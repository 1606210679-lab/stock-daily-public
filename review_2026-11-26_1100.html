<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-11-26 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-11-26</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 5</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:20.0%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 5 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ", title_cn: "核心PCE升到3.3%，12月加息25基点够吗？", body_cn: "美国10月核心PCE同比从9月的3.1%升至3.3%，高于市场预期的3.2%，环比也涨0.3%。12月加息已是焦点，但“25还是50基点”并非五五开：芝商所11月25日的市场评论显示，当时25基点的定价概率约94.6%。真正的悬念是25基点能否压住物价，还是后续数据会把更大幅度加息重新推回市场视野。11月25日QQQ收跌0.65%，SPY跌0.29%，科技股较弱但没有全面抛售；通胀担忧和盘面抗跌摆在一起。感恩节休市后，周五美股提前收盘。周五若利率预期再上修，QQQ与芯片股还能扛住吗？", title_en: "Core PCE Rises to 3.3% — Is a 25bp December Hike Enough?", body_en: "US core PCE rose to 3.3% year-on-year in October from 3.1% in September, above the 3.2% consensus, with a 0.3% monthly gain. A December hike is in focus, but the 25-versus-50-basis-point choice is not evenly priced: CME Group market commentary on Nov. 25 put the then-implied probability of a 25-basis-point hike at about 94.6%. The real question is whether that move cools inflation; persistently hot data would bring larger hikes back into the debate. QQQ closed down 0.65% and SPY 0.29% on November 25, tech weak but not broadly sold off. After the Thanksgiving closure, US markets close early Friday. If rate expectations are revised higher again Friday, can QQQ and chip stocks hold up?" },
  { ticker: "SPCX", title_cn: "SpaceX获轨道算力部分许可，百万卫星能落地吗？", body_cn: "SpaceX（SPCX）11月25日收涨1.30%。美国联邦通信委员会当天对其Starmind轨道数据中心系统作出“部分批准、部分暂缓”决定，申请规模最多100万颗卫星。批下来的主要是光学链路失效时用于遥测、跟踪和控制的后备通信频段；卫星退役处置等事项仍有待审议。市场买的是百万卫星承载算力的远景，但眼下拿到的是有限无线电许可，不是已经发射，也不是已签客户带来的收入。发射能力、在轨功耗和数据传输成本要一项项验证。你觉得下一次真正能给SpaceX估值抬锚的，会是首批在轨部署，还是愿意付费的客户合同？", title_en: "SpaceX Wins Partial Orbital Compute License — Can a Million Satellites Fly?", body_en: "SpaceX (SPCX) closed up 1.30% on November 25. The FCC that day issued a partial grant and partial deferral for its Starmind orbital data center system, which seeks up to 1 million satellites. What was approved is mainly backup communications spectrum for telemetry, tracking and control when optical links fail; satellite deorbit disposal and other matters remain under review. Investors are buying the vision of a million satellites carrying compute, but what exists now is a limited radio license, neither deployed hardware nor revenue from signed customers. Launch capacity, on-orbit power and data transmission costs must each be proven. What proof would make SpaceX’s orbital data-center plan an economically credible business?" },
  { ticker: "NVDA", title_cn: "“大空头”握英伟达看涨期权，200美元再空？", body_cn: "英伟达（NVDA）11月25日收跌3.91%，报149.30美元；“大空头”Michael Burry却透露，已平掉纳指100看跌期权，还拿着上周五买入的英伟达价外看涨期权，组合约25%为现金。除Palantir和MetLife的看跌期权，他说其他头寸暂时几乎全为多头。但这不是彻底翻多：若市场重新乐观、英伟达接近200美元，他计划再做空。价外看涨期权赌短期弹性，也承受时间损耗；留现金是为了有下一次出手的空间。英伟达首席执行官黄仁勋复任后的急涨已部分回吐。Burry一手押反弹、一手等高位反空，你更看重他的哪一步？", title_en: "‘Big Short’ Burry Holds Nvidia Calls — Will He Short Again at $200?", body_en: "Nvidia (NVDA) fell 3.91% on November 25 to $149.30, yet Michael Burry disclosed he has closed his Nasdaq 100 puts and still holds out-of-the-money Nvidia calls bought last Friday, with about 25% of the portfolio in cash. Aside from puts on Palantir and MetLife, he said other positions are for now almost entirely long. This is no wholesale pivot: if sentiment turns optimistic again and Nvidia approaches $200, he plans to short. The OTM calls bet on near-term upside while carrying time decay; the cash reserves room for another move. Some of the sharp rally since Jensen Huang's return has been given back. Burry is betting on a bounce with one hand and waiting to short the highs with the other — which step do you weight more?" },
  { ticker: "LI", title_cn: "理想绩后涨11%，美团周五财报能接力吗？", body_cn: "理想汽车（LI）11月25日美股收涨11.03%，第三季收入288亿元、同比增5.4%，汽车毛利率从上季9.4%回升至15.3%，但仍净亏约3.10亿元。股价先为毛利修复投票，后续要看第四季11万至11.5万辆的交付指引能否把亏损填平。科网财报的下一棒是美团（03690.HK）：公司定于11月27日港股收盘后公布业绩、北京时间19时开电话会。美团还没交卷，它的题目也不同于理想——核心本地商业能赚多少，外卖补贴和新业务投入又会吃掉多少。理想的改善已反映在股价里；美团能否拿出足够的利润和展望，让市场继续买科网股？", title_en: "Li Auto Jumps 11% Post-Earnings — Can Meituan Follow Friday?", body_en: "Li Auto (LI) rose 11.03% in US trading on November 25, with third-quarter revenue of RMB 28.8 billion, up 5.4% year-on-year. Vehicle margin recovered to 15.3% from 9.4% the prior quarter, but the company still posted a net loss of about RMB 310 million. The stock first voted for the margin repair; next comes whether the Q4 guidance of 110,000 to 115,000 deliveries can close the loss. The next baton in tech earnings is Meituan (03690.HK), due to report after the Hong Kong close on November 27 with a call at 19:00 Beijing time. Meituan hasn't delivered yet, and its test differs from Li Auto's: how much core local commerce can earn, and how much food delivery subsidies and new business investment will consume. Li Auto's improvement is already in the price; can Meituan show enough profit and outlook to keep the market buying tech?" },
  { ticker: "01810.HK / 09626.HK", title_cn: "小米利润承压、B站广告增20%，谁能继续涨？", body_cn: "同在11月24日晚交卷，次日港股收盘却走出分化：小米（01810.HK）涨0.23%，B站（09626.HK）涨7.19%。小米第三季收入1072.4亿元、同比降5.2%，经调整净利润48.84亿元、降56.8%；交付100,975辆新车，但汽车及AI等创新业务分部毛利率从25.5%降至19.2%，手机还遭遇存储器件涨价。该分部239亿元收入中，汽车占227亿元，另12亿元才是包含AI的其他业务，不能把239亿元都算成AI收入。B站收入83.2亿元、增8%，广告收入30.9亿元、增20%，净利润5.04亿元、增7%；手游收入却降7%至14.1亿元。小米要证明规模能换回利润，B站要证明广告增长可以盖过游戏放缓。你会先看小米毛利企稳，还是B站广告再加速？", title_en: "Xiaomi Profit Under Pressure, Bilibili Ads Up 20% — Who Keeps Rising?", body_en: "Both reported on the evening of November 24, but next day's Hong Kong close brought divergence: Xiaomi (01810.HK) added 0.23% and Bilibili (09626.HK) gained 7.19%. Xiaomi's third-quarter revenue was RMB 107.24 billion, down 5.2% year-on-year, with adjusted net profit of RMB 4.884 billion, down 56.8%. It delivered 100,975 new vehicles, but the smart EV and AI innovation segment's gross margin fell to 19.2% from 25.5%, and handsets faced rising memory component prices. Of that segment's RMB 23.9 billion in revenue, autos accounted for RMB 22.7 billion, with the remaining RMB 1.2 billion the other businesses including AI — the full RMB 23.9 billion cannot all be counted as AI revenue. Bilibili's revenue was RMB 8.32 billion, up 8%, advertising revenue RMB 3.09 billion, up 20%, and net profit RMB 504 million, up 7%; mobile game revenue fell 7% to RMB 1.41 billion. Xiaomi must prove scale converts back into profit; Bilibili must prove ad growth outweighs the gaming slowdown. What would show Xiaomi's margins have stabilized and Bilibili's ad growth remains durable?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
