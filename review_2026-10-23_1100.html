<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-10-23 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-10-23</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 6</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:16.7%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 6 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ / SPY / CLmain", title_cn: "油价突破100美元，AI抛售何时止跌？", body_cn: "QQQ今日跌2.86%，SPY跌1.18%，WTI原油涨2.91%并在盘中突破100美元，直接压力来自Meta财报后的AI投入担忧、中东局势推高能源价格，以及高贝塔科技仓位集中降杠杆。英伟达跌4.40%、AMD跌8.10%、谷歌跌3.08%，说明抛售已从单一财报扩散到算力与平台龙头。多头的抓手是美债收益率同步回落，可缓解科技股估值压力；空头的抓手是油价上涨可能重新推高通胀，AI资本开支回报也尚未得到证明。市场若要企稳，需要先看到油价降温、Meta等巨头止跌，还是半导体不再领跌？", title_en: "Oil Breaks $100: When Will the AI Selloff End?", body_en: "QQQ fell 2.86% and SPY dropped 1.18% as WTI crude futures (CLmain) rose 2.91% and traded above $100 intraday. Pressure came from AI spending concerns following Meta's earnings, Middle East tensions driving energy prices higher, and forced deleveraging in high-beta tech. Nvidia slid 4.40%, AMD tumbled 8.10%, and Alphabet lost 3.08%, signaling the selloff has broadened beyond a single earnings event to computing and platform leaders. Bulls point to falling Treasury yields easing tech valuations; bears warn rising oil could reignite inflation while AI capex returns remain unproven. What evidence would show that forced deleveraging has run its course?" },
  { ticker: "BRK-B / LLY / KO / PG / COST / WMT", title_cn: "现金奶牛逆势走强，防御轮动能持续吗？", body_cn: "科技股普跌之际，宝洁今日涨5.58%，可口可乐涨2.87%，礼来涨2.83%，沃尔玛涨2.82%，好市多涨1.99%，伯克希尔涨1.32%，资金明显转向现金流稳定的消费、医药与综合控股平台。伯克希尔持有约3600亿美元现金，并通过恢复股票回购、收购住宅建筑商Taylor Morrison和增持Alphabet展示新的资本部署节奏。多头的抓手是这些公司盈利可见度高、资产负债表更稳，能在AI估值收缩时提供防御；空头的抓手是防御股近期涨幅已扩大，若科技快速反弹，资金可能再次回流高贝塔资产。下一阶段更值得跟踪伯克希尔、礼来，还是消费必需品组合？", title_en: "The Buffett Trade Is Back: Is Cash Flow Replacing AI Beta?", body_en: "As tech sold off broadly, Procter & Gamble (PG) gained 5.58%, Coca-Cola (KO) rose 2.87%, Eli Lilly (LLY) added 2.83%, Walmart (WMT) climbed 2.82%, Costco (COST) advanced 1.99%, and Berkshire Hathaway (BRK-B) rose 1.32%. Capital visibly rotated into stable cash-flow consumer, pharma, and conglomerate platforms. Berkshire holds approximately $360 billion in cash and has signaled renewed capital deployment through reinstated buybacks, an acquisition of homebuilder Taylor Morrison, and increased Alphabet exposure. Bulls cite high earnings visibility and stronger balance sheets as AI valuations compress; bears note defensive stocks have already extended gains, and a tech rebound could rapidly reverse the rotation. What would prove that this is a durable regime shift rather than a one-day defensive move?" },
  { ticker: "IEF / TLT", title_cn: "美债收益率跌破5%，长久期机会来了吗？", body_cn: "IEF今日涨1.08%，TLT涨1.87%，直接催化是美国10年期国债收益率跌至4.972%，单日下降超过17个基点，为9月23日以来最低水平。股市下跌、AI信用风险升温与避险需求共同推动债券买盘，但油价盘中突破100美元又让通胀风险没有完全退场。多头的抓手是若增长继续降温，TLT对收益率下行的弹性高于IEF；空头的抓手是长久期对通胀和加息预期更敏感，一旦油价推动通胀回升，回撤也会更大。配置上更适合直接买入美债持有到期、选择IEF控制久期，还是用TLT押注收益率继续下行？", title_en: "TLT Outruns IEF: How Much Duration Is the Market Buying?", body_en: "IEF gained 1.08% and TLT surged 1.87% after the U.S. 10-year Treasury yield fell to 4.972%, dropping more than 17 basis points in a single session to its lowest level since 23 September. Equity weakness, rising AI credit risk, and safe-haven demand fueled bond buying, though oil's intraday break above $100 keeps inflation risk from fully fading. Bulls favor TLT for its greater sensitivity to yield declines if growth continues to cool; bears caution that long duration remains highly exposed to inflation and rate-hike repricing should oil push prices higher. What macro signal would justify extending duration beyond IEF into TLT?" },
  { ticker: "META", title_cn: "Meta暴跌近7%，AI烧钱为何压过营收？", body_cn: "Meta今日跌6.98%，最新价格反应说明市场没有继续奖励营收超预期，而是把焦点转向AI投入与现金流。公司三季度营收646.0亿美元，高于市场预期633.34亿美元，同比增长26%；四季度营收指引730亿至760亿美元，中值略高于736亿美元预期。但本季自由现金流为负62.2亿美元，资本开支达到349.1亿美元，公司还预计2027年费用和资本开支将明显增加。多头的抓手是广告展示量与单价均增长11%，核心业务仍能提供资金；空头的抓手是投入节奏快于现金回收。Meta广告、谷歌搜索和亚马逊云中，哪条AI变现路径会先恢复市场信心？", title_en: "Meta's Ad Engine Is Working—Why Is Cash Flow Going Backward?", body_en: "Meta fell 6.98% as markets shifted focus from a revenue beat to AI investment and cash flow. The company posted quarterly revenue of $64.60 billion, above the $63.334 billion consensus and up 26% year-over-year, with next-quarter revenue guidance of $73 billion to $76 billion, a midpoint slightly above the $73.6 billion estimate. However, free cash flow was negative $6.22 billion this quarter as capex reached $34.91 billion, and management flagged meaningfully higher expenses and capex in 2027. Bulls highlight that both ad impressions and pricing each grew 11%, keeping the core business funded; bears argue the investment pace is outrunning cash generation. Google Search and Amazon cloud remain competing AI monetization benchmarks. What evidence would show that advertising cash generation is catching up with AI spending?" },
  { ticker: "MRNA", title_cn: "癌症疫苗数据泄露，Moderna暴跌是错杀吗？", body_cn: "Moderna今日跌17.57%，直接催化是与默沙东合作的个性化癌症疫苗三期数据被提前泄露，市场在正式学术报告前迅速重定价。完整结果显示，intismeran联合Keytruda相较Keytruda单药，把黑色素瘤复发或死亡风险降低42%，并把远端转移或死亡风险降低38%，达到统计学和临床意义。多头的抓手是超过1100人的三期试验验证了个性化mRNA疗法，且未出现新的安全信号；空头的抓手是股价此前已计入接近最佳情形，42%的结果虽为正面，却不足以满足更高预期，向其他癌种扩展也尚未得到证明。接下来更值得跟踪Moderna、默沙东，还是等待整体生存数据再判断平台价值？", title_en: "Phase 3 Leak Hits Moderna: Did Expectations Outrun the Science?", body_en: "Moderna tumbled 17.57% after data from its Phase 3 personalised cancer vaccine trial, developed with Merck, was leaked ahead of the official academic release, triggering a rapid reprice. Full results showed that intismeran combined with Keytruda reduced the risk of melanoma recurrence or death by 42% and the risk of distant metastasis or death by 38% versus Keytruda alone, meeting both statistical and clinical significance thresholds. Bulls point to validation of personalised mRNA therapy across more than 1,100 patients with no new safety signals; bears argue the stock had priced in a near-best-case outcome and the 42% result, while positive, fell short of elevated expectations with expansion to other cancer types still unproven. What evidence would distinguish platform validation from success in a single indication?" },
  { ticker: "BE", title_cn: "Bloom财报创新高，股价为何反跌近9%？", body_cn: "Bloom Energy今日跌8.70%，这一日间跌幅发生在盘后财报公布前；结果出炉后股价仍承压。公司三季度营收12.358亿美元，高于10.9亿美元预期，同比增长138.1%；非GAAP每股收益0.94美元，也高于0.7016美元预期。管理层把全年营收指引上调至44亿至46亿美元，非GAAP毛利率升至34.5%，但指引是管理层预测，不等于已签订单，也没有说明具体客户能贡献多少收入。多头的抓手是AI数据中心现场供电需求推动产品收入首次超过10亿美元，利润率同步改善；空头的抓手是本季自由现金流净流出1.81亿美元，扩产和营运资金仍会吞噬现金，强劲增长也已反映在高估值中。Bloom、GE Vernova和Vertiv中，谁更能把AI电力需求转化为现金流？", title_en: "Bloom's Revenue Doubles—Why Is Free Cash Flow Still Negative?", body_en: "Bloom Energy fell 8.70% intraday ahead of its earnings release, with shares remaining under pressure after results were published. The company reported quarterly revenue of $1.2358 billion, well above the $1.09 billion consensus and up 138.1% year-over-year, with non-GAAP EPS of $0.94 versus the $0.7016 estimate. Management raised full-year revenue guidance to $4.4 billion to $4.6 billion and lifted non-GAAP gross margin to 34.5%, though guidance reflects management projections rather than contracted orders and does not specify individual customer contributions. Bulls cite AI data-centre on-site power demand driving product revenue above $1 billion for the first time alongside improving margins; bears note free cash flow was negative $181 million this quarter, with expansion and working capital continuing to consume cash and strong growth already embedded in the valuation. What would show that margin expansion is converting into durable cash generation?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
