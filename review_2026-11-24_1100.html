<script>
const topics = [
  { ticker: "NVDA", title_cn: "黄仁勋重掌英伟达，31%反弹能持续吗？", body_cn: "英伟达（NVDA）美股11月23日收涨31.48%，董事会当天宣布英伟达首席执行官黄仁勋即刻恢复总裁、首席执行官及董事职务，成为前一交易日大跌后的明确反转催化。公司同时表示，独立调查仍在推进，并将增设首席合规官；人事决定没有结束调查，客户订单能否恢复仍待验证。多头看管理层稳定后，云厂对产品路线和交付的疑虑能否缓和；空头看后续调查结论、治理安排与高投入客户的采购回报。上周财报收入和指引虽强，股价却先急跌后暴涨，说明估值还受信任变化牵动。调查进展、Vera Rubin交付和客户采购中，哪个变化最能让这轮修复站稳？", title_en: "Jensen Huang Returns to Nvidia: Can the 31% Rebound Last?", body_en: "Nvidia (NVDA) closed up 31.48% on Nov. 23 after the board reinstated chief executive Jensen Huang as president, chief executive and director with immediate effect, a clear reversal catalyst after the previous session's slide. The company said its independent investigation continues and it will add a chief compliance officer; the decision does not conclude the probe, and any recovery in customer orders remains to be demonstrated. Bulls ask whether stable leadership eases cloud buyers' concerns about the roadmap and deliveries. Bears focus on the investigation's conclusions, governance and returns on customers' heavy compute spending. Strong quarterly revenue and guidance did not stop the stock from first falling sharply and then rebounding, showing how trust still affects valuation. Which change in the probe, Vera Rubin deliveries and customer purchases would best support a lasting recovery?" },
  { ticker: "QQQ", title_cn: "英伟达复任带动QQQ涨7%，科技反弹能扩散吗？", body_cn: "纳指100ETF（QQQ）美股11月23日收涨7.00%，纳斯达克综合指数涨6.51%，标普500涨4.73%；英伟达董事会恢复黄仁勋职务后，科技股从上周五的急跌中强劲反弹。三倍做多半导体ETF SOXL涨39.93%，三倍做空SOXS跌40.95%，杠杆产品的振幅显示板块情绪转向之急，但其每日重置机制也放大跨交易日和多日持有风险。多头看芯片、存储、制造链同步回升，空头看治理事件改善不等于算力投资的回报问题已经解决。若下一交易日依旧只有英伟达和半导体领涨，其他科技公司的盈利兑现能否带动QQQ继续跑赢标普500？", title_en: "Nvidia Reinstatement Lifts QQQ 7%: Can Tech Rally Broaden?", body_en: "The Nasdaq-100 ETF (QQQ) closed up 7.00% on Nov. 23; the Nasdaq Composite rose 6.51% and the S&P 500 gained 4.73% as tech recovered from Friday's selloff following Nvidia's reinstatement of Huang. The triple-long semiconductor ETF SOXL gained 39.93%, while the triple-short SOXS lost 40.95%. Their daily reset magnifies risks over multiple sessions; they are not simple long-term proxies for chip shares. Bulls see chips, memory and manufacturing rallying together. Bears note that a governance decision does not settle the returns on compute investment. If Nvidia and semiconductors still dominate next session, can earnings evidence from other tech firms help QQQ keep beating the broader S&P 500?" },
  { ticker: "MU / SNDK / SKHY", title_cn: "美光闪迪海力士急弹，存储行情能走远吗？", body_cn: "美光（MU）、闪迪（SNDK）与SK海力士美股标的（SKHY）11月23日分别收涨19.04%、10.69%和20.00%，在英伟达管理层变动引发的芯片股修复中集体回升；三者前一交易日均大跌。这是风险偏好回暖的价格证据，不是存储报价上涨或新增客户合同的证明。业务抓手也不同：美光与海力士更受HBM和DRAM供给、云厂GPU交付节奏影响；闪迪的NAND及数据中心闪存还要看库存与价格周期。多头押注AI服务器建设维持对高带宽内存的需求，空头担心客户资本支出放慢，急弹只是在回补此前抛售。接下来美光、海力士的HBM供货和闪迪的NAND价格，哪项能先把股价修复变成业绩证据？", title_en: "Micron, SanDisk, SK Hynix Surge: Can the Memory Rally Last?", body_en: "Micron (MU), SanDisk (SNDK) and SK Hynix's US-listed instrument (SKHY) rose 19.04%, 10.69% and 20.00%, respectively, on Nov. 23. All three had fallen sharply in the prior session and recovered with the semiconductor rally after Nvidia's management change. The moves show renewed risk appetite, not higher memory selling prices or newly signed customer contracts. Micron and SK Hynix depend more on HBM and DRAM supply and cloud GPU deliveries. SanDisk's NAND and data-centre flash exposure also depends on inventories and the pricing cycle. Bulls expect AI server buildout to sustain memory demand. Bears fear a slowdown in customer capital spending and a rebound driven mainly by short covering. Will Micron and Hynix HBM shipments or SanDisk NAND pricing first provide earnings evidence?" },
  { ticker: "TSM", title_cn: "台积电涨14.08%，制造链能接棒吗？", body_cn: "台积电美股（TSM）11月23日收涨14.08%，与英伟达领衔的半导体板块反弹同向；股价急升不等于当天新增订单。台积电的关键抓手是先进制程与先进封装能否接住客户新产品需求，从芯片设计进入实际投片、封装和交付。多头看英伟达管理层稳定后，既定产品路线的执行不再承受相同的信任折价；空头担心芯片股单日大涨领先于晶圆产能利用率、封装供给及利润改善。台积电的定价还取决于不同客户的需求，而非仅靠一家芯片设计商。下一阶段若英伟达涨势放缓，台积电新增投片、先进封装交付及毛利率，哪项最能支撑独立行情？", title_en: "TSMC Jumps 14.08%: Can the Manufacturing Chain Take Over?", body_en: "TSMC's US shares (TSM) closed up 14.08% on Nov. 23 alongside the Nvidia-led semiconductor rally, but that price move is not evidence of new orders placed the same day. Its test is whether advanced processes and packaging can absorb customers' new-product demand and turn chip designs into actual wafer starts, packaging and deliveries. Bulls see less uncertainty about Nvidia's product roadmap after its leadership decision. Bears worry a single day's stock rally is running ahead of wafer utilisation, packaging capacity and margins. TSMC also serves many customers, so its valuation cannot rest on one chip designer alone. If Nvidia's advance cools, which TSMC measure can sustain a separate move: wafer starts, packaging deliveries or gross margin?" },
  { ticker: "INTC", title_cn: "英特尔涨16.34%，代工业务能接住反弹吗？", body_cn: "英特尔（INTC）美股11月23日收涨16.34%，跟随芯片股从上周五的抛售中急弹；目前没有证据显示英伟达的客户已向英特尔转单。与台积电主要承接外部晶圆代工不同，英特尔还要同时检验自有处理器的竞争力、代工客户开发、建厂支出和利用率，股价反弹需要更多公司自身证据。多头看美国本土制造及下一代工艺的长期可选性，空头看大规模投入的利润回收慢、客户认证周期长。板块情绪已经先走一步，英特尔要证明的是外部客户投片与制造利润能否跟上；相较追随芯片行情，代工客户、产能利用率与现金流中，什么变化最值得等待？", title_en: "Intel Rises 16.34%: Can Foundry Catch the Rebound?", body_en: "Intel (INTC) closed up 16.34% on Nov. 23 as chip stocks bounced from Friday's selloff. There is no evidence that Nvidia's customers transferred purchases to Intel. Unlike TSMC's mainly external foundry model, Intel must prove the competitiveness of its own processors alongside outside foundry demand, fab spending and utilisation. Bulls see long-term possibilities in US-based manufacturing and next-generation processes. Bears see slow payback on heavy investment and lengthy customer qualification. Sector sentiment has moved first, while external customer wafer starts and manufacturing profit still need to follow. What change in foundry customers, utilisation and cash flow would make the rebound more credible?" },
  { ticker: "TSLA", title_cn: "特斯拉涨11.46%，反弹能摆脱英伟达吗？", body_cn: "特斯拉（TSLA）美股11月23日收涨11.46%，SpaceX（SPCX）涨4.35%，与英伟达复任后科技风险偏好回暖同向。两家公司虽都与特斯拉首席执行官马斯克有关，却不能因同日上涨便推断会有股权合并或资产注入；网上流传的合并估值也不是已宣布的交易。特斯拉下一步仍要用汽车业务现金流和Optimus等新项目进度检验估值，SpaceX则要看发射、星链网络投入与商业回款。多头看科技投资者重新愿意承担高成长公司的执行风险，空头看急涨后仍缺乏共同的盈利催化。下一交易日若英伟达涨势趋缓，特斯拉交付利润与SpaceX星链指标分别怎样证明自身行情？", title_en: "Tesla Gains 11.46%: Can Its Rebound Stand Apart from Nvidia?", body_en: "Tesla (TSLA) closed up 11.46% on Nov. 23, while SpaceX (SPCX) rose 4.35%, both benefiting from the recovery in tech risk appetite after Huang's reinstatement. Both have ties to Tesla chief executive Elon Musk, but rising together does not establish a merger or asset transfer; circulating merger valuations are not an announced deal. Tesla still needs auto cash flow and measurable Optimus progress to justify its valuation. SpaceX needs launches, Starlink network investment and commercial cash receipts to support its own. Bulls see investors taking more execution risk in growth names again. Bears see no shared earnings catalyst behind these gains. If Nvidia cools, how would Tesla deliveries and profit and SpaceX Starlink metrics each demonstrate independent strength?" },
  { ticker: "ANT", title_cn: "Anthropic首发售股，逆势跌后怎么布局？", body_cn: "Anthropic（ANT）美股11月23日收跌1.43%，报87.64美元，未跟随当天QQQ的7.00%反弹。公司首席执行官达里奥·阿莫代伊在首次公开发行中按每股83美元出售约337.84万股、金额约2.80亿美元，相关持股变动于11月23日向美国证监会申报；这笔出售属于首次公开发行配售，并非周一盘中新增的二级市场抛售；持股变动在收盘后披露，无法解释此前的收盘跌幅。上市后价格仍高于发行价，但较首日高位回落，供给、估值与算力成本都在接受市场检验。多头看Claude需求与企业付费转化，空头看计算资源支出、流通筹码及盈利兑现。ANT分批布局需要哪些成交与锁定期信号，分散AI敞口又如何降低新股风险？", title_en: "Anthropic IPO Share Sale: How to Position After the Drop?", body_en: "Anthropic (ANT) closed down 1.43% at $87.64 on Nov. 23 despite QQQ's 7.00% rebound. Its chief executive Dario Amodei sold about 3.3784 million shares at $83 apiece in the initial public offering, worth roughly $280 million. The change in his holding was reported to the SEC on Nov. 23. The sale was part of the offering allocation, not a new disposal in Monday's secondary trading; the holding change was disclosed after the close and cannot explain the earlier decline. The stock is above the offer price but below its first-day high; supply, valuation and compute costs remain under scrutiny. Bulls point to Claude demand and conversion into paying enterprise users. Bears point to compute spending, the tradable float and the challenge of delivering profits. What trading and lock-up evidence would support a staged ANT position, and how could diversified AI exposure mitigate single-issue risk?" },
  { ticker: "GC=F", title_cn: "黄金收复3600美元，反弹能站稳吗？", body_cn: "黄金期货（GC=F）11月23日日线收于每盎司3651.40美元，较11月20日的3515.40美元上涨3.87%，盘中最高3691美元，重新站上3600美元关口。上周五黄金与科技股同跌，本周一又与科技股同涨；这组走势反映此前急跌后的修复，却不足以证明黄仁勋复任直接推动金价。多头看流动性压力缓和后，黄金的配置需求重新出现；空头担心金价从急跌中反弹过快，利率和美元变化仍会制约后续表现。11月24日北京时间上午期货报价仍在3600美元上方，但这不是美股周一收盘价。金价能否守住3600美元、美债收益率和12月美联储会议哪个信号最该决定黄金仓位？", title_en: "Gold Reclaims $3,600: Can the Rebound Hold?", body_en: "Gold futures (GC=F) closed the Nov. 23 daily session at $3,651.40 an ounce, up 3.87% from $3,515.40 on Nov. 20, and reached an intraday high of $3,691, recovering the $3,600 level. Gold fell with tech stocks on Friday and rose with them on Monday. That pattern shows a recovery after a sharp decline, not proof that Huang's reinstatement directly drove gold. Bulls see renewed allocation demand as liquidity pressure eases. Bears worry that the bounce came too quickly and that interest rates and the dollar will constrain it. Futures were still above $3,600 on the Beijing morning of Nov. 24, a different session from the Nov. 23 US close. Which would most inform gold positioning: whether $3,600 holds, the path of Treasury yields or the December Federal Reserve meeting?" },
  { ticker: "01810.HK / 09626.HK / 03690.HK / 02015.HK", title_cn: "小米B站今晚交卷，港股财报谁先破局？", body_cn: "小米集团（01810.HK）和哔哩哔哩（09626.HK）计划在11月24日发布季报；小米业绩直播安排在北京时间19:30，B站电话会在北京时间20:00。理想汽车（02015.HK）随后接力，美团（03690.HK）董事会安排11月27日审议季度业绩，截至今天上午，四家公司的待发业绩均尚无实际结果。四家公司也不能硬套同一个“AI收入”故事：小米看汽车交付和毛利能否与手机、IoT业务共同改善利润；B站看广告、游戏增长与盈利质量；理想看交付、产品结构和汽车毛利；美团看核心本地商业利润与新业务投入。小米与理想的汽车利润、B站与美团的平台盈利，哪组实绩和指引更值得跟踪？", title_en: "Xiaomi, Bilibili Report Tonight: Which HK Earnings Breaks Out?", body_en: "Xiaomi (01810.HK) and Bilibili (09626.HK) plan to publish quarterly results on Nov. 24. Xiaomi's results livestream is set for 19:30 Beijing time and Bilibili's call for 20:00. Li Auto (02015.HK) follows later, while Meituan's (03690.HK) board plans to review its quarterly results on Nov. 27. As of this morning, none of the four has released the pending results. These four should not be forced into a single AI-revenue story. For Xiaomi, track EV deliveries and vehicle margin together with phones and IoT profitability; for Bilibili, advertising, games and earnings quality. Li Auto faces delivery, product-mix and vehicle-margin tests; Meituan must balance core local-commerce profit with new-business investment. Which reported profits and guidance will offer the clearer test: Xiaomi and Li Auto autos, or Bilibili and Meituan platforms?" },
  { ticker: "AMD", title_cn: "AMD反弹近7%，转售登记会压住股价吗？", body_cn: "AMD美股11月23日收涨6.85%，随英伟达复任引发的芯片股反弹回升。美股收盘后，AMD提交股份转售登记文件，涉及最多3.369亿股已发行或未来可发行股份，其中包括OpenAI和Meta各自认股权证对应的最多1.6亿股；登记不等于全部权证已经归属、行权，也不等于这些股份已在周一市场出售，申报于收盘后披露，与当天的上涨分属不同时段。多头看合作关系可能带来长期客户需求，空头看未来稀释及客户采购能否兑现；公司不会从卖方转售中直接取得款项。OpenAI与Meta的实际采购、权证归属、AMD数据中心交付，哪个最能验证反弹？", title_en: "AMD Rises Nearly 7%: Will the Resale Filing Weigh on Shares?", body_en: "AMD closed up 6.85% on Nov. 23 as chip stocks rebounded following Huang's reinstatement at Nvidia. After the US close, AMD filed to register the resale of up to 336.9 million already issued or potentially issuable shares, including up to 160 million each underlying warrants for OpenAI and Meta. Registration does not mean all warrants have vested or been exercised or that those shares were sold during Monday's session; the disclosure came after the close, in a different period from the earlier gain. Bulls see the partnerships as potential sources of lasting customer demand. Bears see dilution risk and uncertainty over actual purchases. AMD would receive no proceeds from selling holders' resales. Which of actual OpenAI and Meta purchases, warrant vesting conditions and AMD data-centre deliveries would best validate the rebound?" },
  { ticker: "DELL", title_cn: "戴尔今晚放榜，AI服务器能带来利润吗？", body_cn: "戴尔科技（DELL）安排美东11月24日盘后讨论2027财年第三季财报，电话会于美中时间当日15:30举行；北京时间要到11月25日凌晨才能看到完整结果。截至11月24日上午，业绩尚未公布，市场仍在等待实际营收与盈利数据。看点不是只数AI服务器订单：订单能否按时交付、带动收入增长，服务器的利润率是否守住，以及营运资本和现金流是否同步改善，决定高需求能否成为股东回报。多头看企业部署AI算力仍有持续采购，空头看竞争和供应链成本可能侵蚀增量利润。财报后应先对照服务器交付、利润率和现金流，再判断戴尔相对芯片供应商是否更值得配置？", title_en: "Dell Reports Tonight: Can AI Servers Deliver Profit?", body_en: "Dell Technologies (DELL) is scheduled to discuss third-quarter financial year 2027 results after the Nov. 24 US close, with a call at 15:30 US Central time; the full figures will be available in the early hours of Nov. 25 Beijing time. On the Beijing morning of Nov. 24, the actual revenue and profit figures had yet to be released. The test goes beyond the number of AI server orders: can orders ship on time and lift revenue, can server margins hold, and do working capital and cash flow improve together? Bulls expect sustained enterprise demand for AI compute. Bears worry competition and supply-chain costs will erode incremental profit. After release, compare deliveries, margins and cash flow before judging Dell against chip suppliers." },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
