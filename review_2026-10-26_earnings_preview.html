<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-10-26 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-10-26</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 6</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:16.7%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 6 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "MSFT / GOOGL", title_cn: "微软谷歌周三交卷，AI投入能否换来增长？", body_cn: "微软与谷歌定于周三盘后披露业绩，市场对微软的预期为每股收益约4.82美元、营收约924.9亿美元，对谷歌的预期为每股收益约3.11美元、营收约1320.2亿美元。核心不只是两家公司能否超过一致预期，而是Azure与Google Cloud增速、AI产品变现和资本开支之间是否形成更清晰的回报闭环，结果也会重估英伟达等上游硬件股。多头希望看到云需求继续加速，并由广告和软件现金流覆盖算力投入；空头担心投入增长快于收入与自由现金流。财报后，哪些指标能证明微软Azure或Google Cloud的AI回报更扎实？", title_en: "Microsoft, Google Report Wednesday — Can AI Spending Deliver Growth?", body_en: "Microsoft (MSFT) and Alphabet (GOOGL) are set to report earnings after-hours Wednesday. Consensus estimates Microsoft EPS at ~$4.82 and revenue at ~$92.49 billion, while Alphabet is expected to post EPS of ~$3.11 and revenue of ~$132.02 billion. Beyond beating estimates, markets will scrutinize Azure and Google Cloud growth rates, AI monetization, and whether capital expenditure is forming a clearer return loop — results will also reprice upstream hardware names such as Nvidia (NVDA). What combination of cloud growth and cash conversion would prove that AI capex is improving earnings quality?" },
  { ticker: "AMZN", title_cn: "AWS周四交卷，亚马逊利润率能守住吗？", body_cn: "亚马逊定于周四盘后放榜，市场一致预期为每股收益约2.00美元、营收约2062.9亿美元。AWS增速仍是估值核心，但这次还要同时检查AI基础设施投入、零售履约效率和广告业务能否共同支撑利润率。多头的抓手是云需求扩张与广告高毛利可以抵消资本开支压力；空头的抓手是数据中心投入若继续提速，自由现金流可能再次落后于利润增长。若AWS达标但资本开支超预期，市场会如何重新评估亚马逊的长期份额与现金流价值？", title_en: "Amazon Reports Thursday — Can AWS Margins Hold?", body_en: "Amazon (AMZN) is scheduled to report after-hours Thursday, with consensus calling for EPS of ~$2.00 and revenue of ~$206.29 billion. AWS growth remains the valuation anchor, but this cycle also demands scrutiny of AI infrastructure spend, retail fulfillment efficiency, and advertising's contribution to margin support. Bulls argue cloud expansion and high-margin advertising can offset capex pressure; bears warn that accelerating data-center investment could once again cause free cash flow to lag earnings growth. What would show that AWS growth is strong enough to absorb higher capex without weakening cash conversion?" },
  { ticker: "INTC", title_cn: "英特尔周四交卷，毛利率能否止跌？", body_cn: "英特尔定于周四盘后公布业绩，一致预期为每股收益约0.40美元、营收约167.8亿美元。市场关注点将从单纯的营收增减转向毛利率、代工业务投入和服务器产品竞争力：若产品组合改善并控制资本开支，修复叙事有望延续；若代工亏损和价格竞争继续吞噬利润，收入达标也难以改变估值压力。多头需要看到客户与产能利用率改善，空头则会盯住费用和现金消耗。财报后，哪些毛利率和现金流信号能证明英特尔转型开始兑现？", title_en: "Intel Reports Thursday — Can Gross Margins Find a Floor?", body_en: "Intel (INTC) is due to report after-hours Thursday, with consensus estimates of ~$0.40 EPS and revenue of ~$16.78 billion. Market focus shifts from top-line growth to gross margins, foundry investment, and server product competitiveness — an improved product mix with controlled capex could sustain the recovery narrative, while continued foundry losses and pricing pressure would keep valuation stress elevated even on an in-line revenue print. Bulls need to see customer wins and rising utilization; bears will focus on operating expenses and cash burn. What margin and cash-flow signals would prove that the turnaround is moving from investment into payoff?" },
  { ticker: "STX / SKHY / SNDK", title_cn: "海力士希捷先放榜，存储行情能否接力？", body_cn: "存储链本周分批交卷：希捷与SK海力士率先披露，闪迪周四盘后登场。市场对希捷的预期为每股收益约7.49美元、营收约41.8亿美元，对闪迪的营收预期约108.5亿美元；SK海力士则承担HBM景气风向标角色。美光和整个半导体板块也会跟随结果重新定价，尤其要比较合同价与现货价能否同向。多头关注AI服务器对HBM、企业级SSD和高容量硬盘的持续拉动，以及供给纪律带来的价格支撑；空头担心NAND、DRAM与HDD周期不同步，库存和客户集中度会放大波动。财报后，哪些价格和库存信号能说明存储行情已从HBM扩散到NAND与容量硬盘？", title_en: "SK Hynix, Seagate Report First — Can Memory Momentum Carry On?", body_en: "The memory supply chain reports in waves this week: Seagate (STX) and SK Hynix (SKHY) lead, with SanDisk (SNDK) following after-hours Thursday. Consensus pegs Seagate at ~$7.49 EPS and ~$4.18 billion in revenue, and SanDisk revenue at ~$10.85 billion; SK Hynix serves as the key HBM sentiment barometer. Micron (MU) and the broader semiconductor sector will reprice on results, with particular attention to whether contract and spot prices are moving in the same direction. What pricing and inventory pattern would confirm that the memory cycle is broadening beyond HBM?" },
  { ticker: "GEV / VRT", title_cn: "AI电力链周三交卷，订单能否兑现利润？", body_cn: "GE Vernova与Vertiv定于周三美股开盘之前披露，市场对GEV的预期为每股收益约4.01美元、营收约121.1亿美元，对Vertiv的预期为每股收益约1.85美元、营收约38.0亿美元。两家公司分别代表电网与发电设备、数据中心电力与散热，核心不是订单是否增长，而是积压订单转收入的速度、项目执行成本和利润率，结果也会影响Bloom等同赛道公司。多头看好AI数据中心与电网扩容形成多年需求；空头担心供应链、交付和高估值放大任何指引缺口。财报后，哪些订单转化和利润率信号能支撑GEV与Vertiv的估值？", title_en: "AI Power Chain Reports Wednesday — Can Orders Convert to Profit?", body_en: "GE Vernova (GEV) and Vertiv (VRT) are set to report before the open Wednesday. Consensus expects GEV EPS of ~$4.01 and revenue of ~$12.11 billion, and Vertiv EPS of ~$1.85 and revenue of ~$3.80 billion. The critical question is not whether orders are growing, but the pace of backlog conversion, project execution costs, and margins — results will also move peers such as Bloom Energy (BE). Bulls see multi-year demand from AI data centers and grid expansion; bears flag supply-chain, delivery risks, and stretched valuations amplifying any guidance shortfall. What backlog conversion and margin profile would confirm that the AI power cycle remains durable?" },
  { ticker: "LLY", title_cn: "礼来周四交卷，减重药增长能否续航？", body_cn: "礼来定于周四美股开盘之前发布业绩，市场平均预期为每股收益约6.67美元、营收约226.2亿美元。最大看点是减重与糖尿病药物的销量增长、产能扩张和产品组合能否继续推动收入，同时维持费用与利润率纪律。多头的抓手是需求仍强、供应增加能够释放此前受限的销量；空头的抓手是高基数、扩产成本和竞争加剧可能让增长低于高估值要求。财报后，哪些销量、供应和利润率数据能证明礼来增长尚未见顶？", title_en: "Eli Lilly Reports Thursday — Can Weight-Loss Drug Growth Sustain?", body_en: "Eli Lilly (LLY) is set to report before the open Thursday, with consensus estimates of ~$6.67 EPS and revenue of ~$22.62 billion. The key focus is whether volume growth in weight-loss and diabetes drugs, capacity expansion, and product mix can continue driving revenue while maintaining cost and margin discipline. Bulls point to resilient demand and rising supply unlocking previously constrained sales; bears cite a high base, expansion costs, and intensifying competition as potential drags on growth relative to an elevated valuation. What combination of volume, supply, and margins would show that growth has not yet peaked?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
