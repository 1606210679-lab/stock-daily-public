<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-11-06 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-11-06</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 8</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:12.5%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 8 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ / .IXIC / .SPX", title_cn: "纳指跌5.54%，非农会再补一刀吗？", body_cn: "纳指在美股周四（11月5日）跌5.54%、QQQ跌6.49%、标普500跌4.36%，民主党赢得国会控制权后，市场集中重估AI数据中心建设、资本开支与监管风险。北京时间周五（11月6日）21:30将公布美国10月非农，市场预期新增约6万人，9月前值2.9万人，失业率预计维持4.2%。多头希望弱数据降低利率压力，空头担心强数据推高美债收益率、弱数据又确认经济降温。非农新增就业、失业率和工资增速中，哪个会决定科技股能否止跌？", title_en: "Payrolls Meet an AI Policy Shock — What Reprices First?", body_en: "The Nasdaq tumbled 5.54% in the Thursday, November 5 U.S. session, QQQ fell 6.49%, and the S&P 500 shed 4.36% as markets repriced AI data center buildout, capex plans, and regulatory risk following the Democratic sweep of Congress. October nonfarm payrolls are due Friday, November 6 at 9:30 a.m. ET (21:30 Beijing time), with consensus expecting around 60,000 new jobs versus September's 29,000, and unemployment seen holding at 4.2%. Bulls want a soft print to ease rate pressure — but with weak data signaling a cooling economy and strong data threatening to push Treasury yields higher, which metric will prove decisive for tech stocks: job additions, unemployment, or wage growth?" },
  { ticker: "SNDK / MU / SKHY", title_cn: "存储三巨头齐跌，HBM逻辑失效了吗？", body_cn: "存储链在美股周四（11月5日）遭遇集中去杠杆：闪迪跌22.26%、美光跌17.48%、SK海力士跌13.40%，共同压力来自AI数据中心建设可能面临更严格的政策审查，但三家风险并不相同。闪迪此前财报显示企业级SSD需求、毛利率和指引仍强，高预期令估值最敏感；美光的核心是HBM产能紧张和多年供货协议能否按期兑现；海力士还面临纽约州约450亿美元项目许可延迟，影响美国本地扩产节奏。多头看到存储供应紧张与长期订单，空头担心政策审批、云厂削减资本开支和周期价格回落。企业级SSD订单、HBM合同价和美国项目许可中，哪个最能判断这次板块暴跌是否过度？", title_en: "SSD, HBM, U.S. Permits — Which Memory Risk Is Real?", body_en: "The memory supply chain saw concentrated deleveraging in the Thursday, November 5 U.S. session, with SanDisk dropping 22.26%, Micron falling 17.48%, and SK Hynix declining 13.40%, as AI data center construction faces heightened policy scrutiny — though each name carries distinct risks. SanDisk's recent earnings showed strong enterprise SSD demand, margins, and guidance, making its elevated valuation the most sensitive to sentiment shifts; Micron's story hinges on whether tight HBM capacity and multi-year supply agreements hold on schedule; SK Hynix also faces a permitting delay on its roughly $45 billion New York project, threatening its U.S. expansion timeline. With bulls pointing to memory supply constraints and long-term order books versus bears citing policy approvals, cloud capex cuts, and cyclical price risk, which factor — enterprise SSD orders, HBM contract pricing, or U.S. project permits — best determines whether this sector selloff went too far?" },
  { ticker: "AMD", title_cn: "AMD财报双超后跌17.28%，错在哪？", body_cn: "AMD在美股周四（11月5日）跌17.28%，两天前的强财报和第四季度高指引未能抵消政策折价。公司第三季度营收、每股收益和数据中心收入均超过预期，管理层还预计下一季营收约170亿美元；但市场开始担心数据中心审批、客户资本开支和MI450交付节奏被外部政策拖慢。多头看到需求和产品路线没有改变，空头认为估值已经计入快速扩张。MI450出货、数据中心增速和毛利率中，哪个指标最能让市场重新相信强财报？", title_en: "Great Quarter, Brutal Re-Rating — Can MI450 Repair Trust?", body_en: "AMD dropped 17.28% in the Thursday, November 5 U.S. session despite a strong earnings report two days earlier, as policy uncertainty overwhelmed beats across revenue, EPS, and data center revenue, along with management's roughly $17 billion next-quarter revenue outlook. Markets have begun discounting the risk that data center approvals, customer capex decisions, and MI450 delivery schedules could be slowed by external policy headwinds. Bulls see unchanged demand and a solid product roadmap; bears argue the valuation already priced in rapid expansion. Among MI450 shipments, data center revenue growth, and gross margins, which metric can most credibly restore confidence in AMD's earnings beat?" },
  { ticker: "MRVL", title_cn: "迈威尔再跌16.48%，并购要重算吗？", body_cn: "迈威尔在美股周四（11月5日）跌16.48%，全股票收购Lumentum的稀释担忧与AI基建监管风险同时压低估值。固定换股交易本已让市场担心长交割期、审批和整合成本，如今数据中心扩建节奏再被质疑，原本超过10亿美元的年化协同目标也需要更长时间兑现。多头看好交换芯片、DSP与激光器件的完整平台，空头担心买方股价下跌继续侵蚀交易对价。监管审批、客户留存和协同兑现中，哪个最能决定迈威尔是否见底？", title_en: "Dilution Meets Regulation — Can Marvell Carry Both?", body_en: "Marvell dropped 16.48% in the Thursday, November 5 U.S. session as dilution concerns from its all-stock Lumentum acquisition compounded AI infrastructure regulatory risk. The fixed exchange-ratio deal already had the market worried about a long close, regulatory review, and integration costs — and now the pace of data center expansion is being questioned, pushing the timeline for realizing more than $1 billion in annualized synergies even further out. Bulls back the combined switching, DSP, and laser platform; bears warn that continued pressure on the acquirer's stock erodes the deal's effective value. Among regulatory approval, customer retention, and synergy realization, which factor most determines whether Marvell has found a bottom?" },
  { ticker: "NBIS", title_cn: "Nebius跌14.89%，交付风险暴露了吗？", body_cn: "Nebius在美股周四（11月5日）跌14.89%，市场把AI数据中心政策风险与公司自身容量交付压力叠加定价。新云厂的收入增长依赖服务器、电力和园区按计划上线，任何许可延迟或客户资本开支调整，都会先影响远期收入而成本与融资负担仍然存在。多头的抓手是AI算力需求和长期合同，空头的抓手是建设进度、融资成本和客户集中。已签容量、投产时间和单位资本回报中，哪个最能证明Nebius不是只靠远期故事支撑估值？", title_en: "Capacity Contracts Meet Permit Risk — What Is Nebius Worth?", body_en: "Nebius fell 14.89% in the Thursday, November 5 U.S. session as markets layered AI data center policy risk on top of the company's own capacity delivery pressures. As a new cloud provider, its revenue growth depends on servers, power, and campuses coming online on schedule — any permitting delay or shift in customer capex hits forward revenue while costs and financing obligations remain fixed. Bulls hold onto AI compute demand and long-term contracts; bears point to construction progress, financing costs, and customer concentration. Among contracted capacity, time-to-production, and unit capital returns, which metric best demonstrates that Nebius is not purely a forward-story valuation?" },
  { ticker: "TSM", title_cn: "台积电跌10.75%，先进制程也躲不过？", body_cn: "台积电在美股周四（11月5日）跌10.75%，AI监管与数据中心建设担忧已经从芯片设计公司蔓延到先进制程代工。台积电的订单能见度来自英伟达、AMD和云厂自研芯片，但如果客户资本开支、园区审批或能源供应放慢，远期晶圆需求也会被重新折现。多头的抓手是先进制程份额与长期产能预订，空头的抓手是客户集中、扩产成本和政策周期。先进制程利用率、客户锁定产能的力度和资本开支中，哪个最能证明台积电仍有防守属性？", title_en: "Foundry Leadership Meets Policy Risk — Is TSMC Defensive?", body_en: "TSMC fell 10.75% in the Thursday, November 5 U.S. session as AI regulatory and data center buildout concerns spread from chip designers into advanced-node foundry. TSMC's order visibility is anchored by Nvidia, AMD, and hyperscaler custom silicon, but if customer capex, campus approvals, or energy supply slow down, forward wafer demand gets re-discounted. Bulls point to advanced-node market share and long-term capacity bookings; bears flag customer concentration, expansion costs, and the policy cycle. Among advanced-node utilization, the firmness of customer capacity commitments, and capital expenditure, which factor best makes the case that TSMC still carries defensive attributes?" },
  { ticker: "TSLA", title_cn: "Tesla跌10.80%，政治风险压过AI吗？", body_cn: "Tesla在美股周四（11月5日）跌10.80%，选举结果落地后，市场重新计入特斯拉首席执行官马斯克与新国会之间的政策和监管摩擦。Tesla的高估值不仅来自汽车，还依赖Robotaxi、Optimus、xAI与SpaceX协同，因此政治关系、自动驾驶审批和政府合同预期会放大股价波动。多头的抓手是Robotaxi与机器人商业化，空头的抓手是监管、品牌分化和汽车业务增长放缓。Robotaxi许可、Optimus订单和汽车现金流中，哪个最能抵消政治风险折价？", title_en: "Robotaxi Promise Meets Congress — Which Risk Wins?", body_en: "Tesla fell 10.80% in the Thursday, November 5 U.S. session as markets, following the election outcome, repriced the friction between CEO Elon Musk and the incoming Congress on policy and regulation. Tesla's premium valuation rests not just on vehicles but on Robotaxi, Optimus, xAI, and SpaceX synergies — making political relationships, autonomous driving approvals, and government contract expectations outsized drivers of stock volatility. Bulls anchor to Robotaxi and robotics commercialization; bears cite regulatory exposure, brand polarization, and slowing automotive growth. Among Robotaxi permitting, Optimus orders, and automotive cash flow, which can most effectively offset the political risk discount?" },
  { ticker: "INTC", title_cn: "英特尔再跌10.35%，修复逻辑失灵吗？", body_cn: "英特尔在美股周四（11月5日）跌10.35%，芯片监管冲击叠加公司此前疲弱的第四季度指引，使修复交易再次承压。数据中心业务增长无法完全抵消PC需求下降、毛利率压力和代工投入，市场也担心政策变化拖慢美国本土制造项目与客户导入。多头的抓手是政府支持、数据中心增长和潜在客户，空头的抓手是现金消耗、执行周期和竞争差距。毛利率、代工客户和PC需求中，哪个指标最可能先证明英特尔修复仍在继续？", title_en: "Weak Guidance Meets Policy Shock — What Saves Intel?", body_en: "Intel dropped 10.35% in the Thursday, November 5 U.S. session as the chip policy shock compounded the company's already-weak prior-quarter guidance, putting fresh pressure on the recovery trade. Data center growth cannot fully offset PC demand weakness, gross margin pressure, and foundry investment, and there are growing concerns that policy shifts could slow U.S. domestic manufacturing projects and customer onboarding. Bulls lean on government support, data center momentum, and potential customers; bears point to cash burn, execution timelines, and competitive gaps. Among gross margins, foundry customer wins, and PC demand, which metric is most likely to first signal Intel's recovery is still on track?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
