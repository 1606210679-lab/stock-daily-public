<script>
const topics = [
  { ticker: "NVDA", title_cn: "英伟达把AI主线拉了回来,代价是自己的毛利率?", body_cn: "上财季英伟达营收同比增长106%至962.21亿美元,创下季度新高并超出市场预期,数据中心收入同比增长117%,毛利率与前一季持平在75%。公司同时确认Rubin正加速进入全面量产,黄仁勋的说法是AI已经走到拐点,算力现在就是收入。但这份成绩单也交代了一处退让:受存储组件涨价影响,四季度毛利率将短期触底至71%至72%,等于让出三到四个百分点;公司给出的对冲叙事是全面铺开的Agentic AI会带来一块想象空间更大的增量市场。市场先信了成长这一半——财报公布后英伟达盘后涨超4%,存储、光通信、云计算等AI相关板块同步回暖。你如何看待这份业绩?AI产业链能否借此迎来一轮上涨行情?", title_en: "Nvidia Reclaims AI Narrative — But at What Cost to Gross Margins?", body_en: "Nvidia posted record quarterly revenue of $96.221 billion, up 106% year-over-year and above consensus, with data center revenue surging 117% and gross margin holding at 75%. The company confirmed Rubin is accelerating toward full mass production, with CEO Jensen Huang calling AI an inflection point where compute power directly equals revenue. However, rising memory component costs will pressure Q4 gross margins to a near-term trough of 71–72%, a concession of three to four percentage points, offset by the company's narrative around Agentic AI as an incremental growth market; Nvidia shares rose over 4% after hours, lifting memory, optical networking, and cloud computing stocks broadly. How do you read this earnings report — can the AI supply chain rally from here?" },
  { ticker: "CRM / CRWD / OKTA / WDAY / HPQ", title_cn: "软件绩后集体跳涨,硬件却挨砸,差在哪一层?", body_cn: "北京时间8月27日,一批美股软件企业密集披露2027财年第二季度业绩,盘面反应相当直接:CrowdStrike营收14.7亿美元,股价大涨约11%;赛富时营收113亿美元,股价大涨约12%;Okta的涨幅更是达到20%。此前市场传出私募机构银湖资本正在洽谈收购Workday,这条消息本身就带动了整个软件板块走强,Workday盘后涨3.17%。有意思的是同一晚的另一半:惠普盘后跌8.98%,日间明明还是涨的。两边的差别不在AI叙事而在成本结构——软件卖订阅、没有物料,存储涨价与它无关;PC厂商的内存与闪存是硬成本,而这正是英伟达同晚下调毛利率时点名的那条理由。软件的这轮跳涨是重估还是情绪?你会追已经交卷的赛富时与Okta、押银湖收购落地,还是等硬件把成本转出去?", title_en: "Software Stocks Surge on Earnings While Hardware Gets Crushed — What's the Divide?", body_en: "A cluster of U.S. software companies reported earnings on August 27 Beijing time, with markets reacting sharply: CrowdStrike revenue of $1.47 billion drove shares up roughly 11%; Salesforce revenue of $11.3 billion sent shares up roughly 12%; Okta surged 20%. Reports that private equity firm Silver Lake is in talks to acquire Workday boosted the broader software sector, with Workday rising 3.17% after hours. The contrast with hardware was stark — HP fell 8.98% after hours despite gaining intraday — as software's subscription model carries no bill-of-materials exposure to rising memory and NAND flash costs, the very factor Nvidia cited the same evening when guiding margins lower. Is software's rally a genuine re-rating or a sentiment trade — will you chase Salesforce and Okta, bet on the Silver Lake deal closing, or wait for hardware to pass through its cost pressures?" },
  { ticker: "MRVL / AVGO / AAOI", title_cn: "迈威尔周五凌晨交卷,光通信接得住AI主线吗?", body_cn: "北京时间周五凌晨,迈威尔科技将公布2027财年第二财季业绩,市场预计营收约27.08亿美元。要提醒的是每股收益的共识在不同数据源之间差出一倍以上,0.40美元与0.94美元同时存在,这通常是GAAP与非GAAP的口径差,看到\"超预期\"之前得先确认对标的是哪一个。市场重点盯三件事:第三季度与全年指引会不会上修、与谷歌合作的长期指引能不能对上实际订单、以及接近59%的毛利率守不守得住——最后这条尤其关键,英伟达刚刚示范过存储涨价怎么吃掉毛利。板块这边,迈威尔周三收涨1.97%、盘后再涨3.63%,博通收跌0.32%,而OpenAI自研芯片被指正在威胁英伟达的利润率,定制ASIC与光互连的份额之争还没分出胜负。你认为光通信能否成为AI的下一条主线?更看好迈威尔、博通还是上游光模块?", title_en: "Marvell Reports Friday — Can Optical Networking Hold the AI Narrative?", body_en: "Marvell Technology is set to report its fiscal second-quarter results in the early hours of Friday Beijing time, with consensus revenue estimated at approximately $2.708 billion. A critical caveat: EPS consensus varies by more than twofold across data sources — $0.40 versus $0.94 — likely reflecting GAAP versus non-GAAP differences, so any \"beat\" must be evaluated against the correct baseline. Key focal points include whether Q3 and full-year guidance will be revised upward, whether long-term Google partnership guidance aligns with actual order flow, and whether gross margins near 59% can be defended — especially after Nvidia demonstrated how rising memory costs erode profitability. Marvell rose 1.97% on Wednesday and gained another 3.63% after hours, while Broadcom slipped 0.32%, and OpenAI's custom chip efforts are seen as a growing threat to Nvidia's margins, leaving the share battle between custom ASICs and optical interconnects unresolved. Do you see optical networking as AI's next major theme — and do you favor Marvell, Broadcom, or upstream optical module makers?" },
  { ticker: "QQQ / .SPX / XAUUSD / BTC.USD", title_cn: "PCE没超预期却压不住长端,沃什明晚怎么说?", body_cn: "美国7月核心PCE同比3.3%、环比0.2%,基本符合预期,但真正决定美股的仍是长端美债。财政部扩大长期国债回购、并传出可能动用一般账户资金之后,10年期收益率只短暂回落就重新回到4.7%附近,30年期仍在5.2%上方。这条链对股票是双重挤压:收益率越高,AI与半导体这类靠未来盈利定价的成长股估值越承压;而财政融资与云巨头为数据中心发债,又在同一个资金池里抢长期资金。周三盘面几乎停摆,标普500收跌0.02%、QQQ收涨0.09%,黄金涨0.75%,所有仓位都在等英伟达。接下来的焦点是8月27日至29日的杰克逊霍尔年会,今年主题是\"金融创新:对支付与政策的影响\",北京时间8月28日22点沃什将发表主题演讲。他能不能缓和利率担忧?美股、黄金还是比特币,你更关注谁?", title_en: "PCE In Line, Yet Long-End Yields Hold Firm — What Will Warsh Say Tomorrow Night?", body_en: "U.S. July core PCE came in at 3.3% year-over-year and 0.2% month-over-month, broadly in line with expectations, but long-end Treasuries remain the dominant driver for equities. After the Treasury expanded long-dated bond buybacks and reports emerged of potential use of the general account, the 10-year yield dipped only briefly before returning to around 4.7%, with the 30-year still above 5.2%. This creates a dual squeeze on growth stocks such as AI and semiconductors — higher long-end yields compress valuations on future earnings, while fiscal financing and cloud giants issuing bonds for data centers compete for the same pool of long-duration capital. Wednesday's session was nearly paralyzed, with the S&P 500 down 0.02%, QQQ up 0.09%, and gold up 0.75%, as all positioning awaited Nvidia. Attention now turns to the Jackson Hole symposium from August 27–29, themed \"Financial Innovation: Implications for Payments and Policy,\" with Fed Chair Warsh delivering the keynote at 10 p.m. Beijing time on August 28. Can Warsh ease rate concerns — and are you watching equities, gold, or bitcoin most closely?" },
  { ticker: "MU / SKHY / SNDK / SOXL / 07709", title_cn: "最大的买家承认存储涨价,定价权换手了?", body_cn: "英伟达在下调四季度毛利率展望时,把原因直接写成存储组件涨价,等于由这条链上最大的买家出面确认了涨价的强度和持续性。存储股盘后立刻跟上:美光盘后涨3.06%,SK海力士盘后涨3.43%,半导体三倍做多的SOXL盘后涨5.51%;而日间它们其实平平,闪迪收涨1.26%、美光收涨0.58%、海力士还收跌0.95%,方向是在财报之后才被定下来的。把这几个月串起来看,账单一路往下走:小米二季度净利被存储成本咬掉42.6%,英特尔GPU价格因此跳升48%,英伟达对客户加价超过15%,现在轮到它自己的毛利率。反过来的信号也有,三星110万亿韩元的股东回报方案落地当天股价反而下跌,说明市场没把\"现金流转分红\"当成新的买入理由。你会站在收钱的存储一端,还是等下游先给出承受力的答案?", title_en: "The Biggest Buyer Confirms Memory Price Hikes — Has Pricing Power Shifted?", body_en: "When Nvidia cited rising memory component costs as the direct reason for its lower Q4 gross margin outlook, it effectively had the supply chain's largest buyer confirm both the intensity and persistence of the price increases. Memory stocks responded immediately after hours: Micron rose 3.06%, SK Hynix rose 3.43%, and the 3x leveraged semiconductor ETF SOXL gained 5.51% — though all had been flat to slightly negative during the regular session, with SanDisk up 1.26%, Micron up 0.58%, and SK Hynix down 0.95%, with direction only set after the earnings release. Tracing the chain over recent months, the cost burden has migrated steadily downstream: Xiaomi's net profit was cut 42.6% by memory costs, Intel GPU prices jumped 48% as a result, Nvidia passed over 15% in price increases to customers, and now its own margins are absorbing the pressure. The counter-signal is notable too — Samsung's ₩110 trillion shareholder return plan failed to lift its stock on the day of announcement, suggesting markets do not view cash flow redistribution as a new buy catalyst. Will you position on the memory side collecting the price premium, or wait for downstream players to demonstrate they can absorb it?" },
  { ticker: "NBIS / IREN / CRWV", title_cn: "算力的钱在往下游走,AI新云今晚要交答卷?", body_cn: "IREN今晚盘后交卷,而它的股价已经比高点低了约48%,市场要看的是数据中心究竟能不能变成收入。Nebius周三日间收跌3.62%,盘后被英伟达的指引带起来涨5.36%——这个反差本身就是这条赛道的写照,自身还没证明什么,但只要上游确认AI资本开支仍在扩张,它们就跟着被重估。钱的流向也确实更透明了:英伟达首席财务官称已在前沿实验室投入约500亿美元,OpenAI现有与计划中的承诺约相当于12吉瓦,另有报道称Anthropic与Nscale达成约450亿美元的算力协议。风险同样具体,Nebius刚以50亿美元完成可转债发行,而营收基数只有约14亿美元,伯里正在加空这条赛道的多只标的。AI新云到底是订单驱动还是融资驱动?你更看好自建算力的IREN、扩张最快的Nebius,还是客户更分散的CoreWeave?", title_en: "Compute Capital Flows Downstream — Will AI Cloud Newcomers Deliver Tonight?", body_en: "IREN reports after hours tonight with its stock already roughly 48% off its high, and the market needs to see whether data center capacity can translate into actual revenue. Nebius fell 3.62% during Wednesday's regular session before jumping 5.36% after hours on the back of Nvidia's guidance — a contrast that captures the sector's dynamic: these companies have yet to prove themselves operationally, but confirmation of continued upstream AI capital expenditure is enough to trigger a re-rating. Capital flows are becoming more transparent: Nvidia's CFO disclosed approximately $50 billion deployed into frontier labs, OpenAI's existing and planned commitments represent roughly 12 gigawatts, and Anthropic is reported to have reached an approximately $4.5 billion compute agreement with Nscale. Risks are equally concrete — Nebius just completed a $5 billion convertible note offering against a revenue base of only approximately $1.4 billion, and Michael Burry has been building short positions across multiple names in this space. Is AI cloud growth order-driven or financing-driven — and do you prefer IREN's owned-infrastructure model, Nebius's rapid expansion, or CoreWeave's more diversified customer base?" },
  { ticker: "GOOG / META / AAPL / MSFT / PLTR", title_cn: "同样在烧AI,大市值科技为何一涨一跌?", body_cn: "周三的巨头是分化的:谷歌收跌1.23%,理由被写得很直白,投资者在拿它的AI资本开支去对冲云业务的增长,当支出的斜率比收入更陡,市场就先减仓;而Meta收涨1.07%、苹果收涨1.15%、微软收涨0.95%、Palantir收涨2.76%。围绕Meta的分歧最极端,同一天既有分析以\"该上车的便宜货\"为题看多,也有以\"AI泡沫警报、2027年才见真章\"为题警示,意思是这轮AI投入的回报要等到2027年才被验证,而估值现在就得付。另一个值得留意的细节是,伯里正在加空Palantir,它周三仍然收涨2.76%,分歧一点没收敛。AI支出是确定的,回报的时间表却不确定,谁的现有业务扛得过这段空窗期?你更看好现金流稳的苹果与微软、广告在修复的Meta,还是等谷歌云增速重新超过资本开支?", title_en: "All Burning AI Capex — Why Are Mega-Cap Tech Stocks Moving in Opposite Directions?", body_en: "Wednesday saw a clear divergence among the largest technology companies: Alphabet fell 1.23% as investors explicitly weighed AI capital expenditure against cloud revenue growth, reducing exposure when spending trajectory outpaces revenue trajectory; meanwhile Meta gained 1.07%, Apple 1.15%, Microsoft 0.95%, and Palantir 2.76%. The debate around Meta was particularly polarized, with one analyst framing it as a value opportunity and another warning of an AI bubble with returns only verifiable in 2027 — meaning valuations must be paid now for outcomes priced years out. Also notable: Michael Burry is building a short position in Palantir, which still closed up 2.76% on the day, with no sign of convergence. AI spending is certain; the timeline for returns is not — which companies' existing businesses can sustain the gap? Do you favor the stable cash flows of Apple and Microsoft, Meta's recovering advertising business, or are you waiting for Alphabet's cloud growth to re-accelerate above its capital expenditure rate?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
