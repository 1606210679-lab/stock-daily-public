<script>
const topics = [
  { ticker: "NVDA", title_cn: "962亿超了两个基准,英伟达却主动下调自己的毛利率?", body_cn: "英伟达把两个基准一次跨过去了:上一财季营收创纪录的962.21亿美元、同比增长106%,既高于约936亿美元的市场共识,也高于摩根士丹利那份约911亿美元的预测,营收超预期约4.3%、每股收益超预期约6.2%;拆开看更清楚,数据中心收入同比增长117%,本季毛利率持平前一季的75%;下一季指引给到约1,080亿美元,更远的2028财年营收指引是增长约70%,而此前市场最关心的Rubin也已加速进入全面量产。股价的反应很能说明门槛有多高:周三日间先收跌1.59%,财报出来后盘后一度走低,直到2028年的指引被读懂才转涨,收在盘后上涨5.26%附近。真正的新信息不在收入而在利润率——公司把毛利率展望下调,并给出了具体位置:受存储组件涨价影响,四季度毛利率将短期触底至71%至72%,较本季的75%要让出三到四个百分点,理由写得很直白,就是存储芯片价格飙升。这条链绕了一圈回到了起点,涨价先咬手机厂的毛利,再顶高GPU售价,英伟达自己也对客户加价超过15%,现在轮到它自己的毛利率被账单击中。空方还有两条具体证据:客户付款周期比上一季拉长了33%,而OpenAI的自研芯片被认为正在威胁它的利润率,定制硅在抢地盘。多头的抓手是订单与回报——亚马逊把GPU订单追加了两百万块,本季约260亿美元返还股东、回购环比增长约30%,黄仁勋把话说得更满,称AI已经到达拐点、\"现在算力即收入\",并公开否认循环融资;而全面铺开的Agentic AI被公司列为下一段增量市场的来源。你会为约70%的增长指引买单、等毛利率见底,还是换去卖存储给它的那一端?", title_en: "Nvidia Tops $96.2B Revenue Record, But Cuts Its Own Gross Margin Outlook?", body_en: "Nvidia posted record quarterly revenue of $96.221 billion, up 106% year-over-year, beating the ~$93.6 billion market consensus and Morgan Stanley's ~$91.1 billion estimate by roughly 4.3% on revenue and 6.2% on EPS. Data center revenue surged 117% year-over-year, while next-quarter guidance came in at ~$108 billion and FY2028 revenue growth is guided at ~70%; the Rubin platform has also been accelerated into full mass production. However, Nvidia guided gross margin down to 71%–72% next quarter from 75% — explicitly blaming soaring memory chip prices — while bearish flags include a 33% quarter-over-quarter lengthening in customer payment cycles and OpenAI's custom silicon reportedly threatening margins. Bulls point to Amazon adding two million GPU units to its order, ~$26 billion returned to shareholders this quarter with buybacks up ~30% sequentially, and CEO Jensen Huang declaring AI has reached an inflection point. Will you pay up for ~70% growth guidance and wait for margins to bottom, or rotate to the memory suppliers feeding Nvidia instead?" },
  { ticker: "CRM / CRWD / OKTA / HPQ", title_cn: "同一晚软件暴涨硬件被砸,分界线是谁吃物料成本?", body_cn: "英伟达之后的那一小时里挤了五份财报,结果劈成了完全相反的两半。软件全线跳涨:Okta盘后涨20.62%,赛富时营收约113亿美元、盘后涨13.35%,CrowdStrike营收约14.7亿美元、盘后涨9.68%,而它们的日间表现其实平平——赛富时收平、CrowdStrike收涨2.05%、Okta收涨2.92%,方向都是财报之后才定的。硬件却在同一小时被砸:惠普盘后跌8.98%,日间明明还收涨3.39%。分界线不在AI叙事而在成本结构:软件卖的是订阅,没有物料,存储涨价与它无关;惠普是PC厂商,内存与闪存合约价直接进它的物料清单,而这正是英伟达在同一晚下调毛利率时点名的那条理由。同一条账单,买存储的人交钱,不买存储的人收钱。另一条催化来自并购,市场传出私募机构银湖资本正在洽谈收购Workday,它盘后涨3.17%,这把\"软件资产被低估\"的说法从估值层面推到了交易层面。空方的理由是位置:这类跳涨多数发生在财报当晚,次日能否守住要看指引的持续性,而Snap当天收跌8.45%说明广告类软件并没有被一起重估。你会追盘后跳涨的赛富时与Okta、赌银湖收购落地,还是等硬件把成本转嫁出去再回头看?", title_en: "Software Surges, Hardware Crushed Same Night — Who Bears the Bill for Components?", body_en: "Five earnings reports landed in the hour after Nvidia, splitting cleanly into two camps. Software names rallied sharply after hours: Okta +20.62%, Salesforce (~$11.3 billion revenue) +13.35%, and CrowdStrike (~$1.47 billion revenue) +9.68% — all three had been roughly flat during the regular session. Hardware fell hard: HP dropped 8.98% after hours despite closing the regular session up 3.39%. The dividing line is cost structure — software runs on subscriptions with no bill of materials, while HP's PC business carries memory and NAND flash directly in its cost of goods, the exact cost pressure Nvidia named the same night when cutting its margin outlook. A separate catalyst came from M&A: reports that Silver Lake is in talks to acquire Workday lifted that stock 3.17% after hours, elevating the \"undervalued software assets\" thesis from valuation to deal-level reality, though Snap's 8.45% regular-session decline signals ad-driven software was not re-rated alongside the rest. Will you chase the after-hours surge in Salesforce and Okta and bet on the Silver Lake deal closing, or wait for hardware makers to successfully pass costs downstream before revisiting?" },
  { ticker: "MU / SKHY / SNDK / SOXL", title_cn: "英伟达亲口承认存储涨价,存储股盘后一起跳?", body_cn: "存储这条链等的就是这句官方认证。英伟达在下调毛利率展望时把原因写成\"存储芯片价格飙升\",等于由最大的买家出面确认了这轮涨价的强度与持续性,存储股盘后立刻跟上:美光盘后涨3.06%、SK海力士盘后涨3.43%,半导体三倍做多的SOXL盘后涨5.51%,光通信与云计算这两条相邻的AI链同时回暖。日间它们其实没什么表现——闪迪周三收涨1.26%、美光收涨0.58%,海力士还收跌0.95%,方向是在财报之后才被定下来的。这里的逻辑要拆清楚:同一句话对英伟达是成本、对存储是收入,买家承认成本压力越重,卖家的定价权就越被坐实,这也是为什么盘后跳得最猛的是杠杆工具而不是个股。空方的理由并没有被消灭,反而更清楚了:涨价的终点是需求本身,当AI服务器整机价格被抬高超过15%、云厂商的资本开支门槛跟着上移,总有一层会先缩手;另外周期高点上的股东回报承诺已经出现,三星那份创纪录方案落地当天股价反而下跌,说明市场对\"现金流转分红\"这件事并不当作新的买入理由。你会跟着定价权买美光与海力士、用杠杆工具做短线,还是等云厂商的资本开支指引先表态?", title_en: "Nvidia Confirms Memory Price Surge — Do Memory Stocks Jump After Hours?", body_en: "Memory stocks got the official confirmation they had been waiting for. When Nvidia cited \"soaring memory chip prices\" as the explicit reason for its margin cut, the largest buyer in the market effectively validated both the magnitude and durability of this pricing cycle — Micron jumped 3.06% after hours, SK Hynix rose 3.43%, and the 3x leveraged semiconductor ETF SOXL surged 5.51%, with optical networking and cloud computing names also recovering. During the regular session the moves were minimal — SanDisk +1.26%, Micron +0.58%, SK Hynix -0.95% — confirming the direction was set entirely by the earnings release. The logic cuts both ways: the same sentence that is a cost for Nvidia is revenue for memory suppliers, and the heavier the buyer acknowledges its cost pressure, the more the sellers' pricing power is validated. Bear risks remain intact, however — when AI server system prices rise more than 15% and cloud capex thresholds move higher, demand destruction becomes a real ceiling; Samsung's record shareholder return announcement also saw its stock fall on the day it was announced, suggesting the market does not treat \"converting cash flow to dividends\" as a new buy trigger. Will you buy Micron and SK Hynix on confirmed pricing power and use leveraged instruments for short-term exposure, or wait for cloud providers to signal their capex intentions first?" },
  { ticker: "MRVL / AVGO", title_cn: "定制芯片正在抢份额,迈威尔今晚就要给出答案?", body_cn: "英伟达刚交完卷,今晚轮到定制芯片这条线自证。迈威尔今晚盘后、也就是北京时间周五凌晨披露2027财年第二财季业绩,营收共识约27.1亿至27.6亿美元,而期权市场给这份财报定的价是约208亿美元的市值摆动幅度——这个量级本身就说明分歧有多大。有一个细节值得先说清楚:每股收益的共识在不同数据源之间差出一倍以上,0.40美元与0.94美元同时存在,这通常是GAAP与非GAAP的口径差,看到\"超预期\"三个字之前要先确认对标的是哪一个。市场真正盯的是三件事:第三季度与全年指引会不会上修、与谷歌合作的长期指引能不能对上实际订单、以及接近59%的毛利率守不守得住——最后这条尤其关键,因为英伟达刚刚示范了存储涨价怎么吃掉毛利。它周三收涨1.97%,盘后跟着英伟达再涨3.63%。争议在同一天被两条消息推到台面上:一是有报道称OpenAI的自研AI芯片正在威胁英伟达的利润率,定制硅确实在抢地盘,而定制ASIC恰恰是迈威尔与博通的主场;二是有分析直接以\"博通就是新的英伟达,而这正是问题所在\"为题提出警告,意思是当一个赛道开始被同样的叙事定价,后来者的估值风险也会跟着复制。博通周三收跌0.32%。所以今晚这份财报要回答的不是增长,而是这轮定制芯片的订单究竟落到了谁手里、能不能兑现成收入。此前公司内部人在160%的涨幅里累计卖出约6.32亿美元,而卖方同期上调它的AI营收预期,今晚就是这两种判断的裁决时刻。你会赌定制芯片继续抢份额、换去份额更稳的博通,还是等财报落地再说?", title_en: "Custom Chips Are Taking Share — Does Marvell Deliver the Answer Tonight?", body_en: "With Nvidia's results in, the custom chip thesis now faces its own test. Marvell reports its fiscal second-quarter results after hours tonight, with revenue consensus in the range of ~$2.71 billion to ~$2.76 billion; options markets are pricing a move implying roughly $20.8 billion in market cap swing — a scale that reflects just how wide the disagreement is. One detail warrants caution upfront: EPS consensus varies by more than 2x across data sources, with figures of $0.40 and $0.94 both in circulation, likely reflecting a GAAP vs. non-GAAP discrepancy — any \"beat\" headline needs to be checked against the right baseline. The market is focused on three things: whether third-quarter and full-year guidance gets raised, whether the long-term Google partnership guidance aligns with actual order flow, and whether gross margin near 59% can hold — the last point is especially critical given Nvidia's live demonstration of how memory inflation eats into margins. Marvell closed Wednesday up 1.97% in the regular session and added another 3.63% after hours following Nvidia. Controversy was pushed to the surface the same day by two developments: reports that OpenAI's in-house AI chip is threatening Nvidia's margins confirm that custom ASIC — precisely Marvell and Broadcom's territory — is gaining ground, while one analyst published a direct warning titled \"Broadcom is the new Nvidia, and that's the problem,\" cautioning that when a sector gets priced on identical narratives, valuation risk replicates for later entrants. Broadcom closed Wednesday down 0.32%. Tonight's report must answer not whether growth is happening, but whose hands the custom chip orders are actually in and whether they can be converted into revenue — insiders have sold ~$632 million into a ~160% rally, while the sell side has simultaneously raised AI revenue estimates, making tonight the adjudication moment for both views. Will you bet on custom chips continuing to take share and rotate into Broadcom for more durable positioning, or wait for the print before deciding?" },
  { ticker: "NBIS / IREN", title_cn: "英伟达的钱撑起AI新云,IREN今晚也要交卷?", body_cn: "AI新云这条线今晚有第二场考试。IREN今晚盘后交卷,而它的股价已经比高点低了约48%,市场要看的是数据中心的变现能不能体现在收入里。Nebius周三日间收跌3.62%,盘后被英伟达的指引带起来、涨5.36%——这个反差本身就是这条赛道的写照:自身基本面还没证明什么,但只要上游确认AI资本开支仍在扩张,它们就跟着被重估。这一轮的资金流向也更透明了:英伟达首席财务官表示公司已在前沿实验室投入约500亿美元,而OpenAI现有与计划中的承诺规模约相当于12吉瓦,另有报道称Anthropic与Nscale达成约450亿美元的算力协议——钱确实在往这条链上走。空方的证据同样具体:伯里在加空这条线上的多只标的,而Nebius刚以50亿美元完成可转债发行、营收基数只有约14亿美元,融资与收入之间的差距是它最大的风险敞口。判断的关键落在今晚:IREN能否用自建路径证明折旧与电力成本可以被租约收入覆盖。你会选自建的IREN、靠融资扩张的Nebius,还是等云厂商的资本开支指引先落地?", title_en: "Nvidia's Capital Fuels the New AI Cloud — Does IREN Deliver Tonight?", body_en: "The new AI cloud trade faces its second earnings test tonight. IREN reports after hours with its stock already down roughly 48% from its highs, and the market needs to see whether data center monetization is translating into actual revenue. Nebius fell 3.62% during Wednesday's regular session before being lifted 5.36% after hours by Nvidia's guidance — a contrast that captures this sector precisely: fundamentals remain unproven, but confirmation of sustained upstream AI capex is enough to trigger a re-rating. Capital flows into this chain are becoming more transparent: Nvidia's CFO indicated the company has committed roughly $50 billion to frontier labs, OpenAI's existing and planned commitments represent roughly 12 gigawatts of compute capacity, and Anthropic reportedly signed a ~$45 billion compute agreement with Nscale. Bear evidence is equally specific: Michael Burry has been building short positions across several names in this trade, and Nebius just completed a $5 billion convertible note issuance against a revenue base of only ~$1.4 billion — the gap between financing scale and revenue generation is its most significant risk exposure. The critical judgment falls tonight: can IREN demonstrate through its self-build model that depreciation and power costs are covered by lease revenue? Will you choose self-build IREN, financing-driven Nebius, or wait for cloud providers' capex guidance to land first?" },
  { ticker: "QQQ / .SPX", title_cn: "通胀比预期还黏了一点,市场却全在等一份财报?", body_cn: "周三的盘面几乎是停摆的:标普500收跌0.02%、QQQ收涨0.09%,而当天其实有一份足够重要的数据。7月PCE通胀同比3.7%,与6月持平,但略高于3.6%的市场预期;核心PCE同比3.3%同样持平,更值得注意的是核心的环比从0.1%抬到了0.2%——通胀不是在恶化,而是黏住了,这对正在权衡9月是否加息的联储不是好消息。市场当时几乎没反应,因为所有仓位都压在同一份财报上,直到英伟达盘后交卷,标普500ETF在盘后才涨了0.59%。真正压着股市的仍是长端:财政部扩大长期国债回购、并传出可能动用财政部一般账户资金之后,10年期收益率只短暂回落就重新回到4.7%附近,30年期仍在5.2%上方。这条链条对股票的作用是双重的——收益率越高,靠未来盈利定价的AI与半导体估值越承压;而财政融资与云巨头为数据中心发债,本身又在同一个池子里争夺长期资金。真正的政策变量从今天开始:杰克逊霍尔全球央行年会8月27日至29日举行,今年主题是\"金融创新:对支付与政策的影响\",而北京时间明晚10点沃什将发表首次以主席身份的重要讲话。两条线索合起来看更有意思——通胀数据偏黏给了鹰派措辞的理由,而年会主题指向支付与数字资产,意味着这次讲话对稳定币与加密支付这条链的影响可能比对股指更直接。多头的理由是财报已经把AI资本开支的持续性坐实;空头的理由是通胀没有继续下行,而措辞一旦偏鹰,长端与美元会同时抬头。你会趁财报利好加科技、先看明晚的措辞,还是换到利率敏感资产?", title_en: "Inflation Stickier Than Expected, Yet Markets Were Watching Just One Earnings Report?", body_en: "Wednesday's session was effectively on pause — the S&P 500 closed down 0.02% and QQQ up 0.09% — despite a meaningful macro data release. July PCE inflation came in at 3.7% year-over-year, matching June but slightly above the 3.6% consensus; core PCE also held at 3.3% year-over-year, with the more notable detail being core month-over-month rising from 0.1% to 0.2% — not deteriorating, but sticky, which is unwelcome news for a Fed weighing a September decision. Markets barely reacted in real time, with all positioning concentrated on Nvidia's earnings; S&P 500 ETFs only gained 0.59% after hours once that report landed. The long end of the curve remains the real overhang: after the Treasury expanded long-dated bond buybacks and reports emerged of potential use of the Treasury General Account, the 10-year yield dipped briefly before returning to around 4.7%, with the 30-year still above 5.2% — higher yields compress valuations on AI and semiconductor names priced on future earnings, while Treasury financing and cloud giants issuing debt for data centers compete for long-duration capital in the same pool. The key policy variable begins now: the Jackson Hole central banking symposium runs August 27–29, themed \"Financial Innovation: Implications for Payments and Policy,\" and Warsh is scheduled to deliver his first major speech as Fed Chair at 10 p.m. Beijing time tomorrow evening. Read alongside sticky inflation data — which supplies justification for hawkish language — and a conference theme pointing toward payments and digital assets, the speech may carry more direct implications for the stablecoin and crypto payments complex than for equity indices. Bulls rest on earnings having confirmed the durability of AI capex; bears note inflation is not falling further, and any hawkish shift would lift both the long end and the dollar simultaneously. Will you add to tech on the earnings tailwind and monitor tomorrow's remarks first, or rotate into rate-sensitive assets ahead of Jackson Hole?" },
  { ticker: "GOOG / META", title_cn: "同样在烧AI,谷歌被卖Meta被买差在哪?", body_cn: "周三的巨头是分化的:谷歌收跌1.23%,是几家里跌得最明显的一只,而Meta收涨1.07%、苹果收涨1.15%、微软收涨0.95%、Palantir收涨2.76%。谷歌被卖的理由被写得很清楚——投资者在拿它的AI支出去对冲云业务的增长,当资本开支的斜率比云收入更陡时,市场就会先减仓;这与阿里那份财报被砸的逻辑是同一个,区别只是谷歌的云基数更大。Meta这边的分歧更极端:同一天既有分析以\"该上车了,这是便宜货\"为题看多,也有以\"AI泡沫警报,2027年才见真章\"为题的警告,意思是这一轮AI资本开支的回报要到2027年才会被验证,而估值现在就要付。这就是当下大市值科技的共同处境:AI支出是确定的,回报的时间表不确定,谁的现有业务能扛住这段空窗期,谁就先被买。值得注意的是Palantir的涨幅——伯里正在加空它,而它周三仍收涨2.76%,分歧同样没有收敛。你会买现有业务更扛的Meta、等谷歌的云增速重新超过资本开支,还是干脆避开这段回报空窗期?", title_en: "Both Burning Cash on AI — Why Is Google Sold While Meta Is Bought?", body_en: "Mega-cap tech diverged sharply on Wednesday: Alphabet fell 1.23%, the steepest decline in the group, while Meta gained 1.07%, Apple +1.15%, Microsoft +0.95%, and Palantir +2.76%. The case against Alphabet was stated plainly — investors are using its AI spending as a hedge against cloud revenue growth; when the slope of capex is steeper than the slope of cloud revenue, the market trims the position first, the same logic that punished Alibaba's recent results, though Alphabet's cloud base is considerably larger. The Meta debate was equally polarized on the same day, with one analyst publishing a bullish note titled \"time to get in, this is cheap\" alongside a separate warning headlined \"AI bubble alert, 2027 is when it gets real\" — the argument being that returns on this wave of AI capex won't be validated until 2027, while valuations demand payment today. This is the shared condition of large-cap tech right now: AI spending is certain, the return timeline is not, and whichever company's existing business can sustain the gap gets bought first. Palantir's 2.76% gain is worth noting — Michael Burry is building a short position against it, yet the divergence showed no sign of narrowing on Wednesday. Will you buy Meta for its more resilient core business, wait for Alphabet's cloud growth to re-accelerate past its capex run-rate, or sidestep the entire return-gap window altogether?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
