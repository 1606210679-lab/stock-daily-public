<script>
const topics = [
  { ticker: "NVDA / ANT", title_cn: "英伟达财报遇上Anthropic上市窗口，AI链怎么选？", body_cn: "英伟达（NVDA）美股周一（11月16日）收跌4.12%，定于美东周二盘后交出换帅后首份业绩；Anthropic则处在招股和潜在上市交易窗口，两件事同时检验AI投入能否转化为收入。Finnhub日历列英伟达营收预期约1112亿美元、每股收益约2.52美元，实际数字与下一季指引仍待披露；Anthropic的招股区间也不是最终发行价。多头看芯片交付和模型需求彼此支撑，空头担心英伟达管理层过渡、云厂资本支出回收及新股高估值。周一股价不能由尚未公布的财报或尚未完成的上市来解释。指引不等于已签合同，也不能证明对手获得订单。短期先核英伟达交付，中期再看Anthropic定价；你认为先等业绩验证比抢新股更稳妥吗？", title_en: "Nvidia Earnings Meet the Anthropic IPO Window — Where Is the AI Signal?", body_en: "Nvidia (NVDA) fell 4.12% on Monday, November 16, with after-hours earnings due Tuesday marking the company's first results under new leadership; Anthropic is simultaneously in its IPO subscription and potential listing window, with both events testing whether AI investment can convert to revenue. Finnhub consensus pegs Nvidia revenue at ~$111.2B and EPS at ~$2.52, though actual figures and next-quarter guidance remain unreleased; Anthropic's price range is not yet a final offering price. Bulls see chip delivery and model demand as mutually reinforcing; bears cite Nvidia's management transition, cloud capex payback risk, and lofty IPO valuations. Monday's stock move cannot be explained by earnings not yet released or an offering not yet completed. Guidance is not a signed contract and does not prove a rival won orders. Which confirmation matters first for positioning: Nvidia's deliveries or Anthropic's final pricing?" },
  { ticker: "SOXL / SOXS", title_cn: "SOXL跌16.39%，三倍杠杆仓位怎么管？", body_cn: "半导体三倍做多ETF（SOXL）美股周一（11月16日）收跌16.39%，三倍做空ETF（SOXS）涨16.54%，英伟达、AMD、台积电和存储股普遍下跌之际，杠杆工具把单日方向判断放大成明显不同的损益。多头若押注英伟达周二盘后财报带动板块修复，SOXL提供较高的单日弹性；空头若押注盈利指引不及预期，SOXS对下跌更敏感。但两只基金追踪的是每日杠杆目标，连续持有时的复利和每日重置会使多日表现偏离标的累计涨跌的简单三倍，盘中反抽也可能迅速侵蚀空头收益。当前更重要的是先区分基本面判断和杠杆期限：在财报前控制SOXL敞口、用SOXS短期对冲，还是等英伟达指引明确后再选择方向？", title_en: "SOXL Plunges 16.39% — How Should Traders Manage 3x Leveraged Positions?", body_en: "The 3x leveraged semiconductor ETF (SOXL) fell 16.39% on Monday, November 16, while its inverse counterpart (SOXS) gained 16.54%, as Nvidia, AMD, TSMC, and memory stocks declined broadly — with leverage amplifying a single day's directional call into materially different P&L outcomes. Bulls betting on a sector recovery driven by Nvidia's after-hours earnings gain higher single-day elasticity via SOXL; bears anticipating a guidance miss find SOXS more sensitive to downside. Critically, both funds target daily leverage resets, meaning compounding and daily rebalancing cause multi-day returns to diverge significantly from a simple 3x multiple of the underlying's cumulative move, and intraday reversals can rapidly erode short-side gains. The more important question now is separating fundamental conviction from leverage horizon: would you trust a daily-reset hedge through Nvidia's earnings release?" },
  { ticker: "QQQ", title_cn: "沃什提出AI三种情景，QQQ回撤后怎么布局？", body_cn: "纳指100 ETF（QQQ）美股周一（11月16日）收跌2.67%，标普500 ETF（SPY）跌1.91%；美联储主席沃什在11月16日生产率与就业会议上提出“超级智能”带来的三种示意情景。其一是生产率上升且劳动与资本广泛受益；其二是增长改善却伴随自动化造成的就业冲击；其三是前期巨额投资与股市上涨之后回报不及预期、估值回落和失业增加。他明确表示这些情景不是预测，也没有在讲话中给出12月利率决定。多头看生产率提升支撑盈利，空头担心劳动力错配或资本支出不能兑现。讲话不能单独解释QQQ周一全部跌幅，更不能把情景推演当成利率决定；这三种情景中，你最担心哪一种对科技估值的冲击？", title_en: "Warsh Outlines Three AI Scenarios — How to Position After QQQ's Pullback?", body_en: "The Nasdaq-100 ETF (QQQ) fell 2.67% and the S&P 500 ETF (SPY) dropped 1.91% on Monday, November 16. In remarks at a Nov. 16 productivity and employment conference, Fed Chair Warsh laid out three illustrative scenarios for \"superintelligence\": broad productivity gains benefiting both labor and capital; improved growth accompanied by automation-driven job displacement; and a third where outsized prior investment and equity gains give way to disappointing returns, valuation compression, and rising unemployment. Warsh explicitly noted these are not forecasts and offered no December rate decision. Bulls see productivity gains supporting earnings; bears worry about labor mismatch and capital spending that fails to pay off. The remarks alone cannot explain QQQ's entire Monday decline, nor are the scenarios a rate decision. Of the three scenarios, which poses the biggest risk to tech valuations?" },
  { ticker: "09888.HK / 09618.HK / 00700.HK / 09988.HK", title_cn: "腾讯阿里接力放榜，港股科技靠什么反攻？", body_cn: "百度（09888.HK）11月16日先交卷：第三季AI云基础设施收入82亿元，同比增长94%，但在线营销收入119亿元、同比下降22%，云业务增长尚未完全抵消广告承压。京东（09618.HK）定于17日美股开市前发布业绩，腾讯（00700.HK）18日审议季报，阿里（09988.HK）19日公布结果。国家统计局数据显示，10月社零同比仅增0.4%，较9月的1.1%放缓；1—10月网上商品零售额增长2.9%，消费成色会影响后续指引。四家的检验点不能混为“AI收入”：京东看零售订单、履约成本与利润率；腾讯看游戏和广告；阿里看电商利润与云增长；百度则看AI云能否持续抵消广告下滑。多头押注效率与云需求带动盈利修复，空头担心消费疲软、促销投入和算力成本。你更相信腾讯游戏广告、京东零售利润，还是阿里与百度云业务能率先拿出有利润支撑的反攻？", title_en: "Tencent, Alibaba Set to Report — Can Hong Kong Tech Stage a Comeback?", body_en: "Baidu (09888.HK) kicked off earnings season on Nov. 16: Q3 AI cloud infrastructure revenue rose 94% YoY to RMB 8.2 billion, while online marketing revenue fell 22% YoY to RMB 11.9 billion, leaving cloud growth unable to fully offset ad weakness. JD.com (09618.HK) reports before U.S. market open on the 17th, Tencent (00700.HK) reviews quarterly results on the 18th, and Alibaba (09988.HK) publishes results on the 19th. Official data show October retail sales grew just 0.4% year over year, down from 1.1% in September, while online goods retail sales rose 2.9% over January–October; consumer momentum will weigh on forward guidance. The four names demand distinct scorecards: JD on retail orders, fulfillment costs, and margins; Tencent on gaming and ads; Alibaba on e-commerce profit and cloud growth; Baidu on whether AI cloud can keep offsetting ad decline. Bulls are betting on efficiency gains and cloud demand driving an earnings recovery; bears cite soft consumption, promotional spending, and compute costs. Do you have more conviction in Tencent's gaming and ad revenue, JD's retail margins, or Alibaba and Baidu's cloud businesses to deliver a profit-backed rebound first?" },
  { ticker: "ANT", title_cn: "Anthropic上市窗口逼近，三条路径怎么布局？", body_cn: "Anthropic拟以ANT为代码上市，11月10日更新的招股书列出每股70至78美元的预计发行区间和约8.25亿股发行量；公司尚未公布最终定价和首日成交价格。此前彭博援引知情人士称认购意向约为公开发行量六倍，但询价热度不等于普通投资者能获配，也不保证上市后收益。美东11月19日只是市场预期的交易窗口，仍须等正式公告。多头看Claude需求和云渠道扩张，空头担心算力成本、盈利兑现及新股流通供给。申购获配受资格与分配限制，上市后买入要面对价格发现，已上市云合作伙伴只提供间接敞口、并非等同持有Anthropic；如果想参与这轮模型公司上市，什么样的发行价与首日成交价才值得承担这类风险？", title_en: "Anthropic IPO Window Approaches — How to Navigate Three Entry Paths?", body_en: "Anthropic plans to list under the ticker ANT; its prospectus updated Nov. 10 lists an indicative price range of $70–$78 per share and an offering size of approximately 825 million shares, with final pricing and first-day trading price not yet announced. Bloomberg previously cited sources saying indications of interest reached roughly six times the public offering size, though subscription demand does not guarantee allocation for retail investors or post-listing gains; Nov. 19 U.S. Eastern time remains only the market's expected trading window, pending official announcement. Bulls point to Claude demand and cloud-channel expansion; bears flag compute costs, profit delivery risk, and newly tradable shares. IPO allocation depends on eligibility and distribution, buying after listing exposes investors to price discovery, and listed cloud partners offer only indirect exposure rather than ownership of Anthropic. What final offering and first-trade prices would justify that risk?" },
  { ticker: "TSM", title_cn: "台积电跌6.34%，10月营收年内新高能托底吗？", body_cn: "台积电（TSM）美股周一（11月16日）收跌6.34%，与英伟达和AMD同向下跌；公司11月10日已公布10月合并营收新台币5868.9亿元，同比增59.7%，为2026年截至10月的单月最高值。强劲的月度收入与一周后的股价回撤呈现背离，但已披露的数据不能倒作周一跌幅的直接原因。多头看先进制程与封装需求仍有订单基础，空头担心客户支出节奏、产能扩建成本和芯片板块估值同步压缩；一日跌幅不能直接证明订单已被取消。下一个核验点是11月营收、后续产能指引及英伟达财报，再看订单能否延续。台积电的代工订单、英伟达的实际交付，还是暂时用QQQ分散个股风险，哪个更适合作为观察AI硬件链的入口？", title_en: "TSMC Drops 6.34% Despite an October Revenue Peak — What Matters Next?", body_en: "TSMC (TSM) fell 6.34% on Monday, November 16, moving in the same direction as Nvidia and AMD. On November 10, the company had reported October consolidated revenue of NT$586.89 billion, up 59.7% year over year and the highest monthly total through October 2026. Strong monthly revenue contrasts with a share-price decline a week later, but the earlier release cannot be treated as a direct cause of Monday's move. Bulls point to sustained order demand for advanced process nodes and advanced packaging; bears cite customer spending cadence, capacity expansion costs, and valuation compression across the semiconductor sector — a single-day decline does not confirm order cancellations. The next tests are November revenue, subsequent capacity guidance and Nvidia's earnings, to see whether demand holds up. Does TSMC's operating resilience make this selloff look excessive, even before Nvidia reports?" },
  { ticker: "NVDA / SPCX / MU / SNDK", title_cn: "ARK加码英伟达与SpaceX，桥水为何转向存储？", body_cn: "截至9月30日的第三季13F显示，ARK持有的英伟达（NVDA）股数较6月底增加约85%，SpaceX（SPCX）增加约51%；桥水则把英伟达股数减约30%，美光（MU）增约103%，闪迪（SNDK）从317股增至约6.68万股，但闪迪基数很低，不宜只看增幅。Alphabet申报的SpaceX持股市值约占其13F所列证券总值的95%，这不是占Alphabet全部资产的比例。不同机构并非押注同一条AI链：有人加码龙头与航天，有人降低芯片龙头敞口、增持存储。上述变化按两季持股数量比较，不能把股价上涨造成的市值变化当作买入，也无法看出10月至今的买卖或空头。观察机构分歧时，你更认同ARK的英伟达与SpaceX，还是桥水的存储方向？", title_en: "ARK Adds Nvidia and SpaceX as Bridgewater Cuts the Chip Leader — What Matters?", body_en: "Third-quarter 13F holdings as of September 30 show ARK increased its Nvidia (NVDA) position by approximately 85% from end-June and SpaceX (SPCX) by roughly 51%, while Bridgewater trimmed Nvidia by about 30%, raised Micron (MU) by approximately 103%, and lifted SanDisk (SNDK) from 317 shares to roughly 66,800 — though SanDisk's base was extremely small, making the percentage gain misleading. Alphabet's disclosed SpaceX stake represents roughly 95% of the total market value of securities listed in its 13F, not a share of Alphabet's total assets. The divergence reveals institutions are not all betting on the same AI chain: some are adding exposure to the chip leader and aerospace, while others are reducing it and rotating into memory. These comparisons use share counts rather than market values, so price appreciation alone is not treated as buying; the filings do not show trades from October onward or short positions. When assessing the institutional divide, do you side with ARK's Nvidia-and-SpaceX thesis or Bridgewater's tilt toward memory?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
