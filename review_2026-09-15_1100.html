<script>
const topics = [
  { ticker: "CRWD / PANW", title_cn: "网安股集体大涨,AI安全能否成新主线?", body_cn: "周一美股网络安全概念集体大涨,CrowdStrike收涨13.85%报235.38美元,创历史新高;Palo Alto Networks涨超13%,网络安全ETF-Global X涨逾10%,概念整体涨6.52%。推力是过去两天Anthropic、OpenAI、微软等头部公司接连发布的AI风险警示。英伟达首席执行官黄仁勋此前也指出,随着AI加快代码生成,漏洞发现和攻击的速度同步提升,网络安全可能成为下一个重要应用。落到钱上要看预算:企业如果加大模型监控、身份验证、云安全和自动化防御的投入,AI这条交易主线就可能由GPU、服务器延伸到安全软件。多头的抓手是风险被头部公司自己点名,安全预算最先落地;空头的抓手是网安的盘子远小于算力,接不住从芯片上掉下来的市值。AI越危险网安越赚钱,这个逻辑你信吗?", title_en: "Cybersecurity Stocks Surge — Can AI Security Become the Next Major Theme?", body_en: "U.S. cybersecurity stocks rallied sharply Monday, with CrowdStrike closing up 13.85% at $235.38, a record high; Palo Alto Networks gained over 13%; and the Global X Cybersecurity ETF rose more than 10%, with the sector up 6.52% overall. The catalyst was a wave of AI risk warnings issued over the prior two days by Anthropic, OpenAI, and Microsoft. Nvidia CEO Jensen Huang has also noted that as AI accelerates code generation, the speed of vulnerability discovery and cyberattacks rises in tandem — potentially making cybersecurity the next major AI application. The bull case rests on security budgets being the first to capture AI-driven spending; the bear case is that the cybersecurity market is far smaller than compute infrastructure and cannot absorb capital rotating out of chips. The more dangerous AI becomes, the more cybersecurity profits — do you buy that logic?" },
  { ticker: "SOXL / NVDA / AMD / MRVL / AVGO", title_cn: "三倍半导体ETF单日跌17%,芯片能否止血?", body_cn: "周一芯片全线重挫。三倍做多半导体ETF(SOXL)收跌16.98%,它带三倍杠杆,跌幅本身会被放大,同期个股跌得小得多:Marvell收跌7.32%报218.82美元,英特尔收跌5.59%报97.19美元,博通收跌4.77%报344.72美元,AMD收跌4.40%报493.41美元,英伟达收跌3.36%报210.96美元。砸下来的是周末那场表态:Anthropic首席执行官阿莫迪呼吁全球放慢AI推进,马斯克、OpenAI首席执行官奥尔特曼和谷歌AI负责人相继附议。马斯克的传记作者提出,这些公司承认风险之后可能要面对法律责任;反方向的声音也有,特朗普公开抨击这轮AI恐慌。博通还有自己的账,它给出的217亿美元AI收入预测撞上放缓担忧。多头的抓手是没有一家宣布削减资本开支,喊话和改预算两回事;空头的抓手是训练节奏真被按下去,最先挨刀的是卖算力的这批。几位大佬喊放慢,真能让这轮资本开支慢下来吗?", title_en: "3x Semiconductor ETF Drops 17% in a Day — Can Chips Stem the Bleeding?", body_en: "Chips sold off broadly Monday. The 3x leveraged semiconductor ETF (SOXL) closed down 16.98%, with the decline amplified by its leverage; underlying stocks fell more modestly — Marvell dropped 7.32% to $218.82, Intel fell 5.59% to $97.19, Broadcom lost 4.77% to $344.72, AMD slid 4.40% to $493.41, and Nvidia declined 3.36% to $210.96. The trigger was weekend remarks from Anthropic CEO Dario Amodei calling for a global slowdown in AI development, with Elon Musk, OpenAI CEO Sam Altman, and Google's AI chief echoing the view. Broadcom faced an additional headwind as its $21.7 billion AI revenue forecast collided with slowdown fears. The bull case is that no company has announced capex cuts — rhetoric and budgets are different things; the bear case is that if training timelines are genuinely pressed, compute sellers take the first hit. Can a few executives calling for a slowdown actually put the brakes on this capex cycle?" },
  { ticker: "MU / SNDK / SKHY", title_cn: "存储成重灾区,涨价撑起的增长能否续?", body_cn: "存储是周一跌得最狠的一档。SK海力士收跌7.60%报175.63美元,美光收跌5.25%报924.03美元,闪迪收跌4.98%报1551.99美元,西部数据同步走低。跌幅排在半导体前面不是偶然,这一档的估值里装的正是涨价预期。闪迪8月5日公布的那份财季报表把结构摆得很清楚:营收89.7亿美元,环比增长51%,公司自己说增量约三分之一来自出货量提升,三分之二来自价格上涨,非GAAP毛利率升6.2个百分点到84.6%。价格贡献三分之二,意味着报价一旦不再往上走,增速会自己塌下来。TrendForce此前估算NAND合约价在春季那一季涨了70%到75%,到下一季预计收窄至10%到15%。多头的抓手是美光9月30日的季报会给出最新报价和订单;空头的抓手是涨价这条腿比出货量那条腿短,AI节奏一慢它先软。三分之二的增长来自涨价,这样的高增长算数吗?", title_en: "Memory Stocks Hit Hardest — Can Price-Driven Growth Last?", body_en: "Memory was the worst-performing segment Monday. SK Hynix fell 7.60% to $175.63, Micron dropped 5.25% to $924.03, SanDisk lost 4.98% to $1,551.99, and Western Digital moved lower in tandem. The outsized declines relative to broader semiconductors are no coincidence — valuations in this group are priced for sustained price increases. SanDisk's most recent quarterly results laid out the structure clearly: revenue of $8.97 billion, up 51% sequentially, with the company attributing roughly one-third of the gain to volume growth and two-thirds to price increases, lifting non-GAAP gross margin 6.2 percentage points to 84.6%. With pricing accounting for two-thirds of growth, any stall in ASP momentum would deflate the growth rate on its own. TrendForce had previously estimated NAND contract prices rose 70%–75% in the spring quarter, with the following quarter expected to narrow to 10%–15% growth. The bull case is Micron's upcoming earnings providing the latest read on pricing and orders; the bear case is that the pricing leg is shorter than the volume leg, and any AI slowdown hits it first. When two-thirds of growth comes from price increases, does the headline number really hold up?" },
  { ticker: "GOOG / META / AAPL", title_cn: "芯片大跌谷歌Meta逆势涨,AI的钱在换方向?", body_cn: "同一条AI线上,周一走出了两个方向。谷歌收涨3.06%报345.71美元,Meta收涨2.71%报665.60美元,苹果收涨0.24%报333.08美元,而卖算力的那批在两位数下挫。市场对这轮的概括是:卖铲子的在跌,用铲子的在涨。逻辑不复杂,模型迭代放慢,最先被砍的是芯片订单,而这些公司自己就是买家,开支压力反而松一口气。钱从哪儿来也值得看一眼:大型科技公司近期合计发行了约2200亿美元债券,Alphabet和Meta被当成AI正在扭曲信贷市场的样本,Meta手上还压着约1300亿美元的AI建设计划。苹果走的是另一条线,它的Siri升级不要求用户换新机。多头的抓手是需求端的公司握着议价权,放慢对它们是省钱;空头的抓手是这笔钱终究是借来的,利率再往上,这本账就不好算了。同一条AI线上,最后赚到钱的会是卖算力的还是用算力的?", title_en: "Chips Plunge While Google and Meta Rally — Is AI Money Changing Hands?", body_en: "The same AI trade produced two divergent directions Monday. Alphabet closed up 3.06% at $345.71, Meta gained 2.71% to $665.60, and Apple edged up 0.24% to $333.08 — while compute sellers posted double-digit losses. The market's shorthand for the session: the shovel-sellers fell, the shovel-users rose. The logic is straightforward — slower model iteration means chip orders get cut first, while these companies are themselves the buyers, so easing capex pressure is a relief. The funding angle is also worth noting: major tech companies have recently issued roughly $220 billion in bonds in aggregate, with Alphabet and Meta cited as examples of AI distorting credit markets; Meta alone is sitting on approximately $130 billion in AI infrastructure plans. Apple is on a separate track, with its Siri upgrade not requiring users to buy new hardware. The bull case is that demand-side companies hold pricing power and a slowdown means savings; the bear case is that this money is ultimately borrowed, and higher rates make the math harder. On the same AI trade, who ultimately captures the returns — the compute sellers or the compute users?" },
  { ticker: "QQQ / SPY / .SPX", title_cn: "10年期美债盘中触及5%,指数能否扛住?", body_cn: "指数跌得比芯片体面得多。QQQ收跌0.80%报709.18美元,SPY收跌0.45%报760.88美元,标普500收跌0.48%报7619.98点。同一天,10年期美债收益率盘中触及5%,最高到5.012%,是2007年以来的最高水平,尾盘回落到4.95%附近,没有守在5%上方。往上顶的是通胀和供给两头:上周五的物价数据把本周加息的押注推到88%(CME FedWatch),油价同步反弹,政府和企业的融资需求还在膨胀。收益率对科技股的传导路径很明确,贴现率一抬,越是把利润放在远期的公司越吃亏,这也解释了同一天芯片跌两位数而指数只跌不到1%。美联储的利率决议在美东时间9月16日周三下午、北京时间9月17日凌晨2点公布。多头的抓手是指数没跟着芯片走,说明钱是在内部换方向而不是离场;空头的抓手是5%这道关口一旦站稳,估值高的那批还得再调一轮。收益率到5%这关,你觉得市场这次是高估还是低估了?", title_en: "10-Year Treasury Hits 5% Intraday — Can Equities Hold?", body_en: "Major indexes held up far better than chips. QQQ fell 0.80% to $709.18, SPY dropped 0.45% to $760.88, and the S&P 500 declined 0.48% to 7,619.98. On the same day, the 10-year Treasury yield touched 5% intraday, reaching a high of 5.012% — its highest level since 2007 — before pulling back to around 4.95% by the close. The upward pressure came from both inflation and supply: Friday's price data pushed rate-hike bets to 88% on CME FedWatch, oil prices rebounded, and government and corporate financing needs continue to expand. The transmission from yields to tech is well-defined — a higher discount rate penalizes companies with earnings weighted toward the future, which explains why chips fell double digits while the broader index lost less than 1%. The bull case is that indexes did not follow chips lower, suggesting rotation rather than outright exit; the bear case is that if 5% holds, high-multiple names face another round of re-rating. With yields at the 5% threshold, does the market have this right — or is it under- or over-reacting?" },
  { ticker: "ORCL / NBIS", title_cn: "华尔街要的是现金,甲骨文的订单能否变现?", body_cn: "甲骨文收跌3.65%报144.79美元,Nebius收跌5.50%报212.19美元。市场对甲骨文的问法很直白:订单它有,华尔街要的是现金。约6640亿美元的积压订单要变成收入,得先把产能建起来,而它的资本预算已经超过业务产生现金的两倍,缺口只能靠借。这就是为什么融资成本成了这条线上的分水岭:同样是做AI算力租赁,CoreWeave的借款定价在SOFR加5.5%,Nebius是加2.5%,放贷的人已经在两家之间划了线。“大空头”迈克尔·伯里近期公开反对AI要放缓的说法,而被摆上台面做压力测试的,正是CoreWeave和Nebius这类靠借钱扩张的公司。10年期美债收益率当天盘中触及5%,让这笔账更难算。多头的抓手是积压订单基数足够大,转化率只要给出方向,估值就有重定的空间;空头的抓手是利率抬高了每一分融资的价格,转化越慢,窟窿越深。订单和现金,市场这次该先看哪一个?", title_en: "Wall Street Wants Cash — Can Oracle Convert Its Backlog?", body_en: "Oracle closed down 3.65% at $144.79 and Nebius fell 5.50% to $212.19. The market's question for Oracle is blunt: it has the orders, but Wall Street wants cash. Converting approximately $664 billion in backlog into revenue requires building out capacity first — and its capital budget already exceeds twice the cash its operations generate, leaving a gap that can only be filled by borrowing. That is why financing costs have become the fault line in AI cloud infrastructure: CoreWeave borrows at SOFR plus 5.5%, while Nebius is at SOFR plus 2.5% — lenders have already drawn a line between them. 'Big Short' investor Michael Burry has publicly pushed back against the AI slowdown narrative, yet it is precisely leveraged-expansion players like CoreWeave and Nebius being placed under stress-test scrutiny. With the 10-year yield touching 5% intraday, the math only gets harder. The bull case is that a large enough backlog gives conversion-rate improvements room to re-rate valuations; the bear case is that every point of rate increase raises the cost of financing, and the slower the conversion, the deeper the hole. Backlog or cash — which should the market focus on first?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
