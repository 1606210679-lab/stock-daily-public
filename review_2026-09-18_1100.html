<script>
const topics = [
  { ticker: "QQQ / SPY / .SPX", title_cn: "加息第二天指数全线涨回来,推力在哪?", body_cn: "加息落地的第二天,三大指数全线收涨:QQQ收涨1.73%报716.92美元,SPY收涨1.13%报762.60美元,标普500收涨1.14%报7637.76点。周三美联储宣布加息25个基点那天,标普500收跌0.45%,QQQ几乎收平;一天之后,跌掉的不但补了回来,还多涨了一截。推力有两条,都不在盘面上。一是当周初请失业金人数意外下降,就业这一端没有顺着加息给出的紧缩方向走;二是油价继续走低,通胀这一端的压力也跟着松了。美联储控通胀的表态压低了国债收益率,大型科技股跟着走强。多头的抓手是最不确定的一件事已经过去,数据这边还给了一层缓冲;空头的抓手是点阵图给的是今年还要再加一次,而市场只为这一次定了价。加息这条线还没走完,市场在赌什么?", title_en: "Markets Rebound Day After Rate Hike — What's Driving the Rally?", body_en: "All three major indices closed higher the day after the Fed's 25-basis-point rate hike: QQQ +1.73% to $716.92, SPY +1.13% to $762.60, and the S&P 500 +1.14% to 7,637.76. On Wednesday, when the Fed announced the 25-basis-point hike, the S&P 500 fell 0.45% and QQQ closed roughly flat; a day later the market had more than recovered Wednesday's losses. Two off-screen catalysts provided the lift: weekly jobless claims unexpectedly fell, signaling the labor market isn't tightening in line with rate policy, while continued declines in oil prices eased inflation pressure. The Fed's anti-inflation stance pushed Treasury yields lower, lifting mega-cap tech. Bulls point to the single biggest uncertainty now being behind the market, with the data adding a layer of cushion; bears note the dot plot still signals one more hike this year, while the market has priced in only the one just delivered. With the rate path still open, what is the market actually betting on?" },
  { ticker: "NVDA / AMD / AVGO / SOXL / MRVL", title_cn: "黄仁勋给了个数字,AI硬件为何全线反攻?", body_cn: "英伟达首席执行官黄仁勋给了一个数字:英伟达明年的芯片销量将是今年的两倍。他同时说人工智能安全至关重要,但监管AI不能照搬管社交媒体的那一套。这句话出来之后,AI硬件几条线一起反攻:费城半导体指数涨超3%,AMD收涨6.36%报545.09美元,英伟达收涨2.54%报219.34美元,博通收涨2.29%报347.30美元;光通信这边,Marvell收涨4.81%报240.76美元。三倍做多半导体ETF(SOXL)收涨10.44%,它带三倍杠杆,涨跌幅会被放大,不能跟个股并排看。这已经是半导体反弹的第三个交易日,而这轮反弹的起点,正是“AI放缓”吵得最凶的那几天。多头的抓手是争论吵了一周,终于有人把出货口径摆到了台面上;空头的抓手是翻倍是公司自己给的预期,不是已经签下的订单。一句“明年销量翻倍”,分量够不够撑起这轮反攻?", title_en: "Jensen Huang Drops a Number — Why Did AI Hardware Stage a Full Comeback?", body_en: "Nvidia CEO Jensen Huang stated that the company's chip shipments next year will be double this year's volume, adding that AI safety is critical but that regulating AI cannot follow the same playbook used for social media. The remarks triggered a broad AI hardware rally: the Philadelphia Semiconductor Index surged over 3%, AMD +6.36% to $545.09, Nvidia +2.54% to $219.34, Broadcom +2.29% to $347.30, and Marvell +4.81% to $240.76. The 3x leveraged semiconductor ETF SOXL surged 10.44%, though its amplified moves are not comparable to individual stock performance. This marks the third consecutive session of semiconductor gains — a rebound that began precisely when \"AI slowdown\" fears were loudest. Bulls point to a week-long debate finally getting a concrete shipment figure on the table; bears note that doubling is a projection from the company itself, not orders already signed. Does one line about doubling shipments carry enough weight to sustain this rally?" },
  { ticker: "MU / SNDK / SKHY / INTC", title_cn: "存储价格涨超500%,这还算利好吗?", body_cn: "存储周四集体上涨,推力是一句关于价格的表态:英特尔首席执行官称,存储价格已经涨超500%。美光收涨5.50%报977.50美元,闪迪收涨6.21%报1614.39美元,SK海力士收涨4.64%报182.99美元。涨得最多的反而是说这话的英特尔,收涨7.67%报108.80美元,它这边还压着另一条线——SK海力士用它的美国产能代工存储芯片的谈判,已经是第二天在推股价,但有媒体直接点出,这笔交易目前还不存在。对着周三看更清楚:当时存储三只几乎贴着零轴,做代工的涨了4%;周四反了过来,价格口径一出,被代工的那一批跟上来了。多头的抓手是涨价终于从预期落到了一个具体倍数上;空头的抓手是这句话出自买存储的一方,讲的是成本压力,不等于卖存储的已经把它变成利润,而代工那条线也还只是传闻。这轮存储周期,你觉得走到哪一段了?", title_en: "Memory Prices Up Over 500% — Does That Still Count as Good News?", body_en: "Memory stocks rallied broadly on Thursday after Intel's CEO stated that memory prices have risen more than 500%. Micron gained 5.50% to $977.50, SanDisk rose 6.21% to $1,614.39, and SK Hynix climbed 4.64% to $182.99. Intel itself led the group, surging 7.67% to $108.80, buoyed by a second day of momentum around reports that SK Hynix is in talks to use Intel's U.S. capacity to foundry memory chips — though some outlets noted the deal does not yet exist. The contrast with Wednesday makes it clearer: that day the three memory names sat near flat while the foundry play rose 4%; on Thursday it flipped, and once the pricing figure landed, the names being courted for foundry capacity caught up. Bulls argue that price gains have finally moved from vague expectations to a concrete multiple; bears counter that the 500% figure came from a memory buyer describing cost pressure, not a seller reporting profit, and that the foundry narrative remains unconfirmed rumor. Where do you think this memory cycle currently stands?" },
  { ticker: "NBIS / CRWV / ORCL", title_cn: "算力价格接连上调,三家为何走出两个方向?", body_cn: "AI算力的价格在往上走,三家的股价却走出了两个方向。Nebius拟自10月1日起上调英伟达GPU和AMD CPU的租用价格,幅度尚未由公司正式确认,如果属实,这是继5月之后的第二轮提价,它盘中一度涨9%,收涨4.12%报217.99美元。CoreWeave同样在提价,自6月30日以来持续以更高价格签新的算力合同,三季度签下的合同期限约3至6个月,定价约为每兆瓦4000万美元,股价却收跌4.16%报79.88美元,当天它宣布了30亿美元可转换债券并同步增发股票。甲骨文收涨5.19%报150.59美元,它手上的积压订单是6640亿美元,重组也腾出了一部分成本空间。多头的抓手是能连提两轮价,供需这一侧是实的;空头的抓手是这门生意得先把钱砸进机房,融资方案一公布,提价换来的估值当天就还了回去。一边提价一边要钱,AI云这门生意到底赚不赚钱?", title_en: "AI Compute Prices Keep Rising — Why Are Three Players Moving in Two Directions?", body_en: "AI compute pricing is trending higher, yet three companies' stocks diverged sharply. Nebius plans to raise rental prices for Nvidia GPU and AMD CPU capacity effective October 1 — the magnitude unconfirmed by the company — which would mark a second round of increases since May; shares rose as much as 9% intraday, closing up 4.12% at $217.99. CoreWeave has also been signing new compute contracts at higher prices since June 30, with contracts signed in the third quarter running approximately three to six months at roughly $40 million per megawatt — yet shares fell 4.16% to $79.88 after the company announced $3 billion in convertible notes alongside a concurrent equity offering. Oracle gained 5.19% to $150.59, backed by a $664 billion backlog and cost headroom freed up by restructuring. Bulls point to back-to-back price increases as evidence of real supply-demand tightness; bears note that this business requires heavy upfront capital, and the day a financing deal is announced, any valuation uplift from higher pricing gets handed straight back. Can AI cloud actually make money while raising prices and raising cash at the same time?" },
  { ticker: "RKLB / SPCX", title_cn: "铱星交易过了第一关,航天的账怎么算?", body_cn: "航天这条线周四一起走强,推力各自不同。火箭实验室收涨6.47%报67.82美元,当天的主要故事在它这边:它与铱星通信的交易通过了美国联邦通信委员会的第一道审批,同一时间它完成了19.4亿美元的股票增发,并测试了Neutron火箭的关键硬件。增发规模接近20亿美元,股价当天没有因为摊薄走弱。SpaceX收涨2.60%报154.81美元,延续的还是星舰发射前的那一段,市场仍在提前反应。多头的抓手是审批和硬件同时往前迈了一步,这类公司最缺的就是进度被确认;空头的抓手是审批只是第一道,交易还没完成,而增发的摊薄是当场就发生的。这类公司的进展按年算,市场按天给价,你觉得合理吗?", title_en: "Iridium Deal Clears First Hurdle — How Do You Value the Space Trade?", body_en: "Space stocks moved broadly higher on Thursday on separate catalysts. Rocket Lab surged 6.47% to $67.82, leading the group: its transaction with Iridium Communications cleared an initial FCC approval, the company completed a $1.94 billion equity offering on the same day, and key hardware for the Neutron rocket was tested — all without the share price weakening on dilution. SpaceX rose 2.60% to $154.81, continuing a pre-Starship-launch pricing run as markets trade ahead of the event. Bulls see simultaneous regulatory and hardware progress as exactly the milestone confirmation this type of company needs most; bears note the approval is only the first of several hurdles, the transaction remains incomplete, and the dilution from the equity raise is already in effect. These companies measure progress in years — markets price them by the day. Does that make sense to you?" },
  { ticker: "AAPL / META / TSLA", title_cn: "芯片涨两位数,权重股为何只跟一个点?", body_cn: "周四这轮反弹并不均匀。标普500涨了1.14%,权重股跟得很克制:苹果收涨1.38%报337.00美元,Meta收涨1.34%报682.31美元,特斯拉收涨2.27%报366.20美元。同一天,芯片那一层是6%、7%的涨幅,带杠杆的产品因为放大效应到了两位数。三家当天并不缺消息:苹果正在挑战英国要求它为iPhone留后门的那道保密命令,Meta把新AI代理的权限开到了用户的收件箱和钱包,特斯拉上一季度自由现金流为负11亿美元,钱花在无人出租车和人形机器人上,手上还有435亿美元现金。但这三条都不属于当天能推动股价的量级,它们跟的还是大盘。多头的抓手是钱先进最景气的那一层,轮动才刚开始;空头的抓手是指数被少数几个板块推着走,宽度不够。反弹只发生在芯片这一层,这算不算健康?", title_en: "Chips Surge Double Digits — Why Did Mega-Caps Only Follow by One Point?", body_en: "Thursday's rally was notably uneven. The S&P 500 gained 1.14%, with mega-cap weights moving with restraint: Apple +1.38% to $337.00, Meta +1.34% to $682.31, and Tesla +2.27% to $366.20 — while the chip layer posted gains of 6% to 7%, with leveraged products reaching double digits on their amplification effect. All three had news: Apple is challenging a UK order requiring it to build a backdoor into iPhone; Meta expanded its new AI agent's permissions to users' inboxes and wallets; and Tesla reported negative free cash flow of $1.1 billion last quarter, spending on robotaxi and humanoid robot development while holding $43.5 billion in cash. None of those items were market-moving in magnitude on the day — all three simply tracked the broader index. Bulls say capital is rotating into the hottest sector first and the rotation has only just begun; bears warn that an index driven by a narrow slice of the market lacks the breadth for a durable rally. Is a rebound confined to chips alone healthy?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
