<script>
const topics = [
  { ticker: "AAPL / META / GOOG", title_cn: "库克交棒当天苹果涨2.6%,下周发布会要扛起4.75万亿?", body_cn: "苹果收涨2.61%,是当天大市值科技里几乎唯一像样的红盘,而同一天道指收跌419点、标普500收跌0.71%,它是逆着大盘走完全天的。催化就是交接本身:约翰·特努斯正式接任首席执行官,库克转任执行董事长;特努斯上任首日发出的全员信里把下周那场活动形容为\"极其非凡\",市场直接把这句话当产品预期在买。日历是硬的,美东9月9日、对应北京时间9月10日凌晨开发布会,焦点在新一代iPhone,以及折叠形态究竟会不会在这一代露面。估值这一侧的账也摆得很清楚,总市值约4.75万亿美元、市盈率37倍,新帅接手的是一份已经把高预期提前定价进去的资产,而离5万亿只差5%出头。分歧同一天就出现了,罗森布拉特维持中性,目标价只从300美元抬到303美元,明显低于现价;也有分析师把新帅的首要任务定义为把流失的人才拉回来,而不是这场发布会。巨头内部的分化值得一并看,Meta收涨1.08%,谷歌收跌1.01%,微软收跌1.24%,同一根利率的压力棒下,资金明显在挑叙事最新的那一只。你会把换帅当成苹果AI叙事的重启,还是等9月10日凌晨的实物出来再决定?", title_en: "Apple Rises 2.6% on CEO Handover — Can Next Week's Event Justify $4.75T?", body_en: "Apple gained 2.61%, one of the few large-cap tech names in the green as the Dow fell 419 points and the S&P 500 slid 0.71%. The catalyst was the leadership transition itself: John Ternus officially assumed the CEO role while Tim Cook moved to Executive Chairman, and Ternus's company-wide memo on day one described next week's event as 'extraordinary,' which markets immediately treated as a product signal. The event is scheduled for September 9 U.S. ET — September 10 Beijing time — with focus on the next iPhone generation and whether a foldable form factor will debut; Apple's market cap stands at roughly $4.75 trillion at 37x P/E, already pricing in elevated expectations and sitting just over 5% below $5 trillion, while Rosenblatt maintained Neutral, nudging its target only from $300 to $303 — well below the current price — and other analysts define the new CEO's first task as winning back departed talent rather than the event itself. The split within mega-caps is worth noting: Meta rose 1.08%, Alphabet fell 1.01%, and Microsoft dropped 1.24%, with capital visibly favoring the freshest narrative under the same rate pressure. Will you read the CEO change as a reset of Apple's AI narrative, or wait for the September 10 hardware reveal before deciding?" },
  { ticker: "QQQ / .SPX / MSFT / NVDA / NBIS", title_cn: "加息概率一周从四成跳到七成,AI资本开支要按4.8%重算?", body_cn: "债市才是当天真正的主角。10年期美债收益率升破4.8%,回到2023年10月以来的高位附近,30年期到5.29%,道指收跌419点,标普500收跌0.71%,QQQ收跌1.27%。推力有两条,而且互相加强:美伊僵局把布伦特原油推到90美元上方、连涨第三个交易日;沃什重申抗通胀立场,巴尔表态若通胀不回落就该准备加息,市场对本月加息的定价一周之内从约四成跳到约七成。传导路径这次写得格外具体——微软收跌1.24%,当天的归因干脆写成\"410亿美元的资本开支撞上4.8%的收益率\":AI基建是一笔长久期的现金流投入,贴现率抬一档,回本年限就得重算一遍。卖算力的一侧同样没能免疫,英伟达收跌1.51%,Nebius收跌3.29%,甲骨文当天跌约4%,那笔靠举债撑起来的AI扩产正被债市当面测试。日历排得很密,周三ADP、周五8月非农,市场预期新增约4.5万人。多头的理由是收益率上行来自增长而不是衰退,资本开支的订单一分没少;空头的理由是这轮估值本来就架在低贴现率上,利率多走一段,估值就得少给一段。你会在非农前把仓位挪到现金流确定的一侧,还是认为利率这一跳只是噪音?", title_en: "Rate-Hike Odds Jump From 40% to 70% in a Week — Time to Reprice AI Capex at 4.8%?", body_en: "Bond markets were the real story: the 10-year Treasury yield broke above 4.8%, its highest level since around October 2023, while the 30-year reached 5.29%, the Dow dropped 419 points, the S&P 500 fell 0.71%, and QQQ lost 1.27%. Two reinforcing drivers were at work — the U.S.-Iran standoff pushed Brent crude above $90 for a third straight session, and Warsh reaffirmed his anti-inflation stance while Barr signaled readiness to hike if inflation fails to retreat, sending rate-hike pricing for this month from roughly 40% to roughly 70% within a week. The transmission was spelled out explicitly: Microsoft fell 1.24%, with the day's commentary framing it as '$41 billion in capex colliding with a 4.8% yield' — AI infrastructure is a long-duration cash-flow commitment, and raising the discount rate forces a full recalculation of payback timelines; Nvidia dropped 1.51%, Nebius fell 3.29%, and Oracle slid roughly 4% as its debt-funded AI expansion faced a live stress test from the bond market, with Wednesday's ADP and Friday's August nonfarm payrolls — consensus near 45,000 new jobs — next on the calendar. Will you rotate toward cash-flow-certain positions ahead of payrolls, or treat this rate move as noise?" },
  { ticker: "MU / SNDK / SKHY / SOXL", title_cn: "美光台湾近万人酝酿罢工,存储的风险从价格换到了产线?", body_cn: "存储链集体回吐,美光收跌2.64%,闪迪收跌1.90%,SK海力士收跌2.31%,三倍做多的SOXL收跌6.10%,把前一天靠指数调仓拉出来的那根阳线还了回去。这次的变量不在需求端:代表其台湾厂区近万名员工的工会正在推动罢工,诉求是奖金与利润分享——这是本轮AI存储周期里第一次,风险项从\"价格会不会见顶\"换成了\"产线能不能开满\"。位置也刁,台湾是美光最大的生产基地,而HBM的产能爬坡本来就没有多少余量。第二条压力来自对面,有报道称长鑫科技在新一代AI存储芯片上取得突破,而它上半年营收同比大增874%,巴伦周刊连着几天在讨论美光与长鑫的份额战。第三条是老问题,美光过去几个月主要在签多年长约,现货价的上行它吃不满,有分析直接把这套合约称作\"最坏情况的地板\",封住下限的同时也封住了上限。当供给端的确定性从\"我能不能拿到产能\"变成\"工厂开不开工\",这个板块的定价锚就换了一个。你会把罢工当成一次性扰动去接回调,还是认为这条线一旦松动,整轮存储的估值逻辑都得重写?", title_en: "Nearly 10,000 Micron Taiwan Workers Eye Strike — Has Memory Risk Shifted From Price to Production?", body_en: "Memory names sold off broadly: Micron fell 2.64%, SanDisk dropped 1.90%, SK Hynix slid 2.31%, and the 3x leveraged SOXL lost 6.10%, fully reversing the gains from the prior session's index-rebalancing pop. The variable this time is not on the demand side — a union representing nearly 10,000 employees at Micron's Taiwan facilities is pushing for a strike over bonus and profit-sharing terms, marking the first time in this AI memory cycle that the risk has shifted from 'will prices peak' to 'will production lines run at full capacity'; Taiwan is Micron's largest manufacturing base and HBM capacity ramp already has little slack. Two additional pressures compounded the move: reports that CXMT has achieved a breakthrough in next-generation AI memory chips, with its first-half revenue surging 874% year-on-year, fueling Barron's coverage of a Micron-versus-CXMT market-share battle; and a recurring structural issue — Micron has spent recent months locking in multi-year fixed contracts, limiting its upside capture from spot-price gains, with one analysis labeling the arrangement a 'worst-case floor' that caps both downside and upside. When supply-side certainty shifts from 'can I secure capacity' to 'will the factory actually run,' the sector's pricing anchor changes entirely. Will you treat the strike risk as a one-time disruption and buy the dip, or does a crack in this line mean the entire memory valuation thesis needs rewriting?" },
  { ticker: "NIO / TSLA", title_cn: "蔚来毛利率翻倍仍创52周新低,存储涨价的账单寄到车厂了?", body_cn: "蔚来收跌4.02%,盘后继续走低,收盘价创下52周新低。它交出的是一份撕裂的成绩单:每股亏损比市场预期窄了约两成,而营收低于预期约1.3%,亏损收窄靠的是车辆毛利率——有报道称这一项同比翻了一倍。市场没有买账,砍下去的是另外两件事:一是营收和销售展望都不够看,二是成本端冒出新变量,存储芯片涨价开始进入整车厂的物料清单。这条线值得单独记一笔,过去一年市场把存储涨价当成美光和海力士的利好在买,现在它开始以成本的形式出现在下游的损益表里,同一个价格,在产业链两端是两个方向的符号。卖方反应很快,摩根大通把评级下调至中性,并与花旗一起下调目标价与长期销量预测,理由都指向需求偏慢;管理层这一侧,首席财务官表示有信心完成全年经营目标。同一天特斯拉收跌3.22%,把前一日靠Cybercab叙事拉出来的涨幅回吐了大半,而奥斯汀那批车9月3日才真正投入运营。你会把存储成本当成整个电动车板块的新压力项,还是认为毛利率翻倍才是这份财报里更该被定价的部分?", title_en: "NIO Gross Margin Doubles Yet Stock Hits 52-Week Low — Has the Memory Price Hike Bill Reached Automakers?", body_en: "NIO fell 4.02% and continued lower after hours, closing at a 52-week low despite a mixed earnings report: per-share losses came in roughly 20% narrower than consensus, while revenue missed estimates by approximately 1.3%, with the loss improvement driven by vehicle gross margin — reported to have roughly doubled year-on-year. Markets were unimpressed, focusing instead on two concerns: a revenue and sales outlook that underwhelmed, and a new cost variable — memory chip price increases are now appearing in automakers' bills of materials, the same price that has been bought as a positive for Micron and SK Hynix now showing up as a negative on downstream income statements. Sell-side reaction was swift: JPMorgan downgraded to Neutral and, alongside Citi, cut its price target and long-term volume forecasts citing sluggish demand, while management's CFO expressed confidence in meeting full-year operating targets; Tesla fell 3.22% the same day, giving back most of the prior session's Cybercab-driven gains, with the Austin vehicles only entering actual service on September 3. Will you treat memory costs as a new sector-wide headwind for the entire EV space, or does a doubling gross margin deserve to be the dominant pricing signal in this report?" },
  { ticker: "DELL / AMD", title_cn: "戴尔日间跌6.8%盘后拉8%,AI服务器的订单终于变成利润?", body_cn: "戴尔是当天最分裂的一张图:正股日间收跌6.80%,盘后财报一出反手涨8.01%,把日间砍掉的几乎全部收了回来。数字给得很硬,每股收益7.04美元、超出预期约43%,营收约470亿美元、超出预期约4.6%,公司同时把全年营收指引上调约250亿美元,给出的理由是存储与服务器需求,AI服务器营收翻倍、订单创纪录。这一条之所以要单独拎出来,是因为它正面回答了整个AI硬件链最被怀疑的那个问题——订单能不能落到利润表上,而不是永远停在待交付的口径里。但同一天另一侧的提醒也很清楚,AMD收跌2.36%,有分析直接给出\"上行空间有限\"的判断,理由是主权AI和数据中心的增量已经被提前定价,而这类合作的收入确认往往比公告晚很多。日历上还有一道更大的坎,博通在美东周三盘后交卷,对应北京时间周四凌晨,卖方共识落在每股收益3.22到3.30美元、营收294亿到300亿美元这个区间,不同口径给出的数并不一致,而它手上正是定制ASIC这条线最大的份额。你会把戴尔这份财报当成AI硬件兑现的样本,还是等博通把定制芯片那本账也摊开再说?", title_en: "Dell Falls 6.8% Intraday, Then Surges 8% After Hours — Has AI Server Orders Finally Converted to Profit?", body_en: "Dell was the most bifurcated chart of the day: shares fell 6.80% during regular trading, then reversed sharply after earnings, gaining 8.01% after hours to recover nearly all of the intraday loss. The numbers were unambiguous — EPS of $7.04 beat consensus by roughly 43%, revenue of approximately $47 billion topped estimates by roughly 4.6%, and the company raised its full-year revenue guidance by approximately $25 billion, citing storage and server demand, with AI server revenue doubling and orders hitting a record. This matters because it directly answers the most-questioned issue across the AI hardware chain — whether orders can actually flow through to the income statement rather than staying permanently in the backlog. The same session offered a counterweight: AMD fell 2.36%, with one analysis citing 'limited upside' on the grounds that sovereign AI and data-center incremental demand has already been priced in and revenue recognition on such partnerships typically lags announcements significantly; Broadcom's earnings — due after the U.S. close Wednesday, corresponding to early Thursday Beijing time — represent the next major data point, with sell-side consensus at $3.22 to $3.30 EPS and $29.4 billion to $30.0 billion in revenue — figures that differ across sources — as Broadcom holds the largest share of the custom ASIC line. Will you treat Dell's report as confirmation that AI hardware is delivering, or wait for Broadcom to open the custom-chip books first?" },
  { ticker: "AVGO / MRVL / NVDA / SOXL", title_cn: "博通AI芯片收入涨143%,够不够翻过英伟达立下的那道坎?", body_cn: "博通在美东周三盘后交卷,对应北京时间周四凌晨。算盘先摆出来:卖方共识落在每股收益3.22到3.30美元、营收294亿到300亿美元这个区间,不同口径给出的数并不一致,同比口径的分歧更大,有机构预期给到营收同比增84.52%、每股收益同比增199.53%。真正的悬念不在数字本身,而在这道坎是谁立的——英伟达上一份财报把AI的及格线抬得极高,博通这次要在同一把尺子下被量。它自己的成色不弱,AI芯片销售同比增长143%,单季规模已经在160亿美元量级,有分析认为AI最终会占到营收的54%。多头的抓手很清楚,摩根大通认为市场对博通竞争地位的担忧被严重高估,而AI收入的规模、持续性和增长潜力都被低估;瑞穗看多的理由是连续30个季度的纪录;方舟8月既加仓博通,也把约9,500万美元的AMD换成了英伟达和博通。空头的抓手同样具体,谷歌正在深化与迈威尔的合作,定制ASIC这条线的独家性在松动;有分析指出TPU占比上升会稀释毛利率,虽然不稀释利润总额;客户集中度本身就是一项风险。还有一条更贵的线索,有报道称博通为Anthropic的AI芯片寻求最多800亿美元债务,而彭博在8月下旬就记录到它的信用风险指标飙升——在10年期收益率升破4.8%的这个星期,举债扩产的成本不再是零。价格这一侧,预期已经被砍过一轮,股价距52周高点回落约25%,季内跌超23%,远期市盈率18.9倍。同一天迈威尔收跌0.60%,三倍做多半导体的SOXL收跌6.10%,整个板块都在等这份财报给方向。你会在放榜前埋伏这轮预期差,还是等它先证明订单能变成毛利?", title_en: "Broadcom AI Chip Revenue Up 143% — Is That Enough to Clear the Bar Nvidia Set?", body_en: "Broadcom reported after the U.S. close Wednesday, corresponding to early Thursday Beijing time, with sell-side consensus ranging from $3.22 to $3.30 in EPS and $29.4 billion to $30.0 billion in revenue — figures that vary by methodology, with year-on-year estimates diverging more sharply, some institutions projecting revenue growth of 84.52% and EPS growth of 199.53%. The real question is not the numbers themselves but the benchmark: Nvidia's last report raised the AI passing grade to an extreme level, and Broadcom is now measured against the same ruler. Broadcom's own fundamentals are credible — AI chip revenue grew 143% year-on-year, quarterly AI revenue is already in the $16 billion range, and one analysis projects AI will eventually account for 54% of revenue; JPMorgan argues the market severely overestimates competitive threats to Broadcom's positioning while underestimating the scale, durability, and growth potential of AI revenue, and Mizuho's bull case rests on 30 consecutive quarters of records, while ARK both added to its Broadcom position in August and swapped roughly $95 million of AMD into Nvidia and Broadcom. Bear arguments are equally concrete: Google is deepening its partnership with Marvell, loosening the exclusivity of the custom ASIC line; one analysis notes rising TPU mix will compress gross margins even if it does not reduce total profit; and customer concentration is itself a risk. A higher-stakes data point also surfaced: reports indicate Broadcom is seeking up to $80 billion in debt to fund AI chip development for Anthropic, while Bloomberg documented a spike in its credit-risk indicators in late August — in a week where the 10-year yield broke above 4.8%, the cost of debt-funded expansion is no longer zero. On valuation, expectations have already been trimmed once: the stock sits roughly 25% below its 52-week high, is down over 23% quarter-to-date, and trades at 18.9x forward P/E, with Marvell off 0.60% and SOXL down 6.10% on the same day as the whole sector awaits direction from this print. Will you position ahead of the results to capture a potential earnings surprise, or wait for Broadcom to prove orders can translate into gross margin first?" },
  { ticker: "GPRO", title_cn: "GoPro两天翻倍冲过并购对价,买的是这笔交易还是网红?", body_cn: "GoPro收涨40.38%,两个交易日累计翻倍,当天成交5.0亿股,是日均约950万股的五十多倍。催化有两条,性质完全不同。一条是硬的:公司与Starman Optical签下确定性合并协议,对价为每股1.14美元现金、规模约2.85亿美元,合并后仍将保持上市地位。另一条是软的:一位YouTube创作者披露持仓、金额约1,000万美元,据报道成为其最大个人股东,消息在前一晚就先把股价推高了一截。真正值得看的是价格和对价的关系——收盘价已经站到1.14美元这个现金对价的上方,这意味着买盘定价的不再是这笔交易本身,而是交易之外的东西:更高的竞价,或者纯粹的情绪。风险全摆在明面上,公司年内出现过持续经营的警示,裁员约23%,并聘请投行评估战略选择;空头占流通盘约19.9%,轧空会把波动放大一倍不止;相对强弱指标一度到81,盘后已经回落5.69%。你会把站上对价的这部分溢价理解成对更高报价的押注,还是一次由流量驱动的错价?", title_en: "GoPro Doubles in Two Days Past Buyout Price — Is the Market Buying the Deal or the Influencer?", body_en: "GoPro surged 40.38%, doubling over two sessions, with volume hitting 500 million shares — more than fifty times the roughly 9.5 million daily average. Two catalysts of entirely different character were in play: a hard one, a definitive merger agreement with Starman Optical at $1.14 per share in cash, valuing the deal at roughly $285 million with the combined entity remaining publicly listed; and a soft one, a YouTube creator disclosed a position of approximately $10 million, reportedly becoming the largest individual shareholder, a disclosure that had already pushed shares higher the prior evening. The critical observation is the relationship between the closing price and the deal price — shares closed above the $1.14 cash consideration, meaning buyers are no longer pricing the deal itself but something beyond it: a higher competing bid, or pure sentiment. Risks are fully visible: the company issued a going-concern warning earlier this year, cut its workforce by roughly 23%, and hired an investment bank to evaluate strategic alternatives; short interest stands at roughly 19.9% of the float, enough to amplify volatility significantly; the RSI briefly reached 81, and shares had already pulled back 5.69% after hours. Will you read the premium above the deal price as a bet on a higher competing offer, or as a flow-driven mispricing?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
