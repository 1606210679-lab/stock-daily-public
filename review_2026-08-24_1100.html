<script>
const topics = [
  { ticker: "QQQ / SPY", title_cn: "国债正式破40万亿,这周年会和财报要一起消化?", body_cn: "上周五美股收得平静,QQQ收涨0.35%、标普500ETF(SPY)收涨0.41%,但整周仍是收低的,压制来自长端利率。这周要一次消化两件方向相反的大事。第一件是政策:8月27日至29日的杰克逊霍尔全球央行年会,沃什将首度以主席身份登场;而背景数据刚刚变了性质——美国国债规模在8月正式突破40万亿美元,从\"逼近\"变成\"越过\"。财政赤字与期限溢价是长端利率的根,财长贝森特把长端回购单次规模提到至少40亿美元只处理流动性,不处理这条根,所以年会措辞会直接决定长端往哪走。第二件是财报:英伟达周三盘后交卷,同一晚还有Salesforce、CrowdStrike、Okta与惠普,周四盘后还有迈威尔与IREN。两件事撞在同一周,波动不会小:若措辞偏鹰、长端重新上行,估值靠2027年之后现金流的公司先被折价,而AI硬件正是这类资产里权重最大的一批;反过来,财报够强加措辞偏鸽,资金会立刻回流。多头的理由是回购规模仍有上调空间,空头的理由是40万亿这个数只会继续变大。你会在年会前减仓、等财报和措辞双落地,还是先换到利率敏感资产?", title_en: "U.S. Debt Tops $40 Trillion — Can Markets Digest Jackson Hole and Earnings Together?", body_en: "U.S. Treasury debt officially surpassed $40 trillion in August, shifting from \"approaching\" to \"exceeding\" the threshold, as long-end rates remain the dominant pressure on equities. The Jackson Hole symposium (Aug. 27–29) will mark Fed Chair Warsh's first appearance in that role, and his tone will directly determine where long-end yields head next — Treasury Secretary Bessent's move to raise single-session buyback size to at least $4 billion addresses liquidity, not the deficit root. Nvidia reports after-hours Wednesday alongside Salesforce, CrowdStrike, Okta and HP, with Marvell and IREN following Thursday — if rhetoric turns hawkish and long rates rise, long-duration AI hardware assets face the steepest valuation discounts. Will you reduce exposure ahead of the symposium and wait for both the policy signal and earnings to land, or rotate into rate-sensitive assets now?" },
  { ticker: "BABA", title_cn: "先跌8.6%再抽800亿港元,阿里这两跌不是一回事?", body_cn: "阿里连着挨了两记,而它们的原因完全不同,分开看才不会误判。第一记是财报:美股上周五收跌8.57%,导火索是利润未达预期——上一财季经调整净利润同比下滑38%、GAAP净利润同比降幅约75%,而当天多家卖方在下修模型的同时并没有转空,摩根大通维持增持并把目标价上调到210美元,另有分析以\"用13倍前瞻市盈率买45%的AI云增速\"为题看多。第二记是抽血:8月23日公司宣布向美国境外的非美国人士配售新股,总额800亿港元(约102亿美元),这是2019年港股上市以来首次配售,被外媒称作创纪录规模,所得款项净额100%投向全栈AI能力与AI基础设施。这一记的反应立刻体现在盘后与亚洲盘:美股夜盘再跌4.80%,今日港股盘中跌10.08%,腾讯跌3.72%、小米跌4.41%——同一批资金要腾仓位去接配售,整条港股科技一起被抽。公司称本轮已获超额认购、主权财富基金等长线投资者需求强劲,而上一财季资本开支已同比大增75%、阿里云外部商业化收入同比增长45%创22个季度新高,钱确实有地方花。分水岭只有一个:这800亿港元变成云收入,还是变成折旧。你会趁折价接货、等资本开支见顶,还是换到不必增发的腾讯?", title_en: "Alibaba Hit Twice — Down 8.6%, Then HK$80 Billion Drained. Are These the Same Story?", body_en: "Alibaba absorbed two separate blows with entirely different causes. The first was earnings-driven: U.S. shares fell 8.57% after adjusted net profit dropped 38% year-on-year and GAAP net profit fell roughly 75%, though JPMorgan kept its Overweight rating and raised its price target to $210, with one analyst framing the thesis as \"buying 45% AI cloud growth at 13x forward P/E.\" The second was dilution: on August 23, the company announced a placement of new shares to non-U.S. investors outside the United States totaling HK$80 billion (~$10.2 billion) — its first placement since the 2019 Hong Kong listing and reportedly a record size — with 100% of net proceeds directed to full-stack AI capabilities and infrastructure; the market response was immediate, with U.S. after-hours shares falling another 4.80%, Hong Kong shares dropping 10.08% intraday, Tencent down 3.72%, and Xiaomi down 4.41% as funds were freed up to absorb the placement. The company said the deal was oversubscribed with strong demand from sovereign wealth funds and long-term investors, while last quarter's capex surged 75% year-on-year and Alibaba Cloud's external revenue grew 45% — a 22-quarter high. The single dividing line: whether this HK$80 billion becomes cloud revenue or depreciation. Will you buy the dip and wait for capex to peak, or rotate into Tencent, which isn't diluting?" },
  { ticker: "AAOI / INTC", title_cn: "增发从阿里蔓延到光模块,AAOI夜盘直接砸11.8%?", body_cn: "这轮AI军备竞赛的融资窗口正在同时抽多家公司的血,而市场对不同体量给的折价完全不同。小盘反应最狠:Applied Optoelectronics宣布通过Raymond James与Needham启动6亿美元的市价发行(ATM),上周五收跌3.32%,夜盘再跌11.79%——对一家这个市值的光模块厂,6亿美元的持续抛压相当于把未来几个季度的股本供给一次性摊在盘面上,而ATM的机制是随行就市卖出,等于给股价加了一个持续的天花板。大盘的账更难看:英特尔以每股95美元卖出200亿美元股票,而它上周五收跌2.24%至90.07美元,已经跌回发行价以下,接了这批增发的机构现在是浮亏。同一周还有Nebius以50亿美元完成可转债发行,而它的营收基数只有约14亿美元。四笔放在一起,机制是同一个:趁估值高把未来的钱先拿到手,代价是当期摊薄;分层标准也只有一个,这笔钱能不能在两三个季度内变成可确认的收入——阿里有云收入加速做背书,英特尔要靠代工客户,AAOI要靠CPO与AI互连的订单。空方的理由是利息与摊薄立刻发生、收入要等;多方的理由是不融资就出局。你会买有收入验证的那家、等发行价被收复,还是避开所有正在抽血的标的?", title_en: "Dilution Spreads From Alibaba to Optical Modules — AAOI Crashes 11.8% After-Hours?", body_en: "The AI arms race fundraising window is simultaneously draining multiple companies, and the market is applying very different discount rates by size. Applied Optoelectronics announced a $600 million at-the-market offering via Raymond James and Needham, closing down 3.32% on Friday before falling another 11.79% after-hours — for an optical module maker of its market cap, $600 million in continuous selling pressure effectively front-loads several quarters of equity supply, and the ATM mechanism means a persistent ceiling on the stock price. The larger-cap picture is equally troubled: Intel sold $20 billion in stock at $95 per share, yet closed Friday down 2.24% at $90.07, leaving buyers of that placement already underwater; in the same week, Nebius completed a $5 billion convertible note offering against a revenue base of roughly $1.4 billion. The mechanism across all four is identical — monetize high valuations now and absorb dilution later — and the only differentiating question is whether the capital can translate into recognizable revenue within two or three quarters: Alibaba has accelerating cloud revenue as validation, Intel is counting on foundry customers, and AAOI is counting on CPO and AI interconnect orders. Bears point to immediate interest costs and dilution; bulls say those who don't raise capital get left behind. Will you buy the name with revenue validation and wait for the offering price to be reclaimed, or avoid every stock currently raising capital?" },
  { ticker: "TSLA", title_cn: "内华达放行5000辆robotaxi,召回300万辆也没拦住?", body_cn: "特斯拉上周五收涨5.14%,这是它近期少见的强势,而催化是监管而不是产品:内华达州与拉斯维加斯向它发放了robotaxi运营许可,州层面一次清出最多5,000辆的运营额度,同批拿证的还有Waymo与Uber。第二条催化是延宕已久的Semi电动卡车终于准备发布,定价约30万美元并明确瞄准欧洲市场。真正说明市场情绪的是同一天的反向消息没能拦住它:公司在中国召回近300万辆电动车,原因是隐藏式应急门把手可能让乘客被困,这是它在中国规模最大的一次召回,而股价当天仍收涨5%以上——资金在给\"自动驾驶变成可收费业务\"定价,暂时把硬件质量问题放在了次要位置。空方的理由同样具体:许可只是准入,5,000辆的额度要落地成收入需要车队、保险与运维,而同批拿证的Waymo背后是资本更充裕的Alphabet,先发优势并不在特斯拉这边;召回本身也会产生真实成本。你会按robotaxi的期权价值买入、等它公布单车运营经济性,还是转去Waymo这条线?", title_en: "Nevada Clears 5,000 Robotaxis — Even a 3 Million-Vehicle Recall Couldn't Stop Tesla?", body_en: "Tesla closed up 5.14% Friday in a rare show of strength, driven by regulatory rather than product catalysts: Nevada and Las Vegas granted robotaxi operating permits covering up to 5,000 vehicles, with Waymo and Uber receiving licenses in the same batch. The long-delayed Semi electric truck also moved closer to launch, with pricing around $300,000 and a clear European market focus. Most telling was the market's reaction to simultaneous negative news — a recall of nearly 3 million electric vehicles in China over a concealed emergency door handle that could trap passengers, the company's largest-ever China recall — which failed to stop the stock from closing up more than 5%, as investors priced the potential of autonomous driving becoming a fee-generating business and temporarily set aside hardware quality concerns. The bear case is equally concrete: a permit is only market access, and converting 5,000 vehicles into revenue requires fleet buildout, insurance, and operations, while Waymo — backed by the deeper pockets of Alphabet — holds the first-mover advantage; the recall will also generate real costs. Will you buy on robotaxi option value and wait for unit-level operating economics to be disclosed, or shift to the Waymo angle instead?" },
  { ticker: "MRNA", title_cn: "暴跌23%后反弹8.9%,癌症疫苗行情在重新定价?", body_cn: "Moderna上周五收涨8.86%,而它前一天刚收跌23.55%、更前一天涨了176.97%。三天连起来是一次完整的定价重建:第一天涨的主要是机制——个性化mRNA癌症疫苗在三期黑色素瘤试验中同时达到无复发生存与无远处转移生存两个终点,数据反了空头的仓位方向,多家报道把那天称作历史级的轧空;第二天跌的是强制买盘走完后的获利了结;第三天这8.86%才更接近真实的估值分歧,因为这时买的人已经不是被逼平仓的。要注意的是尺度:卖方上调后的评级多数停在中性,目标价约170美元,是把它从\"跑输\"移出来,不是看多;基本面也没变,公司近12个月营收22.3亿美元、同比仍下滑27.6%,2025年亏损28.2亿美元,而完整数据集尚未公布,从终点达标到定价、产能与实际销量之间还有很长的路。这就是当下的赔率:平台价值已经被验证了一半,商业化一点都还没验证。你会在回撤后建仓、换到确定分成的默沙东,还是等完整数据公布?", title_en: "Down 23%, Then Up 8.9% — Is the Cancer Vaccine Trade Finding a New Price?", body_en: "Moderna closed up 8.86% Friday, one day after falling 23.55% and two days after surging 176.97% — three sessions that together constitute a complete pricing reset. The initial rally reflected mechanism validation: a personalized mRNA cancer vaccine simultaneously hit both recurrence-free survival and distant metastasis-free survival endpoints in a Phase 3 melanoma trial, reversing short positions in what several reports called a historic short squeeze; the following day's selloff reflected profit-taking once forced buying exhausted itself; Friday's 8.86% gain is the closest read on genuine valuation disagreement, as buyers at that point were acting voluntarily. The scale matters: most sell-side upgrades landed at Neutral with a price target around $170, moving the stock off Underperform rather than initiating a bullish call; fundamentals are unchanged, with trailing twelve-month revenue of $2.23 billion, still down 27.6% year-on-year, a 2025 net loss of $2.82 billion, and the complete dataset not yet published — there is a long road from endpoint achievement to pricing, manufacturing capacity, and actual sales. The current odds: platform value is half-validated; commercialization is zero-validated. Will you build a position on the pullback, rotate into Merck for a confirmed royalty stream, or wait for the full data release?" },
  { ticker: "SNDK / MU / SKHY / SOXL", title_cn: "创纪录的分红反而砸盘,存储的账单寄到AI机房了?", body_cn: "存储这条链上周五集体停步:闪迪收跌0.28%、美光收跌0.77%、SK海力士只收涨0.20%,半导体三倍做多的SOXL收跌1.32%。压住它们的不是需求而是两件事。第一件是股东回报的预期差:三星电子宣布2026年将向股东返还最高110万亿韩元(约790亿美元)、约占自由现金流的50%,创下韩国企业史上最高回报纪录,含30万亿韩元季息与15万亿韩元回购,但路透的标题直接是\"创纪录的股东回报令市场失望\",三星电子今日在韩股盘中跌6.84%——传闻阶段市场听到的是\"超100万亿\",落地后相对现金流体量并不惊人,承诺兑现那一刻反而成了出货点;另有分析以\"股价越高、回购越不划算\"提醒这类周期高点的回购未必最优。第二件是涨价的账单终于寄到了终端:多家报道称英伟达已警告大客户,因存储成本上升,明年初出货的AI服务器价格将上涨超过15%。这条链现在有四段——合约价上行先咬手机厂毛利,再顶高GPU售价,最后由买算力的人付账。多空证据同样对立:一边有市场人士再度加倍看好存储、闪迪在投资者日后被上调公允价值估算,另一边是彭博的判断,聪明钱正在离开存储股。你会跟着涨价买美光与闪迪、为分红买海力士与三星,还是等AI机房的资本开支先表态?", title_en: "Record Dividend Triggers a Selloff — Is Memory's Bill Now Arriving at AI Data Centers?", body_en: "The memory supply chain stalled Friday: SanDisk fell 0.28%, Micron dropped 0.77%, SK Hynix edged up just 0.20%, and the 3x leveraged semiconductor ETF SOXL fell 1.32%. Two forces were at work. First, a shareholder return disappointment: Samsung Electronics announced it would return up to 110 trillion Korean won (~$79 billion) to shareholders in 2026 — roughly 50% of free cash flow and a record for Korean corporates, including a 30 trillion won quarterly dividend and 15 trillion won in buybacks — yet Reuters headlined it as \"record shareholder return disappoints markets,\" and Samsung shares fell 6.84% in Korean trading, as the rumored figure had been \"over 100 trillion won\" and the confirmed amount appeared unimpressive relative to cash flow; analysts also noted that buybacks at cycle highs may not represent optimal capital allocation. Second, the price-hike bill has reached end customers: multiple reports indicate Nvidia has warned major clients that AI server prices will rise more than 15% on shipments early next year due to rising memory costs — a four-stage chain in which rising contract prices first compress handset maker margins, then push up GPU selling prices, with the final bill paid by compute buyers. Conflicting signals abound: some market participants are doubling down on memory with SanDisk's fair value estimate raised following its investor day, while Bloomberg suggests smart money is rotating out of memory stocks. Will you follow the price hike into Micron and SanDisk, buy SK Hynix and Samsung for the dividend, or wait for AI data center capex to signal its direction first?" },
  { ticker: "BTC.USD / MSTR", title_cn: "萨勒的比特币仓位刚回水面,他却先警告难受几年?", body_cn: "比特币上周五报77,293美元、微涨0.27%,而围绕它的两条消息是矛盾的。一边是价格终于把一批人从水下捞了出来:Strategy上周五收涨6.10%,有报道明确指出萨勒的比特币押注刚刚回到成本线上方——这家公司本质是一只加杠杆的比特币持仓工具,币价的每一次波动都会被它的资本结构放大,所以它涨得比币本身猛得多。另一边是他自己的表态:萨勒公开提醒股东\"要准备好经历几个难受的年份\",这话从最坚定的多头嘴里说出来,分量与卖方任何一份下调都不同。市场环境也不站在多头这边:有资管机构在被同行直接称作熊市的环境里募到18亿美元,说明资金还在进场,但\"熊市\"这个定语本身就是共识;而这一周长端利率与杰克逊霍尔的措辞会决定风险资产的整体水位,加密资产在利率上行期通常是被最先减仓的一类。你会用MSTR做加杠杆的比特币代理、直接持币,还是等年会措辞落地再决定风险敞口?", title_en: "Saylor's Bitcoin Position Just Broke Even — So Why Is He Warning of Years of Pain?", body_en: "Bitcoin closed Friday at $77,293, up a modest 0.27%, but the two surrounding narratives are contradictory. On one side, the price recovery lifted some investors back above water: Strategy closed up 6.10%, with reports noting that Saylor's bitcoin bet had just returned to breakeven — the company functions as a leveraged bitcoin holding vehicle whose capital structure amplifies every price move, explaining why it outperformed the coin itself. On the other side, Saylor publicly warned shareholders to \"be prepared for several painful years\" — words that carry different weight coming from the most committed bull than any sell-side downgrade. The macro backdrop is also unsupportive: one asset manager raised $1.8 billion in what peers explicitly called a bear market environment, confirming capital is still entering, but the \"bear market\" label itself has become consensus; this week, long-end rates and Jackson Hole rhetoric will set the waterline for risk assets broadly, and crypto is typically the first category to be trimmed when rates rise. Will you use MSTR as a leveraged bitcoin proxy, hold the coin directly, or wait for the symposium's tone to land before sizing your risk exposure?" },
  { ticker: "SPCX", title_cn: "Anthropic的2万亿估值,被拿SpaceX当反面教材?", body_cn: "未上市AI资产的定价开始被公开质疑,而质疑用的样本是已经上市的那一个。有华尔街资深人士撰文指出,Anthropic高达2万亿美元的估值正面临现实检验,理由是SpaceX的走势提供了警示:它6月12日以135美元发行、市值约1.77万亿美元,随后第二批解禁释放约3.19亿股,股价一度跌回发行价以下——超级IPO的定价高峰往往就在上市那一刻,解禁才是真正的考验。需要说清楚的是,2万亿目前仍是市场讨论中的估值区间,不是任何已确认的发行定价,Anthropic的上市时间表也还没有公开确认。SpaceX自己上周五收涨2.22%,并给出一条值得注意的表态:公司称中国是它在AI与火箭两条线上的头号竞争对手,这把它的叙事从\"太空基础设施\"进一步推向\"AI与国家竞争\",也解释了它为什么会被拿来给一级市场的AI估值做参照。多头的依据是稀缺性,英伟达的持仓披露显示对它有约210亿美元的仓位;空方的依据是解禁批次还没走完,而按AI资产定价就要接受长久期资产在利率波动里被优先减仓。你会按太空业务的现金流估值、等解禁走完,还是继续拿它当未上市AI资产的代理?", title_en: "Anthropic's $2 Trillion Valuation — Is SpaceX Being Used as a Cautionary Tale?", body_en: "The pricing of unlisted AI assets is facing open scrutiny, with a publicly traded comparable providing the reference point. A veteran Wall Street commentator argued that Anthropic's reported $2 trillion valuation faces a reality check, citing SpaceX's trajectory as a warning: SpaceX priced at $135 per share in June at a valuation of roughly $1.77 trillion, after which a second tranche unlocked approximately 319 million shares and the stock briefly fell back below its offering price — suggesting the pricing peak of a mega-IPO often occurs at the moment of listing, with lockup expirations as the true test. To be clear, $2 trillion remains a figure in market discussion, not a confirmed offering price, and Anthropic's IPO timeline has not been publicly confirmed. SpaceX itself closed up 2.22% Friday and made a notable disclosure: the company named China as its primary competitor on both AI and rockets, extending its narrative from \"space infrastructure\" toward \"AI and national competition\" — which also explains why it has become a reference point for private-market AI valuations. The bull case rests on scarcity, with Nvidia's disclosed position reflecting approximately $21 billion of exposure; the bear case points to remaining lockup tranches still to clear, and notes that pricing an asset as an AI play means accepting that long-duration assets are the first to be cut when rates move. Will you value it on space business cash flows and wait for all lockups to clear, or continue treating it as a proxy for unlisted AI assets?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
