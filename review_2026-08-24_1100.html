<script>
const topics = [
  { ticker: "QQQ / SPY", title_cn: "回购压不住收益率,钱改去买黄金和比特币了?", body_cn: "上周五美股收得平静,QQQ收涨0.35%、标普500ETF(SPY)收涨0.41%、道指收涨0.98%,但整周仍是收低的。这周的主线已经清楚:财政部扩大长债回购并没有把收益率压住,资金转而去买黄金和比特币——这类被称作\"货币贬值交易\"的仓位,赌的不是利率下行,而是财政信用本身在变松。背景数据刚刚变了性质:美国国债规模在8月正式突破40万亿美元,从\"逼近\"变成\"越过\";财长贝森特把长端回购单次规模提到至少40亿美元,处理的是流动性,不是赤字与期限溢价这条根,所以工具加码反而强化了贬值叙事。本周三件事叠在一起:8月27日至29日的杰克逊霍尔全球央行年会,沃什将首度以主席身份登场,市场要从措辞里读出联储的反应函数、以及9月是否存在超预期加息风险;7月PCE通胀数据同期公布;英伟达周三盘后交卷,同一晚还有Salesforce、CrowdStrike、Okta与惠普,周四盘后还有迈威尔与IREN。地缘也在加码:美国拟对伊朗实施新制裁,可能扰动原油供应、抬高能源成本,而加拿大在贸易谈判破裂后拟对部分美国商品加征报复性关税,两条都指向通胀而不是通缩。多头的理由是回购规模仍有上调空间、7月纪要显示多数委员并不急于加息;空头的理由是40万亿这个数只会继续变大,措辞一旦偏鹰,长端与美元会同时抬头。你会在年会前减仓、等财报和措辞双落地,还是跟着贬值交易去买黄金?", title_en: "Buybacks Fail to Cap Yields — Is Capital Fleeing to Gold and Bitcoin?", body_en: "U.S. equities closed quietly last Friday — QQQ +0.35%, SPY +0.41%, DJIA +0.38% — but posted weekly losses. The dominant theme has crystallized: Treasury expansion of long-bond buybacks failed to suppress yields, driving capital into gold and bitcoin — so-called 'currency debasement trades' that bet on eroding fiscal credibility rather than falling rates. U.S. debt officially crossed $40 trillion in August; Treasury Secretary Bessent raised single-tranche long-end buyback size to at least $4 billion, addressing liquidity but not the deficit or term premium, reinforcing the debasement narrative. Three events converge this week — the Jackson Hole central bank symposium (Aug. 27–29), where Warsh makes his debut as Fed Chair and markets will parse his reaction function for any surprise September rate-hike risk; July PCE inflation data; and Nvidia's after-hours earnings Wednesday alongside Salesforce, CrowdStrike, Okta and HP, with Marvell and IREN reporting Thursday after hours. Geopolitical pressures add to inflationary risk: proposed new U.S. sanctions on Iran threaten oil supply disruption, while Canada plans retaliatory tariffs on select U.S. goods after trade talks collapsed. Will you cut exposure ahead of Jackson Hole and wait for both earnings and Fed guidance to land, or follow the debasement trade into gold?" },
  { ticker: "XAUUSD / GLD / GDX / 01818", title_cn: "金价创三个月新高,达利欧建议拿15%仓位来配?", body_cn: "黄金正在把\"货币贬值交易\"这个说法变成价格。现货金今日涨0.87%至4,647美元、盘中站上4,600美元,是5月中以来最高、创下近三个月新高;白银同步走强。美股这一侧上周五就已经先走:黄金ETF(GLD)收涨1.95%、白银ETF(SLV)收涨1.72%,弹性更大的金矿ETF(GDX)收涨2.98%、纽蒙特收涨3.09%;港股的招金矿业今日盘中涨2.98%,珠峰黄金与潼关黄金同样领涨。驱动写得很直白:财政部意外扩大长债回购之后,收益率反而下行、美元走弱,资金开始为\"财政可持续性\"定价,而不是为利率方向定价,这正是贬值交易的定义。桥水创始人达利欧把话说得更硬——他警告美国财政已经走到拐点、债务危机可能在未来数年内爆发,建议投资者降低债务类资产的配置比例,把投资组合的10%至15%配置于黄金,并持有少量比特币。空方的理由同样具体:金价1月曾创下5,608美元的历史高点,现在这个位置仍是在填坑而不是创新高;而本周三件事都可能反手——若沃什的措辞偏鹰、7月PCE偏高,实际利率抬升会立刻压缩无息资产的吸引力。你会买实物挂钩的GLD、弹性更大的GDX与纽蒙特,还是按达利欧的比例把黄金当底仓?", title_en: "Gold Hits Three-Month High — Is Dalio's 15% Allocation Call Right?", body_en: "Gold is converting the 'currency debasement trade' thesis into price action. Spot gold rose 0.87% to $4,647 today, breaching $4,600 intraday — its highest level since mid-May and a fresh three-month high — with silver advancing in tandem. U.S.-listed gold proxies led last Friday: GLD +1.95%, SLV +1.72%, GDX +2.98%, Newmont +3.09%; Hong Kong-listed Zhaojin Mining gained 2.98% intraday today. The catalyst is straightforward: following the Treasury's surprise expansion of long-bond buybacks, yields fell and the dollar weakened, prompting markets to price 'fiscal sustainability' risk rather than rate direction — the textbook definition of a debasement trade. Bridgewater founder Dalio sharpened his warning, saying U.S. fiscal trajectory has reached an inflection point with a debt crisis possible within years, advising investors to reduce debt-asset allocations and hold 10%–15% of portfolios in gold plus a small bitcoin position. The bear case is equally concrete: gold set an all-time high of $5,608 in January, making the current level a recovery rather than a breakout; and all three macro events this week could reverse the move — hawkish Warsh commentary or a hot July PCE print would lift real rates and immediately compress the appeal of non-yielding assets. Will you buy the benchmark-linked GLD, the higher-beta GDX and Newmont, or size gold as a core position following Dalio's allocation framework?" },
  { ticker: "BABA", title_cn: "先跌8.6%再抽800亿港元,阿里这两跌不是一回事?", body_cn: "阿里连着挨了两记,而它们的原因完全不同,分开看才不会误判。第一记是财报:美股上周五收跌8.57%,导火索是利润未达预期——上一财季经调整净利润同比下滑38%、GAAP净利润同比降幅约75%,而当天多家卖方在下修模型的同时并没有转空,摩根大通维持增持并把目标价上调到210美元,另有分析以\"用13倍前瞻市盈率买45%的AI云增速\"为题看多。第二记是抽血:8月23日公司宣布向美国境外的非美国人士配售新股,总额800亿港元(约102亿美元),这是2019年港股上市以来首次配售,被外媒称作创纪录规模,所得款项净额100%投向全栈AI能力与AI基础设施。这一记的反应立刻体现在盘后与亚洲盘:美股夜盘再跌4.80%,今日港股盘中跌10.08%,腾讯跌3.72%、小米跌4.41%——同一批资金要腾仓位去接配售,整条港股科技一起被抽。公司称本轮已获超额认购、主权财富基金等长线投资者需求强劲,而上一财季资本开支已同比大增75%、阿里云外部商业化收入同比增长45%创22个季度新高,钱确实有地方花。分水岭只有一个:这800亿港元变成云收入,还是变成折旧。你会趁折价接货、等资本开支见顶,还是换到不必增发的腾讯?", title_en: "Alibaba Down 8.6% Then Hit by HK$80B Placement — Are the Two Drops Unrelated?", body_en: "Alibaba absorbed two consecutive blows driven by entirely different forces — conflating them risks a misjudgment. The first was earnings: U.S. shares fell 8.57% last Friday after profit missed expectations, with adjusted net income down 38% year-on-year and GAAP net income down roughly 75% year-on-year in the latest fiscal quarter. Even so, several sell-side desks lowered models without turning bearish — JPMorgan maintained Overweight and raised its price target to $210, while at least one analyst framed the setup as 'buying 45% AI cloud growth at 13x forward P/E.' The second blow was dilution: on August 23, Alibaba announced a placement of new shares to non-U.S. persons outside the United States totaling HK$80 billion (approximately $10.2 billion) — its first placement since the 2019 Hong Kong listing and reportedly a record size — with 100% of net proceeds directed to full-stack AI capabilities and AI infrastructure. The market reaction was immediate: U.S. shares fell another 4.80% in after-hours trading, and Hong Kong shares dropped 10.08% intraday today, with Tencent -3.72% and Xiaomi -4.41% as capital was reallocated to participate in the placement across Hong Kong tech. The company said the offering was oversubscribed with strong demand from sovereign wealth funds and long-term investors; last quarter's capex already surged 75% year-on-year while Alibaba Cloud's external commercial revenue grew 45% year-on-year — a 22-quarter high — providing a destination for the proceeds. The single dividing line: whether this HK$80 billion translates into cloud revenue or depreciation. Will you buy the dip and wait for capex to peak, or rotate into Tencent, which has no need for a dilutive issuance?" },
  { ticker: "AAOI / INTC", title_cn: "增发从阿里蔓延到光模块,AAOI夜盘直接砸11.8%?", body_cn: "这轮AI军备竞赛的融资窗口正在同时抽多家公司的血,而市场对不同体量给的折价完全不同。小盘反应最狠:Applied Optoelectronics宣布通过Raymond James与Needham启动6亿美元的市价发行(ATM),上周五收跌3.32%,夜盘再跌11.79%——对一家这个市值的光模块厂,6亿美元的持续抛压相当于把未来几个季度的股本供给一次性摊在盘面上,而ATM的机制是随行就市卖出,等于给股价加了一个持续的天花板。大盘的账更难看:英特尔以每股95美元卖出200亿美元股票,而它上周五收跌2.24%至90.07美元,已经跌回发行价以下,接了这批增发的机构现在是浮亏。同一周还有Nebius以50亿美元完成可转债发行,而它的营收基数只有约14亿美元。四笔放在一起,机制是同一个:趁估值高把未来的钱先拿到手,代价是当期摊薄;分层标准也只有一个,这笔钱能不能在两三个季度内变成可确认的收入——阿里有云收入加速做背书,英特尔要靠代工客户,AAOI要靠CPO与AI互连的订单。空方的理由是利息与摊薄立刻发生、收入要等;多方的理由是不融资就出局。你会买有收入验证的那家、等发行价被收复,还是避开所有正在抽血的标的?", title_en: "Dilution Spreads from Alibaba to Optical Modules — Did AAOI Sink 11.8% After Hours?", body_en: "The AI arms-race financing window is simultaneously drawing capital from multiple companies, and the market is applying very different discount rates by size. The small-cap reaction was the most severe: Applied Optoelectronics announced a $600 million at-the-market offering launched through Raymond James and Needham, closing last Friday down 3.32% before falling another 11.79% in after-hours trading — for an optical module manufacturer of this market cap, $600 million in continuous supply-side pressure effectively front-loads several quarters of equity issuance onto the tape, and the ATM mechanism sells at prevailing prices, placing a persistent ceiling on the stock. The large-cap math looks worse on paper: Intel sold $20 billion in shares at $95 per share, yet closed last Friday at $90.07 — already below the issuance price, leaving participating institutions underwater. The same week saw Nebius close a $5 billion convertible-bond offering against a revenue base of approximately $1.4 billion. All four transactions share the same mechanism: monetize elevated valuations now and accept current dilution; the only differentiating criterion is whether the proceeds convert into recognizable revenue within two to three quarters — Alibaba has accelerating cloud revenue as collateral, Intel depends on foundry customers, and AAOI depends on CPO and AI interconnect order flow. The bear case: interest expense and dilution are immediate, revenue is not. The bull case: forgo the raise and risk being left out entirely. Will you buy the issuer with revenue validation and wait for the offering price to be recaptured, or avoid all names currently drawing down equity capital?" },
  { ticker: "TSLA", title_cn: "内华达放行5000辆robotaxi,召回300万辆也没拦住?", body_cn: "特斯拉上周五收涨5.14%,这是它近期少见的强势,而催化是监管而不是产品:内华达州与拉斯维加斯向它发放了robotaxi运营许可,州层面一次清出最多5,000辆的运营额度,同批拿证的还有Waymo与Uber。第二条催化是延宕已久的Semi电动卡车终于准备发布,定价约30万美元并明确瞄准欧洲市场。真正说明市场情绪的是同一天的反向消息没能拦住它:公司在中国召回近300万辆电动车,原因是隐藏式应急门把手可能让乘客被困,这是它在中国规模最大的一次召回,而股价当天仍收涨5%以上——资金在给\"自动驾驶变成可收费业务\"定价,暂时把硬件质量问题放在了次要位置。空方的理由同样具体:许可只是准入,5,000辆的额度要落地成收入需要车队、保险与运维,而同批拿证的Waymo背后是资本更充裕的Alphabet,先发优势并不在特斯拉这边;召回本身也会产生真实成本。你会按robotaxi的期权价值买入、等它公布单车运营经济性,还是转去Waymo这条线?", title_en: "Nevada Clears 5,000 Robotaxis — Did a 3M-Vehicle Recall Fail to Stop Tesla?", body_en: "Tesla closed up 5.14% last Friday in a rare show of strength, with the catalysts regulatory rather than product-driven: Nevada and Las Vegas granted Tesla a robotaxi operating permit covering up to 5,000 vehicles statewide — Waymo and Uber received permits in the same batch. A second catalyst was the long-delayed Semi electric truck, now slated for launch at approximately $300,000 and explicitly targeting the European market. The most telling signal was what failed to stop the rally: a recall of nearly 3 million electric vehicles in China over concerns that hidden emergency door handles could trap occupants — Tesla's largest-ever recall in the country — yet shares still closed up more than 5%, as capital priced 'autonomous driving as a billable service' and temporarily subordinated hardware quality concerns. The bear case is equally specific: a permit is only market access, and converting a 5,000-vehicle quota into revenue requires fleet deployment, insurance infrastructure and maintenance operations, while Waymo — backed by Alphabet's deeper capital base — holds a first-mover advantage; the recall will also generate real costs. Will you buy on robotaxi option value and wait for per-vehicle unit economics to be disclosed, or rotate into the Waymo investment thesis instead?" },
  { ticker: "MRNA", title_cn: "暴跌23%后反弹8.9%,癌症疫苗行情在重新定价?", body_cn: "Moderna上周五收涨8.86%,而它前一天刚收跌23.55%、更前一天涨了176.97%。三天连起来是一次完整的定价重建:第一天涨的主要是机制——个性化mRNA癌症疫苗在三期黑色素瘤试验中同时达到无复发生存与无远处转移生存两个终点,数据反了空头的仓位方向,多家报道把那天称作历史级的轧空;第二天跌的是强制买盘走完后的获利了结;第三天这8.86%才更接近真实的估值分歧,因为这时买的人已经不是被逼平仓的。要注意的是尺度:卖方上调后的评级多数停在中性,目标价约170美元,是把它从\"跑输\"移出来,不是看多;基本面也没变,公司近12个月营收22.3亿美元、同比仍下滑27.6%,2025年亏损28.2亿美元,而完整数据集尚未公布,从终点达标到定价、产能与实际销量之间还有很长的路。这就是当下的赔率:平台价值已经被验证了一半,商业化一点都还没验证。你会在回撤后建仓、换到确定分成的默沙东,还是等完整数据公布?", title_en: "Down 23%, Then Up 8.9% — Is the Cancer Vaccine Trade Being Repriced?", body_en: "Moderna closed up 8.86% last Friday, one session after falling 23.55% and two sessions after surging 176.97%. The three-day sequence represents a complete pricing reset: the first day's move was mechanism-driven — a personalized mRNA cancer vaccine simultaneously met both recurrence-free survival and distant metastasis-free survival endpoints in a Phase 3 melanoma trial, wrong-footing short positions and prompting multiple reports to describe the session as a historic short squeeze. The second day's decline was profit-taking once forced covering was exhausted. The third-day 8.86% gain is the closest approximation of genuine valuation disagreement, as buyers at that point were acting voluntarily. Key context on scale: most sell-side upgrades landed at Neutral with price targets around $170, moving the stock off Underperform rather than issuing a Buy; fundamentals are unchanged — trailing-twelve-month revenue of $2.23 billion, still down 27.6% year-on-year, a 2025 net loss of $2.82 billion, and a full dataset not yet published, leaving a long distance between endpoint achievement and pricing, manufacturing capacity, and actual sales volumes. That is the current risk/reward: the platform's scientific value is half-validated; commercial viability has zero validation. Will you build a position on the pullback, rotate into Merck for a confirmed revenue-sharing structure, or wait for the complete dataset?" },
  { ticker: "SNDK / MU / SKHY / SOXL", title_cn: "创纪录的分红反而砸盘,存储的账单寄到AI机房了?", body_cn: "存储这条链上周五集体停步:闪迪收跌0.28%、美光收跌0.77%、SK海力士只收涨0.20%,半导体三倍做多的SOXL收跌1.32%。压住它们的不是需求而是两件事。第一件是股东回报的预期差:三星电子宣布2026年将向股东返还最高110万亿韩元(约790亿美元)、约占自由现金流的50%,创下韩国企业史上最高回报纪录,含30万亿韩元季息与15万亿韩元回购,但路透的标题直接是\"创纪录的股东回报令市场失望\",三星电子今日在韩股盘中跌6.84%——传闻阶段市场听到的是\"超100万亿\",落地后相对现金流体量并不惊人,承诺兑现那一刻反而成了出货点;另有分析以\"股价越高、回购越不划算\"提醒这类周期高点的回购未必最优。第二件是涨价的账单终于寄到了终端:多家报道称英伟达已警告大客户,因存储成本上升,明年初出货的AI服务器价格将上涨超过15%。这条链现在有四段——合约价上行先咬手机厂毛利,再顶高GPU售价,最后由买算力的人付账。多空证据同样对立:一边有市场人士再度加倍看好存储、闪迪在投资者日后被上调公允价值估算,另一边是彭博的判断,聪明钱正在离开存储股。你会跟着涨价买美光与闪迪、为分红买海力士与三星,还是等AI机房的资本开支先表态?", title_en: "Record Dividend Triggers a Selloff — Is Memory's Bill Arriving at the AI Data Center?", body_en: "Memory stocks stalled collectively last Friday: SanDisk -0.28%, Micron -0.77%, SK Hynix +0.20%, and the 3x leveraged semiconductor ETF SOXL -1.32%. Two distinct forces capped the sector rather than demand weakness. First, a shareholder-return expectation gap: Samsung Electronics announced it would return up to 110 trillion Korean won (approximately $79 billion) to shareholders in 2026 — roughly 50% of free cash flow, the largest shareholder return in Korean corporate history — comprising a 30 trillion won quarterly dividend and 15 trillion won in buybacks, yet Reuters headlined the announcement as 'disappointing to markets' and Samsung fell 6.84% in Korean trading today. Rumor had priced in 'over 100 trillion won,' and relative to cash flow the figure was unspectacular, turning the confirmation moment into an exit point; analysts also noted that buybacks at peak valuations are suboptimal in a cyclical high. Second, the price-hike invoice has reached the end customer: multiple reports indicate Nvidia has warned major clients that AI server prices on shipments from early next year will rise more than 15% due to higher memory costs. The transmission chain now spans four links — contract prices first compress handset-maker margins, then lift GPU selling prices, with compute buyers ultimately footing the bill. Bullish and bearish evidence are both present: some market participants have renewed conviction on memory, and SanDisk received a higher fair-value estimate following its investor day; Bloomberg, however, judges that smart money is rotating out of memory stocks. Will you buy Micron and SanDisk on the price-hike thesis, buy SK Hynix and Samsung for the dividend, or wait for AI data-center capex commitments to clarify first?" },
  { ticker: "BTC.USD / MSTR", title_cn: "萨勒的比特币仓位刚回水面,他却先警告难受几年?", body_cn: "贬值交易的两条腿今天走反了:黄金创下近三个月新高,比特币却下跌0.91%至77,069美元。它上周五还报77,293美元、微涨0.27%,而围绕它的两条消息本身就是矛盾的。一边是价格终于把一批人从水下捞了出来:Strategy上周五收涨6.10%,有报道明确指出萨勒的比特币押注刚刚回到成本线上方——这家公司本质是一只加杠杆的比特币持仓工具,币价的每一次波动都会被它的资本结构放大,所以它涨得比币本身猛得多。另一边是他自己的表态:萨勒公开提醒股东\"要准备好经历几个难受的年份\",这话从最坚定的多头嘴里说出来,分量与卖方任何一份下调都不同。市场环境也不站在多头这边:有资管机构在被同行直接称作熊市的环境里募到18亿美元,说明资金还在进场,但\"熊市\"这个定语本身就是共识;而这一周长端利率与杰克逊霍尔的措辞会决定风险资产的整体水位,加密资产在利率上行期通常是被最先减仓的一类。你会用MSTR做加杠杆的比特币代理、直接持币,还是等年会措辞落地再决定风险敞口?", title_en: "Saylor's Bitcoin Position Just Broke Even — So Why Is He Warning of Hard Years Ahead?", body_en: "The two legs of the debasement trade diverged today: gold hit a three-month high while bitcoin fell 0.91% to $77,069. Bitcoin closed at $77,293 last Friday, up a modest 0.27%, and the two headlines surrounding it point in opposite directions. On one side, the price recovery pulled at least one major holder back above water: Strategy closed up 6.10% last Friday, with reports confirming that Saylor's bitcoin position has just returned to breakeven — the company functions as a leveraged bitcoin holding vehicle whose capital structure amplifies every price move, explaining why its equity outperformed the underlying coin. On the other side, Saylor himself publicly warned shareholders to 'be prepared for several uncomfortable years' — a statement that carries different weight coming from the most committed bull than any sell-side downgrade. The macro backdrop is not supportive: one asset manager raised $1.8 billion in a market peers are openly calling a bear market, confirming that inflows continue but also that the 'bear market' label has become consensus. This week, long-end rates and the tone from Jackson Hole will set the overall risk-asset waterline, and crypto typically leads the reduction in risk exposure when rates rise. Will you use MSTR as a leveraged bitcoin proxy, hold the coin directly, or wait for Jackson Hole guidance before sizing your risk exposure?" },
  { ticker: "SPCX", title_cn: "Anthropic的2万亿估值,被拿SpaceX当反面教材?", body_cn: "未上市AI资产的定价开始被公开质疑,而质疑用的样本是已经上市的那一个。有华尔街资深人士撰文指出,Anthropic高达2万亿美元的估值正面临现实检验,理由是SpaceX的走势提供了警示:它6月12日以135美元发行、市值约1.77万亿美元,随后第二批解禁释放约3.19亿股,股价一度跌回发行价以下——超级IPO的定价高峰往往就在上市那一刻,解禁才是真正的考验。需要说清楚的是,2万亿目前仍是市场讨论中的估值区间,不是任何已确认的发行定价,Anthropic的上市时间表也还没有公开确认。SpaceX自己上周五收涨2.22%,并给出一条值得注意的表态:公司称中国是它在AI与火箭两条线上的头号竞争对手,这把它的叙事从\"太空基础设施\"进一步推向\"AI与国家竞争\",也解释了它为什么会被拿来给一级市场的AI估值做参照。多头的依据是稀缺性,英伟达的持仓披露显示对它有约210亿美元的仓位;空方的依据是解禁批次还没走完,而按AI资产定价就要接受长久期资产在利率波动里被优先减仓。你会按太空业务的现金流估值、等解禁走完,还是继续拿它当未上市AI资产的代理?", title_en: "Anthropic's $2T Valuation — Is SpaceX Being Used as a Cautionary Tale?", body_en: "Pricing of private AI assets is facing public scrutiny, using a newly public comparable as the cautionary reference. A senior Wall Street commentator argued that Anthropic's reported $2 trillion valuation faces a reality test, citing SpaceX's post-listing trajectory as the warning: SpaceX priced at $135 per share on June 12 at a market cap of approximately $1.77 trillion, after which a subsequent unlock released roughly 319 million shares and briefly pushed the stock below its issue price — suggesting that peak valuation for a landmark IPO often coincides with the listing itself, with lockup expirations as the true stress test. To be clear, $2 trillion remains a market-discussion figure, not a confirmed offering price, and no public timeline for an Anthropic listing has been confirmed. SpaceX itself closed up 2.22% last Friday and issued a notable statement: the company identified China as its primary competitor across both its AI and rocket businesses, extending its narrative from 'space infrastructure' to 'AI and national competition' — which also explains why it is being used as a private-market AI valuation benchmark. The bull case rests on scarcity, with Nvidia's disclosed holdings implying a position of approximately $21 billion; the bear case is that lockup tranches remain outstanding and pricing an asset as an AI play means accepting that long-duration assets are the first to be reduced when rates move. Will you value it on space-business cash flows and wait for lockups to clear, or continue to hold it as a proxy for private AI assets?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
