<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-08-12 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-08-12</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 7</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:14.3%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 7 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ / .SPX", title_cn: "指数高位不动等CPI,今晚3.4%是及格线?", body_cn: "QQQ周二微跌0.34%、标普500指数跌0.32%,创出新高后连续第二天在高位横着,资金明显不愿在数据前选边。今晚北京时间20:30公布美国7月CPI,道琼斯调查的经济学家预计同比3.4%、低于前值3.5%,核心同比2.5%、低于前值2.6%,环比分别为0.1%与0.2%。被称为\"新美联储通讯社\"的Timiraos给出的判断很直白:数据温和能同时缓解沃什和FOMC的加息压力,居高不下则可能迫使他用实际行动来证明自己。也有观点提醒真正撬动利率的可能是财政数字而非CPI。当预期已经押在温和上,超预期的那一侧谁在防守?", title_en: "Indices Hold Near Highs Ahead of CPI — Is 3.4% the Pass Mark?", body_en: "QQQ slipped 0.34% and the S&P 500 fell 0.32% Tuesday, drifting sideways for a second straight session after record highs as investors avoided taking sides ahead of data. U.S. July CPI prints at 20:30 Beijing time; Dow Jones consensus sees headline CPI at 3.4% year-over-year (prior 3.5%) and core at 2.5% (prior 2.6%), with month-over-month readings of 0.1% and 0.2% respectively. Nick Timiraos, dubbed the \"Fed Whisperer,\" noted bluntly that a soft print would ease pressure on both Warsh and the FOMC, while a hot one could force him to act. Some analysts warn it may be fiscal data, not CPI, that truly moves rates — so with consensus already positioned for a soft print, who is defending the upside surprise?" },
  { ticker: "CRWV / NBIS / RIOT", title_cn: "CoreWeave盘后飙15%,1040亿订单能兑现吗?", body_cn: "CoreWeave周二日间涨2.42%,盘后财报出炉后跳涨15.37%,但数字本身是喜忧参半:Q2营收25.75亿美元、略低于26.11亿的市场预期,每股亏损1.03美元则好于预期的1.24美元。真正点燃情绪的是高达1040亿美元的积压订单——市场愿意用未来的可见度,抵消当期营收的小幅落空。同赛道的Nebius被同步带起,日间涨4.95%、夜盘再涨7.70%,而它今晚美股盘前就要交卷——伯里的空头仍在,卖方则开始讨论两家之间的风险收益比该偏向谁。更长远的一笔是Anthropic与矿企Riot敲定的20年算力采购协议:基础合同约91亿美元、锁定191兆瓦,延期选择权全部行权可达161亿美元,Riot当日涨4.33%。当营收不及预期也能换来大涨,算力的定价锚是不是已经换成了订单簿?", title_en: "CoreWeave Surges 15% After Hours — Can That $104B Backlog Deliver?", body_en: "CoreWeave rose 2.42% during Tuesday's regular session before jumping 15.37% after hours on earnings that were mixed: revenue came in at $2.575 billion, slightly below the $2.611 billion consensus, while the per-share loss of $1.03 beat the expected $1.24. The real catalyst was a $104 billion order backlog, with the market willing to trade near-term revenue miss for forward visibility. Peer Nebius was swept up in the move, gaining 4.95% intraday and a further 7.70% after hours ahead of its own pre-market earnings release; Burry's short remains in place as sell-side desks debate which of the two offers a better risk-reward. Meanwhile, Anthropic and miner Riot finalized a 20-year compute procurement deal — base contract approximately $9.1 billion locking in 191 megawatts, expandable to $16.1 billion if all extension options are exercised — sending Riot up 4.33%. When a revenue miss still triggers a sharp rally, has the pricing anchor for compute already shifted to the order book?" },
  { ticker: "BRK.B / GOOG", title_cn: "巴菲特结束14季净卖出,聪明钱这次买了谁?", body_cn: "13F陆续出炉,伯克希尔二季度买入约235亿美元上市股票、卖出约37亿,净买入接近200亿,正式结束连续14个季度净卖出的纪录;继任者的调仓也开始留下印记,三只新建仓标的已带来约12亿美元浮盈。另外两条更有意思:谷歌的持仓里SpaceX占比高达约95%、对应约5.51亿股;花旗持仓市值突破3000亿美元,并显著加仓美光与AMD等半导体产业链。股价并不配合——伯克希尔B股周二跌2.46%、谷歌跌3.61%。当最保守的钱开始重新买入,跟着抄作业的风险在哪?", title_en: "Buffett Ends 14-Quarter Net Selling Streak — What Did Smart Money Buy?", body_en: "As 13F filings rolled in, Berkshire Hathaway purchased approximately $23.5 billion in listed equities in the second quarter and sold roughly $3.7 billion, marking a net buy of nearly $20 billion and formally ending 14 consecutive quarters of net selling; moves attributed to the designated successor have already generated around $1.2 billion in unrealized gains across three newly initiated positions. Elsewhere, SpaceX accounts for roughly 95% of Google's disclosed holdings at approximately 551 million shares, while Citigroup's equity portfolio surpassed $300 billion and showed significant additions in Micron and AMD. Stock prices were uncooperative — Berkshire B shares fell 2.46% and Google dropped 3.61% on Tuesday. Now that the most conservative money is buying again, what are the risks for those following its lead?" },
  { ticker: "SMCI / LITE", title_cn: "超微盘后涨7.7%,利润大超营收不及该信哪个?", body_cn: "两份被提前定价的财报都翻了盘,但翻的方式不同:Super Micro盘后大涨7.72%,每股收益1.70美元远超0.98美元的预期,代价是营收111.20亿美元、低于117.82亿的预期——毛利的疑虑被打消,规模却没跟上;Lumentum盘后涨3.56%,每股收益3.23美元略超预期、营收10.06亿基本符合,而它上一个交易日刚随光模块板块被砸下8.61%。也就是说,财报前的那轮杀跌更像仓位调整而非基本面预判,同板块的Coherent今晚盘后接着交卷。当利润和营收各错一边,市场这次选择相信哪一个?", title_en: "Super Micro Jumps 7.7% After Hours — Earnings Beat or Revenue Miss: Which Wins?", body_en: "Two pre-priced earnings reports both surprised, but in opposite directions: Super Micro surged 7.72% after hours as EPS of $1.70 handily beat the $0.98 consensus, though revenue of $11.12 billion fell short of the $11.782 billion estimate — gross margin fears were laid to rest even as top-line scale disappointed. Lumentum gained 3.56% after hours with EPS of $3.23 slightly above expectations and revenue of $1.006 billion broadly in line, just one session after the optical module sector dragged it down 8.61%. That pre-earnings selloff now looks more like a positioning flush than a fundamental call, with sector peer Coherent set to report after hours tonight. When earnings beat on profit but miss on revenue, which signal is the market choosing to believe this time?" },
  { ticker: "SKHY / SNDK / MU", title_cn: "海力士涨4.7%,存储又被摩根点进受益名单?", body_cn: "存储链周二集体回暖:海力士涨4.70%、闪迪涨2.68%、美光涨0.87%,三倍做多半导体ETF(SOXL)涨2.31%,把前一日的失血补回来一部分。推力来自卖方口径的转向——摩根大通点出英伟达的芯片景气正在向外扩散,并列出六只可能搭上这轮的标的;花旗的13F也显示它在二季度显著加仓了美光。争议仍在中国新增产能与长约锁价能撑多久。当上游景气被反复确认、股价却走得反复,存储的定价到底缺什么?", title_en: "SK Hynix Gains 4.7% as JPMorgan Names Memory Stocks Among Nvidia Beneficiaries?", body_en: "Memory stocks rebounded broadly on Tuesday: SK Hynix rose 4.70%, SanDisk gained 2.68%, Micron advanced 0.87%, and the 3x leveraged semiconductor ETF SOXL climbed 2.31%, recovering a portion of the prior session's losses. The catalyst was a shift in sell-side tone — JPMorgan flagged that Nvidia's chip-cycle strength is spreading downstream and named six potential beneficiary stocks, while Citigroup's 13F showed it significantly added to Micron in the second quarter. Debate persists over how long China's new capacity additions and long-term supply contracts can hold pricing. With upstream strength repeatedly confirmed yet share prices grinding in fits and starts, what is still missing from the memory sector's valuation story?" },
  { ticker: "SPCX / RKLB", title_cn: "SpaceX回落3.9%,36倍市销率成了估值陷阱?", body_cn: "太空板块周二双双回落:SpaceX跌3.93%,Rocket Lab基本收平、微跌0.04%。财报的余温开始退去,卖方接连出手——有报告直言SpaceX在财报后\"还有很长的下跌空间\",另一份则把Rocket Lab约36倍的远期市销率称作估值陷阱。基本面这边,马斯克的身家随SpaceX反弹回升,叙事仍然庞大。当业绩已经落地、估值成为唯一议题,太空这轮行情要靠什么续命?", title_en: "SpaceX Pulls Back 3.9% — Has a 36x Forward Price-to-Sales Become a Valuation Trap?", body_en: "Space sector names retreated Tuesday: SpaceX fell 3.93% while Rocket Lab was essentially flat, slipping just 0.04%. Post-earnings momentum faded as sell-side reports hit — one stated bluntly that SpaceX still has \"significant downside\" after its earnings rally, while another labeled Rocket Lab's roughly 36x forward price-to-sales ratio a valuation trap. On the fundamental side, Elon Musk's net worth recovered alongside SpaceX's recent rebound and the narrative remains expansive. With results now in the rearview mirror and valuation the sole debate, what does this space rally need to keep running?" },
  { ticker: "SE", title_cn: "Sea盘前双超财报飙14.6%,盈利拐点到了?", body_cn: "Sea Limited周二大涨14.56%,盘前公布的Q2财报双超预期:营收78.05亿美元、高于市场预期的72.75亿,每股收益0.86美元也高于0.79美元的预期。规模与利润同时超预期是这轮上涨最直接的支撑;至于电商、数字金融与游戏三块业务各自贡献多少,要等分部数据披露才能判断。市场对它的长期分歧一直不在增速,而在盈利能否稳定持续。当营收与利润同时给出正面信号,这轮上涨还需要几个季度才算被确认?", title_en: "Sea Surges 14.6% Pre-Market on Double Beat — Has the Profit Inflection Arrived?", body_en: "Sea Limited soared 14.56% on Tuesday after pre-market earnings delivered a double beat: revenue of $7.805 billion topped the $7.275 billion consensus, and EPS of $0.86 exceeded the $0.79 estimate. Simultaneous beats on both scale and profitability provided the most direct support for the rally; the precise contribution from each of its e-commerce, digital financial services, and gaming segments will only become clear once segment-level data is disclosed. The market's long-standing debate on Sea has never centered on growth but on whether profitability can prove durable. Now that revenue and earnings are both flashing positive, how many more quarters does it take before this rally is considered confirmed?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
