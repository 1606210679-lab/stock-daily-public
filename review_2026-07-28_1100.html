const topics = [
  { ticker: "MU", title_cn: "美光周一再跌2%,中国存储巨头IPO砸盘?", body_cn: "美光周一收跌2.25%、隔夜盘后续跌逾3%,存储板块二次探底。中国CXMT大型DRAM厂商挂牌上市,冲击美光、闪迪、西部数据的供给格局,\"存储涨势见顶\"担忧发酵。与此同时,SK海力士将于本周三盘前公布财报,被视为AI存储需求的风向标,财报前夜资金避险离场。当中国新产能与海力士业绩双重悬顶,美光的回调是布局良机还是周期拐点?", title_en: "Micron Slides 2% Monday — Is China's CXMT IPO Crushing Memory Stocks?", body_en: "Micron fell 2.25% Monday and dropped over 3% in after-hours trading, as the memory sector revisited recent lows. China's CXMT, a major DRAM manufacturer, went public, raising supply concerns that weighed on Micron, SanDisk, and Western Digital. With SK Hynix reporting Wednesday as an AI memory bellwether, nervous investors are de-risking ahead of results. With Chinese capacity expansion and Hynix earnings both looming, is Micron's pullback a buying opportunity or a cyclical inflection point?" },
  { ticker: "SNDK", title_cn: "闪迪周一崩11%,存储杀跌还没见底?", body_cn: "闪迪周一重挫11.02%,创存储板块最大单日跌幅,直接导火索是中国CXMT的重磅IPO加剧NAND闪存供给担忧。叠加8月5日自身财报在即、SK海力士本周三先行交卷,存储链进入业绩与竞争的双重考验期。有分析师警示\"闪存AI狂热已退\",也有人称回调后估值渐显吸引力。当新产能冲击撞上财报窗口,闪迪的暴跌是错杀还是趋势确认?", title_en: "SanDisk Crashes 11% Monday — Has Memory Sector Selling Hit Bottom?", body_en: "SanDisk plunged 11.02% Monday, marking the session's largest single-day decline in the memory sector, as China's CXMT IPO intensified NAND flash supply concerns. With SanDisk's own earnings due August 5 and SK Hynix reporting Wednesday, the memory supply chain faces a dual test of results and competition. Some analysts warn \"flash memory AI euphoria has faded,\" while others argue the selloff has created attractive valuations. As new capacity headwinds collide with earnings season, is SanDisk's crash an overreaction or trend confirmation?" },
  { ticker: "SKHY", title_cn: "SK海力士周一跌7.5%,财报前夜HBM还扛得住?", body_cn: "SK海力士周一收跌7.47%,将于本周三盘前公布季报。作为HBM高带宽存储的核心供应商,其业绩是AI存储需求的风向标,却在财报前夜遭遇抛售——市场担忧存储周期见顶、中国CXMT挂牌加剧竞争。有分析称其从\"4700亿美元大回撤\"中的反弹,成败系于AI资本开支能否延续。当HBM红利撞上供给冲击与获利了结,这份财报是给存储链正名还是压垮最后一根稻草?", title_en: "SK Hynix Drops 7.5% Monday — Can HBM Hold Ahead of Earnings?", body_en: "SK Hynix fell 7.47% Monday ahead of its quarterly earnings release Wednesday pre-market. As the dominant HBM high-bandwidth memory supplier and a key barometer of AI storage demand, the stock faced heavy selling on fears of a memory cycle peak and intensifying competition from China's CXMT listing. Analysts note its recovery from a $470 billion drawdown hinges on whether AI capex momentum holds. With HBM tailwinds colliding against supply shocks and profit-taking, will this earnings report vindicate or further pressure the memory sector?" },
  { ticker: "NVDA", title_cn: "英伟达周一跌5%,入股Ilya新公司是何棋?", body_cn: "英伟达周一收跌4.99%,随半导体板块深度回调,但公司动作频频:被曝入股前OpenAI首席科学家Ilya Sutskever的AI初创,并\"做出华尔街没料到的一步\"。有市场评论直言美国政府是英伟达的\"隐形后盾\"。资金在AI资本开支见顶担忧与龙头卡位之间反复拉锯。当股价杀跌与战略扩张同时上演,英伟达的回调是风险释放还是黄金坑?", title_en: "Nvidia Falls 5% Monday — What's the Strategy Behind Its Ilya Startup Stake?", body_en: "Nvidia closed down 4.99% Monday amid a broad semiconductor selloff, yet the company remained strategically active, reportedly taking a stake in former OpenAI chief scientist Ilya Sutskever's new AI startup in what commentators called \"a move Wall Street didn't see coming.\" Some market observers noted the U.S. government serves as Nvidia's \"invisible backstop.\" Investors are torn between peak-AI-capex concerns and Nvidia's continued effort to consolidate strategic positioning. As the stock sells off while expansion accelerates, is this pullback a risk-clearing event or a golden entry point?" },
  { ticker: "SPCX", title_cn: "SpaceX周一跌1.4%,欧洲对手20亿估值来抢?", body_cn: "SpaceX相关标的周一收跌1.36%,随马斯克概念股集体走弱。消息面上,一家欧洲火箭公司正冲刺20亿美元估值,试图挑战SpaceX的发射霸主地位;亦有分析指出其\"最接近的IPO对标并非特斯拉\"。商业航天赛道的竞争格局与估值锚点被重新审视。当欧洲挑战者入局、映射标的溢价承压,SpaceX的稀缺性还能维持多久?", title_en: "SpaceX Drops 1.4% Monday — Can a $2B European Rival Threaten Its Lead?", body_en: "SpaceX-linked shares fell 1.36% Monday, declining alongside broader Elon Musk-affiliated names. A European rocket startup is pursuing a $2 billion valuation in a direct challenge to SpaceX's launch dominance, while analysts noted its \"closest IPO comparable is not Tesla.\" The competitive landscape and valuation benchmarks for commercial space are being reassessed. As a well-funded European challenger enters the arena and premium valuations face pressure, how long can SpaceX maintain its scarcity premium?" },
  { ticker: "TSLA", title_cn: "特斯拉周一再跌1.2%,2026跌势谁来止血?", body_cn: "特斯拉周一收跌1.22%,延续2026年以来的颓势。最新数据显示销量虽有回暖,却掩盖了利润率与现金流的深层问题;不过仍有知名分析师逆势喊出未来12个月上涨85%的目标。多空在Optimus机器人与汽车主业之间激烈分歧。当基本面隐忧与超级看多并存,特斯拉的杀跌是价值陷阱还是错杀?", title_en: "Tesla Falls 1.2% Monday — Who Can Halt the 2026 Downtrend?", body_en: "Tesla closed down 1.22% Monday, extending its 2026 year-to-date decline. Recent data shows a modest sales recovery that masks deeper concerns around margins and cash flow, though one prominent analyst has maintained a bullish 12-month price target implying 85% upside. Bulls and bears remain sharply divided between the Optimus robotics opportunity and the struggles of the core automotive business. With fundamental headwinds and extreme bullishness coexisting, is Tesla's selloff a value trap or an unwarranted overreaction?" },
  { ticker: "INTC", title_cn: "英特尔财报后再拿代工大单,反转要来了?", body_cn: "英特尔周一微跌0.70%、隔夜续软,但财报后的基本面信号转暖:公司拿下一家重量级代工客户,服务器芯片定价权明显改善,资本开支计划也被视为代工业务的\"隐性利好\"。市场对其\"多年最佳季报\"后的持续性仍有疑虑,执行力是最大考验。当代工订单与定价改善接连兑现,英特尔的翻身故事这次能落地吗?", title_en: "Intel Lands Major Foundry Win Post-Earnings — Is a Turnaround Finally Here?", body_en: "Intel edged down 0.70% Monday and softened further in after-hours trading, but post-earnings fundamentals are showing signs of improvement. The company secured a high-profile foundry customer, achieved meaningfully better server chip pricing power, and outlined a capex plan seen as a stealth positive for its foundry ambitions. Markets remain skeptical about the durability of what some called Intel's \"best quarter in years,\" with execution risk remaining the central concern. With foundry wins and pricing gains now materializing, can Intel's turnaround story finally deliver?" },
  { ticker: "QQQ", title_cn: "纳指ETF周一微跌,油价暴跌为何救不了科技?", body_cn: "QQQ周一微跌0.31%,盘面罕见分化:美伊和平预期令油价暴跌、道指走高,但AI资本开支与估值担忧持续压制纳指科技股。本周美联储议息与微软、亚马逊、苹果等Mag-7财报密集来袭,市场对\"AI变现\"的追问升温。有机构直言\"这不是一次正常的板块轮动\"。当宏观转暖与科技退潮背离,这轮盘整会以哪种方式收场?", title_en: "QQQ Edges Lower Monday — Why Can't an Oil Price Crash Save Tech?", body_en: "QQQ slipped 0.31% Monday in an unusually bifurcated session, as U.S.-Iran peace prospects sent oil prices sharply lower and lifted the Dow, while AI capex and valuation concerns continued to weigh on Nasdaq tech. This week brings a dense calendar of Fed rate decisions and Mag-7 earnings from Microsoft, Amazon, and Apple, sharpening investor focus on AI monetization. One institution bluntly noted, \"this is not a normal sector rotation.\" As macro conditions improve but tech retreats, how will this consolidation ultimately resolve?" },
  { ticker: "AMD", title_cn: "AMD周一跌5%,微软合作能否顶住断供风险?", body_cn: "AMD周一重挫5.17%,随芯片股深度回调。利空来自中国加速自研DUV光刻设备、潜在供应链风险浮现;利多则是与微软的合作被视为其数据中心转型的重要验证,Helios平台更被寄望成为冲击万亿市值的催化剂。英伟达入股Ilya新公司也搅动AI芯片格局。当供应链隐忧撞上大客户背书,AMD的杀跌是补跌还是错杀?", title_en: "AMD Drops 5% Monday — Can Microsoft Partnership Offset Supply Chain Risk?", body_en: "AMD tumbled 5.17% Monday in a broad chip stock selloff. Headwinds include China's accelerating development of domestic DUV lithography equipment and emerging supply chain vulnerabilities, while the company's deepening partnership with Microsoft is seen as a critical validation of its data center pivot, with the Helios platform eyed as a potential catalyst toward a trillion-dollar market cap. Nvidia's investment in Ilya Sutskever's startup further reshapes the AI chip competitive landscape. With supply chain risks colliding against a major customer endorsement, is AMD's selloff a catch-up decline or an overreaction?" },
  { ticker: "GOOG", title_cn: "谷歌周一涨2.3%,capex恐慌被证伪了吗?", body_cn: "谷歌周一逆势收涨2.34%,在科技股普跌中相对强势。市场情绪转向,有分析直言此前的\"capex担忧纯属杞人忧天\",且公司内部已有对冲机制;谷歌还联手贝莱德、福特发起技能人才联盟,拓展AI落地场景。在本周Mag-7财报与议息的关键窗口,资金重新为其全栈AI叙事定价。当capex恐慌退潮、逆势走强确立,谷歌能否领跑这轮反弹?", title_en: "Alphabet Gains 2.3% Monday — Has the Capex Panic Been Disproved?", body_en: "Alphabet closed up 2.34% Monday, outperforming amid a broad tech selloff. Sentiment shifted as analysts argued prior capex fears were \"overblown,\" pointing to internal hedging mechanisms the market had underappreciated. Google also partnered with BlackRock and Ford to launch a skilled-workforce alliance, expanding its real-world AI deployment. With Mag-7 earnings and a Fed decision due this week, investors are repricing Alphabet's full-stack AI narrative. As capex panic fades and relative strength emerges, can Alphabet lead the next leg of this recovery?" },
  { ticker: "PLTR", title_cn: "Palantir周一飙7%,财报前先被押注大超预期?", body_cn: "Palantir周一大涨7.00%,资金抢跑即将到来的财报。有分析师喊出200美元目标价,并直言其业绩\"已具备大超预期的条件\",政企AI订单与商业化提速是核心看点。尽管年内仍累跌约26%,但反弹动能正在积聚,市场在高估值与高增长之间反复权衡。当财报窗口临近、看多声浪高涨,Palantir这波抢跑是提前卡位还是透支预期?", title_en: "Palantir Surges 7% Monday — Are Traders Front-Running a Massive Earnings Beat?", body_en: "Palantir surged 7.00% Monday as investors positioned ahead of its upcoming earnings report. One analyst issued a $200 price target, asserting the company has \"all the conditions in place for a significant beat,\" citing accelerating government and commercial AI contract momentum. Despite remaining roughly 26% below its year-to-date peak, bullish momentum is building as the market weighs high valuation against high growth. As the earnings window approaches and bullish conviction intensifies, is this rally an early strategic position or a case of front-running that risks overshooting expectations?" },
  { ticker: "ORCL", title_cn: "甲骨文周一反弹4.3%,云分销新单扳回一城?", body_cn: "甲骨文周一收涨4.27%,从上周的杀跌中反弹。公司通过Ingram Micro在澳大利亚加速Oracle云与AI分销,渠道扩张提振情绪;不过市场对超大规模厂商的AI资本开支回报仍存疑虑,微软本周财报前的capex拷问也牵动云板块神经。政企云需求与烧钱质疑并存。当渠道新单点燃反弹、capex阴影未散,甲骨文的云叙事能否稳住?", title_en: "Oracle Rebounds 4.3% Monday — Can New Cloud Distribution Deal Reverse the Slide?", body_en: "Oracle rose 4.27% Monday, rebounding from last week's steep selloff. The company's expanded Oracle Cloud and AI distribution through Ingram Micro in Australia lifted sentiment around channel growth. However, investor skepticism around hyperscaler AI capex returns persists, and Microsoft's upcoming earnings are keeping pressure on the broader cloud sector. Government and enterprise cloud demand remains in focus alongside ongoing concerns about spending efficiency. With a new distribution win sparking the rebound but capex uncertainty unresolved, can Oracle's cloud narrative regain its footing?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
