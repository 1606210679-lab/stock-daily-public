<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-10-14 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-10-14</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 6</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:16.7%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 6 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: ".SPX / QQQ", title_cn: "CPI今晚落地，大盘连两日窄幅是在等什么？", body_cn: "美股周二窄幅波动：标普500收跌0.02%报7805.45点，纳斯达克100（QQQ）收跌0.33%报743.57美元。市场等待今晚20:30（美东上午8:30）公布的美国9月CPI：目前预期年率3.6%，前值3.4%；核心CPI月率预期0.2%，前值0.3%。本周五，美联储官员沃什将在IMF年会与总裁格奥尔基耶娃对谈。多头的抓手是核心通胀若继续降温、沃什态度偏缓，股债都会得到支撑；空头的抓手是年率预期已从3.4%抬到3.6%，一旦再超预期，利率预期会重新收紧。今晚这份CPI，你觉得足以给大盘定下这个月的方向吗？", title_en: "CPI tonight: why is the market waiting in narrow ranges?", body_en: "U.S. stocks drifted Tuesday: S&P 500 fell 0.02% to 7,805.45, Nasdaq-100 (QQQ) down 0.33% to $743.57. Markets await September CPI at 8:30 a.m. ET—expected 3.6% year-on-year (prior 3.4%), core CPI forecast 0.2% monthly (prior 0.3%). Fed official Warsh will meet IMF President Georgieva at the annual meeting Friday. If core inflation cools and Warsh signals dovish tilt, stocks and bonds gain; if year-on-year expectations rise from 3.4% to 3.6% again, rate expectations tighten. Which CPI line unsettles you more tonight — the 3.6% headline or the 0.2% core?" },
  { ticker: "ASML / TSM", title_cn: "阿斯麦今日放榜，半导体三季报季该看哪组数字？", body_cn: "半导体三季报季今日启幕：阿斯麦将于美东时间10月14日早间公布业绩，台积电紧随其后于10月15日早间放榜。焦点有两项——阿斯麦的EUV设备新增订单与订单能见度，直接反映芯片厂未来12到18个月扩产的信心；台积电的先进封装CoWoS产能是否继续供不应求，以及全年AI芯片需求与毛利率指引。多头的抓手是两家公司此前都没有发出需求降温的信号，指引若维持，AI资本开支的叙事还能延续；空头的抓手是存储股刚被中国厂商的技术突破打乱节奏，设备端订单若不及预期，半导体整条链的估值都会被压。阿斯麦这份财报，你觉得订单能见度比单季营收更值得看吗？", title_en: "ASML reports today—which metrics matter most in semis Q3 season?", body_en: "Semiconductor Q3 earnings season launches today: ASML reports October 14 a.m. ET, TSMC follows October 15 a.m. Focus: ASML's EUV equipment order book and visibility—direct indicators of chip fabs' 12-to-18-month capex confidence; TSMC's CoWoS advanced packaging capacity constraints and full-year AI chip demand and margin guidance. Bulls say neither company has signaled demand cooling; sustained guidance extends AI capex momentum. Bears say memory stocks just reeled from China's domestic DRAM breakthrough; weak equipment orders would pressure the entire semiconductor chain valuation. If ASML's order book disappoints today, how far beyond semis does the damage spread?" },
  { ticker: "JPM / MS / BAC", title_cn: "银行财报进入密集期，净息差和拨备哪个先给信号？", body_cn: "银行三季报进入密集披露期：摩根大通已于周二率先披露，摩根士丹利、美国银行与贝莱德将于美东时间周三早间接棒。此前美国银行因财政部12亿美元罚款在周二的交易中承压。市场关注两条线：净息差能否维持扩张，以及消费与企业贷款的坏账拨备是否同步走高。多头的抓手是利率维持高位对大型银行净息差仍有直接支撑，资本市场交易量恢复也提供了额外收入；空头的抓手是若拨备金额超预期，市场会把它读成信贷质量恶化的先兆，进而压低整个金融板块。这一轮银行财报，你觉得板块估值有重新定价的机会吗？", title_en: "Bank earnings intensify: net interest margin or loan-loss reserves first?", body_en: "Bank Q3 results intensify: JPMorgan reported Tuesday, Morgan Stanley and Bank of America release Wednesday a.m. ET; BlackRock follows. BofA declined Tuesday after Treasury's $1.2B fine. Markets watch two lines: whether net interest margins hold or expand, and whether consumer and commercial loan-loss provisions rise in tandem. Bulls say high rates still support NIM for large banks, and capital markets trading has recovered; Bears say elevated provisions would signal credit deterioration, weighing the entire financial sector. Between net interest margin and loan-loss provisions, which one actually moves bank stocks this week?" },
  { ticker: "AAPL", title_cn: "苹果新品周开启，盘中历史新高为什么没守住？", body_cn: "苹果周二盘中创下历史新高348.15美元，但收盘涨幅收窄至0.09%报341.27美元。本周苹果将集中推出多款新品：周二举行智能家居发布会，推出以AI为核心的新一代家庭设备；本月晚些时候计划推出触屏版MacBook和新款iPad mini；全新折叠屏iPhone Duo将于周五开启预订。多头的抓手是产品线集中更新叠加AI功能落地，有望撬动新一轮换机周期；空头的抓手是盘中高点没能守住，说明新品预期已经反映在股价里，接下来的兑现压力会更大。苹果这轮新品里，你觉得哪一款最有希望带动换机？", title_en: "Apple new product week opens—why didn't intraday record hold?", body_en: "Apple hit intraday record $348.15 Tuesday but closed up only 0.09% at $341.27. This week Apple launches multiple products: smart home devices centered on AI Tuesday, touchscreen MacBook and iPad mini later; folding-screen iPhone Duo pre-orders open Friday. Bulls say the concentrated product refresh plus on-device AI could drive an upgrade cycle; Bears say the intraday high didn't hold, suggesting new-product expectations already priced in and execution risk lies ahead. Why couldn't a record high hold with the product lineup this full?" },
  { ticker: "MU / SNDK / SKHY / WDC", title_cn: "存储股连跌第二天，长鑫的突破还要消化多久？", body_cn: "存储板块周二继续调整，但跌势较周一明显收窄：美光收跌3.62%报953.19美元，闪迪收跌0.34%，SK海力士收跌3.19%，西部数据收跌1.61%。市场仍在消化中国厂商长鑫在下一代4F² DRAM架构上的突破。特斯拉首席执行官马斯克的表态引人注目——他称美光在内存定价上\"相对合理\"，另一些厂商则\"要价过高\"。多头的抓手是闪迪的跌幅从周一的近6%迅速收窄到不足1%，抛压看起来在释放；空头的抓手是国产DRAM的突破一旦向量产推进，长期定价权会被稀释。存储股这两天跌得不深，你觉得市场的担心过度了吗？", title_en: "Memory stocks fall second day—how long to digest Changxin's breakthrough?", body_en: "Memory sector adjusted Tuesday, declines narrower than Monday: Micron fell 3.62% to $953.19, SanDisk down 0.34%, SK Hynix down 3.19%, Western Digital down 1.61%. Markets digest CXMT's breakthrough in next-gen 4F² DRAM architecture. Tesla CEO Elon Musk's comment stood out: Micron's memory pricing \"relatively reasonable\" while others \"overpriced.\" Bulls say SanDisk's decline compressed from ~6% Monday to under 1%, pointing to selling pressure unwinding; Bears say once China's domestic DRAM ramps to volume, long-term pricing power erodes. Is the market underpricing or overpricing the CXMT threat right now?" },
  { ticker: "NVDA / AMD", title_cn: "存储被抛售、算力芯片走强，半导体内部在换仓吗？", body_cn: "存储股遭抛售的同时，AI算力芯片逆势走强：英伟达周二收涨0.97%报228.52美元，AMD收涨1.90%报605.53美元，英特尔收涨1.44%。资金在半导体内部从存储芯片转向逻辑芯片，市场对芯片股的看法正在分化。多头的抓手是算力需求并不直接依赖内存价格，逻辑芯片的订单能见度更平缓；空头的抓手是如果财报季里AI资本开支的预期被下调，逻辑芯片同样躲不开。资金从存储换到算力芯片，你觉得这轮轮动会持续多久？", title_en: "Memory crushed, AI chips rally—is semiconductors rotating internally?", body_en: "While memory stocks slide, AI compute chips surge: Nvidia rose 0.97% to $228.52, AMD up 1.90% to $605.53, Intel up 1.44%. Capital rotates within semiconductors from memory to logic chips; views on chip stocks diverge. Bulls say compute demand is not tied to memory pricing and logic chip order visibility is steadier; Bears say if AI capex guidance disappoints earnings season, logic chips won't escape. What would make this rotation out of memory last beyond this week?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
