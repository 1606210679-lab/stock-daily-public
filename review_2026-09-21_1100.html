<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-09-21 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-09-21</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 5</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:20.0%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 5 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ / META / AAPL / GOOG", title_cn: "三巫日指数几乎收平,Meta跌2.43%是信号吗?", body_cn: "上周五指数收出来几乎是平的,纳指100ETF(QQQ)收涨0.63%报721.45美元,标普500ETF(SPY)收涨0.13%报761.69美元。平的原因不是没事,而是两层在对冲。这一天是季度三巫日,股指期货、股指期权、个股期权同日到期;它同时是标普系列指数这次成分调整生效前的最后一个交易日,跟踪指数的基金通常在这天收盘完成调仓,成交量本来就会被推大。涨的一层在存储和芯片,跌的一层是权重科技股:Meta收跌2.43%报665.75美元,当天没有可对应的公司消息;苹果收跌0.26%报336.13美元;谷歌母公司Alphabet收涨0.21%报344.41美元,是三家里唯一收红的。多头的抓手是权重股这波回调没有基本面消息对应,更像是钱临时换了地方;空头的抓手是它们已经连着几个交易日跑输芯片,掉队的时间在拉长。往后看,苹果这边有报道说新任首席执行官押注定价1999美元的折叠iPhone,谷歌在芬兰用冷天气和核电建新的AI数据中心,美银近日也单独出了一份AI数据中心需求的报告。指数收平的背后是权重股在跌,你觉得这一层要等到什么才会被买回来?", title_en: "Witching Day indices nearly flat; Meta down 2.43% a signal?", body_en: "Friday's Nasdaq-100 ETF (QQQ) rose 0.63% to $721.45, S&P 500 ETF (SPY) gained 0.13% to $761.69 and the flat close was two layers cancelling each other out. Friday was a quarterly triple witching, with index futures, index options and single-stock options all expiring on the same day, and it was also the last trading day before this reshuffle of the S&P indices took effect, so the funds that track them normally complete the switch at that close and volume is pushed up anyway. The gains sat in memory and chips, the losses in mega-cap technology: Meta fell 2.43% to $665.75 with no company news; Apple declined 0.26% to $336.13; Alphabet rose 0.21% to $344.41, the only one of the three to close higher. Bulls note that this pullback in the mega-caps came with no fundamental news attached, which looks more like money moving elsewhere for a while; bears note they have now lagged the chip names for several sessions running, so the time spent behind is getting longer. Looking ahead, reports say Apple's new chief executive is betting on a foldable iPhone priced at $1999, Google is building its next AI data centre in Finland on cold weather and nuclear power, and BofA has just put out a separate note on AI data centre demand. What would have to turn up for money to come back into the mega-caps?" },
  { ticker: "SNDK / MU / SKHY / INTC", title_cn: "闪迪收涨10.99%领跑存储,被动买盘能算利好吗?", body_cn: "闪迪上周五收涨10.99%报1791.82美元,是存储这一批里涨得最多的一只,而它多出来的那部分涨幅跟存储价格没有关系。标普道琼斯指数公司9月4日公布,闪迪与戴尔、Palo Alto Networks、Arista一同进入标普100指数,自9月21日起生效,耐克同日被调出;上周五正是生效前的最后一个交易日,跟踪这只指数的基金要在这天把仓位换过来。同板块其余几只差得很远:美光收涨3.92%报1015.80美元,SK海力士收涨2.46%报187.50美元,英特尔收跌0.18%报108.60美元。同一个板块的涨幅从两位数一路排到负数,说明推它们的不是同一个理由。多头的抓手是进宽基指数带来的被动买盘不看估值也得买,而存储本身的基本面也在往上走——美光上周公布了新的存储产品,英特尔那边的说法是目前只能满足客户约一半的需求;空头的抓手是这种买盘是一次性的,调仓做完就没有了,而且这次调整9月4日就已经公布,涨幅里有多少是当天才发生的事并不好说。被动买盘做完之后,这10.99%还剩得下多少?", title_en: "SanDisk leads memory stocks up 10.99%; passive buying a tailwind?", body_en: "SanDisk closed 10.99% higher at $1,791.82 on Friday, the biggest gain in the memory group, and the extra part of that move has nothing to do with memory prices. S&P Dow Jones Indices said on September 4 that SanDisk would join the S&P 100 alongside Dell, Palo Alto Networks and Arista, effective from September 21, with Nike leaving the index the same day; Friday was the last trading day before it took effect, so the funds tracking that index had to move their positions at that close. The rest of the group was nowhere near: Micron gained 3.92% to $1,015.80, SK Hynix rose 2.46% to $187.50, and Intel fell 0.18% to $108.60. A single sector running from double digits down to a negative number says the same reason is not pushing all of them. Bulls note that passive money coming in with an index has to buy whatever the valuation, and that the fundamentals are moving too: Micron unveiled a new memory product last week, and Intel's own line is that it can supply only about half of what its customers want. Bears note that this kind of buying is one-off and is finished once the switch is done, and that the change was already public on September 4, so how much of Friday's move was actually news on the day is hard to say. Once the switch is done, is a one-off index bid a tailwind at all?" },
  { ticker: "AVGO / AMD / NVDA", title_cn: "博通接棒芯片反攻,黄仁勋那句话还剩多少推力?", body_cn: "芯片上周五继续涨,但把个股摆到一起看,出力的换了人。博通收涨2.97%报357.61美元,是三只里涨得最多的,也是唯一比上一个交易日涨得更多的一只(上一个交易日收涨2.29%);AMD收涨2.70%报559.82美元,上一个交易日是6.36%;英伟达收涨1.34%报222.27美元,上一个交易日是2.54%。消息面并没有换新的,还是英伟达首席执行官黄仁勋那句“明年芯片销量将是今年的两倍”,他同时淡化了AI放缓的说法。多头的抓手是卖方这边仍在加码,上周有分析把当前的AI放缓担忧直接称作误读,也有研究列出博通这波回调值得买入的理由;空头的抓手是同一条消息进入第二天,能推动的幅度明显小了一圈,而且推的已经不是最初那两只。一条消息推了两天,领涨的还换了人,第三天要靠什么接上?", title_en: "Broadcom leads chip rally; how much momentum remains from Huang's comment?", body_en: "Chips kept rising on Friday, but line the three up and the ones doing the work have changed. Broadcom rallied 2.97% to $357.61, the biggest of the three and the only one to gain more than it had the session before, when it closed 2.29% higher; AMD gained 2.70% to $559.82 against 6.36% the session before, and Nvidia rose 1.34% to $222.27 against 2.54%, as the sector extended gains on Nvidia CEO Jensen Huang's forecast of chip shipments doubling next year. He also played down talk of an AI slow-down. Bulls note the sell side is still adding: one piece last week called the current slow-down worry a straight misreading, and another set out the reasons to buy this dip in Broadcom. Bears note that on day two the same line moved prices visibly less, and that the names carrying it are no longer the two that started it. Is a rally that hands the lead to a different name every session a healthy one?" },
  { ticker: "MSTR / BTC.USD.CC", title_cn: "比特币没动Strategy收涨16.39%,涨的是什么?", body_cn: "上周五这两个价格走出了完全不同的方向。比特币报81428美元,基本没动,涨0.24%;以持有比特币为主业的Strategy(MSTR)收涨16.39%报153.92美元。币没涨,股票涨了16%,多出来的那部分不在币价上。对应的消息有两条:迈克尔·赛勒把CLARITY法案未能推进称作行业的“正向拐点”,并暗示公司还会继续买入比特币;另有报道统计,这只股票过去一个月已经涨了53%。多头的抓手是规则一旦落地,持币公司身上的折价会被重新算一遍,而公司本身还在加仓;空头的抓手是币价一动没动,涨的全是对规则的预期,而那项法案本身并没有通过,同期木头姐凯茜·伍德刚说完“比特币不是死猫”,说明分歧还摆在那里。币价一动没动,股票涨了16%,多出来的这部分你会怎么给它定价?", title_en: "Bitcoin flat while Strategy surges 16.39%; what's rallying?", body_en: "Bitcoin held at $81,428 (up 0.24%) Friday while Strategy (MSTR), whose main business is holding bitcoin, jumped 16.39% to $153.92. The coin did not move, the stock rose 16%, and the extra part is not in the coin price. There were two pieces of news attached: Michael Saylor called the CLARITY bill's failure to advance a positive inflection point for the industry and hinted the company would keep buying bitcoin, and a separate report counted the stock up 53% over the past month. Bulls note that once the rules land, the discount carried by companies that hold coin gets recalculated, and that the company itself is still adding. Bears note the coin price did not move at all, so what rose is the expectation around the rules, while the bill itself did not pass; Cathie Wood had just said bitcoin is not a dead cat, which shows the disagreement is still there. Is an expectation about rules worth a 16% day on its own?" },
  { ticker: "TSLA", title_cn: "特斯拉Autopilot再下一城,监管期限会是坎吗?", body_cn: "特斯拉上周五收跌0.53%报364.27美元,当天它这边的两条消息指向相反的方向。一条是Autopilot软件拿下第六个欧洲国家的许可,欧洲市场是一国一国批,多一个就多一块可以开通的收入;另一条是美国国家公路交通安全管理局针对Cybercab提出问询,这款车没有方向盘、没有踏板也没有传感器,监管方要求特斯拉在9月30日前给出答复。多头的抓手是欧洲这边的审批在按节奏推进,属于能兑现的进展;空头的抓手是Cybercab的问询带着明确期限,答复内容可能直接影响这款车的量产安排,而它正是特斯拉当前估值里最靠前的那部分想象。Cybercab的答复9月30日到期,你觉得市场会把这件事当成多大的事?", title_en: "Tesla Autopilot wins sixth European license; regulatory deadline a hurdle?", body_en: "Tesla fell 0.53% to $364.27 Friday as mixed signals emerged: Autopilot gained approval in a sixth European country, expanding revenue-generating markets, while the U.S. National Highway Traffic Safety Administration opened an inquiry into the Cybercab, which has no steering wheel, no pedals and no sensors, and has asked Tesla to respond by September 30. Bulls note the European approvals are coming through on schedule and are progress the company can actually book; bears note the Cybercab inquiry comes with a hard deadline and the answer could feed straight into how that vehicle is brought to production, and it is the front part of what Tesla's current valuation is imagining. What in that response would actually move the Cybercab's production timeline?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
