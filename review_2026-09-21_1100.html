<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-09-21 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-09-21</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 5</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:20.0%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 5 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "SPY / QQQ / META / ORCL / AAPL", title_cn: "指数没动,涨的都在哪一层?", body_cn: "上周五是季度三巫日,股指期货、股指期权、个股期权在同一天到期。指数收出来的结果几乎是平的:标普500ETF(SPY)收涨0.13%报761.69美元,纳指100ETF(QQQ)收涨0.63%报721.45美元。但指数里面并不平静。涨的那一层集中在半导体,费城半导体指数当天涨近3%;权重科技股反而在跌,Meta收跌2.43%报665.75美元,甲骨文收跌1.98%报147.61美元,苹果收跌0.26%报336.13美元。甲骨文这个跌幅把它上一个交易日5.19%的涨幅还回去了三分之一,Meta这天没有可对应的公司消息。往后看,本周有两件带日期的事:中美经贸团队已于9月20日在纽约开始磋商,中方由何立峰率团,行程从9月19日到23日;同一周美联储官员密集发声。指数收平和权重股普跌,你会先信哪一个?", title_en: "Indexes Flat, But Where Were the Gains?", body_en: "Friday was the quarterly triple witching expiration for index futures, index options, and single-stock options. SPY closed up 0.13% at $761.69 and QQQ gained 0.63% to $721.45 — both nearly flat. Underneath, semiconductors surged nearly 3% on the Philadelphia Semiconductor Index, while heavyweight tech names fell: Meta dropped 2.43% to $665.75, Oracle shed 1.98% to $147.61, and Apple slipped 0.26% to $336.13. That drop gave back about a third of the 5.19% gain Oracle posted the prior session, and Meta had no company-specific news that day. U.S.-China trade talks began in New York on September 20th, led by He Lifeng, running September 19–23; Fed officials are also set to speak in force this week. With indexes flat and large-caps broadly lower, which signal do you trust first?" },
  { ticker: "NVDA / AMD / AVGO / SOXL", title_cn: "费城半导体又涨近3%,谁在接棒?", body_cn: "半导体上周五继续走强,费城半导体指数涨近3%,但把个股摆到一起看,出力的换了人。AMD收涨2.70%报559.82美元,上一个交易日它涨了6.36%;英伟达收涨1.34%报222.27美元,上一个交易日是2.54%。比前一天涨得更多的只有博通,收涨2.97%报357.61美元,上一个交易日是2.29%。三倍做多半导体ETF(SOXL)收涨7.71%报123.67美元,它带三倍杠杆,涨跌幅会被放大,不能跟个股并排看。消息面并没有换,还是英伟达首席执行官那句“明年芯片销量将是今年的两倍”;一天过去,同一条消息能推动的幅度小了一圈,而且推的已经不是最初那几只。涨幅一天比一天小,这轮反攻还剩多少力气?", title_en: "Philadelphia Semi Index Gains Nearly 3% Again — Who's Leading Now?", body_en: "Semiconductors extended their rally Friday, with the Philadelphia Semiconductor Index up nearly 3%, but the drivers rotated. AMD rose 2.70% to $559.82, after gaining 6.36% the prior session; Nvidia added 1.34% to $222.27, following a 2.54% gain. Only Broadcom outpaced its prior-day move, rising 2.97% to $357.61 versus 2.29% previously. SOXL, the 3x leveraged semiconductor ETF, closed up 7.71% at $123.67; it carries triple leverage, so its swings are amplified and cannot be read alongside individual stocks. The catalyst remains Nvidia's CEO comment that chip sales next year will double this year's — but one day later, the same headline is moving markets less, and lifting different names. With gains shrinking by the day, how much momentum does this rally have left?" },
  { ticker: "SNDK / MU / SKHY / INTC", title_cn: "存储涨最猛的那只,靠的不是存储?", body_cn: "存储上周五继续涨,但涨幅最大的那只,理由跟存储价格没关系。闪迪收涨10.99%报1791.82美元,是当天存储里涨得最多的一只,推力是它被纳入标普100指数,周一生效,同一天耐克被调出这个指数。同板块其他几只差得远:美光收涨3.92%报1015.80美元,SK海力士收涨2.46%报187.50美元,英特尔收跌0.18%报108.60美元。同一个板块,涨幅从两位数一路排到负数,而最高的那一档是指数调整给的,不是需求或者价格给的。多头的抓手是进宽基指数会带来被动买盘,这部分钱不看估值也得买;空头的抓手是这种买盘是一次性的,买完就没有了,它不改变存储这门生意本身赚多少钱。存储这轮行情,还能当成一条线来看吗?", title_en: "The Top Memory Gainer Friday — Did It Rally on Memory at All?", body_en: "Memory stocks rose again Friday, but the biggest gainer had nothing to do with memory prices. SanDisk surged 10.99% to $1,791.82, the biggest gainer in the memory group, after being added to the S&P 100 effective Monday — the same day Nike was removed. Elsewhere in the sector, Micron gained 3.92% to $1,015.80, SK Hynix rose 2.46% to $187.50, and Intel edged down 0.18% to $108.60. Within one sector, gains ran from double digits down to negative, and the top tier came from an index adjustment rather than from demand or pricing. Bulls argue index inclusion drives passive buying regardless of valuation; bears counter that it's a one-time flow that changes nothing about memory sector fundamentals. Can memory still be traded as a single theme this cycle?" },
  { ticker: "MSTR / BTC.USD.CC", title_cn: "比特币没动,MSTR为何涨了16%?", body_cn: "上周五这两个价格走出了完全不同的方向。比特币报81428美元,基本没动,涨0.24%;以持有比特币为主业的Strategy(MSTR)收涨16.39%报153.92美元,盘中最高154.02美元,几乎收在当天最高位。币没涨,股票涨了16%,多出来的那部分不在币价上。多家美国财经媒体把这轮上涨追到上周一场众议院委员会的加密立法表决,以及代币化股票获批;Strategy创始人迈克尔·赛勒本人把CLARITY法案被否称作行业的“正向拐点”,并暗示公司还会继续买入比特币。把时间拉长,这只股票过去一个月已经涨了53%。多头的抓手是规则一旦落地,持币公司身上的折价会被重新算一遍;空头的抓手是币价一动没动,涨的全是对规则的预期,而那项法案本身是被否掉的。币没动,代理股涨了16%,多出来的这部分是什么?", title_en: "Bitcoin Barely Moved — So Why Did MSTR Surge 16%?", body_en: "The two assets diverged sharply on Friday. Bitcoin was nearly unchanged at $81,428, up just 0.24%, while Strategy (MSTR), whose core business is holding Bitcoin, surged 16.39% to close at $153.92 — nearly at its intraday high of $154.02. The coin did not move, the stock rose 16%, and that gap is not in the coin price. Multiple U.S. financial media outlets attributed the move to a House committee vote on crypto legislation and the approval of tokenized equities; Strategy founder Michael Saylor called the CLARITY Act's defeat a 'positive inflection point' for the industry and signaled continued Bitcoin purchases. The stock has now risen 53% over the past month. Bulls argue clearer regulation will reprice the discount on Bitcoin-holding companies; bears note the coin itself didn't move and the headline legislation was rejected. Bitcoin was flat while its proxy stock gained 16% — what exactly is that premium pricing in?" },
  { ticker: "RKLB / SPCX", title_cn: "航天股一起回吐,涨的理由还在吗?", body_cn: "航天上周五集体走弱,火箭实验室收跌4.79%报64.57美元,是这条线上跌得最多的一只;SpaceX收跌1.36%报152.71美元。回吐的不止这两只,同一天AST SpaceMobile跌6%、Planet Labs跌4%,整个板块一起往回走。火箭实验室这边,上一个交易日它还涨了6.47%,手上是两条摆得出来的进展:与铱星通信的交易通过了美国联邦通信委员会的第一道审批,19.4亿美元的股票增发也已完成。摊薄当天没有反映在股价上,隔了一个交易日开始反映。把时间拉长看,这只股票今年以来下跌7.44%,同期标普500上涨11.76%。多头的抓手是审批和资金两件事都往前迈了一步,进度是实的;空头的抓手是进度按年兑现,摊薄却是当场发生的。进度按年兑现,摊薄当场发生,这类公司的好消息该怎么定价?", title_en: "Space Stocks Give Back Gains — Is the Thesis Still Intact?", body_en: "Space stocks retreated broadly on Friday. Rocket Lab fell 4.79% to $64.57, the steepest decline among the space names, while SpaceX declined 1.36% to $152.71; AST SpaceMobile and Planet Labs lost 6% and 4%, respectively. Rocket Lab had rallied 6.47% the prior session on two concrete developments: first-round FCC approval of its Iridium deal and completion of a $1.94 billion equity offering — dilution that was not immediately priced in but began to be reflected a session later. Year-to-date, the stock is down 7.44% versus an 11.76% gain for the S&P 500. Bulls point to two concrete steps forward, one regulatory and one financial; bears note dilution is immediate while milestones pay out over years. When progress is measured in years but dilution hits today, how should good news from these companies be valued?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
