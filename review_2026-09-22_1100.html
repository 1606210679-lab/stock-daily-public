<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-09-22 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-09-22</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 5</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:20.0%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 5 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ", title_cn: "油价和收益率双双回落,纳指新高站得住吗?", body_cn: "纳指100ETF(QQQ)周一收涨2.88%报741.47美元,纳斯达克综合指数收涨2.3%,创下历史新高,这也是6月以来的第一个新高;标普500指数收涨1.49%报7764.70点,距离上月的纪录还差0.4%,道琼斯工业平均指数只收涨0.7%。推动这一天的不是哪一家公司的消息,而是上周压着市场的两样东西同时松了:原油价格回落,美债收益率走低,上周那轮把市场搅得不安的上行,这一天退了回去。多头的抓手是这两项压力一起退,对高估值的科技股来说就是实打实的空间,而且这一天并没有出现新的收紧信号;空头的抓手是涨幅的分布很不均匀,纳指涨2.3%的同一天道指只涨0.7%,把指数抬起来的是AI相关的少数几个板块,不是全面普涨,这条叙事一旦松动,指数就没有别的支点。这个新高是被一条主线抬上去的,你觉得它的含金量够不够?", title_en: "Nasdaq's First Record Since June — Can One Sector Carry an Index?", body_en: "The Nasdaq 100 ETF (QQQ) rose 2.88% to $741.47 Monday, while the Nasdaq Composite gained 2.3% to mark its first record high since June; the S&P 500 advanced 1.49% to 7,764.70, within 0.4% of last month's all-time high, while the Dow added just 0.7%. The rally was driven not by any single company but by the simultaneous retreat of two headwinds that had weighed on markets last week — crude oil prices and Treasury yields. Bulls cite the removal of two valuation overhangs as genuine relief for high-multiple tech stocks, and note the rally came without any further tightening in rates; bears note the gains were narrowly concentrated in AI-related sectors, with the Nasdaq up 2.3% versus the Dow's 0.7% — this was not a broad advance, and if that one narrative loosens the index has nothing else holding it up. If oil and yields turn back up next week, does any of this hold?" },
  { ticker: "ARM / INTC / AMD / NVDA / AVGO", title_cn: "Arm单日收涨17%,AI需求从GPU挪到CPU了吗?", body_cn: "Arm周一收涨17.16%报322.90美元,是纳指100成分股里当天涨得最多的一只;英特尔收涨12.14%报121.78美元,AMD收涨9.95%报615.52美元,收盘市值第一次站上1万亿美元;费城半导体指数当天涨4.3%,连续第五个交易日收涨。触发点是Meta的AI助手Muse登上美区App Store免费榜第一,市场顺着它把AI的需求形态往前推了一格:从被动的对话问答,走到能自己执行任务的代理,后者更吃服务器CPU和边缘侧的通用算力,而不只是GPU。供给侧当天也有一个注脚,英特尔首席执行官陈立武说公司目前只能满足客户约一半的需求;Piper Sandler同日以增持评级启动对Arm的覆盖,目标价320美元。对照着看,市值最大的两只反而落在后面,英伟达收涨2.30%报227.38美元,博通收涨1.60%报362.66美元。多头的抓手是代理类应用真铺开,CPU这一侧的采购会跟着走,这部分过去两年一直被GPU盖住;空头的抓手是这一整天没有任何一家芯片公司发过公告,重新定价的依据是一个消费类应用在App Store上的排名,而这个位置几天就能换人。同一条AI主线上,一侧涨两位数、一侧只涨两个点,这种分化你认为撑得住多久?", title_en: "Arm Leads the Nasdaq 100 — Is the CPU Side Finally Getting Paid?", body_en: "Arm jumped 17.16% to $322.90 Monday, leading the Nasdaq 100, while Intel surged 12.14% to $121.78 and AMD gained 9.95% to $615.52, crossing a $1 trillion market cap for the first time; the Philadelphia Semiconductor Index rose 4.3% for its fifth consecutive up day. The catalyst was Meta's AI assistant Muse topping the U.S. App Store free chart, prompting markets to reprice AI demand toward agentic applications — which are more CPU- and edge-compute-intensive than GPU-dependent — while Intel's CEO said the company can currently meet only about half of customer demand, and Piper Sandler initiated Arm at Overweight with a $320 price target. By contrast, the two largest names lagged: Nvidia rose just 2.30% to $227.38 and Broadcom gained 1.60% to $362.66. Bulls argue that once agentic applications roll out at scale, CPU-side purchasing follows, and that this part of the bill has spent the past two years in the shadow of GPUs; bears note that not a single chip company issued an announcement all day, that the repricing rests on where a consumer app sits in the App Store, and that such a position can change hands within days. So does an app's chart position justify repricing the whole complex?" },
  { ticker: "SNDK / MU / SKHY", title_cn: "闪迪进标普100首日收跌,存储的推力换了吗?", body_cn: "闪迪周一收跌1.41%报1766.64美元,是存储这一批里唯一下跌的一只。时间点很清楚:标普100指数这次成分调整从周一起生效,而生效前的最后一个交易日它收涨10.99%,跟踪这只指数的基金已经在那天把仓位换完,生效当天没有新的买盘接上。同一天板块里其余两只还是涨的,美光收涨2.77%报1043.96美元,重新站上1000美元,SK海力士收涨0.73%报188.86美元。多头的抓手是基本面这一侧没有跟着变,HBM这类高带宽存储的供给仍然偏紧,有报道称订单已经排到2027年,美光的客户还在排队;空头的抓手是靠指数事件推上去的那一段涨幅没有盈利做支撑,事件走完之后价格得重新找依据,而闪迪现在的位置并不低。靠一次性事件推起来的涨幅,你觉得该不该算进一只股票的合理价格里?", title_en: "SanDisk Slips While Memory Climbs — Who Has It Right?", body_en: "SanDisk fell 1.41% to $1,766.64 Monday, the only decliner among memory stocks on the day its inclusion in the S&P 100 took effect; tracking funds had already rebalanced on the final session before the change, when SanDisk rose 10.99%, leaving no incremental buying on effective date. Micron gained 2.77% to $1,043.96, reclaiming the $1,000 level, while SK Hynix rose 0.73% to $188.86. Bulls point to unchanged fundamentals — HBM supply remains constrained with orders reportedly booked into 2027 and Micron's customer queue intact; bears argue the index-event-driven gains lacked earnings support, that the price has to find a fresh basis now the event is done, and that SanDisk's current level is not cheap. Now that the index bid is gone, what carries memory stocks from here?" },
  { ticker: "MRVL / NBIS", title_cn: "Marvell放出2纳米光互连,AI基建谁在被加码?", body_cn: "Marvell周一收涨5.38%报257.38美元,当天它在欧洲光通信展(ECOC)上放出38项技术演示,其中包括业内第一个2纳米的光互连方案,目标是把AI数据中心的网络从1.6T往3.2T推。这件事指向算力之外的另一堵墙:芯片本身的算力还在往上加,但把这些芯片连起来的带宽和功耗已经接近极限。同一条链的另一头是另一种判断,Nebius周一收涨4.14%报232.80美元,但罗斯柴尔德雷德伯恩当天以“卖出”评级启动了对它和CoreWeave的覆盖,理由是GPU租赁价格在下行、超大厂自建产能在增加、融资成本又偏高,三件事一起压缩租算力这门生意的回报。多头的抓手是互连、供电这类配套环节的支出跟着算力一起长,而且多是长约、可见度高的那一类;空头的抓手是展会上的演示离客户的采购清单还隔着很长一段,当天定价的是预期不是订单,而租算力那一侧已经有人在算回报账了。同样是AI基建,钱正在往链条上不同的位置挪,你觉得哪一段的定价最容易出错?", title_en: "Bandwidth, Not Compute — Where Does the AI Money Go Next?", body_en: "Marvell rose 5.38% to $257.38 Monday after showcasing 38 technology demonstrations at ECOC, including what it says is the industry's first 2nm optical interconnect solution, targeting a bandwidth upgrade from 1.6T to 3.2T for AI data center networks. The announcement highlights an emerging bottleneck beyond compute: the bandwidth and power required to connect AI chips are approaching their limits even as chip performance keeps rising. Elsewhere on the AI infrastructure chain, Nebius gained 4.14% to $232.80, though Rothschild Redburn initiated both Nebius and CoreWeave at Sell, citing falling GPU rental prices, hyperscaler in-house capacity buildout, and elevated financing costs, which together compress the returns on renting out compute. Bulls argue that spending on interconnect and power scales with compute itself and tends to come under long contracts with better visibility; bears note that a conference demo is a long way from a customer purchase order, that Monday's move priced expectations rather than orders, and that on the rental side someone is already running the returns maths. Does spending on interconnect and power really scale in step with compute?" },
  { ticker: "META", title_cn: "Muse登顶免费榜,Meta单日涨11%能接上吗?", body_cn: "Meta周一收涨11.43%报741.25美元,是2025年4月以来最好的一天。推力来自它9月8日上线的AI助手Muse:这款应用把ChatGPT挤下去,登上美区App Store免费榜第一,Sensor Tower的统计是上线两周下载量约250万次;富国银行同日把目标价上调到796美元,公司的年度大会Connect也在本周。多头的抓手是市场过去一年怀疑的正是Meta在消费端还能不能做出被真正用起来的产品,Muse是一个直接的反证,而撑起它的模型,跟广告、推荐这些现金流业务用的是同一套基础设施;空头的抓手是从下载量到收入之间隔着一整段路,免费榜的名次几天就能换人,公司高管自己也承认这款产品“深受OpenClaw启发”,年度大会如果拿不出新东西,这一天的涨幅就没有接续。一个免费应用的下载榜名次,你会把它算进这家公司的估值里吗?", title_en: "Meta's Best Day Since April 2025 — Does One App Change the Story?", body_en: "Meta surged 11.43% to $741.25 Monday, its best session since April 2025, driven by its AI assistant Muse — launched September 8 — displacing ChatGPT to reach No. 1 on the U.S. App Store free chart with approximately 2.5 million downloads in its first two weeks, per Sensor Tower; Wells Fargo raised its price target to $796 on the same day, with the company's annual Connect conference also scheduled this week. Bulls argue Muse directly counters long-standing skepticism about Meta's ability to build consumer AI products with genuine traction, underpinned by the same infrastructure serving its advertising and recommendation businesses; bears note the gap between downloads and revenue, the transience of App Store rankings, an executive's own admission that the product is 'heavily inspired' by OpenClaw, and the risk that Connect disappoints — what would it take to turn Muse's downloads into revenue?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
