<script>
const topics = [
  { ticker: ".SPX / SPY", title_cn: "财长把回购单次规模翻倍,债市为何还是不给面子?", body_cn: "救市工具加码了,债市只买了半天账。财长贝森特周四表示,在把长端美债的单次回购规模从20亿美元提高到至少40亿美元之后,未来仍可能继续加码;这条消息先让30年期收益率一度回落近10个基点、美元指数走弱,但债市随后再度承压——财政赤字、通胀与期限溢价这三条根本担忧,回购一分钱也解决不了,它只处理流动性。股指因此掉头:标普500收跌0.87%(标普500ETF跌0.84%),道指收跌1.32%、约600点,而砸盘的不是利率而是沃尔玛给出的消费信号。真正的定价窗口在下周:8月27日至29日的杰克逊霍尔全球央行年会,沃什将首度以主席身份登场,措辞偏鹰会重新推高美元与长端、继续压高估值科技,偏鸽则轮到小盘、地产与利率敏感资产。多头的理由是回购规模还有上调空间、且7月纪要显示多数委员并不急于加息;空头的理由是供给端一点没变,而消费数据刚刚开始转弱。你会继续押科技、换到利率敏感资产,还是等年会措辞落地?", title_en: "Treasury Doubles Buyback Size — Why Won't the Bond Market Cooperate?", body_en: "Treasury Secretary Bessent on Thursday doubled the maximum single-operation buyback size for long-dated Treasuries to at least $4 billion, signaling further increases ahead. The announcement briefly pulled 30-year yields down nearly 10 basis points and weakened the dollar, but bonds sold off again as buybacks address only liquidity — not the market's core concerns of fiscal deficits, inflation, and term premium. The S&P 500 fell 0.87%, the Dow shed roughly 600 points, and next week's Jackson Hole symposium — where Warsh makes his debut as Fed Chair — is the real pricing event: a hawkish tone would lift the dollar and long-end yields, pressuring high-valuation tech, while a dovish tone would rotate favor toward small-caps, real estate, and rate-sensitive assets. Will you stay long tech, rotate into rate-sensitive assets, or wait for Warsh's remarks to land?" },
  { ticker: "WMT", title_cn: "沃尔玛超预期又上调指引,却创下多年最差单日?", body_cn: "周三那份前瞻问的是\"1,888亿美元里看不看得出消费降级\",周四的答案是看得出。沃尔玛营收增长5.9%(按固定汇率5.1%)、每股收益超预期约9.4%、全年指引还上调了,但股价收跌9.15%,是它多年来最差的单日表现。市场只盯住两个数:美国同店销售增速是六年来最慢,以及下一季调整后每股收益指引0.62至0.64美元,低于0.68美元的共识。管理层的解释里藏着更值得注意的一条——它把29亿美元的关税退款直接用于降价,也就是说这家最强的零售商选择用一次性收入去补贴价格,而不是留在利润表里,这通常意味着它看到的需求比财报数字更弱。多头的证据同样在同一份财报:电商销售增长24%,广告与会员这些高毛利业务仍在扩张,而处方药价格下行属于通缩性拖累,压的是销售额而不是需求。但另一半更难看:汽油价格是上行的,它同时挤压同店增速和顾客的钱包,公司自己给出的临界点是每加仑4美元——到了这个价,消费者就开始做取舍。传导已经开始,好市多当天收跌2.3%。你会把这次回调当防御股的入场点,跟着降价逻辑去买折扣渠道,还是先等下个季度的同店数据?", title_en: "Walmart Beats and Raises Guidance — Yet Posts Worst Single-Day Drop in Years?", body_en: "Walmart reported revenue growth of 5.9% (5.1% in constant currency) with EPS beating estimates by roughly 9.4% and full-year guidance raised, yet shares fell 9.15% — the stock's worst single-day performance in years. Markets focused on two figures: U.S. comparable-store sales growth at its slowest pace in six years, and next-quarter adjusted EPS guidance of $0.62–$0.64 versus the $0.68 consensus. Management's decision to deploy $2.9 billion in tariff refunds directly into price cuts — rather than letting them flow through to earnings — signals that underlying demand may be weaker than the headline numbers suggest, while a $4-per-gallon gasoline threshold was cited as the point at which consumers begin making trade-offs. Will you treat this pullback as an entry point for a defensive name, follow the price-cut logic into discount channels, or wait for next quarter's comparable-store data?" },
  { ticker: "TGT / LOW / TJX", title_cn: "关税退款撑起塔吉特净利翻倍,股价还是不涨?", body_cn: "零售放榜周结束,三份成绩单指向同一个结论:好数字撑不住估值。塔吉特二季度销售增长5.3%、超预期并再次上调全年指引,净利润同比大增100.8%,但这个涨幅的主要推手是9.94亿美元的关税退款,而不是经营改善,新任CEO主推的品类与门店改造只是刚见起色,股价周四仍收跌0.47%。劳氏的管理层直接把话说白了,CEO点名消费者支出压力值得警惕,股价收跌1.21%——它还额外背着一层利率账,按揭利率跟着长端上行,装修需求最先被推迟。TJX最有说服力:它被花旗下调评级,理由是核心Marmaxx的同店表现不佳,说明\"折扣零售在消费降级里天然受益\"这个假设并不成立,股价收跌2.64%。周三我把它列为三家里最被看好的一家,现在要更正这个判断的依据。三家的共同点是关税退款这类一次性收入正在美化利润,而同店增速在同步走弱。你会等一次性收入退潮后的真实毛利,买改造见效的塔吉特,还是干脆离开零售?", title_en: "Tariff Refund Doubles Target's Net Profit — Stock Still Won't Rally?", body_en: "Target reported second-quarter sales growth of 5.3%, beat estimates, and raised its full-year outlook, with net profit surging 100.8% year-over-year — but the primary driver was a $994 million tariff refund rather than operational improvement, and shares still closed down 0.47%. Lowe's CEO explicitly flagged consumer spending pressure as a concern, sending shares down 1.21%, with rising mortgage rates adding a second headwind as home-improvement demand is the first to be deferred. TJX, flagged as the most favored of the three in Wednesday's preview, was downgraded by Citi citing weak core Marmaxx comparable-store performance — disproving the assumption that discount retail automatically benefits from consumer trade-down — and fell 2.64%. All three retailers share a common thread: one-time tariff refunds are flattering earnings while underlying comparable-store growth weakens in parallel. Will you wait for true gross margins once the one-time income fades, buy Target on its store-renovation progress, or exit retail altogether?" },
  { ticker: "BABA / 09988", title_cn: "阿里云外部收入连涨到22季新高,利润却被砸掉四分之三?", body_cn: "阿里巴巴2027财年第一财季交出了这轮AI周期里最典型的一份账:营收2,689.53亿元、同比增长9%,略高于2,685.17亿元的市场预期;而利润是两个口径都要看的地方——经调整净利润207.15亿元、同比下滑38%,按GAAP口径的净利润同比降幅约75%,只给出经调整那个数就会严重低估这一季的失血程度。钱去哪了写得很清楚:本季资本开支676.78亿元、同比大增75%,几乎全部投向AI基础设施。换来的东西也是实的:阿里云外部商业化收入同比增长45%、创下22个季度新高,AI相关产品收入连续12个季度维持三位数增长,AI云的年化收入规模达到约495亿元。市场的分歧就落在这个交换比上——美股周四收涨1.26%,港股周四收跌0.79%,资金一边承认云在加速,一边不确定这个投入强度要持续几个季度。CEO的表述是公司在AI浪潮里处于优势位置。你会按云业务给它重估、等资本开支见顶,还是先看下一季的利润率能不能止跌?", title_en: "Alibaba Cloud External Revenue Hits 22-Quarter High — But Profit Drops 75%?", body_en: "Alibaba's fiscal first quarter delivered one of the most representative AI-cycle results to date: revenue of 268.953 billion yuan, up 9% year-over-year and slightly above the 268.517 billion yuan consensus, while the profit picture requires both earnings measures — adjusted net income fell 38% to 20.715 billion yuan, but GAAP net profit dropped approximately 75%, meaning reporting only the adjusted figure would substantially understate the quarter's cash burn. Capital expenditure surged 75% year-over-year to 67.678 billion yuan, almost entirely directed at AI infrastructure, in exchange for Alibaba Cloud external revenue rising 45% to a 22-quarter high, AI-related product revenue sustaining triple-digit growth for 12 consecutive quarters, and AI cloud annualized revenue reaching approximately 49.5 billion yuan. U.S.-listed shares gained 1.26% Thursday while Hong Kong shares fell 0.79%, reflecting investors simultaneously acknowledging cloud acceleration and questioning how many more quarters of this investment intensity lie ahead. Will you re-rate the stock on cloud momentum, wait for capex to peak, or first watch whether next quarter's margins can find a floor?" },
  { ticker: "AMZN / SPCX", title_cn: "Anthropic传冲刺最大IPO,普通人只能借道亚马逊?", body_cn: "AI一级市场的下一颗大瓜正在往公开市场靠。据报道,Claude的母公司Anthropic正筹备一次目标为史上最大规模的IPO,同期两条更具体的进展可以交叉验证:有报道称它已在为创始人安排超级投票权结构,以及IPO前的信贷额度规模将超过100亿美元。必须说清楚的是,发行时间与估值目前都没有公开确认——它尚未出现在公开的新股日历上,市面流传的具体上市窗口与估值数字都还没有第二来源,不宜当成既定事实。可对照的样本是SpaceX:6月12日以135美元发行、市值约1.77万亿美元,而周四它收跌4.05%至134美元、跌回发行价下方,原因是第二批解禁释放了约3.19亿股。这提醒的是同一件事——超级IPO的定价高峰往往在上市那一刻,解禁才是真正的考验。想间接参与的人通常看向亚马逊,它既是Anthropic的投资方也是其云与训练伙伴,但它周四收跌2.16%,当天恰好有报道在质疑其534亿美元AI投资收益的质量,这类账面收益随估值波动、并不等于现金流。你会用亚马逊做替代、等Anthropic正式上市,还是从SpaceX的解禁节奏里先学一课?", title_en: "Anthropic Reportedly Targets Largest-Ever IPO — Can Retail Only Access It Through Amazon?", body_en: "Anthropic, the parent of Claude, is reportedly preparing what it aims to be the largest IPO in history, with corroborating reports citing a supervoting share structure for its founders and a pre-IPO credit facility exceeding $10 billion. Timing and valuation remain publicly unconfirmed — the company has not appeared on any public IPO calendar, and specific listing window and valuation figures circulating in the market lack independent verification and should not be treated as established fact. A comparable reference is SpaceX, which priced at $135 in June at a roughly $1.77 trillion valuation before falling 4.05% Thursday to $134 — back below its issue price — as a second lockup expiry released approximately 319 million shares, a reminder that the pricing peak for mega-IPOs often occurs at listing and that lockup expirations are the real test. Investors seeking indirect exposure typically look to Amazon, both an investor in and cloud and training partner to Anthropic, though Amazon fell 2.16% Thursday amid reports questioning the quality of returns on its $53.4 billion in AI investments — paper gains tied to private valuations are not cash flow. Will you use Amazon as a proxy, wait for Anthropic's formal listing, or take a lesson first from SpaceX's lockup timeline?" },
  { ticker: "MRNA", title_cn: "前一天涨177%后一天跌23%,轧空行情该怎么接?", body_cn: "Moderna周四收跌23.55%至133.32美元,盘后再跌2.76%,而它前一天刚涨了176.97%。两天连起来看才是完整的一课:周三那根涨幅里有很大一部分不是估值重估而是机制——多家报道把它称作一次历史级的轧空,市场原本的持仓方向和数据结果完全相反,空头被迫平仓推着股价走。当强制买盘走完,获利了结立刻接管,同时开始有人质疑数据是否被过度炒作:三期结果只公布了顶线,完整数据集尚未披露,而从\"终点达标\"到\"定价、产能与实际销量\"之间还有很长的路。卖方的动作反而说明了尺度:威廉布莱尔与美银在这两天上调评级、目标价上调至170美元附近,但那是把它从\"跑输\"移到\"中性\",不是看多。基本面也没变:公司近12个月营收22.3亿美元、同比下滑27.6%,2025年亏损28.2亿美元。而周四大盘本身也不好,债市抛售把道指砸了600点。你会在回撤后建仓、换到分成确定的默沙东,还是等完整数据公布再说?", title_en: "Up 177% One Day, Down 23% the Next — How Do You Trade a Short Squeeze?", body_en: "Moderna closed down 23.55% Thursday at $133.32, with shares falling a further 2.76% after hours, one session after surging 176.97%. The two-day sequence illustrates the mechanics of a historic short squeeze: the Wednesday spike was driven largely by forced short covering as positioning was caught entirely on the wrong side of the data, and once the mandatory buying exhausted itself, profit-taking took over alongside questions about whether the results were over-hyped — only top-line Phase 3 data has been released, with the full dataset still pending and a long road remaining between endpoint achievement and actual pricing, capacity, and sales volumes. The magnitude of sell-side moves underscores the calibration: both William Blair and BofA upgraded the stock to neutral with price targets near $170 over the two days — moves from underperform to neutral, not bullish calls. Fundamentals are unchanged: trailing twelve-month revenue of $2.23 billion is down 27.6% year-over-year and the company posted a 2025 loss of $2.82 billion. Will you buy the pullback, rotate into Merck for more certain royalty exposure, or wait for the full data release?" },
  { ticker: "SKHY / MU / SNDK / 07709 / SNXX / SNDQ", title_cn: "分红承诺一出,存储链周四集体反攻还追不追?", body_cn: "被砍了两天的存储链周四全线反攻:SK海力士收涨4.43%,美光收涨3.97%,闪迪收涨2.02%,海力士2倍杠杆产品07709周四收涨7.17%,闪迪2倍做多ETF(SNXX)涨3.84%、2倍做空ETF(SNDQ)跌4.46%,杠杆工具连续两天的减仓方向第一次被扭转。反攻的理由不是需求数据而是股东回报:海力士40万亿韩元(约286亿美元)的回购刚落地,三星据报道计划公布总额超100万亿韩元、把50%自由现金流用于股东回报的方案,AI带来的现金流第一次被明确承诺分给股东。第二条支撑是价格,有报道称AI需求正把芯片价格推高最多15%,而台积电在AI产能上的瓶颈给了三星提价空间。空方的理由没变,而且这一轮反弹恰好放大了它:方舟的伍德本周两次公开表示要避开存储股;更实际的风险是下游,同一周小米的利润被存储成本咬掉42.6%、英特尔的GPU价格被顶高48%,涨价能走多远取决于终端还能吃下多少。你会为分红买海力士与三星,追弹性更大的美光与闪迪,还是等下游的接受度先给出答案?", title_en: "Shareholder Return Pledges Spark Memory-Chain Rebound Thursday — Chase It?", body_en: "After two days of heavy selling, memory stocks rebounded across the board Thursday: SK Hynix gained 4.43%, Micron rose 3.97%, SanDisk advanced 2.02%, the 2x Hynix leveraged product 07709 gained 7.17%, the SanDisk 2x long ETF (SNXX) rose 3.84%, and the 2x inverse ETF (SNDQ) fell 4.46% — the first session in two days where leveraged-product flows reversed their de-risking direction. The catalyst was shareholder returns rather than demand data: SK Hynix's 40 trillion won (approximately $28.6 billion) buyback has been confirmed, and Samsung is reportedly planning a program exceeding 100 trillion won total, committing 50% of free cash flow to shareholders — the first explicit pledge to distribute AI-driven cash flows. A secondary support is pricing, with reports that AI demand is pushing chip prices up as much as 15% and TSMC's AI capacity constraints giving Samsung room to raise prices. The bear case is unchanged and arguably reinforced by the rebound: Ark's Wood publicly stated twice this week she is avoiding memory stocks; more concretely, Xiaomi's profit was hit by memory costs equivalent to 42.6% of earnings and Intel's GPU prices have been pushed up 48%, raising questions about how much more downstream buyers can absorb. Will you buy Hynix and Samsung for the dividend story, chase Micron and SanDisk for greater upside torque, or wait for downstream acceptance to provide confirmation?" },
  { ticker: "WOLF", title_cn: "AI机房收入翻倍了,Wolfspeed还是被砸9.4%?", body_cn: "周三前瞻里我给它的问题是\"数据中心订单能不能在收入里看见\",答案是能看见,但不够。Wolfspeed财年第四季营收1.496亿美元,基本符合1.5亿美元的预期,公司口径里AI数据中心收入同比增长一倍以上,第五代碳化硅产品也已发布;可每股亏损2.81美元,远差于预期的亏损1.47美元,毛利率仍为负,原因是产能利用率不足——它建好的产线还没有足够订单去摊薄折旧。下一季指引同样没有拐点:营收1.4亿至1.6亿美元,非GAAP毛利率预计仍是负值。所以股价的反应分成两段:财报当晚先涨2%到29.80美元,第二天收跌9.42%至26.35美元,市场用一夜时间读懂了\"新叙事的收入增速很高、但基数太小\"。多头能抓的只有两件事:手上还有11亿美元现金、净债务下降,以及与光宝在800伏直流电源上的认证和与通用电气航空航天的高压碳化硅合作;空头的抓手是覆盖它的两位卖方都给卖出、目标价30美元,而它2025年刚经历过破产重整。你会赌产能利用率的拐点、换到已经有AI收入的电源链龙头,还是彻底避开这类负毛利的转型股?", title_en: "AI Data Center Revenue Doubles at Wolfspeed — Stock Still Falls 9.4%?", body_en: "Wolfspeed's fiscal fourth quarter revenue of $149.6 million came in roughly in line with the $150 million consensus, and management reported that AI data center revenue more than doubled year-over-year with its fifth-generation silicon carbide products launched — but EPS loss of $2.81 far exceeded the expected loss of $1.47, gross margin remained negative due to insufficient capacity utilization, and next-quarter guidance of $140–$160 million revenue with non-GAAP gross margin still projected negative offered no inflection point. The market's two-stage reaction reflected a single night of closer reading: shares initially rose 2% to $29.80 on earnings night before closing down 9.42% at $26.35 the following day, as investors concluded that the new AI narrative carries high growth rates on an extremely small base. Bulls can point to $1.1 billion in cash on hand, declining net debt, a certification with Lite-On on 800V DC power supplies, and a high-voltage silicon carbide partnership with GE Aerospace; bears note that both sell-side analysts covering the stock rate it a sell with a $30 price target, and that the company completed a bankruptcy reorganization in 2025. Will you bet on a capacity utilization inflection, rotate into power-chain leaders already generating AI revenue, or avoid negative-gross-margin turnaround stories entirely?" },
  { ticker: "NTES", title_cn: "游戏收入涨15%还派息回购,网易为何收跌5.9%?", body_cn: "网易那个\"12倍前瞻市盈率是便宜还是没增长\"的问题,周四给出了第三种答案:有增长,但利润被别的东西吃掉了。二季度营收45亿美元、同比增长15%并超出预期,游戏业务的增长和利润率都在改善;但非GAAP每股收益1.79美元、同比下滑13%,比预期低约22.6%,差在两处——投资损失,以及研发费用上升。公司同时宣布每份ADS派息0.48美元并授权23亿美元回购,这种\"收入好、利润差、现金分给你\"的组合本该是防守型资产的标准配置,股价却收跌5.85%,说明市场在这轮利率与消费双重收缩里,对\"利润为什么变差\"的容忍度极低。多头的抓手是估值与股东回报:低倍数加回购加派息,加上游戏流水的稳定性;空头的抓手是投资损失与研发投入都不是一次性的,如果这两项持续,低倍数就不是错杀。同一天旗下网易云音乐与有道也交了卷。你会为股东回报买入网易、等下一季利润率修复,还是换到弹性更大的腾讯?", title_en: "NetEase Gaming Revenue Up 15% With Dividend and Buyback — Why Did It Fall 5.9%?", body_en: "NetEase's second quarter answered the question of whether its 12x forward P/E reflected cheapness or a lack of growth with a third option: growth exists, but profit is being eroded elsewhere. Revenue of $4.5 billion rose 15% year-over-year and beat estimates, with gaming revenue growth and margins both improving, but non-GAAP EPS of $1.79 fell 13% year-over-year and missed consensus by approximately 22.6%, dragged down by investment losses and higher R&D expenses. The company simultaneously declared a dividend of $0.48 per ADS and authorized a $2.3 billion buyback — a combination of strong revenue, weak profit, and cash returned to shareholders that should characterize a classic defensive asset — yet shares fell 5.85%, indicating the market has near-zero tolerance for profit deterioration amid simultaneous rate and consumption headwinds. Bulls point to the low valuation, shareholder returns, and the resilience of gaming transaction volumes; bears note that neither investment losses nor rising R&D are one-time items, meaning a low multiple is not necessarily unwarranted if both persist. Will you buy NetEase for its shareholder returns and await margin recovery, or rotate into Tencent for greater upside?" },
  { ticker: "09992", title_cn: "拉布布之后还没找到第二个,泡泡玛特创52周新低?", body_cn: "拉布布之外的第二条腿,暂时还是没长出来。泡泡玛特周四盘后发布上半年业绩,周五早盘直接跳空低开至141.10港元,盘中最低140.10港元创下52周新低,盘中跌幅一度超过4.5%,过去一年累计跌约53.6%。业绩的核心不是亏了,而是失速:有报道指出它的增长在2026年上半年急剧减速,公司仍在寻找下一个能撑起量级的角色形象。这就是它估值折价的全部来源——去年年报显示拉布布所在的系列约占总营收40%,单一IP的周期一旦过峰,再高的历史增速也没法外推;它近12个月的营收仍同比增长80.8%、净利润增长95.3%,而市值同期跌了46%,增速与股价的背离本身就是市场对\"这批增速不可持续\"的投票。多头的抓手是海外与新品类:新加坡圣淘沙的新店和首家海外烘焙店把IP的变现方式从盲盒往门店与餐饮延伸,27家卖方仍给买入、目标204.76港元;空头的抓手是第二个IP还没被验证。你会赌海外接棒、等下一个角色出圈,还是把它当已经过峰的周期股?", title_en: "Nothing After Labubu Yet — Is Pop Mart Hitting a 52-Week Low?", body_en: "Pop Mart's second leg of growth has yet to materialize. The company released its first-half results after Thursday's close, and Hong Kong shares opened sharply lower Friday at HK$141.10, hitting an intraday low of HK$140.10 — a 52-week low — with declines exceeding 4.5% at their worst, bringing the cumulative one-year decline to approximately 53.6%. The core issue is not a loss but a deceleration: reports indicate growth slowed sharply in the first half of 2026, with the company still searching for a character IP capable of replicating Labubu's scale — the series that accounted for approximately 40% of total revenue per last year's annual report, meaning a single IP past its peak renders historical growth rates non-extrapolatable. Trailing twelve-month revenue still grew 80.8% and net profit 95.3% year-over-year, yet market capitalization fell roughly 46% over the same period — a divergence that reflects the market voting that this growth is unsustainable. Bulls point to overseas expansion and new formats, including a new Singapore Sentosa store and the first overseas bakery extending IP monetization beyond blind boxes, with 27 sell-side analysts maintaining buy ratings and a target of HK$204.76; bears note the second IP remains unproven. Will you bet on overseas markets carrying the baton, wait for the next character to break through, or treat Pop Mart as a cycle stock already past its peak?" },
  { ticker: "NVDA", title_cn: "下周就交卷,英伟达为何在债市砸盘里只跌0.3%?", body_cn: "英伟达周四收跌0.33%,在道指跌600点、标普跌0.87%的一天里几乎算是抗跌,而它下周三盘后就要交卷。抗跌的原因是筹码而不是消息:多家卖方在这两天维持看多、给出最高约30%的上行空间,机构对它仍属低配,而周四被砸最狠的是零售与刚炒过的医药,资金并没有从它身上撤。真正的变量都在下周:一是财报本身,市场已经把AI需求的强劲当成既定事实,标准被抬得很高,超预期的门槛比上一季更难;二是同一周的杰克逊霍尔年会,如果沃什的措辞把长端利率重新推上去,估值靠2027年之后现金流的公司会先被折价,英伟达是这类资产里权重最大的一只。行业侧还有一条要注意:代工与存储同步涨价,有报道称AI需求把芯片价格推高最多15%,而它既是买方也是卖方,成本能不能转出去会直接体现在毛利率上。你会在财报前加仓、等年会措辞和财报双落地,还是换到已经受益涨价的上游?", title_en: "Earnings Due Next Week — Why Did Nvidia Fall Only 0.3% in Thursday's Selloff?", body_en: "Nvidia closed down just 0.33% Thursday — effectively outperforming on a day the Dow fell 600 points and the S&P lost 0.87% — with quarterly results due after the close next Wednesday. The resilience reflects positioning rather than news: multiple sell-side firms reiterated bullish views over the past two days with upside targets as high as approximately 30%, institutional investors remain underweight the stock, and Thursday's sharpest selling was concentrated in retail and recently-run biotech rather than Nvidia. Two variables converge next week: the earnings report itself, where the bar is high as strong AI demand has been priced in as a given, making the beat threshold harder than last quarter; and the Jackson Hole symposium in the same week, where hawkish language from Warsh pushing long-end yields higher would first discount companies whose valuations depend on cash flows beyond 2027 — of which Nvidia carries the largest index weight. A supply-chain factor also warrants attention: simultaneous price increases across foundry and memory, with AI demand reportedly pushing chip prices up as much as 15%, mean Nvidia's ability to pass through higher input costs will be directly visible in gross margins. Will you add exposure ahead of earnings, wait for both the symposium and results to clear, or rotate into upstream suppliers already benefiting from the price increases?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
