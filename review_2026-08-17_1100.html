<script>
const topics = [
  { ticker: ".SPX / HD / TGT / WMT", title_cn: "周四凌晨FOMC纪要,标普新高能不能续航?", body_cn: "标普500指数上周一度创收盘新高,上周五因零售销售不及预期小幅回落0.17%至7785.76点,全周仍上涨约0.4%。CPI四项符合预期、PPI环比持平,叠加就业走弱,市场对9月加息的担忧继续缓和,利率期货显示维持利率不变的概率已升至约67%。本周宏观事件密集:房屋开工、工业产出、费城联储指数与8月PMI将陆续公布,重头戏是北京时间周四凌晨2点发布的7月FOMC会议纪要——上次会议虽维持利率在3.50%-3.75%不变,但有三位委员主张加息,纪要如何权衡通胀、油价与增长,会直接影响科技成长股的估值空间。同时零售三巨头全部盘前交卷:周二家得宝(预期每股收益4.8762美元、营收486.9亿),周三塔吉特(2.3095美元、263.2亿),周四沃尔玛(0.7493美元、1887.9亿),它们的同店销售与下半年指引决定\"通胀降温但需求不失速\"这个组合能否被证实。若纪要信号偏温和,你会继续押AI与半导体,转向金融与消费,还是等纪要落地再动?", title_en: "FOMC Minutes Due Thursday — Can S&P 500 All-Time High Hold?", body_en: "The S&P 500 briefly hit a closing record last week before slipping 0.17% to 7,785.76 on Friday after weaker-than-expected retail sales, still ending the week up roughly 0.4%. In-line CPI, flat PPI month-on-month, and softening jobs data have eased rate-hike fears, with futures now pricing a ~67% probability of no change. This week brings housing starts, industrial output, the Philly Fed index, and August PMI, but the main event is the July FOMC minutes — released Thursday at 2 a.m. Beijing time — where three members dissented in favor of a hike at a meeting that held rates at 3.50%–3.75%; the minutes' tone on inflation, oil, and growth will directly shape valuations for tech and growth stocks. Three retail giants also report pre-market: Home Depot Tuesday (EPS est. $4.8762, revenue $48.69B), Target Wednesday ($2.3095, $26.32B), and Walmart Thursday ($0.7493, $188.79B), with same-store sales and second-half guidance serving as the key test of whether cooling inflation and resilient demand can coexist. If the minutes signal a dovish lean, will you stay in AI and semiconductors, rotate into financials and consumer, or wait for the release before acting?" },
  { ticker: "SNDK / MU / SKHY / WDC / DRAM", title_cn: "闪迪单周涨35%,产能被锁到2028了?", body_cn: "存储链的强度在上周达到今年最猛的一档:闪迪上周五涨7.39%,以收盘价计单周累涨约35%(上周一1212.21美元→上周五1641.11美元),周一夜盘再涨4.46%;美光涨2.30%、实现四连涨,四个交易日分别录得0.87%、4.92%、4.23%与2.30%;SK海力士涨0.40%、西部数据涨4.41%、存储ETF(DRAM)涨0.69%。最新催化已经不只是投资者日那份远期蓝图:公司披露已与8家客户签约,覆盖约半数2027财年及三分之二2028财年的产能,并计划明年向AI推理设备客户提供HBF(高带宽闪存)样品。AI推理带动的企业级SSD与NAND缓存需求,正与HBM、DRAM的供需紧平衡形成共振,这也是它敢给出80%毛利率目标的底气。空方两条同样具体:有分析测算日元若继续升值,会直接侵蚀那个80%的毛利率目标,因为其成本结构相当部分挂在日本产能上;德鲁肯米勒二季度13F则显示他清掉了美光。接下来的关键是订单与合约价能否兑现到毛利率。闪迪、美光、海力士、西部数据与日本的铠侠,你更看好谁?", title_en: "SanDisk Surges 35% in a Week — Is Capacity Locked Through 2028?", body_en: "The memory supply chain hit its strongest week of the year: SanDisk surged ~35% on a closing-price basis (Monday $1,212.21 → Friday $1,641.11), adding another 4.46% in after-hours Monday; Micron rose 2.30% for a four-session winning streak (daily gains of 0.87%, 4.92%, 4.23%, 2.30%); SK Hynix gained 0.40%, Western Digital 4.41%, and the DRAM ETF 0.69%. The latest catalyst goes beyond the Investor Day roadmap: the company disclosed signed agreements with eight customers covering roughly half of fiscal 2027 capacity and two-thirds of fiscal 2028, with HBF (High Bandwidth Flash) samples for AI inference customers planned for next year. Enterprise SSD and NAND cache demand driven by AI inference is resonating with the tight supply-demand balance in HBM and DRAM — the foundation for SanDisk's 80% gross margin target. Bear cases are equally specific: analysts warn yen appreciation would directly erode that 80% target given significant Japanese production exposure, while Druckenmiller's Q2 13F showed he exited Micron entirely. The real test is whether contract prices and order volumes translate to the margin line. Among SanDisk, Micron, SK Hynix, Western Digital, and Japan's Kioxia — which do you favor?" },
  { ticker: "AMD / AVGO", title_cn: "AMD涨6.5%博通跌5.9%,同一份13F拉开的?", body_cn: "上周五AI芯片内部出现罕见的反向分化:AMD大涨6.50%,博通却跌5.94%。同一个催化解释了两边——德鲁肯米勒的二季度13F显示他大举买入亚马逊与AMD,同时清掉了博通、英特尔与美光。这类持仓披露对二线龙头的边际影响远大于巨头,资金顺势把\"谁被聪明钱选中\"当成了短期定价依据。但博通的空方理由并不成立于业绩:有卖方直接称这轮由VMware业务引发的抛售是买入机会,认为定制ASIC与网络芯片的长期地位没有改变;AMD这边的反方声音则是它上一份财报营收不及预期、股价已从低点修复不少。当13F只是一个季度前的快照,追着它交易就有滞后风险。你更愿意跟着德鲁肯米勒买AMD、逆着他抄底博通,还是干脆不按13F做决策?", title_en: "AMD +6.5%, Broadcom -5.9% — All From the Same 13F?", body_en: "Last Friday saw a rare divergence within AI chips: AMD surged 6.50% while Broadcom fell 5.94%, both moves traced to the same catalyst — Druckenmiller's Q2 13F, which showed he aggressively added Amazon and AMD while exiting Broadcom, Intel, and Micron entirely. Such disclosures carry far greater marginal impact on second-tier leaders than on mega-caps, and markets quickly used \"smart money selection\" as a short-term pricing signal. The bear case for Broadcom, however, does not rest on fundamentals — one sell-side analyst called the VMware-driven selloff a buying opportunity, arguing the long-term position in custom ASICs and networking chips is unchanged; the counter-argument on AMD is that its last earnings missed on revenue and the stock has already recovered substantially from its lows. When a 13F is merely a snapshot from one quarter ago, trading it carries meaningful lag risk. Would you follow Druckenmiller into AMD, fade him by buying Broadcom, or avoid making decisions based on 13F filings altogether?" },
  { ticker: "AAOI / LITE / COHR", title_cn: "AAOI飙15.5%,激光短缺成了最好买的瓶颈?", body_cn: "光互连是上周五最强的分支:Applied Optoelectronics暴涨15.53%,Lumentum跟涨5.19%,Coherent微跌0.43%。核心逻辑被一份研报讲得很直白——AI的真实瓶颈已经从算力转到激光器供给,而这是\"最值得买入的瓶颈\";叠加此前那项拟禁止中国光模块与收发器的提案,国产替代与产能转移的想象被放大。反方证据同样具体:有知名空头公开认为\"商品化的瓶颈环节做不出好公司\",而Coherent刚刚给出双超预期的财报却在次日大跌7.99%,说明这条链的定价对价格弹性极度敏感;卖方内部的目标价也在分裂。当瓶颈叙事与商品化质疑同时成立,你更愿意买弹性最大的AAOI、规模更大的Lumentum,还是刚被杀过一轮的Coherent?", title_en: "AAOI Spikes 15.5% — Is the Laser Shortage the Best Bottleneck to Buy?", body_en: "Optical interconnects were Friday's strongest sub-sector: Applied Optoelectronics (AAOI) surged 15.53%, Lumentum gained 5.19%, and Coherent edged down 0.43%. A research note laid out the core thesis plainly — AI's real bottleneck has shifted from compute to laser supply, making it \"the best bottleneck to own\" — amplified by a proposed ban on Chinese optical modules and transceivers that has expanded the narrative around domestic substitution and capacity relocation. The bear case is equally concrete: a prominent short seller argues that \"commoditized bottleneck components don't make great companies,\" and Coherent's beat-and-raise earnings were followed by a 7.99% drop the next session, underscoring extreme price-elasticity sensitivity across the chain; sell-side price targets are also diverging sharply. With the bottleneck narrative and commoditization concerns both in play simultaneously, do you prefer the highest-beta AAOI, the larger-scale Lumentum, or Coherent after its sharp pullback?" },
  { ticker: "NBIS / CRWV", title_cn: "Nebius再涨8.9%,同一天被下调评级又被看多?", body_cn: "Nebius上周五再涨8.88%,把财报后的涨势拉长,而卖方给出的判断罕见地撕成两半:一派认为它的财报后动能\"有持续力\",并指出定价拐点已经改变了整条叙事;另一派则直接下调评级,理由是\"即便你错过了,也不要追\"。分歧的根源在于同一组数字——Q2营收5.82亿美元、同比增454%,调整后净亏损收窄至3320万美元,增速无可挑剔,但估值已经把未来几个季度的增长提前计入。同赛道的CoreWeave上周五微跌0.97%,它的看点转向能否把客户从AI原生公司拓展到传统企业,这决定订单的可持续性而不只是规模。当增速与估值同时到极值,你更愿意继续持有涨势更猛的Nebius、换到客户结构更分散的CoreWeave,还是等下一份财报再确认定价权?", title_en: "Nebius Gains Another 8.9% — Downgraded and Upgraded the Same Day?", body_en: "Nebius rose another 8.88% on Friday, extending its post-earnings rally, as sell-side opinion split sharply: one camp argued the post-earnings momentum \"has legs\" and flagged a pricing inflection that has changed the entire narrative, while another directly downgraded the stock, advising investors \"not to chase even if you missed it.\" The divide stems from the same set of numbers — quarterly revenue of $582 million, up 454% year-over-year, with adjusted net loss narrowing to $33.2 million — flawless growth, but a valuation that appears to have pulled forward several quarters of expansion. Sector peer CoreWeave slipped 0.97% Friday, with its focus shifting to whether it can expand its customer base beyond AI-native companies to traditional enterprises, which determines order sustainability rather than just scale. With both growth and valuation at extremes, do you hold the higher-momentum Nebius, rotate into CoreWeave's more diversified customer base, or wait for the next earnings report to confirm pricing power?" },
  { ticker: "SPCX", title_cn: "蒂尔申报持股5.5%,SpaceX股价为何没动?", body_cn: "SpaceX上周五微跌0.91%,但资金面出现一条重要披露:彼得·蒂尔与Founders Fund申报持有SpaceX约5.5%的股份。这是一家早期就深度参与马斯克体系的机构,它的仓位规模等于给公开市场一个锚——在史上最大规模IPO首轮解禁刚结束的时点上,大股东选择留在船上而不是减持,本身就是对解禁抛压的一种回答。但股价几乎没有反应,说明市场已经把机构持仓视为既有事实而非新增买盘。此前的分歧仍未解决:多头拿马斯克\"AI将在9月成为SpaceX最大业务\"的预判说事,空头则用财报后\"还有很长下跌空间\"和36倍远期市销率的估值陷阱回应。当大股东用行动表态、价格却不买账,你更信持仓还是更信估值?", title_en: "Thiel Files 5.5% SpaceX Stake — Why Didn't the Stock Move?", body_en: "SpaceX edged down 0.91% on Friday, but a significant ownership disclosure emerged: Peter Thiel and Founders Fund filed a roughly 5.5% stake in SpaceX. As an institution with deep early involvement in the Musk ecosystem, the position size provides a public-market anchor — at a moment when the first lock-up expiry following what would be the largest IPO in history has just concluded, a major shareholder choosing to stay rather than reduce is itself a statement on post-lockup selling pressure. Yet the stock barely reacted, suggesting the market already treats institutional holdings as established fact rather than new buying demand. Prior disagreements remain unresolved: bulls cite Musk's forecast that AI will become SpaceX's largest business by September, while bears counter with post-earnings commentary pointing to \"significant further downside\" and a valuation of 36x forward price-to-sales. When a major shareholder votes with their position but the price doesn't respond, do you trust the holding or the valuation?" },
  { ticker: "BABA / 1810 / BIDU / 1024", title_cn: "阿里小米齐放榜,AI投入开始变现了吗?", body_cn: "港股与中概科网本周进入财报密集窗口,四家的时间点各不相同:小米集团与百度预计周二放榜,快手将于周三港股盘后披露中期业绩,阿里巴巴则在周四美股盘前发布财报。盘面已经先动——小米今日港股盘中涨1.80%、快手涨0.25%;上周五美股这边,阿里涨1.35%、百度跌0.96%。市场要看的不只是营收和利润:阿里的焦点在AI云增长、资本开支规模以及淘宝闪购的投入效率;小米看汽车交付节奏、手机与AIoT毛利以及新业务的推进速度;百度看AI云、自动驾驶与广告三块的此消彼长;快手则聚焦广告、电商GMV与可灵AI的商业化进度。共同的问题只有一个:这批巨头能否同时验证\"AI投入开始变现\"与\"消费业务保持韧性\"。参考腾讯上一份财报的教训——营收增11%、经调整净利润增9%,却因资本开支升至527.8亿元、自由现金流转负而当日跌超3%,说明市场对烧钱的容忍度并不高。阿里、小米、百度、快手,你最期待谁的成绩单?", title_en: "Alibaba and Xiaomi Set to Report — Is AI Investment Finally Paying Off?", body_en: "Hong Kong-listed and U.S.-listed Chinese internet names enter a packed earnings window this week, with each company reporting on a different day: Xiaomi and Baidu are expected to report Tuesday, Kuaishou will release interim results after the Hong Kong close Wednesday, and Alibaba will report pre-market in the U.S. Thursday. Markets have already begun to move — Xiaomi gained 1.80% and Kuaishou 0.25% in Hong Kong intraday today; in U.S. trading last Friday, Alibaba rose 1.35% while Baidu fell 0.96%. Investors want more than revenue and profit: Alibaba's focus is AI cloud growth, capex scale, and the return on investment in Taobao Flash Purchase; Xiaomi's key metrics are EV delivery pace, smartphone and AIoT margins, and new business progress; Baidu's watch points are the shifting balance among AI cloud, autonomous driving, and advertising; and Kuaishou's spotlight falls on advertising, e-commerce GMV, and the monetization of its Kling AI model. The shared question is whether these giants can simultaneously prove that AI investment is converting to revenue while consumer businesses maintain resilience — a lesson underscored by Tencent's most recent earnings, where revenue grew 11% and adjusted net profit 9%, yet the stock fell over 3% on the day as capex climbed to $5.278 billion and free cash flow turned negative, signaling the market's low tolerance for heavy spending. Among Alibaba, Xiaomi, Baidu, and Kuaishou — whose results are you most eager to see?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
