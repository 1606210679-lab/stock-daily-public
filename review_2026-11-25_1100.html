<script>
const topics = [
  { ticker: "ANT", title_cn: "Anthropic破发，布局要等什么信号？", body_cn: "Anthropic（ANT）美股11月24日收跌6.54%，报81.91美元，上市第四个交易日正式收盘首次低于83美元发行价；同日QQQ跌1.99%，新股跌幅更深。公司首席执行官达里奥·阿莫代伊此前在首次公开发行中出售股份，相关申报于11月23日披露，并非24日新增的二级市场减持；把旧交易当作当天跌势的单一原因并不成立。多头看Claude的企业付费需求及后续收入增长，空头看算力开支、可流通筹码及上市初期的价格发现。跌破发行价改变了早期买入者的盈亏结构，但还不能单凭一个关口判断估值已便宜。若考虑分批布局，接下来成交是否稳定、锁定期安排和企业收入兑现，哪项最值得先确认？", title_en: "Anthropic breaks IPO price: what signal to wait for?", body_en: "Anthropic (ANT) fell 6.54% to $81.91 on Nov. 24, its first close below the $83 IPO price on its fourth trading day; QQQ lost 1.99% the same session, with the new listing falling harder. CEO Dario Amodei's share sale came in the IPO itself and was disclosed in a Nov. 23 filing, not a fresh Nov. 24 secondary sale, so it does not alone explain the drop. Bulls point to paid enterprise demand for Claude and future revenue growth; bears to compute spending, tradeable float and early price discovery. Which matters most to confirm before scaling in: stable volume, lock-up terms, or delivered enterprise revenue?" },
  { ticker: "NVDA", title_cn: "英伟达跌5.86%，国会质询会拖累修复吗？", body_cn: "英伟达（NVDA）美股11月24日收跌5.86%，回吐前一日因首席执行官黄仁勋复任而大涨31.48%的部分涨幅。众议院外交事务委员会民主党议员当天要求白宫提供与英伟达相关的往来资料，并呼吁让黄仁勋出席公开听证；参议院银行委员会已将他列为12月3日出口管制听证会证人。议员提出的利益冲突疑问是待调查的指控，并非公司违法的既成结论。多头看管理层重回原位能稳定产品路线及客户交付，空头看公司独立调查和国会监督仍会牵动治理折价。后续公开证词、调查结论及云厂采购，哪项更可能决定股价能否脱离政策和人事波动？", title_en: "Nvidia drops 5.86%: will congressional scrutiny stall the rebound?", body_en: "Nvidia (NVDA) fell 5.86% on Nov. 24, giving back part of the prior day's 31.48% surge tied to CEO Jensen Huang's return. House Foreign Affairs Committee Democrats asked the White House for Nvidia-related correspondence and called for Huang to testify publicly; the Senate Banking Committee has listed him as a witness at a Dec. 3 export-control hearing. Lawmakers' conflict-of-interest questions are allegations under review, not findings of wrongdoing. Bulls see management back in place steadying the product roadmap and deliveries; bears see internal probes and congressional oversight keeping a governance discount. Which will decide whether the stock can shake off policy and personnel swings: public testimony, investigation findings, or cloud capex?" },
  { ticker: "QQQ", title_cn: "QQQ跌1.99%，科技反弹为何只撑一天？", body_cn: "纳指100ETF（QQQ）美股11月24日收跌1.99%，前一日涨幅为7.00%；纳斯达克综合指数跌1.48%，标普500ETF（SPY）仅跌0.49%。英伟达和Anthropic分别跌5.86%及6.54%，显示周一的科技股急弹未能让AI龙头持续领涨，而大盘跌幅较小意味着压力并非均匀扩散。多头认为急涨后回吐仍可能是高波动中的价格消化，空头担心算力建设的融资成本和盈利兑现再次压制高估值板块。两天的涨跌还不能证明趋势已经反转。本周后续交易若QQQ持续弱于SPY，芯片、AI云和其他科技公司中谁能率先出现独立的盈利支撑？", title_en: "QQQ falls 1.99%: why did the tech bounce last a day?", body_en: "The Nasdaq 100 ETF (QQQ) fell 1.99% on Nov. 24 after a 7.00% gain the prior day; the Nasdaq Composite slipped 1.48% and the S&P 500 ETF (SPY) only 0.49%. Nvidia and Anthropic dropped 5.86% and 6.54%, showing Monday's sharp tech rally did not let AI leaders keep leading, while the broader market's smaller decline signals uneven pressure. Bulls call the pullback post-rally consolidation within high volatility; bears fear financing costs for compute build-outs and profit delivery will again weigh on richly valued sectors. Two sessions do not prove a trend reversal. If QQQ keeps lagging SPY this week, who among chip, AI cloud and other tech names will show independent earnings support first?" },
  { ticker: "01810.HK", title_cn: "小米利润降57%，港股为何盘中上涨？", body_cn: "小米集团（01810.HK）11月25日北京时间10:15港股盘中涨6.87%；前一晚公布的第三季收入为人民币1072.4亿元，同比降5.2%，非国际财务报告准则经调整净利润48.84亿元，同比降56.8%，收入与利润同向下滑。拆开业务看，手机×AIoT分部收入834亿元，智能手机毛利率从一年前11.1%降至9.2%，公司指出存储等核心器件涨价；“新能源汽车及AI等创新业务”分部收入239亿元，其中汽车227亿元、其他相关业务12亿元（包含AI业务），不能把239亿元写成AI收入。新车交付100,975辆，但该分部毛利率从25.5%降至19.2%。盘中上涨反映市场仍在权衡交付规模与利润承压；汽车毛利和手机成本哪个先改善，才能让交付规模转为利润修复？", title_en: "Xiaomi profit falls 57%: why are Hong Kong shares up intraday?", body_en: "Xiaomi (01810.HK) rose 6.87% in Hong Kong trading as of 10:15 Beijing time on Nov. 25. The prior evening it reported third-quarter revenue of RMB 107.24 billion, down 5.2% year on year, and adjusted net profit under non-IFRS of RMB 4.884 billion, down 56.8%, with both revenue and profit falling. Smartphone x AIoT revenue was RMB 83.4 billion and smartphone gross margin slid to 9.2% from 11.1% a year earlier, which the company attributed to higher prices for memory and other core components; the EV and AI innovation segment posted RMB 23.9 billion, of which EVs were RMB 22.7 billion and other related businesses RMB 1.2 billion including AI, so RMB 23.9 billion is not AI revenue. Deliveries reached 100,975 units, but segment gross margin fell to 19.2% from 25.5%. The intraday gain shows the market still weighing scale against margin pressure. Which improves first, EV margin or phone costs, turning deliveries into profit recovery?" },
  { ticker: "09626.HK", title_cn: "B站广告增20%，港股急涨靠什么延续？", body_cn: "哔哩哔哩（09626.HK）11月25日北京时间10:15港股盘中涨13.06%；公司前一晚公布第三季收入人民币83.2亿元，同比增长8%，净利润5.04亿元，同比增长7%。增长主要来自广告：收入30.9亿元、同比增20%；增值服务31.5亿元、增4%，手游14.1亿元、同比降7%，并非所有业务同时加速。毛利率从一年前36.7%升至37.3%，经调整净利润8.28亿元、增5%，与法定净利润口径不同。多头看广告效率、用户时长和盈利能力持续改善，空头关注手游下滑以及广告增长能否跨季度保持。今日是财报后的港股盘中反应，不是昨日财报前的股价；接下来广告收入与手游收入哪项更能证明这次估值上修有基本面支撑？", title_en: "Bilibili ad revenue up 20%: what can sustain the Hong Kong rally?", body_en: "Bilibili (09626.HK) rose 13.06% in Hong Kong trading as of 10:15 Beijing time on Nov. 25. The prior evening it reported third-quarter revenue of RMB 8.32 billion, up 8% year on year, and net profit of RMB 504 million, up 7%. Growth came mainly from advertising, at RMB 3.09 billion and up 20%; value-added services were RMB 3.15 billion, up 4%, and mobile games RMB 1.41 billion, down 7%, so not every segment accelerated. Gross margin rose to 37.3% from 36.7% a year earlier, and adjusted net profit was RMB 828 million, up 5%, on a different basis from reported net profit. Bulls cite ad efficiency, user time spent and improving profitability; bears cite the games decline and whether ad growth can hold across quarters. Today's move is the post-earnings Hong Kong reaction, not yesterday's pre-earnings price. Which better proves the re-rating is fundamentals-backed: ad revenue or game revenue?" },
  { ticker: "DELL", title_cn: "戴尔AI服务器收入增291%，利润能跟上吗？", body_cn: "戴尔科技（DELL）11月24日美股正式时段收跌11.83%，公司在收盘后公布2027财年第三季收入549亿美元、同比增103%，非GAAP每股收益9.45美元；当天日间跌幅发生在财报发布之前。AI优化服务器季度收入220亿美元、同比增291%，基础设施业务收入420亿美元、营业利润71亿美元；AI订单积压达1323亿美元，公司将全年收入指引提高到2020亿美元。多头看订单转收入的速度和经营现金流当季45亿美元，空头关注机架交付、客户融资以及大规模订单能否持续产生利润。公司披露的订单和指引提供了新证据，但不能用周二收盘价判定市场已经消化财报。下一交易日要看盘后信息如何重新定价，以及服务器利润与现金回收能否跟上收入扩张？", title_en: "Dell AI server revenue jumps 291%: can profit keep up?", body_en: "Dell Technologies (DELL) fell 11.83% in the Nov. 24 U.S. regular session; after the close it reported revenue for the third quarter of financial year 2027 of $54.9 billion, up 103% year on year, and non-GAAP EPS of $9.45. The daytime drop came before the results were released. AI-optimized server revenue was $22 billion, up 291%, infrastructure revenue $42 billion with $7.1 billion in operating income; AI order backlog reached $132.3 billion, and the company raised full-year revenue guidance to $202 billion. Bulls point to order-to-revenue conversion and $4.5 billion of quarterly operating cash flow; bears to rack deliveries, customer financing and whether large orders keep generating profit. The disclosed orders and guidance are new evidence, but Tuesday's close does not show the market has digested the results. Next session: how after-hours information reprices the stock, and whether server profit and cash collection keep pace with revenue growth?" },
  { ticker: "MU / SNDK / SKHY", title_cn: "美光闪迪双跌11%，存储涨价能托住股吗？", body_cn: "美光（MU）、闪迪（SNDK）和SK海力士美股标的（SKHY）11月24日分别跌11.01%、11.13%和9.90%，把前一日的急弹再度拉回；三只股票同属存储链，却不能用一种产品的价格解释全部股价。需求方小米在刚公布的季报中称存储等核心器件成本上涨，智能手机毛利率从11.1%降至9.2%。这表明采购方利润承压，却不能直接证明美光、海力士的HBM/DRAM，或闪迪的NAND利润会同比例上升：各自产能、长约、产品组合和库存都不同。多头看AI服务器建设仍需HBM与数据中心闪存，空头担心成本压力压缩终端设备需求、芯片股风险偏好再次降温。接下来美光与海力士的HBM交付、闪迪NAND价格和小米手机销量中，哪些数据能证明涨价可持续且供应商真正受益？", title_en: "Micron, SanDisk both fall 11%: can memory price hikes hold the stocks?", body_en: "Micron (MU), SanDisk (SNDK) and the U.S.-listed SK Hynix shares (SKHY) fell 11.01%, 11.13% and 9.90% respectively on Nov. 24, pulling back again after the prior day's sharp rebound; all three sit in the memory chain, but one product's price cannot explain all their moves. Buyer Xiaomi said in its just-released quarterly report that memory and other core component costs rose, with smartphone gross margin falling to 9.2% from 11.1%. That shows buyer margin pressure but does not prove Micron's and Hynix's HBM/DRAM or SanDisk's NAND profits will rise proportionally: capacity, long-term contracts, product mix and inventory all differ. Bulls see AI server build-outs still needing HBM and data-center flash; bears fear cost pressure erodes device demand and re-cools chip risk appetite. Which data would prove the price hikes are sustainable and suppliers truly benefit: HBM deliveries at Micron and Hynix, SanDisk NAND prices, or Xiaomi handset sales?" },
  { ticker: "AMD", title_cn: "AMD跌8.86%，转售登记意味着稀释吗？", body_cn: "AMD美股11月24日收跌8.86%，前一日收盘后公司提交的股份转售登记文件已进入当天交易者的视野。文件涉及最多约3.369亿股已发行或未来可能发行的股份，包括OpenAI和Meta相关权证分别对应最多1.6亿股；登记潜在转售并不等于两家客户已全部满足归属条件、行权或在市场卖出。多头看与大型AI客户的合作可能扩大长期芯片采购，空头看未来流通股增加、价格承压与客户实际采购不及预期。昨天上涨6.85%和今天下跌8.86%，也显示单靠行业风险偏好难给合作定价。要判断股价压力能否消退，应先看权证归属条件、实际客户订单和数据中心产品交付哪项？", title_en: "AMD drops 8.86%: does a resale filing mean dilution?", body_en: "AMD fell 8.86% on Nov. 24, with a share resale registration filed after the prior close already in traders' view that day. The filing covers up to about 336.9 million issued or potentially issuable shares, including warrants tied to OpenAI and Meta covering up to 160 million shares each; registering potential resales does not mean either customer has met vesting conditions, exercised, or sold in the market. Bulls see partnerships with large AI customers potentially expanding long-term chip purchases; bears see a larger future float, price pressure and actual customer purchases falling short. Yesterday's 6.85% gain and today's 8.86% drop show sector risk appetite alone cannot price the partnerships. To judge whether the pressure can fade, which comes first: warrant vesting terms, actual customer orders, or data-center product deliveries?" },
  { ticker: "NBIS", title_cn: "Nebius跌10.73%，融资压力会放大吗？", body_cn: "AI云厂Nebius（NBIS）美股11月24日收跌10.73%，与英伟达、Anthropic等AI标的同向，反映高投入算力链在前一日反弹后再遭抛售；目前没有可核实的当天客户取消订单或公司新一轮融资公告。公司10月与花旗达成35亿美元有担保贷款额度，款项可用于机房建设及GPU采购；贷款记在Nebius账上，偿付责任也由公司承担，并非Meta为其还债。这是旧融资条件，不是11月24日新借入35亿美元。多头看合同需求和融资渠道有助于扩大可交付算力，空头关注建造数据中心所需资本、借款成本，以及合同转成收入和现金流的时间差。股价急跌本身不能回答合同质量。下次披露时，已签容量的实际交付、客户回款或融资成本哪项最能验证这家公司承受波动的能力？", title_en: "Nebius drops 10.73%: will financing pressure widen?", body_en: "AI cloud provider Nebius (NBIS) fell 10.73% on Nov. 24, moving with AI names including Nvidia and Anthropic, reflecting renewed selling in the capital-intensive compute chain after the prior day's rally; there is no verifiable same-day customer cancellation or new company financing announcement. In October the company secured a $3.5 billion secured credit facility with Citi, usable for data-center construction and GPU purchases; the loan sits on Nebius's books with repayment its responsibility, and Meta is not repaying it. These are existing financing terms, not $3.5 billion newly borrowed on Nov. 24. Bulls see contract demand and funding access supporting deliverable compute capacity; bears focus on data-center capital needs, borrowing costs and the lag before contracts convert to revenue and cash flow. A sharp drop alone cannot answer the question of contract quality. At the next disclosure, which best tests the company's resilience: actual delivery of contracted capacity, customer collections, or financing costs?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
