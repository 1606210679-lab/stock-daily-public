<script>
const topics = [
  { ticker: "QQQ / .IXIC / SPY", title_cn: "债市把股市按回去,QQQ跌1.7%,纪要能翻盘吗?", body_cn: "周二美股连续第三个交易日收跌,QQQ跌1.69%、纳指跌1.33%、标普500ETF(SPY)跌0.68%,道指跌0.22%,定价权已经交到债市手里:30年期美债收益率停在5.28%附近,本周一盘中一度冲上5.31%,为2007年以来最高;油价同步上行,构成第二重压制。机制并不复杂——长端利率是所有远期现金流的折现率,AI与半导体这类靠2027年之后的盈利支撑估值的板块,分母一动杀伤最大;而无风险收益率给到5%以上时,债券本身就在和股票抢钱。这一轮的源头不在美国:日本长债抛售正把全球期限溢价一起推高,有卖方直接以\"10年后的10年期远期利率已高于2008年高点\"来描述这个位置,另一份把美债规模逼近40万亿美元列为长期风险。多头的反驳来自数据面:最新几份报告显示经济在降温,而降温本应压低利率而非推高。真正的裁判是北京时间周四凌晨2点公布的7月FOMC会议纪要——7月29日那次会议连续第五次按下不动、区间留在3.50%-3.75%,但有三位委员主张加息25个基点。纪要若把加息一派的理由写得更足,长端还会往上顶。你会趁回调加科技、换到金融与能源,还是等纪要落地再动?", title_en: "Bonds Crush Stocks, QQQ Falls 1.7% — Can FOMC Minutes Reverse the Tide?", body_en: "U.S. equities fell for a third straight session Tuesday, with QQQ dropping 1.69%, the Nasdaq losing 1.33%, SPY off 0.68%, and the Dow down 0.22%, as bond markets seized control of pricing. The 30-year Treasury yield held near 5.28%, having touched 5.31% intraday Monday — its highest since 2007 — while rising oil prices added a second layer of pressure; Japan's long-bond selloff is pushing global term premiums higher, with one sell-side note flagging U.S. debt approaching $40 trillion as a long-term risk. The July FOMC minutes, due Thursday at 2 a.m. Beijing time, will be the decisive test — three committee members dissented in favor of a 25 bp hike at the July 29 meeting, which held the range at 3.50%–3.75% for a fifth consecutive time. Will you buy the tech dip, rotate into financials and energy, or wait for the minutes before acting?" },
  { ticker: "SNDK / SNXX / SNDQ", title_cn: "铠侠先跳水,闪迪跟着收跌9%,拥挤交易开始拆了?", body_cn: "存储板块周二整段翻脸,闪迪收跌9.01%,把周一8.88%的涨幅全部还了回去;它的2倍做多ETF(SNXX)跌17.84%,2倍做空ETF(SNDQ)涨18.00%、盘后继续涨4.16%。导火索出现在亚洲盘:铠侠在日本先跌7.5%,美股盘前闪迪就被压住。但把跌幅推到9%的是另一条——有卖方在同一天摆出\"谁被过度持有、谁还没人买\"的对照,结论是英伟达仍属低配、闪迪属于拥挤交易,这句话出现在AI存储连涨一个月之后,等于给杠杆资金递了减仓的理由。还有一条更直白的提醒:一只在7月遭遇重挫的基金,其13F显示仓位几乎全压在美光与闪迪两只存储股上,把这条赛道的集中度摊在了台面上。多头的依据没有被推翻:HBF样品计划、8家客户锁定2027-2028财年产能、NAND合约价上行都还在,当天亦有市场人士坚持存储行情未走完并点名四只标的。空方要的只是一个价格——当2倍杠杆工具单日一头跌18%、一头涨18%,说明持仓结构比基本面更脆弱。你会把闪迪的回调当加仓机会、退到美光,还是先离开杠杆工具?", title_en: "Kioxia Drops First, SanDisk Follows With 9% Decline — Is the Crowded Trade Unwinding?", body_en: "Memory stocks reversed sharply Tuesday, with SanDisk closing down 9.01%, erasing its entire 8.88% Monday gain; its 2x leveraged long ETF (SNXX) fell 17.84% while the 2x inverse ETF (SNDQ) surged 18.00%, extending a further 4.16% after hours. The trigger emerged in the Asian session as Kioxia fell 7.5% in Tokyo, pressuring SanDisk in U.S. pre-market, but the full 9% decline was amplified by a sell-side note contrasting overcrowded positions against underloved names — flagging Nvidia as underowned while labeling SanDisk a crowded trade, after a month-long AI memory rally that handed leveraged funds a reason to reduce exposure. Bulls' core thesis remains intact — HBM sample programs, eight customers locking in 2027–2028 capacity, and rising NAND contract prices — but when a 2x leveraged instrument swings 18% in a single session in each direction, positioning is more fragile than fundamentals. Do you treat SanDisk's pullback as a buying opportunity, rotate into Micron, or step away from leveraged instruments first?" },
  { ticker: "MU", title_cn: "目标价被上调,美光却收跌7%,卖方和债市谁对?", body_cn: "美光周二收跌7.02%,而同一天美银把它的目标价上调至1,550美元,另有卖方以\"库存不会说谎\"为由上调评级——卖方在加码,股价在下跌,分歧摆得很清楚。空方的理由不在基本面而在折现率:美光的盈利高峰被押在2027年前后HBM与DRAM的紧平衡上,长端利率抬升直接压缩这段远期利润的现值,这也解释了为什么周二跌得最狠的是存储而不是软件。多头的证据在库存与价格:上调评级的那份报告正是以库存数据为依据,AI推理同时拉动企业级SSD与DRAM需求,而下一份财报要等到9月22日,中间没有可验证的节点。这就是当下的赔率结构——基本面利好已被写进价格,利率却还在动。你更相信1,550美元的目标价,还是先等长端收益率停下来?", title_en: "Price Target Raised to $1,550, Yet Micron Closes Down 7% — Who's Right, Sell-Side or Bond Market?", body_en: "Micron fell 7.02% Tuesday even as BofA raised its price target to $1,550 and a separate sell-side firm upgraded the stock citing inventory data as its anchor — a stark divergence between analyst conviction and price action. The bear case is not fundamental but mechanical: Micron's earnings peak is tied to HBM and DRAM supply tightness around 2027, and rising long-end yields directly compress the present value of those forward profits, explaining why memory led Tuesday's sector decline rather than software. With the next earnings report not due until September 22, there is no near-term verifiable catalyst to resolve the tension between a $1,550 target and a market still repricing the discount rate. Do you trust the $1,550 price target, or wait for long-end yields to stabilize first?" },
  { ticker: "SKHY / 07709", title_cn: "海力士收跌9.2%,HBM龙头也躲不过NAND降温?", body_cn: "SK海力士周二收跌9.20%,其2倍杠杆产品07709跌14.74%。它和闪迪的差别本在结构:海力士的核心筹码是HBM,当天仍有卖方以\"相信这位HBM龙头\"为题维持看多。但同一条链上的NAND正在被重新定价——铠侠在日本先跌7.5%、闪迪跌9%,存储被当成一个整体卖出,HBM的溢价没能提供保护。这一点值得记下来:过去两周市场还愿意把HBM与NAND分开定价,周二这条分界线消失了。多头的理由仍然成立,AI服务器对HBM的需求由算力扩张决定,与消费电子周期关系不大;空方的理由是持仓,亚洲存储链一个月的涨幅让任何利率冲击都被杠杆放大,两倍杠杆产品单日跌近15%就是证据。接下来要看的是HBM合约价能否与NAND脱钩。海力士、美光还是闪迪,你觉得哪一只的溢价最经得起利率考验?", title_en: "SK Hynix Falls 9.2% — Can Even the HBM Leader Escape the NAND Selloff?", body_en: "SK Hynix closed down 9.20% Tuesday, with its 2x leveraged product 07709 falling 14.74%, even as a sell-side note maintained a bullish view on the stock as the HBM leader. The structural distinction between HBM and NAND collapsed intraday — Kioxia's 7.5% drop in Tokyo and SanDisk's 9% decline in New York saw memory sold as a single block, with HBM's premium providing no protection. Bulls argue AI server demand for HBM is driven by compute expansion and largely decoupled from consumer electronics cycles; bears point to positioning, as one month of gains across the Asian memory chain amplified every rate shock through leverage, with the 2x product's near-15% single-day loss as evidence. The key question going forward is whether HBM contract pricing can decouple from NAND. Among SK Hynix, Micron, and SanDisk, which do you think holds its premium best against rising rates?" },
  { ticker: "BIDU / 01810 / 01024 / 09988", title_cn: "存储涨价的账单寄到小米,净利少四成却盘中涨5%?", body_cn: "中概与港股科技进入财报密集期,先交卷的两份指向同一个问题——AI的钱谁来付。小米二季度营收1,089亿元、同比下降约6%,经调整净利润62亿元,净利润同比下滑42.6%且低于预期,原因被明确点到存储:内存与闪存合约价上行压住了手机毛利,叠加补贴退坡与消费疲软,即便手机均价创下纪录、汽车与IoT仍在增长也没补回来;而它今日盘中反而涨4.97%,因为这份下滑已经被过去一年近五成的股价跌幅提前定价。百度是另一种失败:周二美股收跌12.73%,二季度营收46.2亿美元、同比下降约4%且低于预期,为连续第五个季度营收下滑,非GAAP每股ADS收益1.06美元(人民币口径7.22元,预期11.05元,差约35%),AI云基础设施约50%的增长盖不住广告的加深拖累,摩根士丹利随后下调至减持、目标价80美元,公司同时提出港股双重主要上市。没交卷的两家更值得盯:快手今日盘中跌4.16%,二季度业绩定在今天披露,上季营收337亿元、同比增3.4%,可灵AI收入同比增超300%,全年260亿元资本开支指引是最大争议;阿里巴巴今日盘中跌1.89%,明天披露的是2027财年第一财季(6月季度),看点在AI云增速、资本开支与淘宝闪购的投入效率。存储涨价对上游是利润、对终端是成本,这条链的两端已经开始分别结账。你会站在收钱的存储一侧、买被利润坑砸过的小米,还是等阿里与快手的资本开支给出答案?", title_en: "Memory Cost Surge Hits Xiaomi Earnings, Net Profit Down 42% — Yet Shares Rise 5% Intraday?", body_en: "Two earnings reports from Chinese tech companies pointed to the same question Tuesday: who pays for AI infrastructure. Xiaomi posted quarterly revenue of 108.9 billion yuan, down roughly 6% year-over-year, with adjusted net profit of 6.2 billion yuan and net profit down 42.6% year-over-year, missing expectations, as rising DRAM and NAND flash contract prices compressed handset margins — shares nonetheless rose 4.97% intraday, reflecting a nearly 50% stock decline over the past year that had pre-priced the disappointment. Baidu closed down 12.73% in U.S. trading after reporting quarterly revenue of $4.62 billion, down roughly 4% year-over-year and below consensus for a fifth consecutive quarter of revenue decline, with non-GAAP EPS of RMB 7.22 per ADS ($1.06) versus RMB 11.05 expected — a roughly 35% miss — as AI cloud infrastructure growth of approximately 50% failed to offset deepening advertising headwinds, prompting Morgan Stanley to downgrade to Underweight with an $80 price target. Kuaishou and Alibaba have yet to report, with Kuaishou falling 4.16% intraday ahead of its results today and Alibaba slipping 1.89% before its release tomorrow, where AI cloud growth, capital expenditure, and Taobao Flash Purchase investment efficiency will be in focus. Memory price inflation is profit for the supply side and cost for the device makers — both ends of the chain are now settling their accounts separately. Will you side with the memory suppliers, buy Xiaomi after its profit hit, or wait for Alibaba's and Kuaishou's capex guidance to decide?" },
  { ticker: "SOXL / SOXS", title_cn: "三倍多空一天换手,SOXS涨15%,杠杆资金认输了?", body_cn: "半导体三倍杠杆工具周二完成一次完整调头:三倍做多的SOXL跌14.80%,三倍做空的SOXS涨15.20%。这组数字的信息量在于对称——它说明当天的抛售不是某只个股的事故,而是整个半导体板块的系统性折价,迈威尔跌7.82%、英特尔跌6.58%、AMD跌4.27%都落在同一个方向。值得提醒的是,几天前还有报道指出杠杆芯片ETF的资金\"黏性很强\",即便有机构警告周期见顶也没有出现明显流出;周二的价格变化说明这份黏性正在被测试。杠杆工具自身的机制风险必须说清:三倍产品每日重置,连续震荡会持续侵蚀净值,方向猜对、时间拖长同样会亏。多头会说这正是错杀后的弹性来源,空方会说长端利率没停之前不该用杠杆接刀。你会用SOXL赌反弹、用SOXS对冲现有持仓,还是回到不带杠杆的个股?", title_en: "SOXS Surges 15%, SOXL Crashes 15% in Single Session — Has Leveraged Money Capitulated?", body_en: "Semiconductor triple-leveraged instruments completed a full reversal Tuesday, with SOXL falling 14.80% and SOXS surging 15.20% — the near-perfect symmetry signaling a systemic sector reprice rather than a single-stock event, with Marvell down 7.82%, Intel off 6.58%, and AMD lower by 4.27% all moving in lockstep. Reports just days ago noted unusually high \"stickiness\" in leveraged chip ETF flows, with retail holders staying put despite institutional warnings of a cycle peak — Tuesday's price action suggests that stickiness is now being stress-tested. The structural risk of 3x daily-reset products bears repeating: continuous volatility erodes net asset value regardless of directional accuracy, and being right on direction but wrong on timing still generates losses. Will you use SOXL to bet on a bounce, SOXS to hedge existing positions, or return to unleveraged individual stocks?" },
  { ticker: "FN", title_cn: "Fabrinet全面超预期仍崩19%,市场改看毛利率了?", body_cn: "Fabrinet(FN)周二收跌19.38%,而它交出来的成绩单每一项都是超预期:第四财季营收13.16亿美元、同比增长45%,高于市场预期的12.8亿美元;非GAAP每股收益4.10美元,高于预期的3.81美元,两项均创纪录。更关键的是下一财季指引也高于共识——营收13.75亿至14.25亿美元(共识约13.5亿),每股收益4.10至4.25美元(共识3.99)。也就是说\"指引不及预期\"这条现成的解释在这里并不成立。被点名的是另外两项:毛利率与自由现金流,多家报道把跌幅归到这里;而它自己的位置同样是理由,作为英伟达光通信供应链的核心一环,即便在崩了19%之后市盈率仍在37倍附近,任何利润质量上的瑕疵都会被高估值放大。这已经是两天内的第二例:此前Coherent双超预期后次日同样大跌7.99%。AI硬件链的定价标准正在从\"增速够不够\"换成\"这段增速值多少毛利\"。你更看Fabrinet的错杀,还是等迈威尔8月27日盘后那份财报给出行业口径?", title_en: "Fabrinet Beats on Every Metric, Still Crashes 19% — Has the Market Shifted to Margin Quality?", body_en: "Fabrinet (FN) closed down 19.38% Tuesday despite a clean earnings beat on every line: fiscal fourth-quarter revenue of $1.316 billion, up 45% year-over-year and ahead of the $1.28 billion consensus, with non-GAAP EPS of $4.10 versus the $3.81 estimate — both record figures. Next-quarter guidance of $1.375–$1.425 billion in revenue and $4.10–$4.25 in EPS also exceeded consensus of approximately $1.35 billion and $3.99 respectively, ruling out a guidance miss as the explanation. Multiple reports attributed the selloff to gross margin and free cash flow quality; as a core node in Nvidia's optical communications supply chain, Fabrinet's roughly 37x P/E even after the 19% decline means any perceived blemish in earnings quality is magnified by the premium multiple. This marks the second such instance in two days, following Coherent's 7.99% post-earnings drop despite its own double beat. The AI hardware chain's valuation standard appears to be shifting from \"is growth fast enough\" to \"what margin does that growth deserve.\" Do you see Fabrinet as oversold, or wait for Marvell's upcoming after-hours earnings to set the industry benchmark?" },
  { ticker: "MRVL / AMD", title_cn: "迈威尔内部人套现6.3亿,股价收跌7.8%谁在接?", body_cn: "迈威尔科技周二收跌7.82%,当天有两条来自公司内部的消息:内部人在这轮160%的涨幅中累计卖出约6.32亿美元股票,CEO本人也有一笔约180万美元的操作。卖方的方向恰好相反——瑞银刚上调它的AI营收预期,认为还有数十亿美元增量;另一份分析则直接以\"股价与它自己的数字之间的差距\"为题提出质疑。AMD周二收跌4.27%,问题相似:有分析同时点向股本稀释与内部人抛售,方舟(ARK)则在四只ETF里买入英伟达、卖出AMD,把资金从二线算力挪回龙头。两只票的共同点很清楚:业务端的增量写在卖方模型的未来里,减持是管理层现在的动作,而长端利率上行让\"未来\"的折价变深。多头的抓手是8月27日盘后迈威尔的财报——定制ASIC与光互连的订单能否兑现,是这条叙事最近的一次硬验证。你会等迈威尔交卷、跟着ARK回到英伟达,还是趁AMD回调布局?", title_en: "Marvell Insiders Sell $630M in Stock as Shares Fall 7.8% — Who Is Buying?", body_en: "Marvell Technology closed down 7.82% Tuesday as two internal data points drew attention: insiders have collectively sold approximately $632 million worth of shares during the stock's 160% rally, including a roughly $1.8 million transaction by the CEO. Sell-side sentiment pointed the opposite direction — UBS recently raised its AI revenue estimates for the company, projecting billions in incremental upside — while a separate analysis questioned the gap between the stock's valuation and its own underlying numbers. AMD fell 4.27% Tuesday amid similar scrutiny over share dilution and insider selling, with ARK buying Nvidia and selling AMD across four ETFs, rotating capital from second-tier compute back to the market leader. The convergence is clear: business upside lives in future sell-side models while insider selling is happening now, and rising long-end yields are deepening the discount applied to that future. Marvell's upcoming after-hours earnings report, where custom ASIC and optical interconnect order trends will face their nearest hard test, is the next key catalyst. Will you wait for Marvell to report, follow ARK back into Nvidia, or position in AMD on the pullback?" },
  { ticker: "NVDA", title_cn: "财报前一周英伟达收跌2.3%,50%折价还是泡沫?", body_cn: "英伟达周二收跌2.34%,距8月26日盘后的财报只剩一周,多空双方却在同一天把话说到了极端。看多的一侧:美银认为把AI风险计入之后它的估值仍存在最多50%的折价、目标指向约55%的上行空间,并明确指出机构对它仍是低配——这在存储与二线算力被称作\"拥挤交易\"的当口是罕见的表述。看空的一侧集中在融资结构:它为OpenAI在俄亥俄的数据中心提供约1,050亿美元的租约担保,债券投资人冈拉克把它5,000亿美元规模的AI融资安排比作\"用香蕉做抵押的债券\",黄仁勋则公开否认这是循环融资。第三条线是竞争:Cerebras把新产品称作\"业内最快的AI加速器\",Groq以35亿美元估值完成3.5亿美元融资,另据报道H200已开始小批量进入中国市场。筹码与风险都很清楚:低配意味着财报超预期会有增量买盘,担保敞口意味着任何客户的资本开支节奏变化都会先打到它的资产负债表上。你会在财报前加仓、等纪要和收益率落地,还是换去没有这类担保敞口的博通?", title_en: "Nvidia Falls 2.3% One Week Before Earnings — 50% Discount or Bubble?", body_en: "Nvidia closed down 2.34% Tuesday, one week before its after-hours earnings report on August 26, as bulls and bears staked out extreme positions on the same day. BofA argued the stock trades at up to a 50% discount to fair value even after pricing in AI risks, with approximately 55% upside to its target, noting that institutional investors remain underweight — a striking characterization given that memory and second-tier compute names are widely labeled crowded trades. The bear case centers on financing structure: Nvidia has provided approximately $105 billion in lease guarantees for OpenAI's Ohio data centers, a commitment bond investor Gundlach likened to \"debt collateralized by bananas,\" while CEO Jensen Huang publicly denied the arrangement constitutes circular financing. A third axis is competition — Cerebras launched what it called the industry's fastest AI accelerator, Groq closed a $350 million round at a $3.5 billion valuation, and H200 chips have reportedly begun entering China in limited quantities. The underweight positioning means an earnings beat could attract significant incremental buying, while the guarantee exposure means any shift in a major customer's capex cadence hits Nvidia's balance sheet first. Will you add before earnings, wait for the FOMC minutes and yields to settle, or rotate into Broadcom to avoid the guarantee overhang?" },
  { ticker: "INTC", title_cn: "英特尔收跌6.6%,目标价被下调后涨势到顶了吗?", body_cn: "英特尔周二收跌6.58%,直接催化是瑞银把目标价从121美元下调至112美元、维持中性评级,盘中跌幅一度到7%。这条下调之所以有杀伤力,是因为它出现在一段极端的持仓故事之后:13F显示软银把其美股组合的约67%押在了英特尔一只股票上。一边是把身家压上的战略投资者,一边是把目标价往下修的卖方,两种判断指向同一个变量——代工订单的兑现速度。多头的理由是7月23日盘后那份财报的超预期幅度,EPS与营收分别超出约93%和12%;空方的理由是这段涨幅已经把\"代工翻身\"写进了价格,而周二整个半导体板块被利率统一折价,高beta的转型故事跌得最快。它在下一次业绩之前没有自己的节点,只能跟着板块走。你会把这次下调当洗盘、跟着软银的仓位走,还是换到订单确定性更高的台积电?", title_en: "Intel Drops 6.6% After Price Target Cut — Has the Rally Peaked?", body_en: "Intel closed down 6.58% Tuesday after UBS trimmed its price target from $121 to $112 while maintaining a Neutral rating, with intraday losses briefly reaching 7%. The downgrade landed with particular force given the positioning backdrop: 13F filings revealed SoftBank has concentrated approximately 67% of its U.S. equity portfolio in Intel alone, creating a stark divergence between a strategic investor betting heavily on the stock and a sell-side analyst cutting its target. Both the bull and bear cases hinge on the same variable — the pace at which foundry orders materialize — and while Intel's most recent earnings delivered an EPS beat of roughly 93% and a revenue beat of roughly 12%, the rally has already priced in a foundry turnaround. With the next earnings report still ahead and no company-specific catalysts in the interim, Intel will trade as a high-beta sector proxy, falling fastest in any broad semiconductor reprice driven by rates. Will you treat this pullback as a washout and follow SoftBank's conviction, or rotate into TSMC for greater order visibility?" },
  { ticker: "META", title_cn: "29州把Meta告上法庭,收跌4.5%成七巨头最差?", body_cn: "Meta周二收跌4.45%,是\"七巨头\"里跌得最狠的一只,原因是当天开庭的一场诉讼:29个州指控Facebook与Instagram的产品设计伤害青少年,多家媒体把它称作社交媒体版的\"大烟草时刻\",并给出高达1.4万亿美元的潜在索赔规模。要说清楚的是,这个数字是原告一方的诉求量级、不是判决结果,但它足以让市场重新给合规与法务成本定价——公司高层已在开庭第一天出庭作证。第二重压力来自成本:投资人史蒂夫·艾斯曼当天质疑它的AI投入,点名费用同比增长约55%,在利率上行、市场开始要求\"投入要有回报\"的时候,这个增速比诉讼更难解释。多头的依据在使用侧,有分析认为AI的实际使用率提升会成为下一阶段的增长驱动,广告效率也确实在被AI改写。风险是两件事叠加:法务成本与资本开支同时抬升,而它的估值靠的是2027年之后的广告利润。你会把这轮下跌当法律风险出清、转去费用更可控的谷歌,还是先看AI投入什么时候体现在收入端?", title_en: "29 States Sue Meta; Stock Drops 4.5%, Worst Among the Magnificent Seven?", body_en: "Meta closed down 4.45% Tuesday, the weakest performer among the Magnificent Seven, as a lawsuit brought by 29 states alleging that Facebook and Instagram product design harms minors opened in court — with multiple outlets describing it as a \"Big Tobacco moment\" for social media and citing plaintiff demands that could reach $1.4 trillion, a figure representing claimed damages rather than any judgment. Company executives testified on the first day of trial, while a second pressure point came from investor Steve Eisman, who questioned Meta's AI spending, citing operating expense growth of roughly 55% year-over-year at a moment when rising rates are forcing markets to demand returns on capital investment. Bulls point to evidence that rising AI utilization rates and AI-driven advertising efficiency gains could fuel the next growth phase; the risk is that legal costs and capital expenditure are rising simultaneously while the stock's valuation depends on advertising profits projected well into the future. Will you treat this selloff as legal-risk clearing and hold, rotate into Alphabet for more contained expense growth, or wait to see when AI investment begins showing up in revenue?" },
  { ticker: "AAPL", title_cn: "苹果把欧洲抽成砍到5%,逆势收涨1.5%领跑?", body_cn: "苹果周二收涨1.45%,是\"七巨头\"里唯一像样的上涨,而它上涨的理由和别人下跌的理由不在同一个维度:它宣布全面调整欧盟的App Store条款,把核心技术佣金降至5%、替代支付渠道费率调整为20%,并放宽第三方应用商店的规则,以此了结与欧盟拖了很久的反垄断争议。这笔交易的算法很清楚——用确定的费率让利,换掉不确定的监管罚单与合规风险,对现金流稳定的公司来说,是把尾部风险变成了可以入模型的成本。另有两条同向消息:有分析给出约30%的上行空间,理由是与英伟达相关的AI布局;另有卖方测算折叠屏机型可能把iPhone均价拉高约11%。空方的理由在前一个交易日还很响,存储合约价上行会先咬硬件厂商的毛利,有卖方正是以\"存储成本逆风\"为由下调过它的评级,而这条压力并没有因为降费而消失。有意思的是同一件事的两面:利率上行打的是远期成长,苹果反而因为盈利就在眼前而受益。你会把苹果当成这轮利率冲击里的避风港,还是等存储成本真正反映到毛利率再看?", title_en: "Apple Cuts EU App Store Fee to 5%, Gains 1.5% Against the Selloff?", body_en: "Apple closed up 1.45% Tuesday, the only meaningful gainer among the Magnificent Seven, after announcing a comprehensive overhaul of its EU App Store terms — reducing the core technology fee to 5%, adjusting alternative payment channel rates to 20%, and relaxing third-party app store rules to resolve a protracted antitrust dispute with the European Union. The trade-off is straightforward: a defined fee concession eliminates the open-ended tail risk of regulatory fines and compliance uncertainty, converting an unpriceable liability into a modeled cost for a company with highly predictable cash flows. Two additional tailwinds emerged — one analysis cited roughly 30% upside driven by AI developments linked to Nvidia, and a separate sell-side estimate suggested a foldable iPhone could lift average selling prices by approximately 11%. The bear case has not disappeared: rising memory contract prices remain a headwind for hardware gross margins, the same factor behind a recent ratings downgrade on the stock, and that pressure is unaffected by the EU fee settlement. Notably, rising long-end rates that are punishing high-multiple growth stocks are a relative benefit for Apple, whose earnings are near-term and visible. Will you treat Apple as a rate-shock safe haven, or wait for memory cost pressure to show up in gross margins before reassessing?" },
  { ticker: "NBIS / CRWV / IREN", title_cn: "二期数据中心刚获批,Nebius反而收跌7.6%?", body_cn: "Nebius周二收跌7.60%,而当天的公司消息全是正面的:新泽西州Vineland市议会通过其数据中心二期扩建、项目拿到监管许可,另有卖方以\"双重好消息\"为题给出看多。好消息换来7.6%的下跌,说明定价的主角不是它自己。AI新云(neocloud)是长端利率最直接的受害者:重资产、靠债务与租约扩张、利润落在两三年后,分母抬高一档估值就要重算一次;同一天还有CRWV、NBIS与IREN谁更值得押注的对比讨论,以及那只7月重挫的基金13F暴露出的赛道集中度问题。另一条不能忽略的是内部动作,公司出现两笔董事减持申报。多头的依据是8月12日盘前那份财报,营收与利润双双好于预期,增速仍在爆发区间;空方的依据是融资节奏,扩张速度取决于能不能在更高的利率下继续借到钱。你会在这轮利率冲击里选客户结构更分散的CoreWeave、算力自建的IREN,还是弹性最大的Nebius?", title_en: "Phase-2 Data Center Approved, Yet Nebius Still Falls 7.6%?", body_en: "Nebius closed down 7.60% Tuesday despite an entirely positive corporate news flow: the Vineland, New Jersey city council approved its Phase 2 data center expansion and the project received regulatory clearance, while a sell-side note framed the day as a \"double positive\" for the stock. The selloff illustrates that sector-level repricing has taken over from company-specific catalysts — AI neocloud operators are among the most direct victims of higher long-end rates, given their capital-intensive, debt-and-lease-funded expansion models with profits landing two to three years out. Two insider selling filings also emerged intraday, adding a second layer of overhang, while broader discussion of capital concentration risk in the AI neocloud space — including comparisons with CoreWeave (CRWV) and IREN — kept sentiment fragile. Bulls can point to the company's most recent earnings report, which beat on both revenue and profit with growth still in explosive territory; bears argue the expansion pace depends on continued access to capital at rates that are now materially higher. In this rate-driven selloff, do you prefer CoreWeave for its more diversified customer base, IREN for its self-built compute, or Nebius for maximum upside potential?" },
  { ticker: "SPCX", title_cn: "高盛喊出1.8万亿太空市场,SpaceX仍收跌2%?", body_cn: "SpaceX周二收跌1.98%,当天最大的一条外部消息其实是利好:高盛提出\"第二次太空时代\"的判断,测算全球太空市场到2035年将达到1.8万亿美元规模。股价没有接住,而市场自己也还没决定该怎么给它归类——有报道把上市两个月后仍没解决的问题重新摆了出来:它到底是一只AI股,还是一只太空股。这个分类问题不是文字游戏,它决定用哪套倍数定价:按发射与星链收入算,是可预测的现金流;按AI算力算,估值锚就变成同赛道那些远期故事,而长端利率一动,后者先被打折。多头的抓手正在AI这一侧——英伟达最新的持仓披露显示其持有约210亿美元SpaceX,是那份表里的第二大股票仓位;空方的理由是解禁与倍数,史上最大规模IPO的后续解禁批次仍在时间表上。你会按太空基础设施给它估值,还是干脆当成AI算力链的一部分来买?", title_en: "Goldman Sees $1.8T Space Market by 2035, Yet SpaceX Still Closes Down 2%?", body_en: "SpaceX closed down 1.98% Tuesday despite a significant external tailwind: Goldman Sachs declared the arrival of a \"second space age\" and projected the global space market will reach $1.8 trillion by 2035. The stock failed to hold the positive catalyst, reflecting an unresolved classification problem that reports flagged again — roughly two months after its IPO, the market has yet to decide whether SpaceX is an AI stock or a space stock, a distinction that is not semantic but determines which valuation multiple applies. Priced on launch and Starlink revenue, it commands a predictable cash flow multiple; priced as AI compute infrastructure, it anchors to the same forward-story multiples being discounted hardest as long-end rates rise. The bull case has an AI anchor — Nvidia's latest holdings disclosure revealed an approximately $21 billion position in SpaceX, its second-largest equity holding — while the bear case centers on valuation and the continued lock-up expiration schedule from what was the largest IPO in history. Will you value SpaceX as space infrastructure, or simply buy it as a component of the AI compute chain?" },
  { ticker: "LLY / JNJ / 01548 / 02359", title_cn: "资金逃离贵估值科技,礼来收涨3.6%医药接棒?", body_cn: "周二真正跑赢的不是科技而是医药:礼来收涨3.60%,强生收涨3.33%,当天的解释很直接——资金正在从昂贵的科技股里撤出。这轮切换和半导体被杀是同一件事的两面:长端利率停在5.28%附近,越靠后的现金流折得越狠,而大药企的现金流就在眼前,药已经在卖、专利期是确定的、股息付得出来。两家各有独立催化:有报道称礼来在口服减重药上正抹平诺和诺德的先发优势;强生拿到MONARCH QUEST 3支气管镜系统的FDA许可。港股这一侧靠的不是轮动而是业绩:金斯瑞生物科技上半年营收同比增27.3%至4.04亿美元、调整后净利润增长两倍以上并全线上调指引,今日盘中涨1.63%、一度触及52周新高;药明康德今日盘中跌1.66%,但它一年涨了约九成,一季度持续经营业务营收同比增39.4%、调整后净利增71.7%、在手订单增23.6%,近期美国法院还阻止了国防部把它列入涉军名单,压了两年的地缘折价被拿掉一部分。空方的理由是位置:两只港股都贴着52周高位,而医药的避风港属性只在利率上行期成立,纪要一旦让市场重新押降息,资金可能立刻掉头回科技。你会买现金流确定的礼来与强生、押业绩上调的金斯瑞,还是赌药明康德的地缘折价继续修复?", title_en: "Capital Flees Expensive Tech, Eli Lilly Gains 3.6% — Is Pharma Taking the Baton?", body_en: "Healthcare outperformed decisively Tuesday, with Eli Lilly rising 3.60% and Johnson & Johnson gaining 3.33%, as capital rotated away from high-multiple technology stocks — the direct mirror of the semiconductor selloff, driven by long-dated Treasury yields holding near 5.28% and compressing the present value of distant cash flows while rewarding large-cap pharma whose revenue is current, patents are defined, and dividends are funded. Each name carried an independent catalyst: reports indicated Eli Lilly is closing the gap with Novo Nordisk in oral weight-loss drugs, while J&J received FDA clearance for its MONARCH QUEST 3 bronchoscopic system. On the Hong Kong side, Genscript Biotech reported first-half revenue up 27.3% year-over-year to $404 million with adjusted net profit more than doubling and full guidance raised, with shares up 1.63% intraday and briefly touching a 52-week high; WuXi AppTec slipped 1.66% intraday despite an approximately 90% gain over the past year, underpinned by strong quarterly results and a recent U.S. court order blocking its designation on the Pentagon's list of companies allegedly supporting the Chinese military — removing part of the geopolitical discount that had weighed on the stock for two years. The bear case for both Hong Kong names is positioning, as each trades near 52-week highs, and pharma's defensive appeal holds only while rates are rising — any shift back toward rate-cut expectations could reverse the rotation into tech instantly. Will you buy Lilly and J&J for cash flow certainty, bet on Genscript's earnings upgrade cycle, or position in WuXi AppTec for continued geopolitical discount recovery?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
