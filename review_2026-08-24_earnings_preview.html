<script>
const topics = [
  { ticker: "NVDA", title_cn: "共识给936亿摩根士丹利只给911亿,英伟达跟谁比?", body_cn: "英伟达周三盘后(北京时间周四凌晨)披露上一财季业绩,这周真正的问题不是好不好,而是跟谁比。市场共识是每股收益约2.13美元、营收约936.3亿美元;而摩根士丹利给出的同一季度营收预测约为911亿美元,低于共识——同一份财报完全可能既超过公司此前的指引,又不及已被抬高的卖方共识,所以\"超预期加上调指引\"这句话必须先说清基准是哪一个。第二道门槛更硬:有统计指出它已连续四个季度在财报次日下跌,说明超预期本身早已不够,市场要的是超预期的幅度和下一段的斜率。三个实际观察点:Rubin的放量节奏、毛利率能否改善、以及份额有没有被定制ASIC侵蚀。它还自带一个矛盾——已警告大客户,因存储成本上升,明年初出货的AI服务器价格将上涨超过15%,涨价护住的是自己的毛利,抬高的却是客户的资本开支门槛。筹码目前在多头一侧:62家卖方给到强烈买入、目标均值304.73美元、约42%的上行空间,而它上周五收跌0.98%。同一周还有杰克逊霍尔年会、沃什首度以主席身份登场,财报与政策撞在一起。你会在财报前加仓、等年会与财报双落地,还是换去买它的上游?", title_en: "Consensus at $93.6B, Morgan Stanley at $91.1B — Which Bar Is Nvidia Beating?", body_en: "Nvidia reports earnings after Wednesday's U.S. close, and the real debate is which benchmark matters: Street consensus stands at roughly $2.13 EPS and $93.63B in revenue, while Morgan Stanley's estimate for the same quarter is approximately $91.1B — meaning a beat and a guidance raise could mean very different things depending on the baseline. A harder hurdle looms: Nvidia has reportedly fallen on earnings day in each of the past four consecutive quarters, signaling that a beat alone is no longer sufficient — magnitude and forward trajectory are what the market demands. Three concrete watch-points: Rubin ramp cadence, whether gross margins can recover, and whether custom ASICs are eroding share — complicated by Nvidia's own warning to major customers that AI server prices will rise more than 15% on early next-year shipments due to higher memory costs, protecting its own margins while raising customers' capex thresholds. With 62 sell-side analysts at Strong Buy, an average price target of $304.73 implying roughly 42% upside, and the Jackson Hole symposium plus Warsh's debut as Fed Chair landing the same week — will you add exposure ahead of earnings, wait for both events to clear, or rotate into Nvidia's upstream suppliers?" },
  { ticker: "MRVL", title_cn: "内部人套现6.3亿,迈威尔周四交卷谁的判断要认错?", body_cn: "迈威尔周四盘后交卷,共识是每股收益约0.94美元、营收约27.6亿美元,而它上周五先收跌5.57%进入财报周。这份财报要给上周那个分歧判胜负:一边是公司内部人在这轮160%的涨幅里累计卖出约6.32亿美元股票、CEO本人也有一笔约180万美元的操作,另一边是瑞银同期上调它的AI营收预期、认为还有数十亿美元增量。两种判断不可能同时对。看点很具体:定制ASIC与光互连的订单能不能兑现——这也是英伟达份额问题的另一面,如果定制芯片真在抢份额,受益的就是它;争议同样具体,有分析直接以\"股价与它自己的数字之间的差距\"为题质疑当前估值,而长端利率只要回头上行,这类靠2027年之后订单支撑的公司会先被折价。同一晚还有IREN、Workday、Affirm与SentinelOne,注意力会被分散。你会等这份财报再决定跟内部人还是跟卖方,直接换去财报已经落地的上游,还是先看杰克逊霍尔的措辞?", title_en: "Insiders Sold $630M — Marvell Reports Thursday: Who Gets Proven Wrong?", body_en: "Marvell reports after Thursday's close against consensus of roughly $0.94 EPS and $2.76B in revenue, entering earnings week after falling 5.57% last Friday. The results will settle a pointed disagreement: company insiders have cumulatively sold approximately $632M in stock during the 160% rally — including roughly $1.8M by the CEO — while UBS over the same period raised its AI revenue estimates for the company, projecting billions in incremental upside. Both positions cannot simultaneously be correct. The specific watch-points are whether custom ASIC and optical interconnect orders convert to recognized revenue — the direct mirror of Nvidia's market-share question — while one analyst has explicitly challenged the current valuation by framing it as the gap between the stock price and the company's own disclosed numbers, a discount that would widen quickly if long-end rates resume their climb, given that the bull case rests heavily on post-2027 order flow. With IREN, Workday, Affirm, and SentinelOne reporting the same evening, will you wait for this print before deciding whether to follow insiders or sell-side, rotate into upstream names whose earnings have already landed, or first gauge the tone out of Jackson Hole?" },
  { ticker: "CRM / CRWD / OKTA / HPQ", title_cn: "英伟达身后还挤着四份财报,软件的AI谁先被定价?", body_cn: "周三盘后除了英伟达,还有Salesforce、CrowdStrike、Okta与惠普四份财报挤在同一小时,这一晚的价值是能把\"AI到底有没有变成收入\"分三层来看。第一层是应用:Salesforce是AI Agent能否转成订阅收入的直接样本,它上周五收涨1.82%,市场要看的是席位数与单席位价格哪个在涨。第二层是安全支出:CrowdStrike上周五收涨0.85%,Okta同晚交卷,这两家决定\"AI时代的安全预算\"是不是还在扩张,而不只是重新分配。第三层是终端成本:惠普上周五收涨0.81%,它直面存储合约价上行,和小米被咬掉42.6%利润、英特尔GPU价格跳升48%是同一条账单的下游,PC厂商能不能把成本转嫁到售价上,这一晚就有答案。共同的争议是注意力:英伟达会吸走当晚绝大部分流动性,任何一家指引不及预期都会在薄成交里被放大。这四家的具体共识数字本文未取,以上看点以定性为准。你会买AI变现最直接的Salesforce、押安全预算的CrowdStrike,还是赌惠普把成本转出去?", title_en: "Four More Earnings Stack Behind Nvidia — Which Software Name Gets Priced on AI First?", body_en: "Wednesday after the close, Salesforce, CrowdStrike, Okta, and HP report alongside Nvidia, offering a three-tier read on whether AI is actually converting to revenue. Salesforce — up 1.82% last Friday — is the most direct test of whether AI Agents translate into subscription revenue, with the market watching seat count versus per-seat pricing; CrowdStrike, up 0.85%, and Okta together determine whether AI-era security budgets are still expanding or merely being reshuffled. HP, up 0.81%, faces the downstream consequences of rising memory contract prices directly — the same cost pressure that clipped 42.6% of Xiaomi's margins and drove a 48% jump in Intel GPU prices — making this the evening to learn whether PC manufacturers can pass costs through to end-market pricing. The shared risk is attention: Nvidia will absorb the overwhelming majority of liquidity that night, meaning any guidance miss from the other four will be amplified in thin trading. Specific consensus figures for these four were not available at the time of writing; the above analysis is qualitative. Will you buy Salesforce as the clearest AI monetization proxy, back CrowdStrike on security budget expansion, or bet that HP can successfully pass its cost increases through?" },
  { ticker: "IREN / NBIS", title_cn: "同行拿14亿营收借了50亿,IREN周四怎么回答?", body_cn: "IREN周四盘后交卷,上周五收跌1.69%。它是这周最能检验AI新云(neocloud)融资结构的一份财报,因为对照样本刚刚出现:同赛道的Nebius最终以50亿美元完成可转换票据发行(初始公告45亿,定价时上调,另附约8亿美元债转股交换),而它的营收基数只有约14亿美元,已经有报道直接以\"这是不是泡沫\"质问这个比例。IREN的差别在于路径:它从矿机业务转型而来、算力以自建为主,所以问题不是能不能借到钱,而是折旧与电力成本能不能被租约收入覆盖。上周我在Nebius那条里把IREN列为\"算力自建\"的替代选项,这份财报就是对那个判断的验证。多头的理由是自建路径的单位成本更低、不必反复靠可转债扩张;空头的理由是它的客户集中度与合约期限都比不上大厂,一旦AI资本开支节奏放缓,重资产会先受伤。你会选自建的IREN、靠融资扩张但增速更快的Nebius,还是等这一轮AI资本开支的指引先落地?", title_en: "A Peer Raised $5B on $1.4B in Revenue — How Does IREN Answer Thursday?", body_en: "IREN reports after Thursday's close, having fallen 1.69% last Friday, and represents the week's sharpest test of neocloud capital structures: the direct comparable just materialized — sector peer Nebius closed a convertible note offering at $5B (upsized from an initial $4.5B, with an additional roughly $800M debt-to-equity exchange), against a revenue base of only approximately $1.4B, prompting reports that explicitly ask whether this ratio constitutes a bubble. IREN's distinction is its path: it converted from a mining operation and owns its compute infrastructure outright, so the question is not whether it can raise capital but whether depreciation and power costs are covered by lease revenue. The bull case is lower unit economics on a self-build model with no need for repeat convertible issuances; the bear case is that customer concentration and contract duration are both weaker than hyperscalers, making heavy fixed assets the first casualty if AI capex momentum slows. Will you choose self-build IREN, the faster-growing but debt-funded Nebius, or wait for this round of AI capex guidance to fully land before deciding?" },
  { ticker: "PDD / XPEV / LI / BILI", title_cn: "沃尔玛刚给消费定了性,中概这周靠补贴还是靠利润?", body_cn: "中概这周从今晚开始连轴:拼多多今晚盘前打头(上周五收跌1.27%),随后是小鹏(收涨1.58%)、理想(收涨1.01%)、B站(收涨2.40%)与唯品会。它们要回答的是同一个问题,而且背景刚刚变了——沃尔玛上一份财报给出六年来最慢的美国同店增速,并把29亿美元关税退款直接用于降价,消费降级已经被最强的零售商亲口确认;放到中概身上,问题就变成补贴换来的增长能不能变成利润。拼多多的争议在Temu:海外补贴与关税成本同时压毛利,而国内主站的增速已经不像前两年。两家造车看的是交付量与单车毛利能不能同时成立,尤其在价格战没有停的前提下;B站要看广告与游戏这两块能不能一起兑现。风险是共同的:一旦哪一家承认\"增长要靠继续补贴\",整个板块的估值中枢都会下移;机会也是共同的,若有人能证明减少补贴后增速仍在,它会立刻被单独重估。你会押规模最大的拼多多、交付弹性更大的两家造车,还是等这一轮全部交卷再挑?", title_en: "Walmart Just Defined the Consumer — Can Chinese ADRs Grow on Profit, Not Subsidies?", body_en: "Chinese ADRs begin reporting tonight, led by PDD pre-market — down 1.27% last Friday — followed by XPeng, up 1.58%, Li Auto, up 1.01%, Bilibili, up 2.40%, and Vipshop. The backdrop shifted materially: Walmart's latest results showed its slowest U.S. same-store sales growth in six years, with the retailer deploying $2.9B in tariff refunds directly into price cuts — the most powerful name in retail has personally confirmed consumer trade-down; applied to Chinese ADRs, the question becomes whether subsidy-driven growth can convert to actual profit. PDD's flashpoint is Temu: overseas subsidies and tariff costs are simultaneously compressing gross margins while domestic platform growth has visibly decelerated from prior-year rates. The two EV names are watched on whether delivery volumes and per-vehicle gross margins can hold simultaneously under a price war that has not ended; Bilibili must show advertising and gaming revenue inflecting together. The shared risk: any company that signals growth still requires sustained subsidies will reprice the entire group's valuation floor lower. The shared opportunity: any name that demonstrates accelerating growth after pulling back subsidies will be immediately re-rated in isolation. Will you back PDD for scale, the two EV makers for delivery optionality, or wait until the full reporting cycle clears before picking?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
