<script>
const topics = [
  { ticker: "NVDA", title_cn: "共识给936亿摩根士丹利只给911亿,英伟达跟谁比?", body_cn: "英伟达周三盘后(北京时间周四凌晨)披露上一财季业绩,这周真正的问题不是好不好,而是跟谁比。市场共识是每股收益约2.13美元、营收约936.3亿美元;而摩根士丹利给出的同一季度营收预测约为911亿美元,低于共识——同一份财报完全可能既超过公司此前的指引,又不及已被抬高的卖方共识,所以\"超预期加上调指引\"这句话必须先说清基准是哪一个。第二道门槛更硬:有统计指出它已连续四个季度在财报次日下跌,说明超预期本身早已不够,市场要的是超预期的幅度和下一段的斜率。三个实际观察点:Rubin的放量节奏、毛利率能否改善、以及份额有没有被定制ASIC侵蚀。它还自带一个矛盾——已警告大客户,因存储成本上升,明年初出货的AI服务器价格将上涨超过15%,涨价护住的是自己的毛利,抬高的却是客户的资本开支门槛。筹码目前在多头一侧:62家卖方给到强烈买入、目标均值304.73美元、约42%的上行空间,而它上周五收跌0.98%。同一周还有杰克逊霍尔年会、沃什首度以主席身份登场,财报与政策撞在一起。你会在财报前加仓、等年会与财报双落地,还是换去买它的上游?", title_en: "Consensus at $93.6B, Morgan Stanley at $91.1B — Which Bar Is Nvidia Clearing?", body_en: "Nvidia reports its latest quarterly results Wednesday after-hours (Thursday morning Beijing time), and the real debate is which benchmark matters. Street consensus stands at ~$2.13 EPS and ~$93.63B in revenue, while Morgan Stanley's estimate for the same quarter is ~$91.1B — meaning the same print could beat guidance yet miss an elevated sell-side bar. A second, harder threshold looms: data show Nvidia has fallen the day after earnings in each of the past four consecutive quarters, signaling that a beat alone is no longer sufficient — magnitude and forward trajectory are what the market demands. Key watch points include Rubin ramp pace, gross margin trajectory, and whether custom ASICs are eroding share. Nvidia has also warned major customers that AI server prices for early next-year shipments will rise more than 15% due to higher memory costs — protecting its own margins while raising the capex hurdle for customers. Currently 62 sell-side analysts rate it Strong Buy with a mean target of $304.73, implying ~42% upside, even as the stock closed down 0.98% last Friday. This week also brings the Jackson Hole symposium and Warsh's first appearance as Fed Chair — earnings and policy land simultaneously. Will you add before the print, wait for both Jackson Hole and earnings to clear, or rotate into Nvidia's upstream suppliers?" },
  { ticker: "MRVL", title_cn: "内部人套现6.3亿,迈威尔周四交卷谁的判断要认错?", body_cn: "迈威尔周四盘后交卷,共识是每股收益约0.94美元、营收约27.6亿美元,而它上周五先收跌5.57%进入财报周。这份财报要给一个已经摆开的分歧判胜负:一边是公司内部人在这轮160%的涨幅里累计卖出约6.32亿美元股票、CEO本人也有一笔约180万美元的操作,另一边是瑞银同期上调它的AI营收预期、认为还有数十亿美元增量。两种判断不可能同时对。看点很具体:定制ASIC与光互连的订单能不能兑现——这也是英伟达份额问题的另一面,如果定制芯片真在抢份额,受益的就是它;争议同样具体,有分析直接以\"股价与它自己的数字之间的差距\"为题质疑当前估值,而长端利率只要回头上行,这类靠2027年之后订单支撑的公司会先被折价。同一晚还有IREN、Workday、Affirm与SentinelOne,注意力会被分散。你会等这份财报再决定跟内部人还是跟卖方,直接换去财报已经落地的上游,还是先看杰克逊霍尔的措辞?", title_en: "Insiders Cashed Out $630M — Marvell Reports Thursday, Who Gets Proved Wrong?", body_en: "Marvell reports Thursday after-hours against consensus of ~$0.94 EPS and ~$2.76B in revenue, after closing down 5.57% last Friday heading into earnings week. The print will adjudicate a clear divide: insiders have sold approximately $632M in stock during the stock's 160% rally — including roughly $1.8M by the CEO — while UBS has simultaneously raised its AI revenue estimates for the company, projecting billions in incremental upside. Both views cannot be right at the same time. Specific watch points are whether custom ASIC and optical interconnect orders convert to revenue — the flip side of Nvidia's market-share question, as a genuine custom-chip share shift would benefit Marvell directly. Valuation is also under explicit scrutiny, with at least one analyst framing the debate as the gap between the stock price and the company's own reported numbers; any renewed rise in long-end rates would further discount a name whose story depends heavily on order visibility beyond 2027. The same evening also features IREN, Workday, Affirm, and SentinelOne, fragmenting attention. Will you wait for this print before deciding whether to follow insiders or sell-side, rotate into upstream names whose earnings have already landed, or watch Jackson Hole's tone first?" },
  { ticker: "CRM / CRWD / OKTA / HPQ", title_cn: "英伟达身后还挤着四份财报,软件的AI谁先被定价?", body_cn: "周三盘后除了英伟达,还有Salesforce、CrowdStrike、Okta与惠普四份财报挤在同一小时,这一晚的价值是能把\"AI到底有没有变成收入\"分三层来看。第一层是应用:Salesforce是AI Agent能否转成订阅收入的直接样本,它上周五收涨1.82%,市场要看的是席位数与单席位价格哪个在涨。第二层是安全支出:CrowdStrike上周五收涨0.85%,Okta同晚交卷,这两家决定\"AI时代的安全预算\"是不是还在扩张,而不只是重新分配。第三层是终端成本:惠普上周五收涨0.81%,它直面存储合约价上行,和小米被咬掉42.6%利润、英特尔GPU价格跳升48%是同一条账单的下游,PC厂商能不能把成本转嫁到售价上,这一晚就有答案。共同的争议是注意力:英伟达会吸走当晚绝大部分流动性,任何一家指引不及预期都会在薄成交里被放大。你会买AI变现最直接的Salesforce、押安全预算的CrowdStrike,还是赌惠普把成本转出去?", title_en: "Four More Earnings Stack Behind Nvidia — Which Software Name Gets AI Priced In First?", body_en: "Wednesday after-hours brings four additional reports alongside Nvidia — Salesforce, CrowdStrike, Okta, and HP — all in the same hour, offering a three-tiered read on whether AI is actually converting to revenue. At the application layer, Salesforce (up 1.82% last Friday) is the clearest test of whether AI Agent functionality can translate into subscription revenue, with the market focused on seat count versus per-seat pricing. At the security-spend layer, CrowdStrike (up 0.85%) and Okta reporting the same night will determine whether AI-era security budgets are still expanding or merely being reallocated. At the hardware-cost layer, HP (up 0.81%) faces rising memory contract prices directly — sitting on the same cost curve as Xiaomi's 42.6% gross-profit hit and Intel's 48% GPU price jump — and this evening will show whether PC vendors can pass those costs through to end prices. The shared risk is attention: Nvidia will absorb the majority of that night's liquidity, meaning any guidance miss from the other four gets amplified in thin trading. Will you buy Salesforce as the most direct AI monetization play, back CrowdStrike on security-budget expansion, or bet that HP can pass its costs through?" },
  { ticker: "IREN / NBIS", title_cn: "同行拿14亿营收借了50亿,IREN周四怎么回答?", body_cn: "IREN周四盘后交卷,上周五收跌1.69%。它是这周最能检验AI新云(neocloud)融资结构的一份财报,因为对照样本刚刚出现:同赛道的Nebius最终以50亿美元完成可转换票据发行(初始公告45亿,定价时上调,另附约8亿美元债转股交换),而它的营收基数只有约14亿美元,已经有报道直接以\"这是不是泡沫\"质问这个比例。IREN的差别在于路径:它从矿机业务转型而来、算力以自建为主,所以问题不是能不能借到钱,而是折旧与电力成本能不能被租约收入覆盖。多头的理由是自建路径的单位成本更低、不必反复靠可转债扩张;空头的理由是它的客户集中度与合约期限都比不上大厂,一旦AI资本开支节奏放缓,重资产会先受伤。你会选自建的IREN、靠融资扩张但增速更快的Nebius,还是等这一轮AI资本开支的指引先落地?", title_en: "A Peer Posted $1.4B Revenue and Borrowed $5B — How Does IREN Answer Thursday?", body_en: "IREN reports Thursday after-hours, having closed down 1.69% last Friday. It is this week's most direct test of neocloud capital structures, as a fresh comparable has just emerged: sector peer Nebius closed a convertible note offering at $5B (upsized from an initial $4.5B announcement, with an additional ~$800M debt-to-equity exchange), against a revenue base of only ~$1.4B — a ratio that has already drawn direct 'is this a bubble?' scrutiny in published commentary. IREN's differentiation lies in its path: transitioning from a mining business to primarily self-built compute, the question is not whether it can raise capital but whether depreciation and power costs can be covered by lease revenue. The bull case is lower unit economics on the self-build model without reliance on repeated convertible issuance; the bear case is that customer concentration and contract duration compare unfavorably to hyperscalers, leaving the heavy-asset model most exposed if AI capex pacing slows. Will you choose self-build IREN, financing-driven but faster-growing Nebius, or wait for this cycle's AI capex guidance to fully land first?" },
  { ticker: "PDD / XPEV / LI / BILI", title_cn: "沃尔玛刚给消费定了性,中概这周靠补贴还是靠利润?", body_cn: "中概这周从今晚开始连轴:拼多多今晚盘前打头(上周五收跌1.27%),随后是小鹏(收涨1.58%)、理想(收涨1.01%)、B站(收涨2.40%)与唯品会。它们要回答的是同一个问题,而且背景刚刚变了——沃尔玛上一份财报给出六年来最慢的美国同店增速,并把29亿美元关税退款直接用于降价,消费降级已经被最强的零售商亲口确认;放到中概身上,问题就变成补贴换来的增长能不能变成利润。拼多多的争议在Temu:海外补贴与关税成本同时压毛利,而国内主站的增速已经不像前两年。两家造车看的是交付量与单车毛利能不能同时成立,尤其在价格战没有停的前提下;B站要看广告与游戏这两块能不能一起兑现。风险是共同的:一旦哪一家承认\"增长要靠继续补贴\",整个板块的估值中枢都会下移;机会也是共同的,若有人能证明减少补贴后增速仍在,它会立刻被单独重估。你会押规模最大的拼多多、交付弹性更大的两家造车,还是等这一轮全部交卷再挑?", title_en: "Walmart Just Defined the Consumer — Can China ADRs Deliver Profit or Just Subsidies This Week?", body_en: "China ADR earnings run continuously this week starting tonight: PDD reports before the open tonight (down 1.27% last Friday), followed by XPeng (up 1.58%), Li Auto (up 1.01%), Bilibili (up 2.40%), and Vipshop. They all face the same question against a backdrop that just shifted — Walmart's latest results showed the slowest U.S. same-store sales growth in six years, with the retailer deploying $2.9B in tariff refunds directly into price cuts, and the world's largest retailer has now confirmed the consumer-downgrade thesis in its own words. Mapped onto China ADRs, the question becomes whether subsidy-fueled growth can convert to profit. PDD's debate centers on Temu, where overseas subsidies and tariff costs are simultaneously compressing gross margins even as domestic platform growth has decelerated from prior-year pace. The two EV names need to show delivery volumes and per-vehicle gross margin holding simultaneously — particularly with the price war still running. Bilibili must demonstrate that advertising and gaming can recover together. The shared risk: any company admitting that growth requires continued subsidies will drag down the sector's valuation floor. The shared opportunity: any name proving that growth holds after subsidy reduction will be re-rated immediately and in isolation. Will you back PDD for scale, either EV name for delivery upside optionality, or wait until the full slate has reported before picking?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
