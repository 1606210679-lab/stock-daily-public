<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-10-30 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-10-30</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 6</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:16.7%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 6 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ / .SPX / AMZN / MSFT / META", title_cn: "AI现金流分化，科技抛售会扩散吗？", body_cn: "QQQ在美股周四（10月29日）跌1.42%、标普500跌0.30%，财报季对科技巨头的考核已经从收入增长转向资本开支和现金回报。亚马逊正式收盘跌4.25%，随后公布营收2019亿美元、调整后每股收益1.89美元，均低于约2062.9亿美元和2.00美元预期；AWS收入481亿美元、同比增长39%，但财报公布后股价仍跌7.30%，过去12个月自由现金流因AI基础设施投入下降35%至422亿美元。多头的抓手是微软仅跌0.16%、Meta反而涨1.96%，说明市场仍愿意奖励能守住利润和现金流的公司；空头的抓手是收入加速如果伴随更快资本开支，估值容错率还会下降。亚马逊、微软与Meta中，谁最可能率先证明AI投入可以同步兑现现金回报？", title_en: "Cash Is the New AI Scorecard — Which Megacap Can Defend It?", body_en: "QQQ fell 1.42% and the S&P 500 fell 0.30% in the Thursday, October 29 U.S. session as earnings-season scrutiny of Big Tech shifted from revenue growth to capex and cash returns. Amazon closed down 4.25%, then posted $201.9 billion in revenue and $1.89 adjusted EPS, both missing estimates of about $206.29 billion and $2.00; AWS grew 39% to $48.1 billion, yet the stock fell another 7.30% after earnings as trailing 12-month free cash flow dropped 35% to $42.2 billion amid AI infrastructure spending. Bulls cite Microsoft's 0.16% dip and Meta's 1.96% gain; bears say faster capex would further compress valuation tolerance. Of Amazon, Microsoft and Meta, who will prove first that AI spending can deliver cash returns at the same time?" },
  { ticker: "GOOGL", title_cn: "谷歌暴跌12.64%，云翻倍也救不了吗？", body_cn: "GOOGL在美股周四（10月29日）跌12.64%，直接催化是利润、自由现金流和资本开支压力盖过了Google Cloud的高速增长。Alphabet第三季度营收1275.8亿美元，略低于约1279.6亿美元预期；每股收益2.12美元，也低于约3.02美元预期。Google Cloud收入307.1亿美元、同比增长103%，营业利润106.4亿美元，但季度自由现金流转为负90.7亿美元，资本开支达到514亿美元。公司维持全年资本开支1950亿至2050亿美元的指引，并预计2027年投入还会显著增加。多头看到云业务翻倍和积压订单提供长期收入，多空分歧则落在这些订单何时覆盖折旧与现金消耗。Google Cloud需要保持多快增长，才能让自由现金流在未来两个季度重新转正？", title_en: "Cloud Doubles, Cash Flow Turns Negative — What Broke at Alphabet?", body_en: "GOOGL fell 12.64% in the Thursday, October 29 U.S. session, with pressure on profit, free cash flow and capex outweighing Google Cloud's rapid growth. Alphabet posted third-quarter revenue of $127.58 billion, just below the approximately $127.96 billion expected, and EPS of $2.12 versus approximately $3.02 expected. Google Cloud revenue rose 103% to $30.71 billion with $10.64 billion in operating income, but quarterly free cash flow was negative $9.07 billion as capex hit $51.4 billion. The company maintained full-year capex guidance of $195 billion to $205 billion and expects spending to rise significantly again in 2027. Bulls see cloud growth and backlog underpinning long-term revenue; the split is over when that backlog covers depreciation and cash burn. How fast must Google Cloud grow to turn free cash flow positive again within two quarters?" },
  { ticker: "INTC", title_cn: "英特尔盘后跌23%，抄底还是观望？", body_cn: "英特尔在美股周四（10月29日）正式收盘跌3.62%，财报公布后再跌23.00%，直接催化是第四季度指引明显低于市场预期。第三季度营收165亿美元，低于约167.8亿美元预期；调整后每股收益0.41美元，略高于约0.40美元预期，但公司预计第四季度营收仅150亿至160亿美元、调整后每股收益0.25美元，分别低于约170亿美元和0.43至0.45美元预期。以色列工厂事故还预计拖累季度营收3亿美元、压低毛利率200个基点。多头看到数据中心收入增长78%，空头则盯住PC收入下降5%和指引缺口。在英特尔、戴尔、惠普与超微电脑这条PC链上，哪一个信号最可能先证明需求已经企稳？", title_en: "Intel's Forecast Craters — Is the PC Slump Getting Worse?", body_en: "Intel closed down 3.62% in the Thursday, October 29 U.S. session and fell another 23.00% after results, driven by fourth-quarter guidance well below expectations. Third-quarter revenue came in at $16.5 billion versus approximately $16.78 billion expected, with adjusted EPS of $0.41 slightly above approximately $0.40, but the company guided fourth-quarter revenue to just $15 billion to $16 billion and adjusted EPS to $0.25, below approximately $17 billion and $0.43 to $0.45. An accident at its Israel fab is expected to cut quarterly revenue by $300 million and gross margin by 200 basis points. Bulls point to 78% data centre revenue growth, bears to a 5% decline in PC revenue and the guidance gap. Across the Intel, Dell, HP and Super Micro PC chain, which signal is most likely to show demand has stabilised first?" },
  { ticker: "SNDK / MU / SKHY", title_cn: "闪迪毛利率85.1%，高景气见顶了吗？", body_cn: "闪迪在美股周四（10月29日）正式收盘跌5.32%，财报公布后再跌3.83%，即使业绩超过预期也未能扭转高预期下的获利回吐。公司2027财年第一季度营收110.3亿美元，高于约108.5亿美元预期；调整后每股收益49.51美元，也高于约47.15美元预期，数据中心收入48亿美元、环比增长61%，调整后毛利率达到85.1%。公司预计下一季度营收122亿至126亿美元、毛利率84.5%至85.5%，并计划11月19日实施1拆8。多头的抓手是企业级SSD需求与供应紧张仍在支撑价格，空头的抓手是美光同期跌4.98%、海力士跌1.58%，说明好消息已被提前交易。闪迪的超高毛利率、美光的估值与海力士的HBM供给纪律中，哪一项会成为存储板块下一轮定价核心？", title_en: "A Record Margin, Yet Shares Fall — Is Memory Priced for Perfection?", body_en: "SanDisk closed down 5.32% in the Thursday, October 29 U.S. session and fell another 3.83% after results, as an earnings beat failed to halt profit-taking against elevated expectations. Revenue for the first quarter of financial year 2027 was $11.03 billion, above approximately $10.85 billion expected, with adjusted EPS of $49.51 versus approximately $47.15; data centre revenue reached $4.8 billion, up 61% sequentially, and adjusted gross margin hit 85.1%. The company guided next-quarter revenue to $12.2 billion to $12.6 billion and gross margin to 84.5% to 85.5%, and plans an 8-for-1 split on November 19. Bulls cite enterprise SSD demand and memory supply constraints still supporting prices; bears note Micron fell 4.98% and SK Hynix 1.58%, suggesting the good news was already priced. Among SanDisk's margins, Micron's valuation and SK Hynix's HBM supply discipline, which will anchor the memory sector's next round of pricing?" },
  { ticker: "NOW", title_cn: "ServiceNow暴跌27%，AI软件要重估吗？", body_cn: "ServiceNow在美股周四（10月29日）跌26.95%，直接催化是财报虽保持增长，却没有达到高估值要求的盈利兑现速度。第三季度总营收44.5亿美元、订阅收入40.4亿美元，后者同比增长21%，当前剩余履约义务同比增长20%；但调整后每股收益1.00美元，略低于约1.02美元预期。公司把2026年AI年度合同价值目标从15亿美元上调至17亿美元，多头因此仍能看到生成式AI渗透和续费韧性；空头则认为AI订单增长尚不足以抵消利润率与估值压力。ServiceNow自身估值与整个AI软件板块的容错率，哪个因素更能解释这次暴跌？", title_en: "ServiceNow Delivers 21% Growth — Why Did the Market Cut 27%?", body_en: "ServiceNow fell 26.95% in the Thursday, October 29 U.S. session, driven by earnings growth that failed to deliver the profit conversion its rich valuation demands. Third-quarter total revenue was $4.45 billion, with subscription revenue of $4.04 billion, up 21% year on year, and current remaining performance obligations up 20%; adjusted EPS of $1.00 came in slightly below the approximately $1.02 expected. The company raised its 2026 AI annual contract value target from $1.5 billion to $1.7 billion, keeping bulls focused on generative AI adoption and renewal resilience, while bears argue AI order growth is not yet enough to offset margin and valuation pressure. How much of this plunge reflects ServiceNow-specific valuation pressure versus a sector-wide drop in execution tolerance?" },
  { ticker: "MRVL", title_cn: "迈威尔跌13%，光互连并购还值吗？", body_cn: "迈威尔在美股周四（10月29日）跌13.24%，与前一日上涨3.32%形成反转，直接催化是市场开始重新评估潜在收购Lumentum可能带来的融资、稀释与整合成本。战略层面，交换芯片、DSP与激光器件合并后可以覆盖更完整的AI数据中心光互连链条，多头看好客户协同和一站式供货；空头担心高溢价交易先侵蚀每股收益，且Lumentum订单周期与迈威尔芯片业务并不完全同步。迈威尔需要披露怎样的融资方案和协同目标，才能证明这笔潜在交易不会损害现有股东价值？", title_en: "A Bigger Optical Stack, a Smaller Valuation — Is Marvell Overpaying?", body_en: "Marvell fell 13.24% in the Thursday, October 29 U.S. session, reversing the prior session's 3.32% gain, as the market began reassessing the financing, dilution and integration costs of a potential Lumentum acquisition. Strategically, combining switching silicon, DSPs and laser components would cover a fuller optical interconnect chain for AI data centres, and bulls like the customer synergies and one-stop supply. Bears worry a rich-premium deal would dilute EPS first and note Lumentum's order cycle is not fully in sync with Marvell's chip business. What financing plan and synergy targets must Marvell disclose to prove the potential deal would not erode existing shareholder value?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
