<script>
const topics = [
  { ticker: ".SPX / QQQ", title_cn: "美伊传出停火共识,油价先跌2.1%抢跑了?", body_cn: "美伊传出停火共识,而油价已经先跑了一步:原油期货主连周二跌2.11%,尽管布伦特与WTI仍站稳80美元上方。真正落地的动作是航运层面的——美国海军清除了霍尔木兹海峡的水雷,海峡通行风险下降,这是当天可被核实的那一半。油价一松,地缘溢价与通胀预期同步退潮,标普500收涨0.32%、QQQ收涨0.62%,比特币盘中一度突破8万美元。缓和的另一半更值得留意:据巴基斯坦军方与伊朗安全部门消息人士向俄罗斯卫星通讯社透露,美伊已就停火条款达成共识、包含霍尔木兹海峡自由航行,预计未来几天官宣,双方将依托伊斯兰堡备忘录启动谈判与技术性会议——但这条消息目前只有单一来源、尚未有任何官方确认,不宜当成既成事实。更矛盾的是同一时间美方仍在加压:财长贝森特宣布对伊朗推出\"前所未有\"的经济行动,聚焦数字资产、技术、黄金、航空、航运五大领域,此前已启动\"经济之怒\"行动并威胁对支持伊朗的境外金融机构实施二级制裁。缓和与加压同时进行,意味着地缘溢价不是消失而是被压缩。今晚与明天还有两道更硬的关口:英伟达盘后交卷,以及随后公布的通胀数据。你会趁油价回落布局成长股、去买原油与能源股赌制裁落地,还是先等财报和通胀数据?", title_en: "U.S.-Iran Ceasefire Signals Emerge — Did Oil Already Price It In?", body_en: "Crude futures fell 2.11% Tuesday as reports — citing Pakistani military and Iranian security sources via Sputnik — indicated the U.S. and Iran have reached consensus on ceasefire terms, including free passage through the Strait of Hormuz, with an official announcement expected within days; the report remains single-source and unconfirmed. The U.S. Navy's removal of mines from the strait offered a verifiable de-escalation, compressing the geopolitical risk premium. Equities responded: the S&P 500 gained 0.32%, QQQ rose 0.62%, and Bitcoin briefly broke $80,000 intraday — even as Treasury Secretary Bessent announced \"unprecedented\" economic measures targeting Iran across five sectors. Will you buy growth stocks on the oil pullback, add crude and energy names as a sanctions play, or wait for earnings and inflation data first?" },
  { ticker: "MRNA", title_cn: "癌症疫苗被算出92亿美元峰值,Moderna再涨14%?", body_cn: "Moderna周二收涨14.36%至158.83美元,催化第一次从\"数据\"变成\"数字\":Wolfe Research把它从跑输上调至同步,理由是给个性化癌症疫苗intismeran算出了约92亿美元的峰值销售预期,巴克莱同步把目标价提到125美元。把最近四个交易日连起来看,这是一次完整的定价迁移——三期黑色素瘤数据公布当天涨176.97%,那一段主要是历史级轧空推的;次日跌23.55%是强制买盘走完后的获利了结;再一日涨8.86%、周二又涨14.36%,买盘的性质已经变了,现在定价的是\"这个平台每年能卖多少钱\",而不是\"终点有没有达标\"。空方的理由仍然扎实:完整数据集尚未公布,峰值销售是模型不是订单,而Wolfe这次上调也只是把评级从跑输移到同步、不是看多;公司近12个月营收22.3亿美元、同比仍下滑27.6%,2025年亏损28.2亿美元,盘后已小幅回落0.71%。真正的下一个节点是完整数据与定价、产能的落地时间表。你会按92亿美元的峰值预期建仓、换到确定分成的默沙东,还是等完整数据?", title_en: "Cancer Vaccine Valued at $9.2B Peak Sales — Can Moderna Hold a 14% Gain?", body_en: "Moderna closed up 14.36% at $158.83 Tuesday after Wolfe Research upgraded the stock from underperform to peer perform, citing a peak sales estimate of approximately $9.2 billion for personalized cancer vaccine intismeran; Barclays simultaneously raised its price target to $125. The four-session move represents a full pricing migration — from short-squeeze dynamics on Phase 3 melanoma data day to genuine platform valuation. Bears retain solid footing: the complete dataset has not been published, peak sales remain a model rather than an order, the Wolfe upgrade stops at peer perform, trailing 12-month revenue stands at $2.23 billion (down 27.6% year-over-year), and the 2025 net loss totals $2.82 billion, with the stock already slipping 0.71% after hours. Will you build a position on the $9.2 billion peak estimate, rotate into Merck for a confirmed revenue share, or wait for the full data readout?" },
  { ticker: "AMD", title_cn: "评级刚被上调,却有人说AMD容易赚的钱没了?", body_cn: "AMD周二收涨4.91%,是当天半导体里最强的大票之一,直接催化是卖方上调评级——它出现在当天的\"华尔街重点评级变动\"名单里,而这轮上调的逻辑离不开一件事:定制ASIC与第二供应商的价值,正在被英伟达的涨价动作反向推高。英伟达已警告大客户,因存储成本上升,明年初出货的AI服务器价格将上涨超过15%,当龙头把价格往上提,客户就更有动机给第二家下单,这是AMD最实际的机会窗口。反方声音同一时间出现,而且说得很直白:有分析以\"容易赚的钱已经没了\"为题提醒,它今年的涨幅已经把份额扩张的乐观预期提前定价,接下来要靠真实的出货与毛利率兑现;更宏观的担忧是有市场人士开始讨论AI泡沫是否临近破裂。今晚英伟达的财报会直接决定这条逻辑的成立方式:如果龙头指引强劲,整条链一起被抬;如果龙头承认成本压力,第二供应商反而更受青睐。你会在财报前押AMD的份额故事、等它自己的出货数据,还是先看今晚龙头怎么说?", title_en: "AMD Just Got Upgraded — But Has the Easy Money Already Been Made?", body_en: "AMD closed up 4.91% Tuesday, the strongest large-cap semiconductor on the day, after appearing on Wall Street's key rating-change list with a fresh upgrade underpinned by the rising strategic value of custom ASICs and second-source supply as Nvidia warns major customers of AI server price increases exceeding 15% due to rising memory costs. The higher Nvidia prices give customers a stronger incentive to diversify orders, opening a practical opportunity window for AMD. The contrarian view appeared simultaneously and bluntly: one note titled \"the easy money is gone\" argued that year-to-date gains have already front-run share-gain optimism, leaving real shipment and gross margin execution as the only remaining catalyst, while broader market discussion of a potential AI bubble adds a macro overhang. Will you hold AMD's market-share thesis into earnings, wait for its own shipment data, or let tonight's Nvidia results set the tone first?" },
  { ticker: "MU / SKHY / SNDK / SOXL / 07709", title_cn: "存储链集体反弹,只有闪迪逆势收跌怎么解释?", body_cn: "存储链周二跟着半导体一起反弹:美光收涨2.48%、SK海力士收涨2.68%,海力士2倍杠杆产品07709收涨0.54%,半导体三倍做多的SOXL收涨4.06%。但同一天有一个例外——闪迪逆势收跌0.83%,这是这条链上唯一没有跟上的一只,值得单独记一笔,因为此前它才是涨得最凶的那个,而近期被点名\"属于拥挤交易\"的也是它,拥挤的仓位在板块普涨时反而最先被减。反弹的支撑来自成本传导的确认:英伟达已警告大客户,因存储成本上升,明年初出货的AI服务器价格将上涨超过15%,这说明上游的合约价上行终于被下游接受、而不是自己消化,涨价的可持续性因此提高了一档。风险仍在两头:一头是需求端,涨价抬高AI机房的资本开支门槛,买算力的人可能自己先放慢;另一头是筹码,三星创纪录的股东回报方案落地后股价反跌,已经说明这条链的好消息在被提前消化。今晚英伟达的资本开支与毛利率口径,是判断这轮涨价能走多远的最直接线索。你会追弹性更大的美光与海力士、等闪迪的拥挤仓位出清,还是先看今晚的指引?", title_en: "Memory Stocks Rally Together — So Why Did SanDisk Buck the Trend?", body_en: "The memory complex rebounded Tuesday alongside semiconductors broadly: Micron gained 2.48%, SK Hynix rose 2.68%, the 2x leveraged SK Hynix product 07709 added 0.54%, and the 3x semiconductor long ETF SOXL climbed 4.06%. The sole exception was SanDisk, which fell 0.83% — the only name in the chain to close lower — notable precisely because it had been the strongest recent performer and the one most frequently flagged as a crowded trade, with crowded positioning often the first to be trimmed on a sector-wide up day. The rally's fundamental anchor was cost pass-through confirmation: Nvidia's warning that AI server prices will rise more than 15% early next year signals that upstream contract price increases are finally being absorbed downstream rather than self-digested, raising the sustainability of the pricing cycle by a notch. Will you chase the higher-beta Micron and SK Hynix, wait for SanDisk's crowded positioning to clear, or watch tonight's Nvidia capex and gross margin guidance first?" },
  { ticker: "BE", title_cn: "AI机房开始抢电,燃料电池股一天就涨6.6%?", body_cn: "AI这条链上最新被定价的不是算力而是电力。Bloom Energy周二收涨6.58%至217.45美元,催化有两条都很具体:卖方在上调它的盈利预测并重申买入,而披露文件显示佩洛西买入了这只票——后者本身不构成基本面,但对散户情绪的影响是真实的;另有分析直接以\"低估了它扩张的速度\"为题上调判断。逻辑并不复杂:AI数据中心的瓶颈已经从\"买不到卡\"往\"接不到电\"转移,电网新增容量的审批与建设周期以年计,而燃料电池可以在场内直接发电、绕开并网排队,这让它从传统的清洁能源标的变成了算力基建的一部分。空方的理由同样清楚:这类公司的订单确认周期长、单个项目金额大,收入波动会很剧烈,而估值已经按\"AI电力\"这个新标签重估过一轮;政策补贴的变化也会直接影响它的经济性。真正的验证点是下一份财报里的装机量与毛利率能不能同时改善。你会把它当算力基建买、换到电网设备与发电资产,还是等装机数据落地?", title_en: "AI Data Centers Are Competing for Power — Did That Just Drive Fuel Cell Stocks Up 6.6%?", body_en: "Bloom Energy closed up 6.58% at $217.45 Tuesday on two concrete catalysts: a sell-side earnings estimate upgrade with a reiterated buy rating, and disclosed purchases of the stock by Pelosi — the latter carrying no fundamental weight but a real impact on retail sentiment — alongside a separate note titled \"underestimating its expansion speed.\" The underlying logic is straightforward: the AI data center bottleneck has shifted from GPU availability to power availability, with grid interconnection queues measured in years, while on-site fuel cells can generate power directly without waiting for grid connection, repositioning the company from a clean-energy play to a piece of compute infrastructure. Bears point to long order-confirmation cycles, large project-level revenue volatility, a valuation already re-rated under the \"AI power\" label, and direct policy subsidy exposure. Will you buy it as compute infrastructure, rotate into grid equipment and generation assets, or wait for installation volumes to show up in the next earnings report?" },
  { ticker: "NBIS", title_cn: "龙头涨价15%,反而成了AI新云的好消息?", body_cn: "Nebius周二收涨5.24%,而这轮反弹背后有一个反直觉的逻辑正在被市场接受:英伟达对客户涨价超过15%,对AI新云(neocloud)未必是坏事。有分析针对同赛道的CoreWeave直接给出这个判断——当卡更贵,已经锁定产能与电力的算力供应商就更有定价权,租金可以跟着抬,而新进入者的门槛被同步推高。另有分析认为Nebius的建设速度超出市场认知。但风险也在同一批消息里:华尔街日报报道OpenAI的数据中心负责人已经离职,而这类新云公司的收入高度依赖少数几个大客户的扩张节奏,客户端的人事与战略变化会直接传导到租约。更实际的约束是它自己的资产负债表——刚以50亿美元完成可转债发行,而营收基数只有约14亿美元,利息与摊薄立刻发生、租约收入要等。今晚英伟达的资本开支指引会同时决定卡价与租金这两条曲线。你会买已锁定产能的Nebius、换到客户结构更分散的CoreWeave,还是等它的租约收入先跑出来?", title_en: "Nvidia's 15% Price Hike — Could It Actually Be Good News for AI Neoclouds?", body_en: "Nebius closed up 5.24% Tuesday as a counterintuitive thesis gained market traction: Nvidia raising prices more than 15% may not be bad news for AI neoclouds. Analysis applied directly to peer CoreWeave argues that pricier GPUs give capacity-locked compute providers greater pricing power — rents can move higher in tandem while the barrier to new entrants rises simultaneously — and a separate note argued Nebius is building faster than the market appreciates. Risk runs alongside the opportunity: the Wall Street Journal reported that OpenAI's head of data centers has departed, and neocloud revenue is highly concentrated among a small number of large customers whose internal personnel and strategic shifts transmit directly to lease terms. The balance sheet adds a harder constraint — Nebius recently closed a $5 billion convertible note offering against an annual revenue base of approximately $1.4 billion, meaning interest and dilution are immediate while lease revenue must be earned over time. Will you buy Nebius for its locked-in capacity, rotate to CoreWeave for its more diversified customer base, or wait for lease revenue to demonstrate a clear growth trajectory first?" },
  { ticker: "MSTR / CRCL", title_cn: "比特币一度破8万,Circle被算出65和140两个价?", body_cn: "油价回落把风险偏好推了回来,比特币周二盘中一度突破8万美元,不过截至今日又回落至约78,810美元、微跌0.20%,说明这个关口还没站稳。加密相关股票的弹性更大:Strategy周二收涨3.42%,Canaccord Genuity维持买入并把目标价上调至175美元;Coinbase收涨4.28%;稳定币发行方Circle收涨4.90%至92.02美元。Circle这只票值得单独看,因为它把当下加密资产的定价分歧放到了最大——Wolfe Research维持跑输评级,即便上调后的目标价也只有65美元,比92.02美元的现价低约29%;而Bernstein给出的目标价是140美元,伍德则公开称赞它的颠覆性——同一家公司的目标价区间从65美元到140美元,高低相差约115%。分歧的根子在稳定币的商业模式:收入主要来自储备资产的利息,所以它既受益于加密交易量扩张,又直接暴露在降息路径上——利率往下走,它的利息收入就变薄。这也解释了为什么本周的通胀数据与年会措辞对它比对比特币更关键。你会用MSTR做加杠杆的币价代理、买Coinbase的交易量,还是赌Circle的稳定币规模?", title_en: "Bitcoin Briefly Tops $80K; Circle Gets Two Targets — $65 and $140?", body_en: "Falling oil prices lifted risk appetite Tuesday, pushing Bitcoin briefly above $80,000 intraday before retreating to approximately $78,810, down 0.20%, signaling the level has not yet held. Crypto-linked equities showed greater momentum: Strategy rose 3.42% as Canaccord Genuity maintained buy and raised its target to $175; Coinbase gained 4.28%; stablecoin issuer Circle advanced 4.90% to $92.02. Circle encapsulates the widest pricing disagreement in the space — Wolfe Research maintains an underperform rating with a target of $65, roughly 29% below the current price, while Bernstein targets $140, with Cathie Wood publicly praising its disruptive potential, putting the target range at a roughly 115% spread. The divide stems from Circle's business model: revenue is driven primarily by interest on reserve assets, meaning the stock benefits from crypto transaction volume growth while simultaneously carrying direct exposure to the rate-cutting path — lower rates compress interest income. That also explains why this week's inflation data and Fed commentary matter more for Circle than for Bitcoin itself. Will you use MSTR as a leveraged Bitcoin proxy, buy Coinbase for transaction volume exposure, or bet on Circle's stablecoin scale?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
