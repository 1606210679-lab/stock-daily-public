<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-09-16 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-09-16</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 6</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:16.7%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 6 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ / SPY / .SPX", title_cn: "美联储今晚决议,加息25个基点能否被扛住?", body_cn: "周二三大指数一起收跌。QQQ收跌0.65%报704.54美元,SPY收跌0.46%报757.39美元,标普500收跌0.45%报7585.73点。压住盘面的是今晚：北京时间9月17日凌晨2点美联储公布利率决议,在油价上涨、美债收益率持续上行的背景下,交易员普遍押注把联邦基金利率目标区间上调25个基点,至3.75%-4.00%。华尔街策略师没有因此转向看空,摩根士丹利、摩根大通和高盛的说法是市场已经对政策转向定价,企业盈利和经济增长仍是支撑股市的主要因素,单次加息未必改变本轮行情的中期方向。也有人在讨论更激进的可能,认为上调50个基点才算真正的表态。多头的抓手是指数只跌不到1%,恐慌指数收在17.20,盘面并没有提前交易出恐慌;空头的抓手是银行股这轮正跟着通胀走弱,利率路径一旦被重新画过,“已经定价”这四个字就得重算。大行说市场已经定价完了,这话站得住吗?", title_en: "Fed Rate Decision Due: Can Markets Absorb a 25 bps Hike?", body_en: "All three major U.S. indices closed lower Tuesday, with QQQ down 0.65% to $704.54, SPY off 0.46% to $757.39, and the S&P 500 falling 0.45% to 7,585.73. What is pressing on the tape is tonight: the Fed announces its rate decision at 2 a.m. Beijing time on September 17, with traders widely expecting a 25 bps hike to a 3.75%–4.00% target range against a backdrop of rising oil prices and climbing Treasury yields. Morgan Stanley, JPMorgan, and Goldman Sachs argue markets have already priced in the pivot and that corporate earnings and economic growth remain the primary support for equities, with a single hike unlikely to change the medium-term direction of this move — though some see a 50 bps move as the only credible signal. Bulls point to the indices falling less than 1% and the VIX closing at 17.20, meaning the tape has not traded panic ahead of the decision; bears counter that bank stocks are weakening alongside inflation, and if the rate path gets redrawn, the claim that it is already priced in has to be recalculated. Have the major banks called the pricing correctly?" },
  { ticker: "SOXL / NVDA / AMD / INTC", title_cn: "AI放缓阵营分裂,芯片反弹能否延续?", body_cn: "主张放慢AI的阵营裂开了。Anthropic、OpenAI主张放慢前沿模型迭代并引入独立安全评估,美国总统特朗普和英伟达首席执行官黄仁勋则反对因“失控论”阻碍AI发展。黄仁勋的说法是安全警告值得重视,但末日预测缺乏科学依据,企业只有在无法控制研发时才应主动降速。这场分歧周一砸出的坑不浅,纳斯达克100指数跌0.8%,英伟达跌3.4%,美光跌4.5%,康宁重挫14%,只有网络安全概念逆势大涨。周二钱回来了一部分：AMD收涨2.19%报504.20美元,英伟达收涨0.57%报212.17美元,英特尔收跌0.05%报97.14美元基本走平。三倍做多半导体ETF(SOXL)收涨1.18%,它带三倍杠杆,涨跌幅本身会被放大,不能跟个股并排看。多头的抓手是已经有人把这轮下跌直接叫做值得买的坑;空头的抓手是要重新判断的不是情绪,而是算力投入到底削不削减。AI要放慢这个说法,被市场当真了几分?", title_en: "AI Slowdown Camp Fractures — Can the Chip Rebound Hold?", body_en: "The coalition advocating AI deceleration has split: Anthropic and OpenAI favor slowing frontier model development and introducing independent safety reviews, while President Trump and Nvidia CEO Jensen Huang oppose curbs based on \"loss-of-control\" arguments. Huang's position is that safety warnings deserve serious attention, but doomsday forecasts lack scientific grounding, and companies should slow down voluntarily only when they can no longer control their own R&D. Monday's fallout was steep — the Nasdaq 100 dropped 0.8%, Nvidia fell 3.4%, Micron lost 4.5%, and Corning plunged 14%, while cybersecurity names rallied against the tide. Tuesday saw a partial recovery: AMD rose 2.19% to $504.20, Nvidia gained 0.57% to $212.17, and Intel (INTC) was essentially flat, down 0.05% to $97.14. The 3x leveraged semiconductor ETF SOXL climbed 1.18%, but it carries three times leverage, so its moves are amplified by construction and cannot be read alongside single stocks. Bulls point to investors already calling this selloff a dip worth buying; bears counter that what has to be reassessed is not sentiment but whether compute spending actually gets cut. How seriously has the market actually taken the call to slow AI down?" },
  { ticker: "MU / SNDK / SKHY", title_cn: "存储不再同涨同跌,涨价故事要收尾了吗?", body_cn: "存储这一档周二走散了。美光收涨0.39%报927.60美元,闪迪收跌1.36%报1530.89美元,SK海力士收跌0.46%报174.83美元,同一天西部数据跌4%、希捷跌5%。周一还是整档一起挨打,隔一天就分出了方向。闪迪这边有自己的事,它刚对信贷额度做了再融资,而该给多少估值的争论正在变大——这一档的估值里装的本来就是涨价预期,融资动作会把这笔账摆得更明白。美光那边等的是9月30日的季报,那是最近一次能拿到真实报价和订单的机会。另一种看法是,真正卡住AI存储的东西可能跟芯片本身无关,而在配套和交付。多头的抓手是美光顶住了,需求端没有跟着一起塌;空头的抓手是同一条涨价逻辑撑不住四家走四个方向,总有一头是看错的。存储的涨价逻辑,现在还是一条线吗?", title_en: "Memory Stocks Diverge — Is the Price-Hike Narrative Fading?", body_en: "The memory sector fractured Tuesday: Micron edged up 0.39% to $927.60, while SanDisk fell 1.36% to $1,530.89, SK Hynix slipped 0.46% to $174.83, Western Digital dropped 4%, and Seagate lost 5% — a sharp contrast to Monday's uniform selloff. SanDisk faces its own headwinds after refinancing its credit facility, intensifying valuation debate in a sector priced on expectations of memory price increases. Micron awaits its September 30 quarterly results, the next real read on pricing and order trends. Another view holds that what actually constrains the AI memory boom may have nothing to do with chips and everything to do with supporting components and delivery. Bulls point to Micron holding up, meaning the demand side has not collapsed with the rest; bears counter that one price-increase thesis cannot support four names moving in four directions, so one end of it has to be wrong. Is the memory price-hike thesis still one coherent story?" },
  { ticker: "AVGO / META / ORCL", title_cn: "博通重申目标Meta自研芯片,AI的账怎么算?", body_cn: "周二市场开始查AI这笔账。博通收跌1.58%报339.27美元,它的首席执行官刚重申了那个很高的AI增长目标,股价却没买账。Meta收涨0.70%报670.24美元,它正在把自研AI芯片的动作做大,目的写得很直白：压成本——买铲子的开始自己造铲子。甲骨文收跌3.07%报140.35美元,这是连着跌的第三天,市场给的评价是6640亿美元积压订单撞上了现实。三家站在同一条链的不同位置：卖算力的重申指引,买算力的想少花钱,中间做交付的要把订单变成现金。多头的抓手是三家拿出来的都是可验证的动作,不是口号;空头的抓手是同一条链上三个位置同时被挑刺,说明被怀疑的不是某一家,而是这笔支出本身的回报节奏。AI这笔账,市场现在查得算不算早?", title_en: "Broadcom Reaffirms AI Target; Meta Bets on Custom Chips — Who Pays?", body_en: "Markets scrutinized AI spending Tuesday. Broadcom slipped 1.58% to $339.27 after its CEO reiterated ambitious AI growth targets that failed to impress investors. Meta rose 0.70% to $670.24 as it accelerates its in-house AI chip program to cut costs — the pick-and-shovel buyer is now making its own shovels. Oracle dropped 3.07% to $140.35 for a third consecutive decline, as the market questioned whether its $664 billion backlog can convert to cash. The three sit at different points on the same chain: the compute seller reaffirms guidance, the compute buyer wants to spend less, and the one handling delivery in between has to turn orders into cash. Bulls point to all three putting forward verifiable actions rather than slogans; bears counter that three positions on one chain drawing fire at once says what is being doubted is not any single company. With all three positions on the same AI supply chain under pressure simultaneously, is the market questioning the return timeline of the entire spend — not just any single company?" },
  { ticker: "CRCL", title_cn: "稳定币法案参议院受阻,Circle能否站稳?", body_cn: "Circle收跌11.41%报86.30美元,是周二跌得最狠的一只。原因很明确：CLARITY法案在参议院投票落空,加密的监管框架没能定下来。同一天Coinbase和Bitmine各跌约5%,比特币跌3.13%报75453.83美元,方舟投资在投票前减了加密相关持仓。多头的抓手是法案没过不等于方向变了,稳定币的合规需求还摆在那儿;空头的抓手是框架不落地,机构资金就没法按规矩进场,而这条线的估值一直是按监管会落地算的。监管迟迟不落地,稳定币这条线还能走多远?", title_en: "Stablecoin Bill Stalls in Senate — Can Circle Hold Its Ground?", body_en: "Circle tumbled 11.41% to $86.30, Tuesday's worst-performing name, after the CLARITY Act failed to pass a Senate vote, leaving crypto's regulatory framework unresolved. Coinbase and Bitmine each fell roughly 5%, Bitcoin dropped 3.13% to $75,453.83, and Ark Invest trimmed crypto-related holdings ahead of the vote. Bulls argue a failed vote does not change the direction of stablecoin adoption; bears counter that without a settled framework, institutional capital cannot enter on compliant terms — and valuations in this space have always assumed regulatory clarity would arrive. With regulation continuing to stall, how much further can the stablecoin trade run?" },
  { ticker: "TSLA / GOOG", title_cn: "Cybercab遇冷,无人出租车换领跑者了吗?", body_cn: "无人出租车的领跑位置周二换了说法。特斯拉收跌0.67%报356.58美元,Alphabet收跌1.24%报341.43美元。Cybercab的发布没能点着市场,监管方又问了一个很实的问题：没有方向盘的车,人到底能不能开。这个问题卡在量产前面。被摆到领跑者位置上的是Waymo,它归Alphabet。两只当天都跌,说明这不是谁抢了谁的钱,而是整条线在决议前夜一起被压住了。多头的抓手是路权和实际里程这类壁垒要用时间换,先跑出来的拿的是真优势;空头的抓手是特斯拉的估值里已经装进了无人出租车这一块,进度一慢,装进去的部分就得往外吐。押注无人出租车,现在给特斯拉的定价合理吗?", title_en: "Cybercab Underwhelms — Has the Robotaxi Lead Changed Hands?", body_en: "The robotaxi frontrunner narrative shifted Tuesday. Tesla fell 0.67% to $356.58 and Alphabet lost 1.24% to $341.43 — both declining together, signaling broad sector pressure ahead of the Fed decision rather than market-share rotation. The Cybercab launch failed to ignite investors, and regulators raised a pointed question: can a vehicle without a steering wheel legally be operated by a person? That question sits directly in the path of mass production. Waymo, owned by Alphabet, has been repositioned as the sector leader. Bulls point to barriers like road rights and real-world mileage taking time to build, so whoever gets out front holds a genuine advantage; bears counter that Tesla's valuation already has the robotaxi piece built into it, and any slippage in timeline means part of that has to come back out. With robotaxi progress slowing, is Tesla's current valuation still justified?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
