<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-07-29 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-07-29</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 9</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:11.1%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 9 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "SKHY / SNDK / MU / DRAM / SOXS", title_cn: "存储集体崩14%,海力士财报未达标还要杀多深?", body_cn: "存储链周二日间先崩:闪迪跌14.25%、存储ETF(DRAM)跌8.89%、美光跌8.85%、海力士跌8.98%,导火索是韩国KOSPI一个月跌近28%与中国CXMT扩产,此时财报尚未公布。收盘后海力士交卷,净利同比暴增约12倍但营收未达目标,夜盘再跌4.79%。恐慌另一端,三倍做空半导体ETF(SOXS)暴涨14.45%、做多的SOXL跌14.52%、海力士2倍杠杆07709跌18.99%。当最硬的HBM财报也没止住血,这轮杀跌是接近出清还是刚开始?", title_en: "Memory Stocks Crash 14%; SK Hynix Misses Revenue — How Much Deeper?", body_en: "Memory-chain stocks collapsed Tuesday: SanDisk -14.25%, DRAM ETF -8.89%, Micron -8.85%, SK Hynix -8.98%, driven by KOSPI's nearly 28% one-month decline and China's CXMT capacity expansion. After the close, SK Hynix reported net profit surging roughly 12x year-over-year but missed revenue targets, sending its shares down another 4.79% in after-hours. SOXS surged 14.45% while SOXL fell 14.52% and the 2x Hynix leverage product 07709 dropped 18.99%. With even the strongest HBM earnings failing to stem the bleeding, is this selloff nearing a flush-out or just getting started?" },
  { ticker: "AMD", title_cn: "AMD跌超8%,AI融资质疑把补跌变主跌了?", body_cn: "AMD周二重挫8.15%,个股无独立利空,主因是芯片股在\"AI融资可持续性\"质疑下集体扩大回调,存储崩盘的抛压顺着算力链传导至GPU与CPU。市场同时在重新比价AI受益标的的性价比,数据中心订单能见度成为多头仅剩的支点。当杀跌从存储蔓延到算力核心,AMD的Helios平台叙事还顶得住吗?", title_en: "AMD Drops Over 8% — Is AI Funding Doubt Turning Catch-Up Selling Into the Main Leg Down?", body_en: "AMD tumbled 8.15% Tuesday with no company-specific negative catalyst, as chipmakers broadly extended declines amid mounting skepticism over AI financing sustainability, with memory-sector selling pressure transmitting through the compute chain into GPU and CPU names. Markets are simultaneously repricing the risk-reward of AI beneficiary stocks, leaving data center order visibility as the lone remaining pillar for bulls. With the selloff spreading from memory into the core of the compute stack, can AMD's Helios platform narrative hold?" },
  { ticker: "INTC", title_cn: "英特尔再跌近6%,财报利好被板块砸回去了?", body_cn: "英特尔周二收跌5.86%,上周财报与代工大单带来的反弹被半导体整体抛售抹平,卖方口径其自6月以来已回撤约39%。多头理由仍是服务器芯片定价改善与代工客户落地,空头担心AI资本开支预期一旦下修,代工扩产就变成重资产陷阱。当板块beta压过个股alpha,这个位置是错杀还是估值重构的开始?", title_en: "Intel Falls Nearly 6% — Earnings Gains Erased by Sector Selloff?", body_en: "Intel closed down 5.86% Tuesday, fully reversing gains from last week's earnings beat and foundry contract announcement as broad semiconductor selling wiped out the rally; sell-side notes indicate the stock has pulled back roughly 39% since June. Bulls point to improving server chip pricing and foundry customer wins, while bears warn that any downward revision to AI capex expectations could turn foundry capacity expansion into a heavy-asset trap. With sector beta overwhelming stock-specific alpha, is this position a mispricing or the start of a valuation reset?" },
  { ticker: "MRVL", title_cn: "迈威尔跌近8%,AI融资疑云还要杀多深?", body_cn: "迈威尔周二收跌7.77%,在AI融资可持续性疑云下随芯片股扩大跌幅,已有卖方公开讨论\"还能跌到哪里\"。定制ASIC与光互连是它的AI核心资产,也有机构把它列为海力士、英伟达之后的下一批受益者,同一份基本面被读出两种方向。当分歧极端化,迈威尔该按周期股还是成长股定价?", title_en: "Marvell Drops Nearly 8% — How Deep Can AI Funding Uncertainty Cut?", body_en: "Marvell closed down 7.77% Tuesday, extending losses alongside chipmakers as doubts over AI financing sustainability intensified, with some sell-side analysts openly debating a floor. Custom ASICs and optical interconnects are its core AI assets, and certain institutions rank it among the next wave of beneficiaries after SK Hynix and Nvidia — yet the same fundamentals are being read in opposite directions. With the divergence reaching an extreme, should Marvell be priced as a cyclical or a growth stock?" },
  { ticker: "NVDA", title_cn: "英伟达存储血洗日几乎收平,市值第一丢了?", body_cn: "英伟达周二微涨0.25%,在存储与芯片板块普跌中几乎收平,相对强势突出。其HBM供应商海力士利润超预期但营收不及目标,给算力链供需留下双向解读空间;同时苹果市值反超英伟达,资金正从高beta的AI硬件回流确定性资产。当板块杀跌而龙头抗跌,这种分化是资金抱团还是补跌前的错觉?", title_en: "Nvidia Nearly Flat on Memory Sector Bloodbath — Has It Lost the Top Market Cap Spot?", body_en: "Nvidia edged up 0.25% Tuesday, standing out for its relative resilience as memory and chip stocks broadly sold off. HBM supplier SK Hynix posted above-consensus profit but missed revenue targets, leaving the compute-chain supply-demand picture open to interpretation in both directions; meanwhile Apple's market cap surpassed Nvidia's as capital rotated from high-beta AI hardware into defensive assets. With the sector selling off while the leader holds, is this divergence genuine institutional conviction or an illusion before a catch-up decline?" },
  { ticker: "GLW", title_cn: "康宁财报后暴跌12%,光通信高增长为何不买账?", body_cn: "康宁周二重挫12.10%,创四个月最大单日跌幅,导火索是Q2财报公布后市场不买账——电话会显示光通信业务保持强劲增长,但增量不足以匹配此前被抬高的AI光纤预期。同期芯片与AI硬件链在资本开支质疑下同步承压,放大了这次杀跌。当\"业绩好但预期更高\"成为财报季主旋律,康宁这跌是错杀还是估值重设?", title_en: "Corning Plunges 12% After Earnings — Why Isn't Strong Optical Growth Enough?", body_en: "Corning tumbled 12.10% Tuesday, its largest single-day decline in four months, after markets rejected its quarterly results — the earnings call highlighted strong optical communications growth, but the incremental gains fell short of elevated AI fiber expectations priced in beforehand. Simultaneous pressure across the chip and AI hardware chain on capex sustainability concerns amplified the selloff. With \"strong results but even higher expectations\" emerging as the earnings season theme, is Corning's drop a mispricing or a valuation reset?" },
  { ticker: "PLTR", title_cn: "Palantir一天回吐6%,财报前抢跑资金撤了?", body_cn: "Palantir周二收跌6.08%,几乎回吐前一日由财报预期驱动的全部涨幅,盘面被解读为财报前的获利了结。高估值标的在AI资本开支质疑升温时首当其冲,叠加其CEO与Anthropic就开源权重的公开交锋带来噪音。政企AI订单增速仍是它唯一的估值支点。当抢跑资金先撤,这份财报要多超预期才填得回缺口?", title_en: "Palantir Gives Back 6% in One Day — Did Pre-Earnings Front-Runners Just Exit?", body_en: "Palantir closed down 6.08% Tuesday, nearly erasing all prior-session gains driven by earnings anticipation, with the tape read as pre-earnings profit-taking. High-valuation names are most exposed as skepticism over AI capex sustainability heats up, compounded by noise from a public spat between its CEO and Anthropic over open-source model weights. Government and enterprise AI order growth remains its sole valuation anchor. With front-runners already out, how large a beat does this earnings report need to close the gap?" },
  { ticker: "SPCX", title_cn: "SpaceX逆势涨2.6%,大行喊的目标价靠谱吗?", body_cn: "SpaceX相关标的周二收涨2.56%,在科技股普跌中逆势走强,催化来自卖方给出的极高目标价——雷蒙德詹姆斯的定价被同行形容为\"荒谬\"。行业会议同时放大商业航天热度,星链与低轨轨道AI被视为新的交易主线。公司将于8月4日交出上市后首份季报。当估值靠叙事撑起,首份财报会是验证还是杀估值的起点?", title_en: "SpaceX Gains 2.6% Against the Tide — Can the Street's Target Price Be Trusted?", body_en: "SpaceX-linked shares rose 2.56% Tuesday, bucking broad tech weakness, with a catalyst from a sell-side price target that peers have publicly described as \"absurd.\" An industry conference simultaneously amplified commercial space enthusiasm, with Starlink and low-orbit AI positioned as emerging trade themes. The company is set to report its first post-listing quarterly results on August 4. With the valuation underpinned largely by narrative, will that first earnings report serve as validation or a trigger for a valuation reset?" },
  { ticker: "QQQ", title_cn: "纳指ETF逆势收跌,议息夜撞双巨头财报怎么走?", body_cn: "QQQ周二收跌0.97%,盘面继续分化:油价回落推动道指录得三连涨,芯片股崩盘却拖累纳指走弱。美联储利率决议今夜揭晓,随后微软与Meta盘后交卷,苹果、亚马逊本周四接棒,宏观与业绩的定价窗口高度重叠。中国存储竞争与AI资本开支回报是当下最大的两个不确定性。当议息与Mag-7财报撞在同一晚,这轮回调会被确认还是被打断?", title_en: "Nasdaq ETF Closes Lower; Fed Decision Meets Twin Mega-Cap Earnings Tonight — What's Next?", body_en: "QQQ closed down 0.97% Tuesday as markets continued to diverge: easing oil prices helped the Dow notch a third straight gain while a chip-sector rout dragged the Nasdaq lower. The Fed's rate decision is due tonight, followed by Microsoft and Meta reporting after the close, with Apple and Amazon set to follow later this week — compressing macro and earnings pricing windows into the same period. China memory competition and AI capex return on investment remain the two largest overhanging uncertainties. With the Fed decision and Mag-7 earnings colliding on the same night, will this pullback be confirmed or interrupted?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
