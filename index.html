<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;

    min-height: 100vh; display: flex; flex-direction: column;

  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }

  /* Card */

  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */

  /* Buttons */

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }

  /* Nav */

<script>
const topics = [
  { ticker: "PLTR / SNAP", title_cn: "Palantir飙29%Snap涨15%,连空头都投降了?", body_cn: "Palantir周二日间暴涨29.45%,Q2营收19.35亿美元、同比增93%,调整后每股收益0.41美元;Snap同日涨14.88%,营收15.99亿美元增19%,净亏损从2.63亿收窄到1.64亿——应用层同时交出了增速和利润。更值得看的是持仓变化:约30%的拉升让做空者账面亏损约30亿美元,大空头伯里已平掉半数PLTR空头,而段永平年初建仓后仍在卖出看跌期权加码。当空头认输与价值投资人进场同时发生,这波定价是被确认还是被挤出来的?", title_en: "Palantir Surges 29%, Snap Jumps 15% — Are Even the Bears Capitulating?", body_en: "Palantir soared 29.45% Tuesday after reporting Q2 revenue of $1.935 billion, up 93% year-over-year, with adjusted EPS of $0.41; Snap rose 14.88% on revenue of $1.599 billion, up 19%, as its net loss narrowed from $263 million to $164 million. The rally inflicted roughly $3 billion in mark-to-market losses on short sellers, with prominent bear Michael Burry having already closed half his PLTR short position, while Duan Yongping — who initiated a position earlier this year — continues adding exposure via put-selling. With short-covering and value buyers entering simultaneously, is this repricing a genuine confirmation or a squeeze?" },
  { ticker: "SPCX", title_cn: "SpaceX利好当天走完,明天9亿股谁来接?", body_cn: "SpaceX周二日间大涨9.43%,盘后首份公开财报出炉后跳水8.04%、一度跌近9%,利好在同一天里被消化干净。报表其实是两好一坏:核心财务指标明显好于预期、营收同比增约92%,AI业务亏损收窄的进度也强于预期,唯独AI相关资本支出高于预期,对英伟达的巨额采购承诺被摆到台前。而筹码要到明天才落地——最多约9.115亿股内部人与员工持股解禁,占总可解禁股份的20%。当好消息走在前面、卖压排在后面,明天接盘的人凭什么定价?", title_en: "SpaceX Catalysts Spent in One Day — Who Absorbs 910M Shares Tomorrow?", body_en: "SpaceX surged 9.43% intraday Tuesday, then dropped 8.04% after-hours — briefly falling nearly 9% — after releasing its first public earnings report, with the positive catalyst fully digested within a single session. The results were two positives and one negative: core financial metrics beat expectations with revenue up roughly 92% year-over-year, and AI segment losses narrowed faster than forecast, but AI-related capital expenditure exceeded estimates, putting a large procurement commitment to Nvidia front and center. With the positive news already priced in and a lock-up expiry of up to approximately 911.5 million insider and employee shares — 20% of total eligible shares — hitting tomorrow, on what basis will buyers set their price?" },
  { ticker: "AMD", title_cn: "AMD业绩不差却盘后跌8.7%,预期是不是太满?", body_cn: "AMD周二日间涨7.00%、与英特尔一同领涨芯片股,但盘后财报公布后急跌8.68%。关键指标与华尔街预期对比后被判定\"稳健有余、惊喜不足\",数据中心加速卡的份额叙事没能给出超预期增量。此前股价已在AI乐观情绪中连续修复,预期被提前打满。当\"solid\"变成利空,AMD要用什么才能重新撬动这轮定价?", title_en: "AMD Beats but Falls 8.7% After-Hours — Were Expectations Already Too High?", body_en: "AMD rose 7.00% intraday Tuesday, co-leading the chip rally alongside Intel, before tumbling 8.68% after-hours following its earnings release. Key metrics were deemed \"solid but unsurprising\" relative to Wall Street expectations, with the data center accelerator market-share narrative failing to deliver an upside surprise. The stock had already rallied substantially on AI optimism, with expectations fully front-loaded. When \"solid\" becomes a disappointment, what will it take for AMD to re-ignite this repricing?" },
  { ticker: "MU / SNDK / SKHY / SOXL", title_cn: "存储链全线暴涨,美光新平台把周期问题答了?", body_cn: "存储链周二集体重估:美光涨7.62%、闪迪涨10.84%、海力士涨8.17%,三倍做多半导体ETF(SOXL)飙19.87%。催化一是美光发布新的AI存储平台,美银同时把此前的回调定义为\"终端需求稳健下的买点\";二是海力士被Wolfe Research与RBC双双首次覆盖、均给出Outperform与200美元目标价,而它与闪迪正联手攻AI的下一个瓶颈。今晚闪迪与西数交卷。当卖方集体转向、平台叙事补位,存储的周期争议这次会被业绩终结吗?", title_en: "Memory Stocks Surge Across the Board — Has Micron's New Platform Settled the Cycle Debate?", body_en: "Memory stocks staged a broad rally Tuesday: Micron gained 7.62%, SanDisk surged 10.84%, SK Hynix rose 8.17%, and the 3x leveraged semiconductor ETF SOXL spiked 19.87%. The dual catalysts were Micron's launch of a new AI memory platform — with BofA simultaneously framing the prior pullback as a buying opportunity given resilient end demand — and SK Hynix receiving its first-ever coverage from both Wolfe Research and RBC, each assigning an Outperform rating with a $200 price target, as SK Hynix and SanDisk jointly target the next AI bottleneck. With sell-side sentiment turning collectively bullish and a new platform narrative filling the gap, will this earnings cycle finally put the memory cycle debate to rest?" },
  { ticker: "MRVL / AAOI", title_cn: "AAOI飙19%迈威尔涨13%,禁令反成光模块红利?", body_cn: "光互连成为周二最猛的分支:Applied Optoelectronics暴涨19.44%,直接催化是一项拟禁止中国AI硬件的提案,国产替代逻辑被瞬间放大;迈威尔涨12.81%,其看涨期权出现罕见的巨量异动,卖方同时在讨论\"打折后是否算便宜\"。Arista对AI网络需求给出乐观指引,进一步印证互连环节的紧俏。当政策与需求同向,光模块这波重估还有多少空间?", title_en: "AAOI Surges 19%, Marvell Gains 13% — Is the Ban Actually a Tailwind for Optical Modules?", body_en: "Optical interconnects were Tuesday's strongest subsector: Applied Optoelectronics surged 19.44%, directly catalyzed by a proposed ban on Chinese AI hardware that instantly amplified the domestic-substitution thesis; Marvell rose 12.81%, with unusually large bullish options activity while analysts debated whether the discounted valuation now looks attractive. Arista's upbeat guidance on AI networking demand further confirmed tightness across the interconnect layer. With policy and demand now pointing in the same direction, how much further can this optical module repricing run?" },
  { ticker: "INTC", title_cn: "英特尔涨10.8%,AI合作把估值争议压住了?", body_cn: "英特尔周二大涨10.84%、夜盘小幅回吐3.38%,与AMD共同领涨这轮芯片反弹。驱动来自二季度指引与AI合作进展的更新,卖方开始重新讨论\"现价是否已算合理\",此前\"估值被充分定价\"的口径明显松动。真正的考验仍是代工客户落地与先进制程的产能利用率。当反弹幅度已经跑到两位数,英特尔的AI叙事撑得住多久?", title_en: "Intel Jumps 10.8% — Has the AI Partnership Narrative Silenced the Valuation Bears?", body_en: "Intel surged 10.84% Tuesday before giving back 3.38% in after-hours trading, co-leading the chip rebound alongside AMD. The move was driven by updated second-quarter guidance and progress on AI partnership developments, prompting the sell-side to revisit whether the current price is now fair — a meaningful shift from the prior consensus that valuation was fully priced in. The real tests remain foundry customer wins and capacity utilization on advanced nodes. With the rally already in double-digit territory, how long can Intel's AI narrative hold?" },
  { ticker: "NVDA", title_cn: "英伟达涨2.6%,SpaceX的开支单成了它的订单?", body_cn: "英伟达周二涨2.56%,涨幅不大但角色关键:SpaceX首份财报暴露出巨额资本开支,其中对英伟达的采购承诺被市场直接读成算力需求的确认——同一份财报里,SPCX盘后跳水而NVDA走高。这把\"客户烧钱\"与\"供应商收钱\"的分化摆得格外清楚。当买方的成本变成卖方的确定性,英伟达的定价还需要看谁的脸色?", title_en: "Nvidia Gains 2.6% — Did SpaceX's Capex Bill Become Its Purchase Order?", body_en: "Nvidia rose 2.56% Tuesday in a move that was modest in size but significant in signal: SpaceX's inaugural earnings report revealed substantial capital expenditure, with a major procurement commitment to Nvidia read directly by the market as confirmation of sustained compute demand — in the same session, SpaceX fell sharply after-hours while Nvidia moved higher. The divergence put the \"customer's cost is the supplier's certainty\" dynamic on sharp display. When a buyer's spending becomes a seller's visibility, whose signals does Nvidia's valuation still need to follow?" },
  { ticker: "AAPL", title_cn: "苹果涨2%,库克正式交棒该抄底还是观望?", body_cn: "苹果周二涨1.96%,消息面尘埃落定——CEO蒂姆·库克确认卸任,卖方立刻列出\"接任期该逢跌买入\"的三条理由,把交棒当作估值重置的起点而非风险。另一条线索是OpenAI在商业秘密诉讼中提交了苹果员工的短信记录,AI人才与技术边界的摩擦公开化。存储成本上行仍压着硬件毛利。当掌舵人换手,苹果的AI补课节奏会加快还是更谨慎?", title_en: "Apple Rises 2% — Is Cook's Succession a Buying Opportunity or a Wait-and-See Moment?", body_en: "Apple rose 1.96% Tuesday as CEO Tim Cook confirmed his departure, with the sell-side immediately laying out three reasons to buy the dip during the transition period, framing the handover as a valuation reset rather than a risk event. A separate development saw OpenAI submit Apple employee text messages in a trade-secret lawsuit, bringing AI talent and technology boundary disputes into the open. Rising memory costs continue to weigh on hardware margins. With a leadership change underway, will Apple's AI catch-up accelerate or turn more cautious?" },
  { ticker: "AMZN", title_cn: "亚马逊跌2.3%,减持余波还是AI开支被追问?", body_cn: "亚马逊周二收跌2.32%,是大市值里少见的下跌,前一夜贝索斯申报出售1500万股的余波仍在发酵。同时公司正把Prime Video打造成AI能力的展示窗口,被解读为向市场证明AI投入的去处;但最新电话会上,它也面对了关于开支与回报的最尖锐提问。市值刚破3万亿,分歧立刻转向\"这笔钱花得值不值\"。当创始人减持与AI叙事同时摆上桌,资金该信哪一边?", title_en: "Amazon Falls 2.3% — Bezos Overhang or Scrutiny Over AI Spending?", body_en: "Amazon closed down 2.32% Tuesday — a rare decline among large-cap names — as the aftershocks of Bezos's filing to sell 15 million shares the prior evening continued to weigh. The company is simultaneously positioning Prime Video as a showcase for its AI capabilities, framing it as evidence that AI investment has a clear destination; yet on its latest earnings call it also faced the sharpest questions yet on spending and returns. With its market cap having just crossed $3 trillion, debate has quickly shifted to whether that capital is being deployed wisely. With the founder selling and the AI narrative still unproven, which signal should investors follow?" },
  { ticker: "QQQ / CRWV", title_cn: "标普道指齐创新高,AI扩散是接棒还是补涨?", body_cn: "QQQ周二大涨3.40%,标普500指数涨1.79%、SPY涨1.80%,标普与道指双双收创历史新高。真正的变化是买盘位置:亚马逊上周用AWS近四年最快增速证明了算力投入能收回来,资金随后从云厂商向AI软件与数据中心基建外扩,CoreWeave同日再涨7.16%。但扩散既可能是行情变厚,也可能是龙头钱赚完了往外找标的;也有人提醒真正的风险不是关税,而是沃什治下的联储路径。当涨的标的越来越多、领涨的越来越弱,这轮新高该按哪个信号交易?", title_en: "S&P and Dow Hit Record Highs — Is AI Broadening a Relay or Just a Catch-Up Trade?", body_en: "QQQ surged 3.40% Tuesday while the S&P 500 gained 1.79% and SPY rose 1.80%, with both the S&P and the Dow closing at all-time highs. The key shift was in where the buying occurred: after Amazon last week posted its fastest AWS growth in nearly four years — validating returns on compute investment — capital rotated outward from cloud names into AI software and data center infrastructure, with CoreWeave gaining another 7.16% on the day. Some observers note the broadening could signal a thickening rally, while others warn it may reflect rotation away from leaders that have already run; separately, voices are flagging that the real risk is not tariffs but the Fed's policy path under Warsh. With more names rallying but leadership thinning, which signal should guide trading at these highs?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
