<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Topics Review — 2026-09-17 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-09-17</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 6</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:16.7%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 6 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ / SPY / .SPX", title_cn: "美联储三年来首次加息,指数为何没松口气?", body_cn: "北京时间9月17日凌晨2点,美联储宣布加息25个基点,把基准利率上调至3.75%-4.00%,是2023年7月以来首次加息,此前连续五次会议按兵不动。结果符合预期,指数却没松口气：QQQ收涨0.03%报704.72美元,SPY收跌0.44%报754.05美元,标普500收跌0.45%报7551.81点,黄金同期涨1.10%。压住盘面的是两件事。一是点阵图,19名官员里有16人认为今年还应再加一次;二是美联储主席沃什在发布会上的说法——通胀过高且持续太久,夏季数据未见明显改善。摩根士丹利、摩根大通和高盛仍然不看空,理由是市场已经对政策转向定价,企业盈利和经济增长才是支撑股市的主要因素。多头的抓手是靴子落地,指数只跌不到半个百分点;空头的抓手是这次被定价的是一次加息,而点阵图给的是两次。点阵图说今年还要再加一次,这件事市场认了吗?", title_en: "Fed Hikes for First Time in Three Years — Why No Market Relief?", body_en: "At 2 a.m. Beijing time on September 17, the Federal Reserve raised its benchmark rate by 25 basis points to 3.75%–4.00%, its first hike since July 2023 after holding steady across five consecutive meetings. Despite an in-line result, markets failed to rally: QQQ edged up 0.03% to $704.72, SPY fell 0.44% to $754.05, the S&P 500 dropped 0.45% to 7,551.81, while gold gained 1.10%. The drag came from the dot plot — 16 of 19 officials favor another hike this year — and Fed Chair Warsh's warning that inflation remains too high and too persistent, with no clear improvement in summer data. Morgan Stanley, JPMorgan, and Goldman Sachs remain constructive, arguing markets have already priced a policy pivot and that corporate earnings and economic growth are the primary equity drivers. Bulls note the index fell less than half a percent once the shoe dropped; bears counter that markets priced one hike while the dot plot signals two. Has the market fully accepted the dot plot's call for another hike this year?" },
  { ticker: "NVDA / AMD / SOXL / AVGO", title_cn: "AI放缓从表态走到动手,芯片为何还在涨?", body_cn: "放慢AI这场争论,这两天从口号进了行动。Anthropic重申放慢前沿模型迭代,OpenAI透露已暂停部分项目,并抽调约25%的生产工程团队排查安全漏洞,Meta则主张企业必要时自行降速。另一边,美国总统特朗普和英伟达首席执行官黄仁勋反对全面踩刹车,众议长约翰逊称暂停研发会让中国受益,副总统万斯警惕巨头借监管筑起竞争壁垒,白宫计划一周内召集AI高管讨论安全边界。真动手了,芯片反而连涨两天：AMD收涨1.65%报512.50美元,英伟达收涨0.82%报213.90美元,博通收涨0.07%报339.51美元,它的首席执行官陈福阳把2028年AI收入指引提到2300亿美元。三倍做多半导体ETF(SOXL)收涨1.61%,它带三倍杠杆,涨跌幅会被放大,不能跟个股并排看。多头的抓手是暂停的是项目,不是预算;空头的抓手是排查漏洞要抽人,抽走的正是原本推进度的那批人。从表态走到动手,这次该不该当成拐点?", title_en: "AI Slowdown Moves From Talk to Action — Why Are Chip Stocks Still Rising?", body_en: "The AI-slowdown debate shifted from rhetoric to action over the past two days: Anthropic reiterated calls to slow frontier model iteration, OpenAI disclosed it has paused select projects and redeployed roughly 25% of its production engineering team to audit safety vulnerabilities, while Meta urged companies to self-impose slowdowns when necessary. On the other side, President Trump and Nvidia CEO Jensen Huang opposed a broad pause, House Speaker Johnson argued halting R&D would benefit China, Vice President Vance warned that big tech could exploit regulation to entrench competitive moats, and the White House plans to convene AI executives within a week to discuss safety boundaries. Chip stocks rose for a second straight session nonetheless: AMD gained 1.65% to $512.50, Nvidia added 0.82% to $213.90, and Broadcom edged up 0.07% to $339.51 — its CEO Hock Tan raised the company's 2028 AI revenue guidance to $230 billion. The 3x leveraged semiconductor ETF SOXL climbed 1.61%; as a leveraged instrument, its moves are amplified and should not be compared directly to individual stocks. Bulls argue what was paused are projects, not budgets; bears note that pulling engineers to fix vulnerabilities removes the very people driving development velocity. Now that action has followed words, should this be treated as an inflection point?" },
  { ticker: "INTC / SKHY / MU / SNDK", title_cn: "SK海力士找上英特尔,代工能接住存储吗?", body_cn: "周三涨得最扎眼的是英特尔,收涨4.03%报101.05美元。推它的消息却来自存储：SK海力士正在跟它谈,由英特尔的美国产能代工存储芯片,海力士方面已就相关报道作出回应。有意思的是谁吃到了这条消息。存储自己没动——SK海力士收涨0.02%报174.87美元,美光收跌0.11%报926.55美元,闪迪收跌0.71%报1519.97美元,三只几乎贴着零轴。同一条消息,做代工的涨了4%,被代工的原地踏步。市场给的解读是,存储缺的是产能,而现在能把这件事变成现金的,是手上有产能的那一方。多头的抓手是英特尔的代工业务终于等到一个肯坐下来谈的大客户;空头的抓手是谈判还没落成,就算落成,产能建起来也要时间。代工吃到存储的红利,这条路走得通吗?", title_en: "SK Hynix Turns to Intel — Can Foundry Capture the Memory Opportunity?", body_en: "Intel was Wednesday's standout gainer, rising 4.03% to $101.05, driven by news from the memory sector: SK Hynix is in discussions with Intel to manufacture memory chips using Intel's U.S. production capacity, and SK Hynix has responded to related reports. Notably, memory stocks themselves barely moved — SK Hynix edged up 0.02% to $174.87, Micron slipped 0.11% to $926.55, and SanDisk fell 0.71% to $1,519.97, all hugging the flat line. The same headline sent the foundry provider up 4% while leaving the memory names flat, with the market's read being that the memory sector's constraint is capacity, and the party positioned to monetize that is the one holding it. Bulls see Intel's foundry business finally landing a major client willing to negotiate; bears note the deal is unsigned and that even if finalized, building out capacity takes time. Can the foundry side genuinely capture the upside from memory's supply constraints?" },
  { ticker: "LITE / MRVL", title_cn: "光通信集体反弹,没有消息也能涨一天?", body_cn: "光通信周三集体反弹。Lumentum收涨9.59%报919.40美元,领涨标普500,Marvell收涨3.61%报229.71美元,同一天AXT涨11.44%,Semtech涨11.03%,Coherent涨约6%。翻了一圈,没有一条属于Lumentum自己的消息:没有财报,没有指引,没有订单,也没有评级调整。市场把这轮涨归到两件事上,一是这批票前面跌得太深,周三是超跌之后的回补;二是共封装光学的热度,AXT当天就是被点名成这个方向的赢家。对照着看更清楚,周一重挫14%的康宁这天没跟上。多头的抓手是AI要搬的数据早晚得落到光这一层,产能是真紧的;空头的抓手是没有公司层面的消息撑着,涨得快的退得也快。这轮光通信的涨,有多少是真需求?", title_en: "Optical Networking Rebounds Broadly — Can a Sector Rally Without Any News?", body_en: "Optical networking stocks staged a broad rebound on Wednesday. Lumentum surged 9.59% to $919.40, leading the S&P 500, while Marvell gained 3.61% to $229.71; on the same day, AXT jumped 11.44%, Semtech rose 11.03%, and Coherent advanced roughly 6%. No company-specific catalyst emerged for Lumentum — no earnings, no guidance, no order announcement, no rating change. The market attributed the move to two factors: the group had fallen sharply in prior sessions, making Wednesday a technical rebound, and co-packaged optics enthusiasm drove AXT to be cited as a direct beneficiary of that theme. By contrast, Corning, which had plunged 14% on Monday, failed to participate. Bulls argue the data AI needs to move will ultimately land on the optical layer and capacity constraints are real; bears caution that without company-level catalysts, sharp gains can reverse just as quickly. How much of this optical networking rally reflects genuine demand?" },
  { ticker: "CRCL", title_cn: "贝莱德万事达同日站台,Circle为何还在跌?", body_cn: "Circle收跌6.78%报80.45美元,是周三跌得最狠的一只,也是连着第二天大跌。当天它并不缺好消息:贝莱德、万事达和Visa同日公布了与它相关的合作安排,它自己还宣布收购跨境支付公司Tazapay,年化支付额超过250亿美元。消息摆了一桌,股价还是往下走,同一天比特币也在走软。多头的抓手是支付巨头肯把名字挂上来,合规这条路是通的;空头的抓手是监管框架仍然悬着,巨头站台解决不了机构资金能不能按规矩进场的问题。合作公告一条接一条,稳定币的生意到底成不成立?", title_en: "BlackRock and Mastercard Endorse Circle — So Why Is the Stock Still Falling?", body_en: "Circle dropped 6.78% to $80.45 on Wednesday, making it the session's worst performer and extending its decline for a second consecutive day, despite a string of positive announcements: BlackRock, Mastercard, and Visa all disclosed partnership arrangements with the company on the same day, and Circle separately announced the acquisition of cross-border payments firm Tazapay, which processes over $25 billion in annualized payment volume. With a full table of positive news, the stock still fell, as Bitcoin also softened on the day. Bulls point to major payments players willing to attach their names to the platform as validation that the compliance pathway is viable; bears argue the regulatory framework remains unresolved and that marquee endorsements do not answer whether institutional capital can enter the market under existing rules. With partnership announcements arriving one after another, does the stablecoin business model actually hold up?" },
  { ticker: "SPCX / TSLA", title_cn: "一边等点火一边等批文,两条线为何分岔?", body_cn: "特斯拉首席执行官马斯克手上的两条线周三走出了差距。SpaceX收涨5.15%报150.88美元,推力来自即将到来的星舰发射,市场在提前反应。特斯拉收涨0.42%报358.08美元,几乎没动,它这边卡着的还是监管:美国国家公路交通安全管理局明确表示,特斯拉必须先证明Cybercab可以合法销售。一个在等点火,一个在等批文,同一天,一个涨超5%,一个贴着零轴。多头的抓手是发射一旦成了,可回收运力这条线的估值口径就得重画;空头的抓手是发射是一次性事件,而批文卡住的是能不能持续卖车。同一个人的两家公司走两个方向,这正常吗?", title_en: "One Awaits Ignition, One Awaits Approval — Why Are Two Lines Diverging?", body_en: "Tesla CEO Elon Musk's two flagship companies moved in opposite directions on Wednesday. SpaceX gained 5.15% to $150.88, lifted by anticipation of an upcoming Starship launch as markets priced in the event in advance. Tesla added just 0.42% to $358.08, barely moving, as its regulatory overhang persisted: the National Highway Traffic Safety Administration stated explicitly that Tesla must first demonstrate the Cybercab can be legally sold before moving forward. One is waiting for ignition, the other for regulatory approval — on the same day, one surged more than 5% while the other hugged the flat line. Bulls argue a successful launch would force a revaluation of the reusable-lift capacity thesis; bears counter that a launch is a one-time event, while the approval bottleneck determines whether Tesla can sustainably sell vehicles. Is it normal for two companies run by the same person to move in opposite directions like this?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
