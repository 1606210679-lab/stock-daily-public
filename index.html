<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-10-28 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-10-28</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 6</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:16.7%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 6 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ / SPY / AMD / AVGO / NVDA", title_cn: "美联储周四凌晨决议，科技股反弹能守住吗？", body_cn: "QQQ周二涨1.27%、SPY涨0.56%，美联储将在北京时间周四凌晨公布利率决议，市场基准预期是维持3.75%-4.00%区间不变。指数上涨并不平均：AMD涨5.45%、博通涨4.00%，英伟达只涨0.90%，说明资金更偏向高弹性芯片和定制算力。多头的抓手是科技财报与AI订单继续支撑盈利；空头的抓手是新闻发布会若释放偏鹰的12月信号，收益率上行会压缩高估值板块。决议后，QQQ、SPY与半导体龙头中谁能获得盈利和利率的双重支持？", title_en: "Fed Decides Early Thursday: Can the Tech Rally Hold?", body_en: "QQQ gained 1.27% and SPY 0.56% Tuesday, with the Fed's rate decision due early Thursday Beijing time; the base case is a hold at 3.75%-4.00%. Gains were uneven: AMD jumped 5.45% and Broadcom 4.00%, while Nvidia added just 0.90%, suggesting money favors high-beta chips and custom compute. Bulls cite tech earnings and AI orders; bears warn a hawkish December signal at the press conference would lift yields and squeeze richly valued sectors. After the decision, which of QQQ, SPY or the chip leaders can claim both earnings and rate support?" },
  { ticker: "SKHY / STX / TER / SNDK", title_cn: "海力士营收破100万亿，存储行情能接力吗？", body_cn: "SK海力士周二涨1.92%，公司第三季度营收104.6万亿韩元、营业利润83.3万亿韩元，均创纪录，并确认HBM4出货扩大。希捷同期营收42.33亿美元、非GAAP每股收益7.68美元，分别高于约41.8亿美元和7.49美元预期，自由现金流达到15亿美元；泰瑞达营收13.06亿美元、非GAAP每股收益2.29美元，也超过约12.8亿美元和2.06美元预期。多头看到AI需求已经从HBM扩展到硬盘与测试设备；空头担心80%的海力士营业利润率和高速涨价难以长期维持。闪迪周四交卷后，HBM、NAND与容量硬盘哪条路线的利润支撑最扎实？", title_en: "SK Hynix Revenue Tops 100 Trillion Won: Can the Memory Rally Continue?", body_en: "SK Hynix rose 1.92% Tuesday as third-quarter revenue hit a record 104.6 trillion won and operating profit reached 83.3 trillion won, with HBM4 shipments expanding. Seagate posted $4.233 billion revenue and $7.68 non-GAAP EPS versus about $4.18 billion and $7.49 expected, plus $1.5 billion of free cash flow; Teradyne beat with $1.306 billion revenue and $2.29 non-GAAP EPS. Bulls see AI demand spreading from HBM to hard drives and test equipment; bears doubt the 80% Hynix margin can last. After SanDisk reports Thursday, which route — HBM, NAND or high-capacity drives — offers the firmest profit support?" },
  { ticker: "SOFI", title_cn: "SoFi财报双超预期，13%涨势还能追吗？", body_cn: "SoFi周二涨13.42%，直接催化是第三季度调整后净营收约14亿美元，高于约12.8亿美元预期；调整后每股收益0.18美元，也超过0.17美元预期。公司会员数同比增35%至1710万，并把2026年调整后净营收目标提高到50.4亿美元，同时给出2027年64亿美元营收和0.90美元每股收益展望。多头的抓手是会员、产品和利润率同步增长；空头的抓手是全年目标已经上调，后续估值需要更持续的信贷质量与费用控制。接下来应重点比较SoFi的会员增长、技术平台收入和净息差，哪一项最能延长盈利周期？", title_en: "SoFi Beats on Both Lines: Can the 13% Rally Run Further?", body_en: "SoFi jumped 13.42% Tuesday after third-quarter adjusted net revenue of about $1.4 billion topped the roughly $1.28 billion estimate, with adjusted EPS of $0.18 also beating $0.17. Members rose 35% year over year to 17.1 million, and the company raised its 2026 adjusted net revenue target to $5.04 billion while guiding to $6.4 billion of 2027 revenue and $0.90 EPS. Bulls point to member, product and margin growth moving together; bears note the targets are already raised and valuation now demands steadier credit quality and cost control. Next, compare member growth, technology platform revenue and net interest margin: which best extends the earnings cycle?" },
  { ticker: "GOOG / MSFT", title_cn: "微软谷歌今晚放榜，AI投入能换来现金吗？", body_cn: "Alphabet周二涨0.84%，微软与Alphabet将在周三美股收盘后公布业绩，市场预期微软每股收益约4.82美元、营收约924.9亿美元，Alphabet每股收益约3.11美元、营收约1320.2亿美元。截图把两家公司视为全球AI算力景气的风向标，但真正的比较不只是Azure与Google Cloud增速，还包括AI产品收入、剩余履约义务、资本开支和自由现金流。多头希望云需求足以覆盖新增数据中心投入；空头担心收入增长仍追不上折旧与现金消耗。财报后，Azure、Google Cloud与上游芯片订单中，哪组数据最能证明AI投入开始形成回报闭环？", title_en: "Microsoft, Google Report Tonight: Can AI Spending Turn Into Cash?", body_en: "Alphabet rose 0.84% Tuesday, with Microsoft and Alphabet reporting after Wednesday's US close; consensus expects Microsoft EPS of about $4.82 on revenue near $92.49 billion, and Alphabet EPS of about $3.11 on revenue around $132.02 billion. The screenshot casts both as bellwethers for global AI compute demand, but the real comparison goes beyond Azure and Google Cloud growth to AI product revenue, remaining performance obligations, capex and free cash flow. Bulls want cloud demand to cover new data-center buildout; bears worry revenue growth still trails depreciation and cash burn. After earnings, which — Azure, Google Cloud or upstream chip orders — best shows AI spending is closing the return loop?" },
  { ticker: "INTC", title_cn: "英特尔周四交卷，量子涨势能过毛利率关吗？", body_cn: "英特尔周二涨3.61%，半导体板块走强与收购量子软件公司Classiq的消息继续支撑股价，但周四业绩才是更直接的估值检验。市场预期每股收益约0.40美元、营收约167.8亿美元，重点将落在服务器产品、代工业务亏损、毛利率和资本开支。多头的抓手是产品组合改善与客户利用率回升，可以让收入增长更快落到利润；空头的抓手是量子业务商业化仍远，新增并购也不能替代代工现金消耗的改善。财报后，产品毛利率、代工亏损与自由现金流中，哪项最能证明转型开始进入回报期？", title_en: "Intel Reports Thursday: Can the Quantum Rally Clear the Margin Test?", body_en: "Intel rose 3.61% Tuesday, supported by strength across semiconductors and its acquisition of quantum software company Classiq, but Thursday's results are the more direct valuation test. Consensus expects EPS of about $0.40 on revenue near $16.78 billion, with attention on server products, foundry losses, gross margin and capex. Bulls argue better product mix and recovering customer utilization will push revenue growth into profit faster; bears note quantum commercialization remains distant and fresh M&A cannot offset foundry cash burn. After the results, which proves the turnaround has entered a payback phase: product gross margin, foundry losses or free cash flow?" },
  { ticker: "CRWV / NBIS", title_cn: "CoreWeave丹麦扩容，云厂反弹能持续吗？", body_cn: "CoreWeave周二涨7.94%、Nebius涨11.22%，直接催化是CoreWeave在丹麦启用新的AI算力，并把全球高速网络继续扩展到中东与亚太。新容量上线说明欧洲客户需求仍在扩张，也让前期因融资成本承压的云厂出现反弹。多头的抓手是更多可用电力和跨区域网络可以提高合同承接能力；空头的抓手是服务器采购、折旧与利息会先于收入发生，扩容本身并不等于高回报订单。下一步应比较CoreWeave的新合同定价、Nebius的数据中心利用率与两家公司的自由现金流，哪项能真正化解债务担忧？", title_en: "CoreWeave Expands in Denmark: Can the Cloud Rally Last?", body_en: "CoreWeave rose 7.94% and Nebius 11.22% Tuesday, driven by CoreWeave activating new AI compute in Denmark and extending its global high-speed network into the Middle East and Asia-Pacific. The new capacity signals European customer demand is still expanding and lifted cloud providers that had been pressured by financing costs. Bulls say more available power and cross-region networking raise contract capacity; bears note servers, depreciation and interest are incurred before revenue, and expansion alone does not equal high-return orders. Next, compare CoreWeave's new contract pricing, Nebius's data center utilization and both firms' free cash flow: which truly eases debt concerns?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
