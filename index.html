<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-10-14 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-10-14</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 7</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:14.3%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 7 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: ".SPX / QQQ", title_cn: "CPI今晚登场，美股新高还能守住吗？", body_cn: "标普500（.SPX）今日跌0.02%，QQQ跌0.33%，指数在纪录高位附近等待北京时间今晚20:30公布的9月CPI。市场预计整体CPI环比升0.6%、同比升3.6%，高于8月的0.4%和3.4%；核心CPI预计环比升0.2%、同比升2.4%，前值分别为0.3%和2.4%。多头的抓手是核心环比继续降温，可缓解长端利率压力并支撑大型科技估值；空头的抓手是能源价格可能把整体通胀推高，如果同比达到3.6%或更高，美联储维持高利率的预期会重新升温。数据落地后，资金会继续留在QQQ、转向价值股，还是先降低风险敞口？", title_en: "CPI Lands Tonight: Can US Stocks Hold Record Highs?", body_en: "The S&P 500 (.SPX) fell 0.02% and QQQ 0.33%, hovering near record highs before September CPI at 20:30 Beijing time. Headline CPI is seen up 0.6% m/m and 3.6% y/y, versus 0.4% and 3.4% in August; core up 0.2% m/m and 2.4% y/y, versus 0.3% and 2.4%. Bulls see cooling core inflation easing long-end rate pressure and supporting megacap tech; bears warn energy could lift headline inflation, reviving expectations that the Fed will keep rates higher for longer if y/y reaches 3.6% or more. After the print, will funds stay in QQQ, rotate to value, or cut risk first?" },
  { ticker: "MU / SKHY / WDC / SNDK / 07709", title_cn: "ASML营收不及预期，存储链调整还没结束？", body_cn: "美光（MU）今日跌3.62%，SK海力士（SKHY）跌3.19%，西部数据（WDC）跌1.61%，闪迪（SNDK）跌0.34%，海力士两倍杠杆产品07709跌5.44%；直接压力来自ASML季度营收不及预期，财报后的抛售情绪向存储与芯片链扩散，同时长鑫存储带来的竞争担忧仍在发酵。多头的抓手是ASML已第三次上调销售预测，美光客户集中度下降也削弱了单一客户风险；空头的抓手是设备龙头业绩落差与国产存储价格压力叠加，可能继续压缩板块估值。接下来更值得跟踪美光的客户结构、SK海力士的HBM优势，还是西部数据与闪迪的修复弹性？", title_en: "ASML Revenue Misses Estimates: Is the Memory Chain Selloff Over?", body_en: "Micron (MU) fell 3.62%, SK Hynix (SKHY) 3.19%, Western Digital (WDC) 1.61% and SanDisk (SNDK) 0.34%, while the 2x leveraged Hynix product 07709 dropped 5.44%. The direct pressure came from ASML's quarterly revenue miss, with post-earnings selling spreading across the memory and chip chain, while competition worries over ChangXin Memory Technologies persist. Bulls note ASML's third sales-forecast hike and Micron's falling customer concentration; bears see the equipment leader's earnings gap plus domestic memory price pressure further compressing sector valuations. Which matters more ahead — Micron's customer mix, SK Hynix's HBM edge, or the recovery potential at Western Digital and SanDisk?" },
  { ticker: "SPCX", title_cn: "Starlink月增57万用户，SpaceX估值还能抬多高？", body_cn: "SpaceX（SPCX）今日跌4.21%，市场一边消化回调，一边重新评估Starlink每月新增约57万用户的增长速度，以及投资人Ron Baron提出的十年后50万亿美元估值设想。多头的抓手是卫星互联网用户扩张能形成持续订阅收入，并为发射、终端和数据服务提供交叉变现空间；空头的抓手是50万亿美元只是极其乐观的长期预测，当前价格仍要面对资本开支、卫星更新和监管成本。投资者更应关注Starlink用户增速、SpaceX发射效率，还是等待估值预期降温后再参与？", title_en: "Starlink Adds 570K Users a Month: How High Can SpaceX's Valuation Go?", body_en: "SpaceX (SPCX) fell 4.21% as the market digested the pullback and reassessed Starlink's growth of roughly 570,000 net users a month, along with investor Ron Baron's scenario of a $50 trillion valuation in a decade. Bulls argue satellite-internet expansion builds recurring subscription revenue and cross-selling across launch, terminals and data services; bears counter that $50 trillion is an extremely optimistic long-term projection, and the current price still faces capex, satellite replacement and regulatory costs. Should investors watch Starlink's user growth, SpaceX's launch efficiency, or wait for valuation expectations to cool?" },
  { ticker: "NVDA", title_cn: "英伟达投资版图破510亿，生态扩张还能提振估值吗？", body_cn: "英伟达（NVDA）今日涨0.97%，最新催化是公司投资Doctolib与Genesis AI，其投资组合规模已超过510亿美元，资本配置正从芯片供应链延伸到医疗科技与通用AI应用。多头的抓手是股权投资可以提前绑定潜在大客户与新应用场景，并让英伟达分享生态伙伴增长；空头的抓手是投资规模扩大也会增加估值波动和资本配置风险，且被投企业能否转化为GPU需求仍需验证。下一阶段更值得押注英伟达核心芯片业务、Genesis AI等应用生态，还是等待投资回报开始兑现？", title_en: "Nvidia's Investment Portfolio Tops $51 Billion: Can Ecosystem Growth Lift Valuation?", body_en: "Nvidia (NVDA) rose 0.97% on news it invested in Doctolib and Genesis AI, lifting its portfolio past $51 billion as capital allocation spreads from the chip supply chain into health tech and general AI applications. Bulls say equity stakes lock in future large customers and new use cases while letting Nvidia share in partners' growth; bears warn the larger investment scale raises valuation volatility and capital-allocation risk, and whether those companies convert into GPU demand is unproven. Should investors back Nvidia's core chip business, the Genesis AI-style application ecosystem, or wait for returns to materialize?" },
  { ticker: "AAPL", title_cn: "HomeView重磅发布，苹果AI能打开新收入吗？", body_cn: "苹果（AAPL）今日涨0.09%，直接催化来自搭载Apple Intelligence与人脸识别的新款HomeView智能家居中枢发布，LG也同步推出为Apple Home生态设计的配件。多头的抓手是家庭场景能把苹果的设备、服务与AI助手连接起来，分析师提出的Siri每月20美元订阅设想若落地，庞大用户基础可带来新的经常性收入；空头的抓手是订阅价格和240亿美元年收入均属分析师情景，并非苹果正式指引，用户付费意愿与Siri能力仍待验证。苹果AI更值得押注HomeView生态、Siri订阅，还是等待新硬件带动换机？", title_en: "Apple Debuts HomeView: Can Apple Intelligence Unlock New Revenue?", body_en: "Apple (AAPL) rose 0.09%, driven by the launch of its new HomeView smart-home hub featuring Apple Intelligence and facial recognition, with LG simultaneously releasing accessories designed for the Apple Home ecosystem. Bulls say the home setting links Apple's devices, services and AI assistant, and an analyst scenario of a $20-a-month Siri subscription could add recurring revenue atop a huge user base; bears note the subscription price and $24 billion in annual revenue are analyst estimates, not Apple guidance, with payment willingness and Siri's capabilities still unproven. What should investors back — the HomeView ecosystem, a Siri subscription, or waiting for new hardware to drive upgrades?" },
  { ticker: "TSLA", title_cn: "Roadster发布重启，特斯拉能找回产品光环吗？", body_cn: "特斯拉（TSLA）今日跌0.74%，最新催化是长期延期的Roadster发布活动重新回到议程，特斯拉首席执行官马斯克以“时机就是一切”预热相关进展。多头的抓手是Roadster虽非走量车型，却能重新强化特斯拉在性能、品牌与技术上的领先形象，并为高端产品线制造关注；空头的抓手是项目已经多次延期，跑车销量对整体收入的直接贡献有限，市场最终仍会回到量产节奏与盈利能力。特斯拉下一阶段更值得看Roadster的品牌效应、Robotaxi的城市扩张，还是Optimus的量产兑现？", title_en: "Roadster Launch Restarts: Can Tesla Reclaim Its Product Halo?", body_en: "Tesla (TSLA) slipped 0.74% after the long-delayed Roadster launch event returned to the agenda, with CEO Musk teasing the progress by saying \"timing is everything.\" Bulls argue the Roadster, though not a volume model, can reinforce Tesla's leadership in performance, brand and technology and draw attention to the high-end lineup; bears note the project has slipped repeatedly, sports-car sales add little to overall revenue, and the market will ultimately focus on production pace and profitability. What matters more for Tesla next — the Roadster's brand halo, Robotaxi's city expansion, or Optimus production delivery?" },
  { ticker: "AMD", title_cn: "AMD为Fermi项目背书，信用支持能撬动新订单吗？", body_cn: "AMD今日涨1.90%，直接催化来自Fermi围绕Project Matador获得AMD信用支持的消息，同时市场关注Fermi规模达8.5亿美元的可转债融资。多头的抓手是芯片供应商参与信用支持，可能帮助大型数据中心项目更快完成融资、锁定设备采购，并把AMD的竞争从单纯卖芯片延伸到项目落地能力；空头的抓手是信用背书会增加交易结构复杂度，若客户建设进度或融资回报不及预期，市场也会重新评估集中度与潜在风险。投资者下一步应更关注AMD由此获得的实际订单、Fermi的项目执行，还是英伟达生态的竞争回应？", title_en: "AMD Backs Fermi Project: Can Credit Support Unlock New Orders?", body_en: "AMD rose 1.90% after Fermi secured AMD credit support around Project Matador, with the market also focused on Fermi's $850 million convertible bond financing. Bulls say a chip supplier's credit backing could help the large data center project close financing faster, lock in equipment purchases and extend AMD's edge from selling chips to delivering projects; bears warn the credit support adds structural complexity, and any slippage in construction or financing returns would prompt a reassessment of concentration and risk. What should investors watch next — AMD's resulting orders, Fermi's project execution, or Nvidia's competitive response?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
