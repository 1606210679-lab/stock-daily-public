<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-11-12 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-11-12</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 6</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:16.7%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 6 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "NVDA", title_cn: "英伟达盘后传换帅，反弹能否守住？", body_cn: "英伟达（NVDA）美股周三（11月11日）正式时段收涨2.92%，与芯片股反弹同向；收盘后才有媒体报道其董事会正讨论首席执行官黄仁勋的去留，盘后20:00美东最后一笔约158.78美元，较正式收盘低约8.61%。董事会尚未公布去留决定，盘后消息对正式交易时段的影响有待下一交易日检验。多头看AI算力订单和现有产品生态，空头担心领导层变化扰动客户关系、治理风险叠加高估值；前几日的股东诉讼也只是未经裁决的原告指控。董事会正式公告、英伟达订单披露与AMD替代份额中，哪个信号会先决定后续走势？", title_en: "Nvidia Board Said to Weigh CEO Change; Can the Rally Hold?", body_en: "Nvidia (NVDA) closed up 2.92% in Wednesday's regular session. Only after the close did media report its board is discussing CEO Jensen Huang's future; the last after-hours print at 20:00 ET was about $158.78, roughly 8.61% below the close. No board decision is out yet. Bulls cite AI compute orders and the product ecosystem; bears flag leadership disruption, governance risk and a rich valuation, with the recent shareholder suit still unadjudicated allegations. What would a formal board decision and Nvidia order disclosures need to show for the regular-session rally to hold?" },
  { ticker: "MU / SNDK / SKHY", title_cn: "美光涨11.89%，存储反弹有后劲吗？", body_cn: "美光（MU）美股周三（11月11日）收涨11.89%，闪迪（SNDK）涨13.69%、SK海力士（SKHY）涨9.71%，与AI硬件风险偏好回升同向，但三家各自的业务催化并不相同。Anthropic最新招股书列出美光拟在其IPO完成后认购约10亿美元股份：这是附条件的股权投资，不是美光新增HBM销售；闪迪的企业级SSD需求要看云客户采购和产品价格，海力士则要验证HBM供给与扩产兑现。多头看AI投入推动高端存储需求，空头担心融资承诺、普通存储价格周期和客户库存会使反弹难以转为利润。后续更值得核对的是美光的HBM出货、闪迪的SSD订单，还是海力士的产能与定价？", title_en: "Micron Jumps 11.89%; Does the Memory Rally Have Legs?", body_en: "Micron (MU) rose 11.89% on Wednesday, with SanDisk (SNDK) up 13.69% and SK Hynix (SKHY) up 9.71%, tracking a recovery in AI hardware risk appetite even as each name's catalyst differs. Anthropic's latest prospectus lists Micron subscribing to about $1 billion of shares after its IPO closes — a conditional equity investment, not new HBM sales. SanDisk still needs enterprise SSD orders and cloud purchasing to materialize, while SK Hynix needs to validate HBM capacity and pricing. Bulls see AI spending lifting high-end memory demand; bears cite financing commitments, the commodity memory cycle and customer inventories. What shipment, order and pricing evidence would show that all three memory names can sustain the rebound?" },
  { ticker: "CRWV / NBIS", title_cn: "CoreWeave暴涨后Nebius待报，算力云还能追吗？", body_cn: "CoreWeave（CRWV）美股周三（11月11日）收涨24.71%，Nebius（NBIS）同日涨15.44%；前者是财报后首个完整交易日的反应，后者则在自己的财报公布前跟涨，两只股票所处的业绩时点不同。CoreWeave本季营收36.61亿美元，高于Finnhub日历约36.2亿美元的预期，全年营收指引提高至130亿—133亿美元；GAAP每股亏损1.27美元，日历约亏1.18美元的预期未注明相同会计口径，暂不能判定EPS是否达标。其收入积压约1325亿美元，但净利息费用约8.46亿美元，合同转现金仍需时间。Nebius按Finnhub日历将在美东周四（11月12日）开市前发布财报，营收预期约9.3亿美元、每股亏损预期约0.70美元，尚无实际结果；市场更要看已签需求对应多少实际投入使用的算力、现金消耗和后续指引。多头看AI算力需求与两家公司收入潜力，空头担心电力、折旧及融资先于回款。CoreWeave的订单兑现，还是Nebius的上架容量与现金流，更能支撑这轮涨势？", title_en: "CoreWeave Surges, Nebius Reports Next: Can Compute Cloud Extend?", body_en: "CoreWeave (CRWV) rose 24.71% on Wednesday (Nov. 11), its first full session after the post-close earnings release, while Nebius (NBIS) climbed 15.44% before its own report. The two rallies reflect different reporting stages. CoreWeave posted quarterly revenue of $3.661 billion, above the roughly $3.62 billion Finnhub calendar estimate, and raised full-year revenue guidance to $13.0 billion to $13.3 billion. Its GAAP loss per share was $1.27; the calendar's roughly $1.18 loss estimate lacks a confirmed matching accounting basis, so an EPS beat or miss cannot be determined. Revenue backlog of about $132.5 billion is not cash in hand, while net interest expense was about $846 million. Nebius is due before the U.S. market opens on Thursday (Nov. 12); revenue of roughly $930 million and a loss of about $0.70 per share are forecasts, not reported results. Bulls see AI compute demand and revenue growth in both; bears worry that power, depreciation and financing run ahead of collections. What would CoreWeave's contract-to-cash conversion and Nebius's live capacity and cash flow need to show to sustain the rally?" },
  { ticker: "QQQ", title_cn: "AI财报带动QQQ反弹，盘后风险会逆转吗？", body_cn: "纳指100 ETF（QQQ）美股周三（11月11日）收涨2.31%，前一日偏热的10月CPI并未阻断当日科技股修复：CoreWeave在财报后的正式交易时段大涨24.71%，存储与部分芯片股同步回升。多头将其视为AI订单仍在兑现的证据，空头认为单家公司营收和巨额积压未解决整个行业的融资成本；美国通胀和利率风险也未因一天反弹消失。英伟达治理报道直到收盘后才出现，其盘后股价回落给下一交易日的科技股行情添了变量。接下来是等英伟达正式回应、观察美债收益率，还是用CoreWeave订单交付验证QQQ反弹的广度？", title_en: "AI Earnings Lift QQQ; Will After-Hours Risk Reverse It?", body_en: "The Nasdaq 100 ETF (QQQ) rose 2.31% Wednesday, as a firmer October CPI failed to stop the tech rebound: CoreWeave gained 24.71% in the regular session while memory and some chip names recovered. Bulls read it as proof AI orders are still being delivered; bears say one company's revenue and huge backlog don't fix industry-wide financing costs, and inflation and rate risk haven't gone away. Nvidia's governance report surfaced only after the close, and its after-hours slide adds a variable for the next session. What would Nvidia's response, Treasury yields and CoreWeave's actual deliveries need to show for the QQQ rebound to broaden?" },
  { ticker: "GOOG", title_cn: "谷歌拟认购Anthropic百亿，云收入能兑现吗？", body_cn: "Alphabet的GOOG美股周三（11月11日）收涨2.00%，Anthropic最新SEC招股书把其IPO之外的伙伴认购结构写清：若IPO完成且相关条件满足，Google拟按发行价购买约100亿美元Class N股份，七家伙伴合计约260亿美元。认购尚未交割，而且Google所认购的一部分用于履行此前的2026年投资承诺，100亿美元并非全为新追加资金。多头看Google Cloud算力合作及潜在持股价值，空头看资本占用、估值波动与Anthropic在模型市场同时也是竞争者；这份招股材料对云收入的实际贡献仍待验证。云业务实际收入、认购交割和投资回报中，哪个更能验证这笔布局？", title_en: "Google Plans a $10 Billion Anthropic Stake; Can Cloud Revenue Follow?", body_en: "Alphabet (GOOG) rose 2.00% Wednesday; Anthropic's latest SEC filing detailed the subscription structure outside its IPO: if the IPO closes and conditions are met, Google intends to buy about $10 billion of Class N shares at the offering price, part of roughly $26 billion across seven partners. The subscription has not settled, and part of Google's purchase fulfills an earlier 2026 investment commitment, so the $10 billion is not all new money. Bulls cite Google Cloud compute ties and the stake's potential value; bears flag capital tied up, valuation swings and Anthropic as a rival in models. What cloud revenue and completed share settlement would validate the investment thesis?" },
  { ticker: "MRVL / LITE / COHR", title_cn: "光通信链三股反弹，进口政策会改写机会吗？", body_cn: "美股光通信链周三（11月11日）反弹：Marvell（MRVL）收涨9.33%，Lumentum（LITE）涨10.67%，Coherent（COHR）涨9.25%。路透报道微软要求美国政府重新考虑对中国新型光收发模块的拟议进口限制，理由是供应收紧可能拖慢AI数据中心建设；目前仍是政策游说，并非限制措施已撤回。Lumentum与Coherent更贴近光器件供给，Marvell侧重网络芯片及互连；多头看数据中心扩容和高速连接需求，空头担心进口政策变化使供应商竞争加剧、产品价格承压。政策正式文本、三家新增订单与毛利率中，哪个更能验证这轮反弹？", title_en: "Optical Stocks Rally; Will Import Policy Rewrite the Opportunity?", body_en: "Optical networking names rebounded Wednesday: Marvell (MRVL) rose 9.33%, Lumentum (LITE) 10.67% and Coherent (COHR) 9.25%. Reuters reported Microsoft asked the U.S. government to reconsider proposed import limits on Chinese optical transceiver modules, arguing tighter supply could slow AI data center buildouts; this is lobbying, not a withdrawn restriction. Lumentum and Coherent sit closer to component supply, Marvell to networking chips and interconnect. Bulls see data-center expansion and high-speed connectivity demand; bears see import policy intensifying supplier competition and pressuring prices. What would the formal policy text, new orders and gross margins need to show for the rally to last?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
