<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }

  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }

  /* Card */

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {

  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }

  /* Field */

  /* Content boxes */

    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }

    color: #fcd34d; background: rgba(245,158,11,0.06);

  /* Buttons */

  /* Hint */

  /* Nav */

<script>
const topics = [
  { ticker: "PLTR", title_cn: "Palantir单日飙29%,空头一天亏掉30亿美元?", body_cn: "Palantir周二日间暴涨29.45%,把前一夜财报的盘后涨幅彻底兑现,成为标普500与道指同创新高的领涨旗手。据统计,这轮约30%的拉升已让做空者账面亏损约30亿美元,空头回补本身又成了燃料。基本面支撑是Q2营收同比增93%与商业收入的翻倍级增速,但估值也被推到极限。当逼空行情盖过基本面定价,追进去的人靠什么止盈?", title_en: "Palantir Surges 29% — Did Short Sellers Just Lose $3 Billion in a Day?", body_en: "Palantir surged 29.45% on Tuesday, fully realizing its after-hours post-earnings gains and leading both the S&P 500 and Dow Jones to simultaneous record highs. The roughly 30% rally has inflicted an estimated $3 billion in mark-to-market losses on short sellers, whose forced covering added further fuel. Fundamentals underpin the move — Q2 revenue rose 93% year-over-year with commercial revenue nearly doubling — but valuations are now stretched to the limit. When a short squeeze eclipses fundamental pricing, what's the exit strategy for late buyers?" },
  { ticker: "SPCX", title_cn: "SpaceX营收增92%却盘后崩8%,烧钱吓退谁?", body_cn: "SpaceX周二日间大涨9.43%,盘后首份公开财报出炉后却跳水8.04%。业绩本身不差:营收同比增长约92%、超市场预期,二季度亏损同步收窄,连接业务与AI相关收入是主要拉动。市场真正介意的是另一半——开支规模惊人,其中对英伟达的巨额采购承诺被摆到台前,马斯克还在电话会上抛出年收入万亿美元的远期目标。当超预期与烧钱同时放大,首份财报反而成了估值分水岭?", title_en: "SpaceX Revenue Jumps 92% Yet Crashes 8% After-Hours — Who's Spooked by the Spending?", body_en: "SpaceX surged 9.43% during Tuesday's session, only to tumble 8.04% after releasing its first-ever public earnings report after the close. Results were solid — revenue grew approximately 92% year-over-year, beating expectations, with quarterly losses narrowing and connectivity and AI-related revenue as key drivers. What unsettled markets was the other side of the ledger: staggering capital expenditures, including a headline-grabbing procurement commitment to Nvidia, while Musk laid out a long-term target of $1 trillion in annual revenue on the earnings call. When a beat and a cash burn arrive together, does the first earnings report become a valuation inflection point?" },
  { ticker: "AMD", title_cn: "AMD业绩不差却盘后跌8.7%,预期是不是太满?", body_cn: "AMD周二日间涨7.00%、与英特尔一同领涨芯片股,但盘后财报公布后急跌8.68%。关键指标与华尔街预期对比后被判定\"稳健有余、惊喜不足\",数据中心加速卡的份额叙事没能给出超预期增量。此前股价已在AI乐观情绪中连续修复,预期被提前打满。当\"solid\"变成利空,AMD要用什么才能重新撬动这轮定价?", title_en: "AMD Falls 8.7% After-Hours Despite Solid Results — Were Expectations Already Too Full?", body_en: "AMD gained 7.00% during Tuesday's session, co-leading the chip rally alongside Intel, before plunging 8.68% after its earnings report hit after the close. Key metrics were measured against Wall Street expectations and deemed \"solid but unsurprising,\" with the data center accelerator share narrative failing to deliver a meaningful upside surprise. The stock had already staged a sustained recovery on AI optimism, leaving expectations fully priced in. When \"solid\" becomes a sell signal, what will it take for AMD to re-ignite this repricing?" },
  { ticker: "MU / SNDK / SKHY / SOXL", title_cn: "存储链全线暴涨,美光新平台把周期问题答了?", body_cn: "存储链周二集体重估:美光涨7.62%、闪迪涨10.84%、海力士涨8.17%,三倍做多半导体ETF(SOXL)飙19.87%。催化一是美光发布新的AI存储平台,美银同时把此前的回调定义为\"终端需求稳健下的买点\";二是海力士被Wolfe Research与RBC双双首次覆盖、均给出Outperform与200美元目标价,而它与闪迪正联手攻AI的下一个瓶颈。今晚闪迪与西数交卷。当卖方集体转向、平台叙事补位,存储的周期争议这次会被业绩终结吗?", title_en: "Memory Stocks Surge Across the Board — Has Micron's New Platform Answered the Cycle Question?", body_en: "Memory stocks staged a broad re-rating on Tuesday: Micron rose 7.62%, SanDisk gained 10.84%, SK Hynix climbed 8.17%, and the 3x leveraged semiconductor ETF SOXL surged 19.87%. Two catalysts drove the move — Micron unveiled a new AI memory platform while BofA reframed the recent pullback as a buying opportunity amid resilient end demand; separately, SK Hynix received initiation coverage from both Wolfe Research and RBC, each assigning Outperform ratings and a $200 price target, as SK Hynix and SanDisk jointly target the next AI bottleneck. SanDisk and Western Digital report tonight. With sell-side consensus shifting and platform narratives filling the gap, will this earnings cycle finally put the memory cycle debate to rest?" },
  { ticker: "MRVL / AAOI", title_cn: "AAOI飙19%迈威尔涨13%,禁令反成光模块红利?", body_cn: "光互连成为周二最猛的分支:Applied Optoelectronics暴涨19.44%,直接催化是一项拟禁止中国AI硬件的提案,国产替代逻辑被瞬间放大;迈威尔涨12.81%,其看涨期权出现罕见的巨量异动,卖方同时在讨论\"打折后是否算便宜\"。Arista对AI网络需求给出乐观指引,进一步印证互连环节的紧俏。当政策与需求同向,光模块这波重估还有多少空间?", title_en: "AAOI Spikes 19%, Marvell Jumps 13% — Is the China Ban a Windfall for Optical Module Stocks?", body_en: "Optical interconnects were Tuesday's standout sector: Applied Optoelectronics surged 19.44%, directly catalyzed by a proposed ban on Chinese AI hardware that instantly amplified the domestic substitution thesis; Marvell gained 12.81%, with unusually heavy call option activity flagged alongside sell-side debate over whether the discounted valuation now looks attractive. Arista's bullish guidance on AI networking demand further validated tightness across the interconnect layer. With policy tailwinds and demand growth aligned, how much further can this optical module re-rating run?" },
  { ticker: "INTC", title_cn: "英特尔涨10.8%,AI合作把估值争议压住了?", body_cn: "英特尔周二大涨10.84%、夜盘小幅回吐3.38%,与AMD共同领涨这轮芯片反弹。驱动来自二季度指引与AI合作进展的更新,卖方开始重新讨论\"现价是否已算合理\",此前\"估值被充分定价\"的口径明显松动。真正的考验仍是代工客户落地与先进制程的产能利用率。当反弹幅度已经跑到两位数,英特尔的AI叙事撑得住多久?", title_en: "Intel Surges 10.8% — Has the AI Partnership Narrative Silenced the Valuation Debate?", body_en: "Intel surged 10.84% on Tuesday before giving back 3.38% in after-hours trading, co-leading the chip rebound alongside AMD. The rally was driven by updated second-quarter guidance and progress on AI partnership developments, prompting sell-side analysts to revisit whether current prices are now fair — a notable softening from prior \"fully valued\" assessments. The real test remains foundry customer wins and capacity utilization on advanced nodes. With the rebound already running into double digits, how long can Intel's AI narrative hold up?" },
  { ticker: "NVDA", title_cn: "英伟达涨2.6%,SpaceX的开支单成了它的订单?", body_cn: "英伟达周二涨2.56%,涨幅不大但角色关键:SpaceX首份财报暴露出巨额资本开支,其中对英伟达的采购承诺被市场直接读成算力需求的确认——同一份财报里,SPCX盘后跳水而NVDA走高。这把\"客户烧钱\"与\"供应商收钱\"的分化摆得格外清楚。当买方的成本变成卖方的确定性,英伟达的定价还需要看谁的脸色?", title_en: "Nvidia Gains 2.6% — Did SpaceX's Capex Bill Become Its Purchase Order?", body_en: "Nvidia rose 2.56% on Tuesday in a modest but pivotal move: SpaceX's maiden earnings report revealed massive capital expenditure, and the market read its procurement commitment to Nvidia as direct confirmation of compute demand — on the same report, SPCX fell sharply after hours while NVDA moved higher. The divergence laid bare the split between a customer absorbing costs and a supplier collecting revenue. When a buyer's spending becomes a seller's certainty, whose approval does Nvidia's pricing still need?" },
  { ticker: "AAPL", title_cn: "苹果涨2%,库克正式交棒该抄底还是观望?", body_cn: "苹果周二涨1.96%,消息面尘埃落定——CEO蒂姆·库克确认卸任,卖方立刻列出\"接任期该逢跌买入\"的三条理由,把交棒当作估值重置的起点而非风险。另一条线索是OpenAI在商业秘密诉讼中提交了苹果员工的短信记录,AI人才与技术边界的摩擦公开化。存储成本上行仍压着硬件毛利。当掌舵人换手,苹果的AI补课节奏会加快还是更谨慎?", title_en: "Apple Rises 2% as Cook Confirms Departure — Time to Buy the Dip or Wait?", body_en: "Apple gained 1.96% on Tuesday as the leadership transition was confirmed — CEO Tim Cook announced his departure, prompting sell-side analysts to immediately outline three reasons to buy on weakness during the succession period, framing the handover as a valuation reset rather than a risk event. A separate development saw OpenAI submit Apple employee text messages in a trade secret lawsuit, bringing AI talent and technology boundary disputes into the open. Memory cost inflation continues to weigh on hardware margins. With a new captain at the helm, will Apple's AI catch-up accelerate or turn more cautious?" },
  { ticker: "AMZN", title_cn: "亚马逊跌2.3%,减持余波还是AI开支被追问?", body_cn: "亚马逊周二收跌2.32%,是大市值里少见的下跌,前一夜贝索斯申报出售1500万股的余波仍在发酵。同时公司正把Prime Video打造成AI能力的展示窗口,被解读为向市场证明AI投入的去处;但最新电话会上,它也面对了关于开支与回报的最尖锐提问。市值刚破3万亿,分歧立刻转向\"这笔钱花得值不值\"。当创始人减持与AI叙事同时摆上桌,资金该信哪一边?", title_en: "Amazon Falls 2.3% — Bezos Selloff Overhang or AI Spending Under Scrutiny?", body_en: "Amazon closed down 2.32% on Tuesday, a rare decline among large-caps, as the aftershocks of Bezos's disclosed sale of 15 million shares continued to reverberate. The company is simultaneously positioning Prime Video as a showcase for its AI capabilities, framed as evidence of where AI investment is being deployed — yet its latest earnings call drew some of the sharpest questions yet on spending and returns. With its market cap having just crossed $3 trillion, debate has quickly shifted to whether the capital allocation is justified. With a founder selling and an AI narrative on the table, which signal should investors trust?" },
  { ticker: "QQQ", title_cn: "纳指ETF涨3.4%,海峡重开把风险溢价打没了?", body_cn: "QQQ周二大涨3.40%,标普500指数涨1.79%、SPY涨1.80%,标普与道指双双收创历史新高。驱动是强劲财报流叠加地缘缓和——霍尔木兹海峡重开的乐观预期直接压缩了风险溢价,道指还录得史上第27次单日千点级上涨。但仍有观点提示,真正的威胁不是关税而是沃什领导下的联储路径。当地缘与业绩同时给顺风,这轮新高最怕的变量是什么?", title_en: "QQQ Surges 3.4% — Did the Strait Reopening Wipe Out the Risk Premium?", body_en: "QQQ surged 3.40% on Tuesday, with the S&P 500 gaining 1.79% and SPY rising 1.80%, as both the S&P and Dow Jones closed at all-time highs. The rally was fueled by a strong earnings flow combined with geopolitical easing — optimism over the reopening of the Strait of Hormuz directly compressed risk premiums, while the Dow recorded its 27th-ever single-day gain of 1,000 points or more. Yet one view cautions that the real threat is not tariffs but the Fed's policy path under Warsh. With geopolitics and earnings both providing tailwinds, what is the single variable this new high fears most?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});
