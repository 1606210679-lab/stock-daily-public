<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Hint */

  /* Nav */

<script>
const topics = [
  { ticker: "QQQ / .SPX", title_cn: "指数高位不动等CPI,今晚3.4%是及格线?", body_cn: "QQQ周二微跌0.34%、标普500指数跌0.32%,创出新高后连续第二天在高位横着,资金明显不愿在数据前选边。今晚北京时间20:30公布美国7月CPI,道琼斯调查的经济学家预计同比3.4%、低于前值3.5%,核心同比2.5%、低于前值2.6%,环比分别为0.1%与0.2%。被称为\"新美联储通讯社\"的Timiraos给出的判断很直白:数据温和能同时缓解沃什和FOMC的加息压力,居高不下则可能迫使他用实际行动来证明自己。也有观点提醒真正撬动利率的可能是财政数字而非CPI。当预期已经押在温和上,超预期的那一侧谁在防守?", title_en: "Indices Stall at Highs Ahead of CPI — Is 3.4% the Pass Mark?", body_en: "QQQ slipped 0.34% and the S&P 500 fell 0.32% Tuesday, trading sideways for a second straight session near record highs as investors avoided taking sides ahead of data. U.S. July CPI prints at 20:30 Beijing time; Dow Jones survey economists forecast headline CPI at 3.4% year-over-year — below the prior 3.5% — and core at 2.5%, with monthly readings of 0.1% and 0.2% respectively. The 'Fed Whisperer' Timiraos offered a blunt read: a soft print eases pressure on both Warsh and the FOMC, while a hot one could force him to act. With consensus already leaning dovish, who is positioned for an upside surprise?" },
  { ticker: "CRWV / NBIS / RIOT", title_cn: "CoreWeave盘后飙15%,1040亿订单能兑现吗?", body_cn: "CoreWeave周二日间涨2.42%,盘后财报出炉后跳涨15.37%,但数字本身是喜忧参半:Q2营收25.75亿美元、略低于26.11亿的市场预期,每股亏损1.03美元则好于预期的1.24美元。真正点燃情绪的是高达1040亿美元的积压订单——市场愿意用未来的可见度,抵消当期营收的小幅落空。同赛道的Nebius被同步带起,日间涨4.95%、夜盘再涨7.70%,而它今晚美股盘前就要交卷——伯里的空头仍在,卖方则开始讨论两家之间的风险收益比该偏向谁。更长远的一笔是Anthropic与矿企Riot敲定的20年算力采购协议:基础合同约91亿美元、锁定191兆瓦,延期选择权全部行权可达161亿美元,Riot当日涨4.33%。当营收不及预期也能换来大涨,算力的定价锚是不是已经换成了订单簿?", title_en: "CoreWeave Surges 15% After Hours — Can $104B Backlog Deliver?", body_en: "CoreWeave rose 2.42% during regular trading Tuesday before jumping 15.37% after hours on earnings that delivered a mixed scorecard: revenue came in at $2.575 billion, slightly below the $2.611 billion consensus, while the per-share loss of $1.03 beat the expected $1.24. The catalyst was a $104 billion order backlog, with markets willing to discount the near-term revenue miss in exchange for forward visibility. Peer Nebius was lifted in tandem — up 4.95% in the session and another 7.70% after hours ahead of its own earnings — while Anthropic and miner Riot finalized a 20-year compute procurement deal valued at approximately $9.1 billion for 191 megawatts, with extension options bringing the total to $16.1 billion; Riot gained 4.33%. When a revenue miss still triggers a double-digit rally, has the pricing anchor for compute capacity already shifted to the order book?" },
  { ticker: "BRK.B / GOOG", title_cn: "巴菲特结束14季净卖出,聪明钱这次买了谁?", body_cn: "13F陆续出炉,伯克希尔二季度买入约235亿美元上市股票、卖出约37亿,净买入接近200亿,正式结束连续14个季度净卖出的纪录;继任者的调仓也开始留下印记,三只新建仓标的已带来约12亿美元浮盈。另外两条更有意思:谷歌的持仓里SpaceX占比高达约95%、对应约5.51亿股;花旗持仓市值突破3000亿美元,并显著加仓美光与AMD等半导体产业链。股价并不配合——伯克希尔B股周二跌2.46%、谷歌跌3.61%。当最保守的钱开始重新买入,跟着抄作业的风险在哪?", title_en: "Buffett Ends 14-Quarter Net Selling Streak — What Did Smart Money Buy?", body_en: "As 13F filings emerged, Berkshire Hathaway purchased approximately $23.5 billion in listed equities in Q2 while selling roughly $3.7 billion, resulting in nearly $20 billion in net purchases and formally ending 14 consecutive quarters of net selling; moves attributed to the designated successor have already generated approximately $1.2 billion in unrealized gains across three newly initiated positions. Separately, SpaceX accounts for roughly 95% of Google's disclosed holdings at approximately 551 million shares, while Citadel's equity portfolio crossed $300 billion and showed notable additions in Micron, AMD, and other semiconductor names. Stock prices were uncooperative — Berkshire B shares fell 2.46% and Google dropped 3.61% on Tuesday. Now that the most conservative capital is buying again, where does the risk lie for those following its lead?" },
  { ticker: "SMCI / LITE", title_cn: "超微盘后涨7.7%,利润大超营收不及该信哪个?", body_cn: "两份被提前定价的财报都翻了盘,但翻的方式不同:Super Micro盘后大涨7.72%,每股收益1.70美元远超0.98美元的预期,代价是营收111.20亿美元、低于117.82亿的预期——毛利的疑虑被打消,规模却没跟上;Lumentum盘后涨3.56%,每股收益3.23美元略超预期、营收10.06亿基本符合,而它上一个交易日刚随光模块板块被砸下8.61%。也就是说,财报前的那轮杀跌更像仓位调整而非基本面预判,同板块的Coherent今晚盘后接着交卷。当利润和营收各错一边,市场这次选择相信哪一个?", title_en: "Super Micro Jumps 7.7% After Hours — Earnings Beat or Revenue Miss: Which Wins?", body_en: "Two pre-priced earnings reports both reversed expectations, but in different ways: Super Micro surged 7.72% after hours as EPS of $1.70 far exceeded the $0.98 consensus, though revenue of $11.12 billion fell short of the $11.782 billion estimate — gross margin concerns were dispelled even as top-line scale disappointed. Lumentum gained 3.56% after hours, with EPS of $3.23 slightly beating estimates and revenue of $1.006 billion broadly in line, one session after the optical module sector dragged it down 8.61%. The pre-earnings selloff now looks more like a positioning adjustment than a fundamental call, with sector peer Coherent set to report after hours tonight. When earnings and revenue diverge in opposite directions, which signal is the market choosing to believe this time?" },
  { ticker: "SKHY / SNDK / MU", title_cn: "海力士涨4.7%,存储又被摩根点进受益名单?", body_cn: "存储链周二集体回暖:海力士涨4.70%、闪迪涨2.68%、美光涨0.87%,三倍做多半导体ETF(SOXL)涨2.31%,把前一日的失血补回来一部分。推力来自卖方口径的转向——摩根大通点出英伟达的芯片景气正在向外扩散,并列出六只可能搭上这轮的标的;花旗的13F也显示它在二季度显著加仓了美光。争议仍在中国新增产能与长约锁价能撑多久。当上游景气被反复确认、股价却走得反复,存储的定价到底缺什么?", title_en: "SK Hynix Rises 4.7% as JPMorgan Adds Memory Stocks to Beneficiary List?", body_en: "Memory stocks rebounded broadly on Tuesday: SK Hynix gained 4.70%, SanDisk rose 2.68%, Micron added 0.87%, and the 3x leveraged semiconductor ETF SOXL climbed 2.31%, recovering a portion of the prior session's losses. The catalyst was a shift in sell-side tone — JPMorgan noted that Nvidia's chip cycle is broadening outward and named six stocks positioned to benefit, while Citi's 13F showed it significantly increased its Micron position in Q2. Debate remains over how long new Chinese capacity additions and long-term supply contracts can hold pricing. With upstream strength repeatedly confirmed yet share prices remaining choppy, what is still missing from the memory sector's valuation story?" },
  { ticker: "SPCX / RKLB", title_cn: "SpaceX回落3.9%,36倍市销率成了估值陷阱?", body_cn: "太空板块周二双双回落:SpaceX跌3.93%,Rocket Lab基本收平、微跌0.04%。财报的余温开始退去,卖方接连出手——有报告直言SpaceX在财报后\"还有很长的下跌空间\",另一份则把Rocket Lab约36倍的远期市销率称作估值陷阱。基本面这边,马斯克的身家随SpaceX反弹回升,叙事仍然庞大。当业绩已经落地、估值成为唯一议题,太空这轮行情要靠什么续命?", title_en: "SpaceX Pulls Back 3.9% — Is a 36x Price-to-Sales Ratio a Valuation Trap?", body_en: "Space sector names retreated Tuesday: SpaceX fell 3.93% while Rocket Lab was nearly flat, slipping just 0.04%. Post-earnings enthusiasm began to fade as sell-side reports landed — one stated outright that SpaceX still has 'significant downside' following its earnings rally, while another flagged Rocket Lab's roughly 36x forward price-to-sales ratio as a valuation trap. On the fundamental side, Musk's net worth rebounded alongside SpaceX's recovery, keeping the broader narrative intact. With results now in the rearview and valuation the sole remaining debate, what does this space rally need to sustain itself?" },
  { ticker: "700", title_cn: "腾讯放榜前跌3%,AI变现能顶住增速放缓?", body_cn: "腾讯周三港股盘中跌3.06%、恒生指数同步跌1.20%,资金在财报前先减仓。公司将于今日港股收盘后公布Q2业绩,华尔街机构预计营收约2024.58亿元、同比增9.73%,每股收益6.259元、同比增4.38%——预期本身已经落在个位数增长区间,这正是分歧的起点。真正的看点不在游戏与广告的常规基数,而在AI怎么记账:公司近期明确表态把重心放在\"部署\"而不是把模型做得更大,新推出的WorkBuddy被一些报道视作股价回调后的转机线索,但这些投入短期只体现在成本端。同日港股科技内部已先分化——京东跌3.00%,中芯国际逆势涨3.06%。当增长预期只剩个位数,AI落地能不能替估值兜底?", title_en: "Tencent Drops 3% Before Results — Can AI Monetization Offset Slowing Growth?", body_en: "Tencent fell 3.06% in Hong Kong Wednesday while the Hang Seng Index shed 1.20%, as investors trimmed positions ahead of the company's Q2 results due after the Hong Kong close today. Wall Street consensus projects revenue of approximately 202.458 billion yuan, up 9.73% year-over-year, with EPS of 6.259 yuan, up 4.38% — expectations already anchored in single-digit growth territory, which is precisely where disagreement begins. The real focus is less on gaming and advertising than on how AI gets accounted for: Tencent has recently signaled a shift toward 'deployment' over model scaling, and the newly launched WorkBuddy has been cited in some reports as a potential inflection point following the share price pullback, though near-term AI spending shows up only on the cost side. Hong Kong tech names diverged on the day — JD.com fell 3.00% while SMIC bucked the trend, gaining 3.06%. With growth expectations down to single digits, can AI execution underpin the valuation?" },
  { ticker: "SE", title_cn: "Sea盘前双超财报飙14.6%,盈利拐点到了?", body_cn: "Sea Limited周二大涨14.56%,盘前公布的Q2财报双超预期:营收78.05亿美元、高于市场预期的72.75亿,每股收益0.86美元也高于0.79美元的预期。规模与利润同时超预期是这轮上涨最直接的支撑;至于电商、数字金融与游戏三块业务各自贡献多少,要等分部数据披露才能判断。市场对它的长期分歧一直不在增速,而在盈利能否稳定持续。当营收与利润同时给出正面信号,这轮上涨还需要几个季度才算被确认?", title_en: "Sea Surges 14.6% Pre-Market on Dual Beat — Has the Profit Inflection Arrived?", body_en: "Sea Limited soared 14.56% Tuesday after pre-market earnings delivered a double beat: revenue of $7.805 billion topped the $7.275 billion consensus, and EPS of $0.86 exceeded the $0.79 estimate. Simultaneous beats on both scale and profitability provided the most direct support for the rally; the individual contributions from e-commerce, digital financial services, and gaming will only become clear once segment data is disclosed. The market's long-standing debate on Sea has never centered on growth but on whether profitability can be sustained. With both revenue and earnings now sending positive signals, how many more quarters of confirmation does this rally require?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
