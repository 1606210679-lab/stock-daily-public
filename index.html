<script>
const topics = [
  { ticker: "TSLA / SPCX", title_cn: "Cybercab后天上路,特斯拉这5.5%在按AI估值算?", body_cn: "特斯拉收涨5.51%,是标普500当天涨幅最靠前的成分股,而同一天标普500收跌0.58%、道指盘中一度跌约360点,它几乎是逆着大盘走的。三条催化叠在一起:德州机动车管理部门的自动驾驶车辆名录显示,首批Cybercab已经登记进入付费robotaxi车队,而奥斯汀的Cybercab就在9月3日投入运营;马斯克同期放出FSD的新进展,下一步是识别并避让坑洼路面;香港的入门款Model 3把起售价下调8.5%,砍掉部分舒适配置、保留三电与智驾硬件,直接对着亚洲市场的价格战去。市场的定价口径因此变了——它不再按交付量给估值,而是按一家AI公司给估值,发布会前的这段涨幅买的是Robotaxi的商业化预期,不是这个季度的车。分歧同样具体:有分析师直接称当前的多头逻辑站不住脚,预测市场对\"年内以约3万美元售价卖出Cybercab\"只给到约17%的概率,而许可与登记只是准入,车队、保险与运维要花的钱一分不会少。同属马斯克体系的SpaceX收涨1.55%,它这一周的叙事是用燃气轮机去解AI数据中心的电力瓶颈。你会赌9月3日之后Robotaxi的单车经济性、等首批运营数据出来,还是把这轮涨幅当发布会前的情绪?", title_en: "Cybercab Launches in Days — Is Tesla's 5.5% Gain Priced as an AI Stock?", body_en: "Tesla surged 5.51%, leading S&P 500 gainers on a day the index fell 0.58% and the Dow dropped as much as 360 points intraday. Three catalysts converged: Texas DMV filings show the first Cybercab units registered for paid robotaxi service, with Austin operations set to launch September 3; Musk unveiled FSD progress targeting pothole detection; and Hong Kong entry-level Model 3 pricing was cut 8.5%, stripping comfort features while retaining drivetrain and FSD hardware to compete on Asian pricing. Markets are now valuing Tesla as an AI company rather than on delivery volumes — this rally is pricing Robotaxi commercialization, not the current quarter. Bears push back sharply: one analyst called the bull thesis untenable, estimating only ~17% market-implied odds that Cybercab sells at roughly $30,000 this year, and warns that permits and registration are just entry — fleet buildout, insurance, and operations will cost plenty. Will you bet on per-unit Robotaxi economics after September 3 and wait for early operating data, or treat this rally as pre-launch sentiment?" },
  { ticker: "SNDK / MU / SKHY / SOXL", title_cn: "闪迪尾盘暴拉5.5%,买它的是指数不是基本面?", body_cn: "8月收官日闪迪从盘中跌超2%一路拉到收涨5.50%,而这根尾盘阳线的触发不是订单也不是评级——它被纳入MSCI World与ACWI指数,被动资金必须在调仓日按权重买入,这是机械买盘。证据在盘后:调仓的窗口一过,它立刻回吐1.06%。同一天存储链其余标的的成色也值得看清楚,美光收涨2.77%,但成交量只有2,260万股、不到日均4,560万股的一半,涨幅是在缩量里走出来的;SK海力士收涨2.20%,半导体三倍做多的SOXL只涨1.30%,弹性工具并没有跟上。基本面这一侧,两个方向同时在推进:供给端铠侠与闪迪宣布在存储上投资超过310亿美元扩产;而中国的长鑫科技上半年营收同比大增874%、HBM3E已进入小批量试产,巴伦周刊两天内连发两篇讨论美光与长鑫的份额战。价格端也还有想象空间,有报道称36GB HBM3E的现货价约2,100美元、相当于长协价的4至5倍,而美光过去几个月主要在签多年长约,等于把现货那部分上行提前锁掉了一块。空方的提醒来自下游,Palo Alto的CEO说这轮存储超级周期终究会回到周期本身。你会把指数买盘当反攻信号,跟着现货与长协的价差去买美光与海力士,还是等长鑫的良率先给出答案?", title_en: "SanDisk Surges 5.5% at Close — Index Rebalancing, Not Fundamentals?", body_en: "SanDisk reversed from a more-than-2% intraday loss to close up 5.50% on the final session of August, with the late spike driven not by orders or ratings upgrades but by inclusion in the MSCI World and ACWI indexes — forcing passive funds to buy mechanically on rebalancing day. The evidence arrived in after-hours trading: once the rebalancing window closed, SanDisk immediately gave back 1.06%. Elsewhere in the memory complex, Micron gained 2.77% on volume of just 22.6 million shares — less than half its daily average of 45.6 million — while SK Hynix rose 2.20% and the 3x leveraged semiconductor ETF SOXL gained only 1.30%, failing to keep pace. On the fundamental side, two forces are moving simultaneously: on the supply side, Kioxia and SanDisk announced a combined memory capacity investment of over $31 billion; meanwhile China's CXMT posted first-half revenue up 874% year-over-year with HBM3E entering limited trial production, prompting Barron's to run two articles in two days on the Micron-CXMT share battle. On pricing, 36GB HBM3E spot prices are reported near $2,100 — four to five times contract rates — though Micron has largely been locking in multi-year agreements in recent months, capturing less of the spot upside. The bear case comes from downstream: Palo Alto's CEO warned that the memory supercycle will ultimately revert to its cyclical nature. Will you treat the index-driven buying as a breakout signal and chase the spot-versus-contract spread in Micron and SK Hynix, or wait for CXMT's yield data to speak first?" },
  { ticker: "NVDA / MRVL / AVGO / AMD", title_cn: "英伟达35亿投联发科,定制芯片的围墙修到哪了?", body_cn: "英伟达收涨1.48%,催化是它把一个潜在对手拉进了自己的体系:联发科接入NVLink Fusion,英伟达同时认购35亿美元的联发科可转债,黄仁勋在同一天公开表示不惧定制芯片。这句话有分量,因为对面的战报刚好相反——迈威尔收跌2.29%,它手上是谷歌那份被称作1200亿美元量级的长期合作,但市场给出的判断是这笔收入确认的时点太晚,合作规模对冲不了兑现时间,财报后的两刀砍到现在还没止住。第三方是博通,收涨0.42%,周三盘后交卷,共识是每股收益约3.30美元、营收约299.5亿美元,它在定制ASIC这条线上份额最大,但也有分析指出TPU的占比上升正在稀释它的毛利率,规模换来的不全是利润。AMD收涨1.10%,走的是完全不同的第四条路:与思科、HUMAIN合作的沙特AI基础设施已经上线并朝1吉瓦规模扩,芬兰3.878亿欧元的LUMI-AI主权超算也选用了MI430X。要留意的是同一天的反向信号,有分析把主权AI称作展示窗口而不是收入窗口,而方舟当日减持AMD、换入英伟达与博通。通用GPU、定制ASIC还是主权算力,你更看好哪条路把订单变成收入?", title_en: "Nvidia Invests $3.5B in MediaTek — How Far Does the Custom Chip Moat Extend?", body_en: "Nvidia rose 1.48%, catalyzed by pulling a potential rival into its own ecosystem: MediaTek is connecting to NVLink Fusion while Nvidia subscribed to $3.5 billion in MediaTek convertible bonds, with Jensen Huang publicly declaring he has no fear of custom chips on the same day. That statement carries weight given the opposing scorecard — Marvell fell 2.29% despite holding a long-term Google partnership reportedly worth $120 billion, as markets judged the revenue recognition timeline too distant to offset the deal's scale, with post-earnings selling pressure still unresolved. Broadcom, the largest player in custom ASICs, edged up 0.42% ahead of its after-hours earnings, with consensus at roughly $3.30 EPS and $29.95 billion in revenue, though analysts note rising TPU share is compressing its gross margins. AMD gained 1.10% on a different path entirely: its Saudi AI infrastructure with Cisco and HUMAIN is live and scaling toward 1 gigawatt, and Finland's €387.8 million LUMI-AI sovereign supercomputer selected the MI430X. Notable counter-signals emerged the same day — one analyst labeled sovereign AI a showcase window rather than a revenue window, and ARK reduced its AMD position while rotating into Nvidia and Broadcom. General-purpose GPU, custom ASIC, or sovereign compute — which path do you back to convert orders into revenue?" },
  { ticker: "GOOG / META / MSFT / AAPL", title_cn: "OpenAI广告年化冲上10亿,谷歌一天跌掉2.2%?", body_cn: "谷歌收跌2.18%,是当天大市值科技里跌得最深的一只,而归因这次异常清楚:有报道称OpenAI的广告业务年化收入已经达到10亿美元,而奥特曼此前把广告称作\"最后手段\",从这句表态到10亿只用了约200天。伯恩斯坦顺着这条线把话说得更远,认为Meta的广告收入可能在2026年就超过谷歌搜索。但当天的盘面说明市场砍的不只是谷歌的份额:Meta自己收跌0.98%,微软收跌1.22%,苹果收跌0.89%,四家一起走弱,被重新定价的是\"流量入口\"这门生意本身的确定性——过去十几年广告预算跟着搜索框走,现在多了一个每天都在扩张的对话框。对照另一侧更能看出资金的方向,同一天卖算力的在涨,英伟达收涨1.48%,AMD收涨1.10%。伤口其实更早就裂开了,8月27日Alphabet单日蒸发过6,920亿美元市值。多头的抓手是谷歌自有TPU、成本结构比对手厚实,而且它在把AI工具卖向新的行业;空方的抓手是AI资本开支正在逼近万亿量级,而高盛提示这一轮资本开支还会给市场一个意外。你会趁回调接谷歌、换到广告份额在扩张的Meta,还是干脆站到卖算力的一侧?", title_en: "OpenAI Ads Hit $1B Annualized Run Rate — Did That Cost Google 2.2% in a Day?", body_en: "Alphabet fell 2.18%, the steepest decline among large-cap tech that day, with causation unusually clear: reports emerged that OpenAI's advertising business has reached a $1 billion annualized revenue run rate — roughly 200 days after Altman had called advertising a \"last resort.\" Bernstein extended the argument further, suggesting Meta's ad revenue could surpass Google Search as early as 2026. Yet the session's price action shows markets punished more than just Alphabet's share: Meta fell 0.98%, Microsoft dropped 1.22%, and Apple declined 0.89%, with all four weakening together as markets repriced the certainty of the \"traffic gateway\" business model itself — ad budgets that followed the search box for over a decade now face an expanding dialogue box. The directional capital flow was visible on the other side: Nvidia gained 1.48% and AMD rose 1.10% the same day. The wound had already opened earlier — Alphabet shed approximately $692 billion in market cap in a single session on August 27. Bulls point to Google's proprietary TPUs, a stronger cost structure than rivals, and its push to sell AI tools into new industries; bears highlight AI capex approaching the trillion-dollar threshold, with Goldman Sachs flagging further capex surprises ahead. Will you buy Alphabet on the dip, rotate into Meta where ad share is expanding, or simply stand on the side selling compute?" },
  { ticker: "QQQ / .SPX / BZ", title_cn: "道指刚收下第五个红月,9月这道坎怎么过?", body_cn: "8月最后一个交易日收得很拧巴:道指录得连续第五个月上涨,把整个夏天的涨势完整保住,但收官当天标普500收跌0.58%,QQQ只收涨0.05%,盘中道指一度跌约360点。砸下去的是地缘——美国对伊朗动武之后,加息押注同步升温,布伦特原油现在报91.28美元、单日涨0.87%,月内累计涨约9%。这两条其实是同一个方向的压力:油价抬高通胀预期,而通胀预期又把沃什上周那番鹰派表态坐得更实,长端利率一旦回头,估值靠远期盈利的成长股先被折。日历风险也摆得很密,本周是就业周、非农即将公布,而9月在统计上是标普500全年表现最差的一个月,这个季节性偏偏撞上了利率与油价同时抬头。多头的理由是道指五连阳本身就说明趋势没断,AI资本开支的扩张也还在继续;空头的理由是这轮上涨已经把好消息定价得很满,而非农只要偏强,加息这条线就会被重新押注。你会在非农前降低仓位、留在现金流确定的巨头,还是用能源做一层对冲?", title_en: "Dow Logs Its Fifth Straight Monthly Gain — Can It Hold Through September?", body_en: "The final August session delivered a conflicted close: the Dow posted its fifth consecutive monthly gain, preserving the full summer rally, yet the S&P 500 fell 0.58% on the day, QQQ barely gained 0.05%, and the Dow itself dropped as much as 360 points intraday. The catalyst was geopolitical — following U.S. military action against Iran, rate-hike bets rose in tandem, with Brent crude at $91.28, up 0.87% on the day and approximately 9% for the month. These two forces point in the same direction: higher oil lifts inflation expectations, which reinforce the hawkish remarks delivered by Warsh last week, and if long-end rates turn higher, growth stocks valued on distant earnings face the first repricing hit. Calendar risks are stacking up: this is payrolls week with nonfarm data imminent, and September is statistically the worst month of the year for the S&P 500 — a seasonal headwind landing precisely when rates and oil are both rising. Bulls note that five consecutive monthly gains signals an intact trend with AI capex expansion continuing; bears counter that the rally has already priced in good news fully, and any stronger-than-expected payrolls print will revive rate-hike positioning. Will you trim exposure ahead of payrolls and shelter in cash-generative mega-caps, or use energy as a hedge?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
