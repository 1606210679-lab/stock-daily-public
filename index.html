const topics = [
  { ticker: "QQQ / .IXIC / .SPX", title_cn: "纳指跌5.54%，非农会再补一刀吗？", body_cn: "纳指在美股周四（11月5日）跌5.54%、QQQ跌6.49%、标普500跌4.36%，民主党赢得国会控制权后，市场集中重估AI数据中心建设、资本开支与监管风险。北京时间周五（11月6日）21:30将公布美国10月非农，市场预期新增约6万人，9月前值2.9万人，失业率预计维持4.2%。多头希望弱数据降低利率压力，空头担心强数据推高美债收益率、弱数据又确认经济降温。非农新增就业、失业率和工资增速中，哪个会决定科技股能否止跌？", title_en: "Payrolls Meet an AI Policy Shock — What Reprices First?", body_en: "The Nasdaq fell 5.54% in the Thursday, November 5 U.S. session, with QQQ down 6.49% and the S&P 500 off 4.36%, as markets re-rated AI data-center buildout, capex and regulatory risk after Democrats won control of Congress. October nonfarm payrolls will be released on Friday, November 6 at 21:30 Beijing time; consensus is about 60K versus 29K prior, with unemployment seen at 4.2%. Bulls want soft data to ease rate pressure, bears fear strong data lifts Treasury yields. Payrolls, unemployment or wage growth — which decides whether tech stops falling?" },
  { ticker: "SNDK", title_cn: "闪迪暴跌22.26%，高景气失效了吗？", body_cn: "闪迪在美股周四（11月5日）跌22.26%，成为当天跌幅最大的非杠杆个股之一，直接催化是AI数据中心政策风险触发高估值存储股去杠杆。公司此前财报显示企业级SSD需求、毛利率和下一季指引仍强，基本面并未在一天内反转；但多头判断越依赖数据中心扩建，政策审批和资本开支放缓就越容易压低估值。多头的抓手是供应紧张和高毛利率，空头的抓手是高预期与高波动。企业级SSD订单、毛利率和客户资本开支中，哪个最能验证这次暴跌是否过度？", title_en: "Strong SSD Fundamentals, 22% Selloff — What Broke?", body_en: "SanDisk plunged 22.26% in the Thursday, November 5 U.S. session, among the day's biggest non-leveraged decliners, as AI data-center policy risk triggered deleveraging in high-multiple memory stocks. Its prior results showed enterprise SSD demand, gross margins and next-quarter guidance still strong, and fundamentals did not turn in a day; but the more the bull case leans on data-center buildout, the more approvals and slower capex can compress multiples. Bulls hold tight supply and fat margins, bears elevated expectations. SSD orders, margins or customer capex — which best tests whether the rout was overdone?" },
  { ticker: "MU", title_cn: "美光跌17.48%，HBM逻辑动摇了吗？", body_cn: "美光在美股周四（11月5日）跌17.48%，即使近期市场仍在讨论内存短缺和多年供货协议，资金仍选择先降低AI硬件敞口。直接压力来自数据中心建设可能面临更严格的政策审查，令投资者重新评估HBM与服务器内存订单的兑现速度。多头的抓手是HBM产能紧张、客户锁单和回购能力，空头的抓手是高资本开支、周期价格和客户削减预算的尾部风险。HBM合同价、产能利用率和云厂资本开支中，哪个最能证明美光长期逻辑没有被破坏？", title_en: "HBM Is Tight, Shares Collapse — Is Demand the Wrong Anchor?", body_en: "Micron fell 17.48% in the Thursday, November 5 U.S. session; even with the market still debating memory shortages and multi-year supply agreements, money chose to cut AI hardware exposure first. The direct pressure is potential stricter policy scrutiny of data-center buildout, forcing investors to reassess how fast HBM and server memory orders convert. Bulls hold tight HBM capacity, locked-in customer orders and buyback firepower; bears high capex, cyclical pricing and the tail risk of customers cutting budgets. HBM contract prices, utilization or cloud capex — which best proves Micron's long-term thesis is intact?" },
  { ticker: "AMD", title_cn: "AMD财报双超后跌17.28%，错在哪？", body_cn: "AMD在美股周四（11月5日）跌17.28%，两天前的强财报和第四季度高指引未能抵消政策折价。公司第三季度营收、每股收益和数据中心收入均超过预期，管理层还预计下一季营收约170亿美元；但市场开始担心数据中心审批、客户资本开支和MI450交付节奏被外部政策拖慢。多头看到需求和产品路线没有改变，空头认为估值已经计入快速扩张。MI450出货、数据中心增速和毛利率中，哪个指标最能让市场重新相信强财报？", title_en: "Great Quarter, Brutal Re-Rating — Can MI450 Repair Trust?", body_en: "AMD fell 17.28% in the Thursday, November 5 U.S. session; strong results two days earlier and bullish fourth-quarter guidance could not offset a policy discount. Third-quarter revenue, EPS and data-center sales all beat, and management guided next-quarter revenue to about $17 billion, but the market now fears data-center approvals, customer capex and MI450 delivery cadence are being slowed by external policy. Bulls see demand and the product roadmap unchanged, bears see a valuation already pricing rapid expansion. MI450 shipments, data-center growth or gross margin — which could restore faith in the beat?" },
  { ticker: "MRVL", title_cn: "迈威尔再跌16.48%，并购要重算吗？", body_cn: "迈威尔在美股周四（11月5日）跌16.48%，全股票收购Lumentum的稀释担忧与AI基建监管风险同时压低估值。固定换股交易本已让市场担心长交割期、审批和整合成本，如今数据中心扩建节奏再被质疑，原本超过10亿美元的年化协同目标也需要更长时间兑现。多头看好交换芯片、DSP与激光器件的完整平台，空头担心买方股价下跌继续侵蚀交易对价。监管审批、客户留存和协同兑现中，哪个最能决定迈威尔是否见底？", title_en: "Dilution Meets Regulation — Can Marvell Carry Both?", body_en: "Marvell fell 16.48% in the Thursday, November 5 U.S. session as dilution worries over its all-stock purchase of Lumentum and AI infrastructure regulatory risk weighed on the multiple together. The fixed exchange ratio already had investors fretting over a long closing, approvals and integration costs; now that data-center buildout pace is in doubt, the original $1 billion-plus annualized synergy target will take longer to deliver. Bulls like the full platform of switching chips, DSPs and lasers, bears fear the falling buyer stock keeps eroding deal value. Approvals, customer retention or synergies — which decides whether Marvell has bottomed?" },
  { ticker: "NBIS", title_cn: "Nebius跌14.89%，交付风险暴露了吗？", body_cn: "Nebius在美股周四（11月5日）跌14.89%，市场把AI数据中心政策风险与公司自身容量交付压力叠加定价。新云厂的收入增长依赖服务器、电力和园区按计划上线，任何许可延迟或客户资本开支调整，都会先影响远期收入而成本与融资负担仍然存在。多头的抓手是AI算力需求和长期合同，空头的抓手是建设进度、融资成本和客户集中。已签容量、投产时间和单位资本回报中，哪个最能证明Nebius不是只靠远期故事支撑估值？", title_en: "Capacity Contracts Meet Permit Risk — What Is Nebius Worth?", body_en: "Nebius fell 14.89% in the Thursday, November 5 U.S. session as the market priced AI data-center policy risk alongside the company's own strain in delivering capacity. Revenue growth at new cloud plants depends on servers, power and campuses coming online as planned; any permitting delay or customer capex cut hits forward revenue first, while costs and financing burdens stay. Bulls hold AI compute demand and long-term contracts, bears construction timelines, financing costs and customer concentration. Contracted capacity, commissioning dates or unit returns on capital — which proves Nebius is not valued on story alone?" },
  { ticker: "SKHY", title_cn: "海力士跌13.40%，美国扩产受阻吗？", body_cn: "SK海力士在美股周四（11月5日）跌13.40%，除全球存储股去风险外，市场还在消化其美国纽约州约450亿美元芯片项目面临许可延迟的消息。HBM需求仍强，但美国扩产若推迟，会改变资本配置、客户本地化供应和未来产能释放节奏。多头认为韩国现有HBM产能与长期客户关系仍具优势，空头担心审批、建设成本和存储周期同步承压。美国项目许可、HBM订单和资本回报中，哪个变量最能决定海力士的估值底？", title_en: "HBM Leader, U.S. Permit Risk — Where Is Hynix's Floor?", body_en: "SK Hynix fell 13.40% in the Thursday, November 5 U.S. session; beyond the global memory de-risking, the market is digesting a report that its roughly $45 billion chip project in New York State faces permitting delays. HBM demand is still strong, but a delayed US buildout would change capital allocation, localized supply for customers and the pace of future capacity. Bulls say Korean HBM capacity and long-standing customer ties still stand out, bears worry approvals, build costs and the memory cycle bite at once. US permits, HBM orders or capital returns — which sets Hynix's valuation floor?" },
  { ticker: "TSM", title_cn: "台积电跌10.75%，先进制程也躲不过？", body_cn: "台积电在美股周四（11月5日）跌10.75%，AI监管与数据中心建设担忧已经从芯片设计公司蔓延到先进制程代工。台积电的订单能见度来自英伟达、AMD和云厂自研芯片，但如果客户资本开支、园区审批或能源供应放慢，远期晶圆需求也会被重新折现。多头的抓手是先进制程份额与长期产能预订，空头的抓手是客户集中、扩产成本和政策周期。先进制程利用率、客户锁定产能的力度和资本开支中，哪个最能证明台积电仍有防守属性？", title_en: "Foundry Leadership Meets Policy Risk — Is TSMC Defensive?", body_en: "TSMC fell 10.75% in the Thursday, November 5 U.S. session as AI regulatory and data-center buildout worries spread from chip designers to leading-edge foundry. Its order visibility comes from Nvidia, AMD and cloud in-house silicon, but slower customer capex, campus approvals or power supply would force forward wafer demand to be discounted again. Bulls hold leading-edge share and long-term capacity reservations, bears customer concentration, expansion costs and the policy cycle. Leading-edge utilization, locked-in capacity or capex — which proves TSMC still has defensive traits?" },
  { ticker: "TSLA", title_cn: "Tesla跌10.80%，政治风险压过AI吗？", body_cn: "Tesla在美股周四（11月5日）跌10.80%，选举结果落地后，市场重新计入特斯拉首席执行官马斯克与新国会之间的政策和监管摩擦。Tesla的高估值不仅来自汽车，还依赖Robotaxi、Optimus、xAI与SpaceX协同，因此政治关系、自动驾驶审批和政府合同预期会放大股价波动。多头的抓手是Robotaxi与机器人商业化，空头的抓手是监管、品牌分化和汽车业务增长放缓。Robotaxi许可、Optimus订单和汽车现金流中，哪个最能抵消政治风险折价？", title_en: "Robotaxi Promise Meets Congress — Which Risk Wins?", body_en: "Tesla fell 10.80% in the Thursday, November 5 U.S. session as, with election results in, the market re-priced policy and regulatory friction between CEO Elon Musk and the new Congress. Its premium valuation rests not only on cars but on Robotaxi, Optimus, xAI and SpaceX synergies, so political ties, autonomy approvals and government contract expectations amplify the stock's swings. Bulls hold Robotaxi and robotics commercialization, bears regulation, brand fragmentation and slowing auto growth. Robotaxi permits, Optimus orders or auto cash flow — which best offsets the political discount?" },
  { ticker: "INTC", title_cn: "英特尔再跌10.35%，修复逻辑失灵吗？", body_cn: "英特尔在美股周四（11月5日）跌10.35%，芯片监管冲击叠加公司此前疲弱的第四季度指引，使修复交易再次承压。数据中心业务增长无法完全抵消PC需求下降、毛利率压力和代工投入，市场也担心政策变化拖慢美国本土制造项目与客户导入。多头的抓手是政府支持、数据中心增长和潜在客户，空头的抓手是现金消耗、执行周期和竞争差距。毛利率、代工客户和PC需求中，哪个指标最可能先证明英特尔修复仍在继续？", title_en: "Weak Guidance Meets Policy Shock — What Saves Intel?", body_en: "Intel fell 10.35% in the Thursday, November 5 U.S. session, chip regulation shocks compounding its previously weak fourth-quarter guidance and pressing the turnaround trade again. Data-center growth cannot fully offset falling PC demand, margin pressure and foundry spending, and the market fears policy shifts will slow US manufacturing projects and customer wins. Bulls hold government support, data-center growth and potential customers, bears cash burn, execution timelines and the competitive gap. Gross margin, foundry customers or PC demand — which first proves the turnaround is still on?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
