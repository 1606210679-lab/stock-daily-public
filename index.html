<script>
const topics = [
  { ticker: "AAPL", title_cn: "苹果盘后跌5.7%,库克警告存储缺货砸了指引?", body_cn: "苹果周四日间跌1.41%,盘后财报公布后再跌5.74%。财年第三季（FY26 Q3）营收超预期,但iPad与服务收入不及预期、大中华区销售放缓,更关键的是库克明确警告存储供应紧张将冲击下一财季营收,公司正大举囤货以应对\"重大供应限制\"。存储成本从此成为硬件毛利的新变量。当超预期也救不了指引,苹果的供应链风险该计价到什么程度?", title_en: "Apple Drops 5.7% After-Hours — Did Cook's Memory Warning Sink Guidance?", body_en: "Apple fell 1.41% during Thursday's session before dropping a further 5.74% after-hours following its earnings release. Revenue beat expectations, but iPad and services revenue missed while Greater China sales slowed. More critically, Cook explicitly warned that memory supply constraints would weigh on next quarter's revenue, with the company aggressively stockpiling to counter what it called \"significant supply limitations.\" When a top-line beat can't rescue guidance, how fully should Apple's supply-chain risk be priced in?" },
  { ticker: "AMZN", title_cn: "亚马逊盘后飙9.4%,AWS重回五年最快增速?", body_cn: "亚马逊周四日间涨3.90%,盘后季报出炉后再涨9.43%。Q2最大亮点是AWS增速创下五年来最快,公司同时把2026年资本开支上调至约2200亿美元,市场把这份财报直接读成\"AI投入已经在云端变现\"。与同夜苹果的下挫形成鲜明对照,两家都超预期却走向两个方向。当加大烧钱反而换来暴涨,capex叙事是不是已经彻底转向?", title_en: "Amazon Surges 9.4% After-Hours — Has AWS Hit Its Fastest Growth in Five Years?", body_en: "Amazon rose 3.90% during Thursday's regular session, then surged a further 9.43% after-hours following its quarterly results. The standout was AWS recording its fastest growth rate in five years, while the company raised its 2026 capital expenditure outlook to approximately $220 billion — a result the market read as confirmation that AI investment is monetizing in the cloud. In stark contrast to Apple's simultaneous decline, both companies beat expectations yet moved in opposite directions. When ramping spend triggers a surge rather than a selloff, has the capex narrative definitively turned?" },
  { ticker: "MSFT", title_cn: "微软日间飙15.5%,一份财报打断纳指六连跌?", body_cn: "微软周四大涨15.51%,把前一夜盘后的涨势完全兑现,直接带动纳指结束六连跌、标普与纳指录得近一个月最佳单日。市场焦点从\"capex会不会失控\"转向\"AI到底能不能变现\",微软用业绩把这个问题按下去了。同期Meta因同类开支被抛售,分化极其刺眼。当龙头证明了烧钱有效,这轮由业绩驱动的反弹能延续多久?", title_en: "Microsoft Surges 15.5% — Did One Earnings Report End Nasdaq's Six-Session Slump?", body_en: "Microsoft surged 15.51% on Thursday, fully realizing the prior evening's after-hours gains and directly lifting the Nasdaq out of a six-session losing streak, with both the S&P 500 and Nasdaq posting their best single-day performance in nearly a month. Market focus shifted from \"will capex spiral out of control\" to \"can AI actually monetize\" — and Microsoft answered with its results. The contrast with Meta, which was sold off on comparable spending, was striking. Now that a megacap has proven the spend is working, how long can this earnings-driven rally last?" },
  { ticker: "META", title_cn: "Meta再跌8%,同批AI开支为何只有它被罚?", body_cn: "Meta周四收跌7.95%,延续财报后的抛售,与微软、亚马逊的暴涨形成极端分化。市场对它的AI投入回报周期最没耐心,卖方仍在争论\"重金投AI之后它是否依然被低估\"。苹果、亚马逊双双超预期却走势分道扬镳,说明资金已在为\"能不能兑现\"精细定价,而非一律给AI溢价。当同一批开支被区别对待,Meta要靠什么把叙事扭回来?", title_en: "Meta Falls 8% — Why Is It Alone Being Penalized for AI Spending?", body_en: "Meta closed down 7.95% on Thursday, extending post-earnings selling pressure in sharp divergence from the surges at Microsoft and Amazon. The market has the least patience for Meta's AI investment payback timeline, and sell-side analysts continue to debate whether the stock remains undervalued despite heavy AI outlays. The split outcomes across Apple and Amazon — both beating expectations yet moving in opposite directions — signal that capital is now pricing \"deliverability\" with precision rather than applying a blanket AI premium. What will it take for Meta to turn its narrative around?" },
  { ticker: "MU / SNDK / SKHY / DRAM / 07709 / SNXX / SOXS", title_cn: "美光飙18%闪迪涨26%,存储反弹轮到追了?", body_cn: "存储链周四暴力反弹:美光涨18.36%、闪迪涨25.99%、海力士涨17.52%、存储ETF(DRAM)涨16.70%;杠杆端更夸张,海力士2倍产品07709涨55.13%、闪迪2倍ETF(SNXX)涨51.88%,三倍做空半导体ETF(SOXS)崩26.29%。日间的驱动是三星利润暴增约13倍与超跌修复;收盘之后,苹果与亚马逊管理层双双点出存储成本飙升、供应紧张,存储股盘后继续跳涨——闪迪夜盘再涨4.61%、海力士涨3.76%。当\"缺货涨价\"由最大客户亲口确认,这轮反弹是趋势重启还是空头逼仓?", title_en: "Micron +18%, SanDisk +26%: Is It Time to Chase the Memory Rebound?", body_en: "The memory complex staged a violent Thursday rally: Micron +18.36%, SanDisk +25.99%, SK Hynix +17.52%, and the DRAM ETF +16.70%; leveraged products were even more extreme, with the 2x SK Hynix product 07709 +55.13%, the 2x SanDisk ETF (SNXX) +51.88%, and the 3x inverse semiconductor ETF (SOXS) collapsing 26.29%. Intraday catalysts were Samsung's roughly 13-fold profit surge and an oversold bounce; after the close, both Apple and Amazon management flagged soaring memory costs and tight supply, sending memory stocks higher again after-hours — SanDisk added 4.61% and SK Hynix 3.76%. With the largest customers on record confirming a supply shortage and price surge, is this rally a trend restart or a short squeeze?" },
  { ticker: "AMD", title_cn: "AMD涨13%,600美元目标价开始被认真算了?", body_cn: "AMD周四大涨13.00%,在AI板块V型反弹中领先大市值一档,卖方给出\"强力信心票\",并开始正面推演600美元目标价的路径。反方观点同样清晰:这个估值需要数据中心份额与毛利率同时兑现才站得住。前一日的Core Scientific交易与Synopsys设计合作仍在发酵。当股价跑在基本面前面,AMD还有多少时间来交付这份预期?", title_en: "AMD Surges 13% — Is a $600 Price Target Now Being Seriously Modeled?", body_en: "AMD jumped 13.00% on Thursday, leading large-cap peers in the AI sector's V-shaped rebound as sell-side analysts issued strong conviction calls and began laying out credible paths to a $600 price target. The bear case remains equally clear: that valuation requires simultaneous delivery on data center market share and margin expansion. The prior day's Core Scientific deal and Synopsys design partnership continue to resonate. With the stock running ahead of fundamentals, how much time does AMD have to deliver?" },
  { ticker: "INTC", title_cn: "英特尔涨11%,代工工具箱扩容能换来真订单?", body_cn: "英特尔周四大涨11.30%、夜盘再涨3.17%,催化是它为AI芯片客户扩充了代工工具链,代工叙事被重新定价。此前连续三日的杀跌几乎一次性收复,卖方\"估值已充分定价\"的判断立刻受到考验。真正的分歧仍在客户落地节奏与先进制程的产能利用率。当工具箱先到、订单还没到,这波反弹能走多远?", title_en: "Intel Jumps 11% — Can an Expanded Foundry Toolkit Win Real Customer Orders?", body_en: "Intel surged 11.30% on Thursday and added a further 3.17% after-hours, catalyzed by the expansion of its foundry toolchain for AI chip customers, prompting a repricing of its foundry narrative. The move nearly fully recovered three consecutive days of selling, immediately putting sell-side \"valuation fully priced\" calls to the test. The real debate remains the pace of customer wins and capacity utilization on advanced nodes. With the toolkit arriving ahead of the orders, how far can this rebound run?" },
  { ticker: "NVDA", title_cn: "英伟达只涨2.7%,大资金接走160亿是信号?", body_cn: "英伟达周四涨2.65%,在AI板块普涨里明显跑输AMD与存储,弹性反而最弱。消息面上,一家AI主题对冲基金把约160亿美元股票组合转让给Citadel,被市场解读为大资金正在AI杀跌中接盘;也有卖方直接把这轮回调称作英伟达与美光的买点。当龙头跑输高弹性同行,资金是在换仓还是在等下一份财报?", title_en: "Nvidia Gains Just 2.7% — Is a $16B Portfolio Transfer a Bullish Signal?", body_en: "Nvidia rose only 2.65% on Thursday, notably underperforming AMD and memory stocks in a broadly higher AI session, showing the least upside elasticity in the group. On the news front, an AI-focused hedge fund transferred an approximately $16 billion equity portfolio to Citadel, which the market interpreted as large capital stepping in to buy the AI selloff; separately, some sell-side analysts explicitly called the recent pullback a buying opportunity in both Nvidia and Micron. With the sector leader lagging higher-beta peers, is capital rotating or simply waiting for the next earnings print?" },
  { ticker: "NBIS", title_cn: "Nebius一天涨27%,7.75亿债务从风险变优势?", body_cn: "Nebius周四暴涨27.13%、夜盘再涨5.08%,与前一日12.65%的重挫完全反转。驱动是其7.75亿美元债务融资被重新解读为\"资本效率\"而非杠杆风险,叠加新的AI合作消息落地。前一日压垮股价的信用违约互换成本担忧,一天之内迅速降温。当同一笔杠杆先被当风险、再被当效率,neocloud的定价锚到底在哪?", title_en: "Nebius Surges 27% — Did $775M in Debt Flip From Risk to Advantage Overnight?", body_en: "Nebius surged 27.13% on Thursday and added a further 5.08% after-hours, completely reversing the prior day's 12.65% plunge. The catalyst was a reinterpretation of its $775 million debt financing as \"capital efficiency\" rather than leverage risk, compounded by the announcement of a new AI partnership. Concerns over credit default swap costs that had crushed the stock just 24 hours earlier dissipated rapidly. When the same leverage is first priced as a risk and then as an advantage, where exactly is the valuation anchor for neocloud names?" },
  { ticker: "TSLA / SPCX", title_cn: "特斯拉涨3.5%,卖中国业务换SpaceX合并值吗?", body_cn: "特斯拉周四收涨3.53%,《华尔街日报》报道其正权衡出售中国业务,为与SpaceX的潜在合并铺路,这一消息直接重塑两家公司的估值关系。SpaceX相关标的当日几乎收平、微跌0.31%,反应远比特斯拉克制。市场同时在讨论重仓马斯克资产的基金正在付出代价。当合并传闻把汽车与航天绑到一起,这对特斯拉是减负还是交出增长引擎?", title_en: "Tesla Gains 3.5% — Is Selling China Operations Worth a SpaceX Merger?", body_en: "Tesla closed up 3.53% on Thursday after the Wall Street Journal reported the company is weighing a sale of its China business as a precursor to a potential merger with SpaceX, a development that directly reshapes the valuation relationship between the two entities. SpaceX-linked instruments were nearly flat on the day, declining 0.31%, a far more muted reaction than Tesla's. Markets are also discussing the cost being borne by funds heavily concentrated in Musk-related assets. With merger speculation linking autos and aerospace, does this represent a balance-sheet relief for Tesla or the surrender of a core growth engine?" },
  { ticker: "QQQ", title_cn: "纳指ETF涨3.3%,PCE降温加财报把恐慌关掉了?", body_cn: "QQQ周四大涨3.30%、标普500ETF(SPY)涨1.68%,纳指100录得2025年5月以来最佳单日,六连跌就此终结。驱动一是微软财报领涨AI板块,二是6月核心PCE同比3.3%、较5月小幅回落,给政策转向留下想象空间。但市场对沃什领导的联储仍不买账,有评论直言\"要看行动不要听话术\"。当反弹由业绩而非流动性驱动,8月的季节性回撤还会不会来?", title_en: "QQQ Gains 3.3% — Did Cooling PCE and Earnings Together Switch Off the Fear?", body_en: "QQQ surged 3.30% on Thursday while the S&P 500 ETF (SPY) gained 1.68%, with the Nasdaq 100 posting its best single-day performance since May 2025 and ending a six-session losing streak. The twin catalysts were Microsoft's earnings leading the AI sector higher and June core PCE coming in at 3.3% year-on-year, a modest decline from May that keeps rate-cut speculation alive. However, markets remain skeptical of the Fed under Warsh's leadership, with commentary bluntly calling for \"action, not guidance.\" With the rebound driven by earnings rather than liquidity, will August's seasonal headwinds still arrive?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
