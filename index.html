<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-10-06 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-10-06</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 5</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:20.0%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 5 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "QQQ", title_cn: "纳指收创新高,10年期却升破5.32%,这波靠什么撑住?", body_cn: "纳斯达克综合指数周一收涨1.05%报27477.31点,刷新历史最高收盘价,标普500指数收涨0.66%报7773.95点,距离自己的历史最高收盘只差不到0.6%,纳指100ETF(QQQ)收涨0.88%报756.20美元。同一时间10年期美债收益率升到5.321%,是2002年以来的最高水平。指数的分化也是同一天的事:道琼斯工业平均指数只收涨0.18%报51267.90点,涨幅不到纳指的六分之一。多头的抓手是这回创新高不是靠估值扩张撑的,是AI这条线的盈利预期在往上推,利率高一点也压不住;空头的抓手是领涨的越来越集中在少数几只大市值科技股,道指和标普的涨幅都跟不上,一旦这几只歇脚,指数没有第二条腿。纳指新高和收益率新高同一天出现,你觉得这周该盯哪一个?", title_en: "Nasdaq Sets Record Close, 10-Year Yield Tops 5.32% — What's Holding It Up?", body_en: "The Nasdaq Composite rose 1.05% Monday to a record close of 27,477.31, while the S&P 500 gained 0.66% to 7,773.95, less than 0.6% below its own record; the Nasdaq 100 ETF (QQQ) added 0.88% to $756.20. The 10-year Treasury yield climbed to 5.321%, its highest since 2002, and the Dow rose just 0.18% to 51,267.90, under one-sixth of the Nasdaq's advance. Bulls say the high is not valuation-driven but powered by AI earnings expectations that higher rates cannot cap; bears say leadership is narrowing to a few mega-cap tech names, and if they stall the index has no second leg. How long can an index record and a yield record coexist before one gives?" },
  { ticker: "TSM / INTC / SPCX", title_cn: "马斯克确认Terafab洽谈台积电,英特尔为何独跌?", body_cn: "台积电周一收涨2.75%报485.80美元,创历史新高,推动来自特斯拉首席执行官马斯克确认了Terafab的早期洽谈,洽谈的对象是台积电。英特尔收跌2.63%报116.19美元,是半导体里当天唯一明显走弱的一只——此前它一直是马斯克芯片项目里唯一被公开点名的代工伙伴,这轮洽谈被市场读成对它位置的挤压。同一条消息里,SpaceX收涨7.63%报171.09美元。多头的抓手是Terafab不管最终落在谁手上,先进制程的产能都绕不开台积电,它在这条线上收的是过路费;空头的抓手是洽谈目前只到早期阶段,金额、产能、时间表一个都没公布,能确定的只是一句确认,订单还没变成合同。台积电这个新高,你觉得算订单落地还是算消息先行?", title_en: "Musk Confirms Terafab Talks With TSMC — Why Is Intel the Only One Falling?", body_en: "TSMC rose 2.75% Monday to a record close of $485.80, driven by Tesla chief executive Elon Musk confirming early-stage Terafab talks with the foundry. Intel fell 2.63% to $116.19, the only clear decliner in semiconductors that day — it had been the sole publicly named foundry partner in Musk's chip project, and the talks are being read as pressure on that position. In the same news, SpaceX rose 7.63% to $171.09. Bulls say whoever wins Terafab, advanced-node capacity runs through TSMC, which collects the toll either way; bears say the talks are only early-stage — no amount, capacity or timeline has been disclosed — so all that is confirmed is one statement and no orders. Is this record orders landing or the news getting ahead?" },
  { ticker: "CBRS", title_cn: "一条推文砸下去,一句话能救回多少?", body_cn: "Cerebras Systems周一收涨9.08%报181.55美元,反弹的直接触发点是OpenAI的Sam Altman公开把它称作紧密伙伴,把市场主要担心的那个问题压了下去。此前SemiAnalysis的一则推文让这只股票承压,担忧集中在它在这个赛道里的需求位置。公司股价52周区间是160.81到386.34美元,现价离区间下沿不远。多头的抓手是Altman这句话等于给出了一个需求侧的外部确认,对一家收入高度依赖少数大客户的芯片公司来说,这种确认比任何分析师评级都硬;空头的抓手是一家公司的估值被一条推文打下去、又被一句话拉回来,说明定价里真正起作用的还是叙事,不是可核验的订单和交付。一句话能涨9%,你觉得这类股票该不该按基本面来定价?", title_en: "One Tweet Sank It, One Line Rescues It — How Much Can That Buy?", body_en: "Cerebras Systems rose 9.08% Monday to $181.55, the rebound triggered directly by OpenAI's Sam Altman publicly calling it a close partner and easing the market's main worry. A SemiAnalysis tweet had earlier pressured the stock, with concern centered on its demand position in the sector. Its 52-week range is $160.81 to $386.34, with the price not far off the low. Bulls say Altman's remark is outside confirmation on the demand side, worth more than any analyst rating for a chip company whose revenue leans on a few large customers; bears say a valuation knocked down by a tweet and lifted by a sentence shows narrative, not verifiable orders and deliveries, is doing the pricing. If one line buys 9%, should stocks like this be priced on fundamentals?" },
  { ticker: "WDC / STX / SNDK / MU", title_cn: "前一天跌超10%,第二天涨回6%,存储这轮反转谁在买?", body_cn: "存储和硬盘周一集体反弹:西部数据收涨6.34%报441.64美元,希捷收涨4.49%报887.09美元,把上周五那根跌超10%的阴线收回了一部分。驱动是Bernstein的回应,它把市场对东芝扩产的恐慌称作茶杯里的风暴,维持西部数据和希捷的增持评级,并给出了倾向——即便东芝接近把产能翻倍,技术和执行上都还有风险,而且这个行业目前是远远供不上需求的。同一板块里两只没跟上:闪迪收跌0.92%报1704.16美元,美光收跌1.02%报1063.96美元。多头的抓手是卖方直接说这一跌是杀过头了,说明紧缺这个前提并没有被一条扩产计划动摇;空头的抓手是反弹和下跌都集中在硬盘这两只身上,闪迪和美光没跟,说明资金买的是“跌多了”,不是“看多整个板块”。从跌10%到涨6%,你觉得这是跌过头之后的修复,还是下跌途中的反弹?", title_en: "Down Over 10% One Day, Up 6% the Next: Who's Buying This Memory Reversal?", body_en: "Memory and hard-drive names rebounded Monday: Western Digital rose 6.34% to $441.64 and Seagate 4.49% to $887.09, clawing back part of Friday's more than 10% drop. The driver was Bernstein's response calling market panic over Toshiba's capacity expansion a storm in a teacup, maintaining Outperform ratings on both and arguing that even near-doubled capacity carries technical and execution risk, with the industry still far short of demand. Two peers lagged: SanDisk fell 0.92% to $1,704.16 and Micron 1.02% to $1,063.96. Bulls say the sell side called the panic a mispricing, leaving the shortage premise intact; bears say the move ran through the two HDD names while SanDisk and Micron did not follow, meaning money bought the dip, not the sector. From down 10% to up 6%, is this mispricing repaired or a bounce in a downtrend?" },
  { ticker: "VST", title_cn: "能源部确认42亿美元核电贷款,Vistra这波涨的是什么?", body_cn: "Vistra Energy周一收涨3.48%报144.89美元,推动是美国能源部确认了一笔42亿美元的核电贷款,用于扩大核电发电量。这条线的背景是数据中心用电需求把电力资产重新推到了定价的中心,同一批被提到的公司还有Constellation、NextEra和NRG。Vistra是标普500里的核电标的,这次是站上了一个关键位置。多头的抓手是这笔钱直接指向扩大发电量,而电力的买家是签了长约的数据中心,现金流的能见度比一般的公用事业资产高;空头的抓手是贷款落地到发电量落地之间隔着建设周期,而现价已经把未来几年的用电增长提前算了进去,一旦数据中心的用电承诺往后推,估值先反应。42亿美元的贷款,你觉得够支撑这条电力叙事走多远?", title_en: "Energy Department Confirms $4.2B Nuclear Loan — What Is Vistra's Rally About?", body_en: "Vistra Energy rose 3.48% Monday to $144.89, driven by the U.S. Energy Department confirming a $4.2 billion nuclear loan to expand nuclear generation. The backdrop is data-center power demand pushing electricity assets back to the center of pricing, with Constellation, NextEra and NRG among the other names cited. Vistra is the S&P 500's nuclear play and has reached a key level. Bulls say the money points straight at expanding generation, and the buyers are data centers on long-term contracts, giving better cash-flow visibility than ordinary utility assets; bears say construction cycles sit between the loan and the megawatts, while the price already discounts years of demand growth, so if data-center power commitments slip, valuation reacts first. How far can $4.2 billion carry this power narrative?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
