<script>
const topics = [
  { ticker: ".SPX / QQQ / .IXIC", title_cn: "CPI与PPI双双降温,美股新高还能冲多远?", body_cn: "美股周四三大指数齐升,标普500指数收涨0.65%至7798.99点、收盘创历史新高,盘中一度上破7800点整数关;纳指涨0.81%、QQQ涨1.16%,道指涨0.13%。推力是连着两天的通胀数据都偏软:7月CPI同比3.4%、环比0.1%,核心同比2.5%、环比0.2%,四项全部符合预期;周四公布的7月PPI同比4.2%,明显低于4.9%的预期与5.5%的前值,环比持平、为四个月最低,市场随即把美联储延长政策暂停的概率往上调,加息担忧进一步缓解。空方的动作同样清楚:大空头伯里被披露加仓QQQ看跌期权,并公开表示在为\"更大的一轮下跌\"做准备;也有卖方提醒下一轮科技财报前不宜追高。数据面转顺、筹码面转紧,这是典型的高位分歧。CPI与PPI会成为美股再创新高的续航燃料,还是新一轮波动的起点?你会继续加仓科技、换到黄金与防御板块,还是先观望等下一轮财报?", title_en: "CPI and PPI Both Cool — How Much Further Can U.S. Stocks Run?", body_en: "U.S. equities advanced Thursday, with the S&P 500 rising 0.65% to a record close of 7,798.99, briefly breaching 7,800 intraday; the Nasdaq gained 0.81%, QQQ surged 1.16%, and the Dow added 0.13%. Soft inflation data drove the rally: July CPI came in at 3.4% year-on-year and 0.1% month-on-month, while July PPI printed at 4.2% year-on-year — well below the 4.9% consensus and prior 5.5% — prompting markets to raise the probability of an extended Fed pause. Meanwhile, noted short-seller Burry disclosed an enlarged QQQ put position, stating he is positioning for \"a larger leg down,\" while sell-side desks cautioned against chasing highs ahead of the next tech earnings cycle. Will CPI and PPI serve as fuel for further record highs, or mark the starting point of a new volatility wave? Do you add to tech, rotate into gold and defensives, or wait for the next earnings round?" },
  { ticker: "SNDK / WDC / SNXX", title_cn: "闪迪投资者日抛蓝图涨13.7%,存储再提速?", body_cn: "闪迪周四大涨13.67%、盘中一度暴涨约17%,催化是它召开2026投资者日——这是从西部数据分拆独立后最重要的一场战略发布会。管理层抛出的长期指引相当激进:28-30财年非GAAP毛利率目标80%、营业利润率75%,调整后自由现金流利润率维持50%,营收年增长15%-19%,并承诺把100%的过剩现金返还股东。同链条一起被抬起来:西部数据涨7.31%,闪迪2倍杠杆ETF(SNXX)单日涨27.28%。但空方理由并没有被消掉:上一轮财报它营收同比暴涨近4倍、还抛出140亿美元回购,却因下一财季指引偏弱连跌两个交易日,说明市场对NAND的定价看的是指引而不是后视镜;伯里同期还在加大对存储链的空头押注。当长期蓝图与短期指引各说一套,你更愿意买本体闪迪、跟涨的西部数据,还是直接用杠杆ETF?", title_en: "SanDisk Investor Day Blueprint Sparks 13.7% Surge — Can Memory Accelerate Further?", body_en: "SanDisk surged 13.67% Thursday, spiking as much as ~17% intraday, after holding its 2026 Investor Day — the most significant strategic presentation since its spin-off from Western Digital. Management issued aggressive long-term targets: non-GAAP gross margin of 80% and operating margin of 75% by fiscal years 2028–2030, adjusted free cash flow margin sustained at 50%, revenue growth of 15–19% annually, and a commitment to return 100% of excess cash to shareholders. The entire memory supply chain was lifted in sympathy, with Western Digital gaining 7.31% and the 2x leveraged SanDisk ETF (SNXX) surging 27.28% on the day. Bear-case risks remain, however: in the prior earnings report, SanDisk posted revenue nearly 4x higher year-on-year and announced a $14 billion buyback, yet still fell for two consecutive sessions on weak near-term guidance — underscoring that NAND pricing is driven by forward outlook, not the rearview mirror. Burry also simultaneously increased short exposure across the memory chain. With the long-term blueprint and near-term guidance telling different stories, do you prefer SanDisk itself, the coattail play in Western Digital, or direct exposure via the leveraged ETF?" },
  { ticker: "SKHY / MU / 07709", title_cn: "海力士涨7.3%美光涨4.2%,存储还能追吗?", body_cn: "存储链周四继续走强:SK海力士涨7.29%、美光涨4.23%,海力士2倍杠杆产品07709涨9.83%,三倍做多半导体ETF(SOXL)涨2.25%。多头理由堆得很厚:SK集团董事长公开表示不担心对英伟达的依赖度,卖方顺势给出\"通往1万亿美元市值之路\"的判断,并指其基本面在强化、估值仍有竞争力;美光则被曝正用一只新设的AI基金重新梳理存储战略,前一日刚重回1万亿美元市值。空方的动作恰好同时出现:伯里被披露加大了对美光的空头头寸,理由是他预期一轮\"更大的下跌\";此外中国长鑫存储已被纳入一只AI存储ETF,新增供给正被资本市场正名。同一条链上,多头看紧缺延续到2027年之后,空头看产能与估值,两边都拿得出证据。你更看好HBM主供的海力士、周期弹性更大的美光,还是干脆用2倍杠杆产品放大波动?", title_en: "SK Hynix +7.3%, Micron +4.2% — Can Memory Stocks Still Be Chased?", body_en: "The memory supply chain extended gains Thursday: SK Hynix rose 7.29%, Micron advanced 4.23%, the 2x leveraged Hynix product 07709 gained 9.83%, and the 3x leveraged semiconductor ETF SOXL added 2.25%. Bull case arguments are stacking up: the SK Group chairman publicly dismissed concerns over dependence on Nvidia, sell-side analysts issued a \"path to $1 trillion market cap\" call citing strengthening fundamentals and competitive valuation, while Micron — which just reclaimed a $1 trillion market cap the prior session — was reported to be restructuring its memory strategy around a newly established AI fund. Bear-side catalysts appeared simultaneously, however: Burry disclosed increased short positions in Micron, anticipating \"a larger decline,\" while China's CXMT was added to an AI memory ETF, signaling that new supply is gaining capital-market legitimacy. Bulls point to supply constraints extending beyond 2027; bears cite capacity additions and stretched valuations — both sides have evidence. Do you favor HBM-dominant SK Hynix, the higher-cyclical-beta Micron, or simply amplify the move with a 2x leveraged product?" },
  { ticker: "AMAT / COHR", title_cn: "应用材料盘后跌5.1%,自建产能没变成订单?", body_cn: "本周AI硬件链的最后两份财报给出了偏冷的答案。应用材料周四日间跌2.48%、盘后再跌5.13%:每股收益3.50美元略超3.4544美元的预期,营收91.15亿美元却略低于91.76亿的预期,更关键的是它给出的指引被市场评为\"反应平淡\"——在股价此前一轮上涨之后,这份指引不足以支撑估值。这一条恰好是本周最重要的验证:特斯拉与SpaceX宣布168亿美元建Terafab园区、英特尔增发150亿美元扩产,这些资本开支公告要变成设备订单才算落地,而设备端的指引说明\"还没到\"。光模块的Coherent对照更刺眼:它在前一晚盘后交出双超预期的成绩——每股收益1.74美元高于1.6474美元的预期,营收20.46亿美元高于20.25亿的预期——次日却收跌7.99%,把前一交易日8.24%的涨幅全部还了回去。多头会说订单只是滞后,空方会说扩产公告与设备采购之间本就隔着一到两个季度。当公告已经满天飞、订单还没进来,你更信设备端的指引,还是继续押AI巨头的资本开支?", title_en: "Applied Materials Falls 5.1% After Hours — Capex Announcements Not Converting to Orders?", body_en: "The final two earnings reports in the AI hardware chain this week delivered a cautious signal. Applied Materials fell 2.48% during the session Thursday and dropped a further 5.13% after hours: EPS of $3.50 slightly beat the $3.4544 consensus, but revenue of $9.115 billion missed the $9.176 billion estimate, and forward guidance was received as underwhelming relative to the stock's prior run-up. This outcome is the week's most important data point: Tesla and SpaceX's announced $16.8 billion Terafab campus and Intel's $15 billion capacity expansion issuance are capex headlines that only matter when they translate into equipment orders — and equipment guidance signals that moment has not yet arrived. The contrast with optical components maker Coherent is stark: it reported a double beat the prior evening — EPS of $1.74 versus the $1.6474 consensus, revenue of $2.046 billion versus $2.025 billion — yet still closed down 7.99% the following session, erasing its prior-day 8.24% gain entirely. Bulls will argue orders are simply lagging; bears will note that capex announcements and equipment procurement are typically separated by one to two quarters. With announcements flooding in but orders yet to follow, do you trust equipment-sector guidance, or continue to bet on hyperscaler capex?" },
  { ticker: "PLTR / TSLA / NVDA", title_cn: "特斯拉涨3.8%Palantir涨4.7%,空头却在加注?", body_cn: "一份被广泛转载的持仓变动显示,伯里在为\"更大的一轮下跌\"布局:加仓QQQ看跌期权、加大美光空头,同时对英伟达、Palantir与特斯拉的头寸也做了调整。有意思的是这三只标的周四全在涨——Palantir涨4.66%、特斯拉涨3.80%、英伟达涨0.54%。各自也有独立催化:特斯拉方面,瑞典工会在公司推出买断方案后结束了持续近三年的罢工,这条长期悬着的劳资风险落地;Palantir延续财报后的强势,此前美银、摩根大通与Oppenheimer在同一时间把它列进最看好的AI标的;英伟达则在等自己披露的13F美股投资组合,市场想看它这一季会不会继续加码AI产业链。空方的逻辑是估值与拥挤度,多方的逻辑是业绩与订单,目前为止股价站在后者一边。当最有名的空头开始加注、标的却继续新高,你会跟着减仓,还是把这当成情绪指标反向用?", title_en: "Tesla +3.8%, Palantir +4.7% — Yet the Most Famous Short Is Adding Exposure?", body_en: "Widely circulated position disclosures showed Burry positioning for \"a larger leg down\" — adding QQQ puts, increasing Micron shorts, and adjusting exposure to Nvidia, Palantir, and Tesla. Notably, all three names gained Thursday: Palantir rose 4.66%, Tesla advanced 3.80%, and Nvidia edged up 0.54%. Each had independent catalysts: in Sweden, a union ended a nearly three-year strike after Tesla introduced a buyout package, removing a long-standing labor risk; Palantir extended its post-earnings momentum, having been added to top AI picks simultaneously by BofA, JPMorgan, and Oppenheimer; and Nvidia's own 13F equity portfolio disclosure is awaited, with markets watching whether the company continued to build out its AI ecosystem holdings. The bear thesis rests on valuation and crowding; the bull thesis rests on earnings and order flow — for now, price action favors the latter. With the most prominent short adding to positions while targets keep making new highs, do you trim alongside him, or treat it as a contrarian sentiment signal?" },
  { ticker: "ONDS", title_cn: "白宫加征无人机关税,Ondas为何反跌8.8%?", body_cn: "白宫周四发布公告,对来自欧盟、日本、列支敦士登、韩国、瑞士与台湾的无人机及零部件加征15%的从价关税,英国产无人机适用10%,关税将在公告后21天生效。按常规推演,这类壁垒应当利好美国本土无人机厂商,但Ondas Holdings当日逆势收跌8.80%,是同期无人机相关标的里最弱的一档。分歧点在成本结构:关税挡住了海外整机,却同时抬高了本土厂商进口零部件的成本,而Ondas这类中小市值公司的供应链本地化程度尚不清楚,市场对\"国产替代受益\"与\"成本上升承压\"两种解读并没有形成共识;此外它前期涨幅已大,政策落地也可能成为获利了结的窗口。当政策方向明确、传导路径却不明确,你会按国产替代逻辑买本土厂商,还是等21天后关税真正生效再看订单?", title_en: "White House Imposes Drone Tariffs — Why Did Ondas Reverse to Fall 8.8%?", body_en: "The White House announced Thursday a 15% ad valorem tariff on drones and components imported from the EU, Japan, Liechtenstein, South Korea, Switzerland, and Taiwan, with a 10% rate applied to UK-origin drones; tariffs take effect 21 days after the announcement. Conventional logic would favor U.S. domestic drone manufacturers, yet Ondas Holdings bucked the trend, closing down 8.80% — the weakest performance among drone-related names on the day. The divergence centers on cost structure: the tariff blocks finished foreign products but simultaneously raises the cost of imported components for domestic manufacturers, and the degree of supply-chain localization at small-cap names like Ondas remains unclear. Markets have not reached consensus on whether the \"domestic substitution beneficiary\" or \"cost-pressure headwind\" narrative applies. Prior gains in the stock also made policy implementation a natural profit-taking window. With policy direction clear but transmission uncertain, do you buy domestic manufacturers on the substitution thesis, or wait until the tariffs actually take effect in 21 days before assessing order flow?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
