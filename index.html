<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;

  /* Card */

  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }

  /* Content boxes */

    border: 1px solid rgba(245,158,11,0.2);

  /* Buttons */

  .copy-body-cn-btn:hover  { background: #b45309; }

  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */

  /* Nav */

<script>
const topics = [
  { ticker: "PLTR / SNAP", title_cn: "Palantir飙29%,空头一天被打掉30亿美元?", body_cn: "Palantir周二日间暴涨29.45%,把前一夜财报的盘后涨幅彻底兑现,成为标普500与道指同创新高的领涨旗手。据统计这轮约30%的拉升已让做空者账面亏损约30亿美元,空头回补本身又变成了新燃料;基本面支撑是Q2营收同比增93%、商业收入翻倍级增速。同一套逻辑在Snap身上重演——它同日涨14.88%,靠的是营收增19%叠加净亏损从2.63亿收窄到1.64亿。当应用层从讲故事切换到报利润,逼空结束之后还剩什么支撑?", title_en: "Palantir Surges 29% — Did Short Sellers Just Lose $3 Billion in a Day?", body_en: "Palantir soared 29.45% Tuesday, fully absorbing its after-hours post-earnings gap and leading both the S&P 500 and Dow Jones to simultaneous record highs. The ~30% rally has inflicted roughly $3 billion in mark-to-market losses on short sellers, with forced covering adding fresh momentum; fundamentals underpin the move, with Q2 revenue up 93% year-over-year and commercial revenue growth near double. The same dynamic played out in Snap, which rose 14.88% on 19% revenue growth and a net loss that narrowed from $263 million to $164 million. Now that the app layer has shifted from storytelling to profit delivery, what support remains once the short squeeze is exhausted?" },
  { ticker: "SPCX", title_cn: "SpaceX两好一坏盘后崩8%,明日解禁再添压?", body_cn: "SpaceX周二日间大涨9.43%,盘后首份公开财报出炉后跳水8.04%、一度跌近9%。报表是两好一坏:核心财务指标明显好于市场预期、营收同比增约92%,AI业务的亏损收窄进度也强于预期,但AI相关资本支出同样高于预期,其中对英伟达的巨额采购承诺被摆到台前。真正的压力落在明天——最多约9.115亿股内部人与员工持股解禁,占总可解禁股份的20%。当利好已被消化、筹码却要在明天涌出,先松手的会是谁?", title_en: "SpaceX Drops 8% After-Hours — Will Tomorrow's Lockup Expiry Add More Pressure?", body_en: "SpaceX surged 9.43% during Tuesday's session before tumbling 8.04% — briefly approaching 9% — after releasing its first public earnings report after-hours. The results were two positives and one negative: core financials and AI segment loss-narrowing both beat expectations, but AI-related capital expenditure exceeded forecasts, with a substantial purchase commitment to Nvidia highlighted. The real pressure arrives tomorrow, when up to approximately 911.5 million insider and employee shares become eligible for sale, representing 20% of total unlockable shares. With the good news digested and supply set to hit tomorrow, who moves first?" },
  { ticker: "AMD", title_cn: "AMD业绩不差却盘后跌8.7%,预期是不是太满?", body_cn: "AMD周二日间涨7.00%、与英特尔一同领涨芯片股,但盘后财报公布后急跌8.68%。关键指标与华尔街预期对比后被判定\"稳健有余、惊喜不足\",数据中心加速卡的份额叙事没能给出超预期增量。此前股价已在AI乐观情绪中连续修复,预期被提前打满。当\"solid\"变成利空,AMD要用什么才能重新撬动这轮定价?", title_en: "AMD Drops 8.7% After-Hours Despite Solid Results — Were Expectations Already Maxed Out?", body_en: "AMD rose 7.00% intraday Tuesday alongside Intel to lead the chip rally, then plunged 8.68% after its earnings report dropped after-hours. Key metrics were deemed \"solid but unsurprising\" against Wall Street expectations, with the data center accelerator share narrative failing to deliver a meaningful upside surprise. The stock had already staged a sustained recovery on AI optimism, leaving little room for incremental good news. When \"solid\" becomes a negative catalyst, what will it take for AMD to re-price this cycle?" },
  { ticker: "MU / SNDK / SKHY / SOXL", title_cn: "存储链全线暴涨,美光新平台把周期问题答了?", body_cn: "存储链周二集体重估:美光涨7.62%、闪迪涨10.84%、海力士涨8.17%,三倍做多半导体ETF(SOXL)飙19.87%。催化一是美光发布新的AI存储平台,美银同时把此前的回调定义为\"终端需求稳健下的买点\";二是海力士被Wolfe Research与RBC双双首次覆盖、均给出Outperform与200美元目标价,而它与闪迪正联手攻AI的下一个瓶颈。今晚闪迪与西数交卷。当卖方集体转向、平台叙事补位,存储的周期争议这次会被业绩终结吗?", title_en: "Memory Stocks Surge Across the Board — Has Micron's New Platform Answered the Cycle Debate?", body_en: "Memory names staged a broad re-rating Tuesday: Micron gained 7.62%, SanDisk surged 10.84%, SK Hynix rose 8.17%, and the 3x leveraged semiconductor ETF SOXL spiked 19.87%. Catalysts included Micron's new AI memory platform launch — with BofA characterizing the recent pullback as a buying opportunity amid resilient end demand — and SK Hynix receiving its first Outperform ratings from both Wolfe Research and RBC, each with a $200 price target, as SK Hynix and SanDisk jointly target AI's next bottleneck. SanDisk and Western Digital report earnings tonight. With the sell side pivoting collectively and platform narratives stepping in, will this earnings cycle finally put the memory debate to rest?" },
  { ticker: "MRVL / AAOI", title_cn: "AAOI飙19%迈威尔涨13%,禁令反成光模块红利?", body_cn: "光互连成为周二最猛的分支:Applied Optoelectronics暴涨19.44%,直接催化是一项拟禁止中国AI硬件的提案,国产替代逻辑被瞬间放大;迈威尔涨12.81%,其看涨期权出现罕见的巨量异动,卖方同时在讨论\"打折后是否算便宜\"。Arista对AI网络需求给出乐观指引,进一步印证互连环节的紧俏。当政策与需求同向,光模块这波重估还有多少空间?", title_en: "AAOI Jumps 19%, Marvell Gains 13% — Is a China AI Ban Fueling Optical Module Upside?", body_en: "Optical interconnects were Tuesday's standout sub-sector: Applied Optoelectronics surged 19.44%, directly catalyzed by a proposed ban on Chinese AI hardware that instantly amplified domestic-substitute logic; Marvell climbed 12.81% amid unusually heavy call-option activity, with sell-side analysts debating whether the stock is cheap at current levels after recent declines. Arista provided an upbeat outlook on AI networking demand, further confirming tightness across the interconnect layer. With policy and demand now pointing in the same direction, how much further can this optical module re-rating run?" },
  { ticker: "INTC", title_cn: "英特尔涨10.8%,AI合作把估值争议压住了?", body_cn: "英特尔周二大涨10.84%、夜盘小幅回吐3.38%,与AMD共同领涨这轮芯片反弹。驱动来自二季度指引与AI合作进展的更新,卖方开始重新讨论\"现价是否已算合理\",此前\"估值被充分定价\"的口径明显松动。真正的考验仍是代工客户落地与先进制程的产能利用率。当反弹幅度已经跑到两位数,英特尔的AI叙事撑得住多久?", title_en: "Intel Surges 10.8% — Have AI Partnership Updates Finally Quieted the Valuation Debate?", body_en: "Intel jumped 10.84% Tuesday before giving back 3.38% in after-hours trading, co-leading the chip rally alongside AMD. The driver was an updated second-quarter outlook and AI partnership developments, prompting sell-side analysts to revisit whether current prices are fairly valued — a notable softening from prior \"fully priced\" language. Key tests remain: foundry customer wins and capacity utilization on advanced process nodes. With the rebound already in the double digits, how long can Intel's AI narrative hold?" },
  { ticker: "NVDA", title_cn: "英伟达涨2.6%,SpaceX的开支单成了它的订单?", body_cn: "英伟达周二涨2.56%,涨幅不大但角色关键:SpaceX首份财报暴露出巨额资本开支,其中对英伟达的采购承诺被市场直接读成算力需求的确认——同一份财报里,SPCX盘后跳水而NVDA走高。这把\"客户烧钱\"与\"供应商收钱\"的分化摆得格外清楚。当买方的成本变成卖方的确定性,英伟达的定价还需要看谁的脸色?", title_en: "Nvidia Gains 2.6% — Did SpaceX's Capex Bill Become Nvidia's Order Confirmation?", body_en: "Nvidia rose 2.56% Tuesday in a move that carried outsized significance: SpaceX's debut earnings report revealed heavy capital expenditure, and the market read its explicit Nvidia purchase commitments as direct confirmation of sustained compute demand — in the same filing, SpaceX fell sharply after-hours while Nvidia moved higher. The divergence puts the \"customer's cost is the supplier's certainty\" dynamic on unusually clear display. When a buyer's spending becomes a seller's conviction, whose signals does Nvidia's valuation still need to follow?" },
  { ticker: "AAPL", title_cn: "苹果涨2%,库克正式交棒该抄底还是观望?", body_cn: "苹果周二涨1.96%,消息面尘埃落定——CEO蒂姆·库克确认卸任,卖方立刻列出\"接任期该逢跌买入\"的三条理由,把交棒当作估值重置的起点而非风险。另一条线索是OpenAI在商业秘密诉讼中提交了苹果员工的短信记录,AI人才与技术边界的摩擦公开化。存储成本上行仍压着硬件毛利。当掌舵人换手,苹果的AI补课节奏会加快还是更谨慎?", title_en: "Apple Rises 2% as Cook Confirms Exit — Time to Buy the Dip or Wait?", body_en: "Apple gained 1.96% Tuesday as CEO Tim Cook officially confirmed his departure, with sell-side analysts immediately publishing three reasons to buy on weakness during a transition, framing the handover as a valuation reset opportunity rather than a risk event. A separate thread emerged as OpenAI submitted Apple employee text messages in a trade-secrets lawsuit, bringing AI talent and intellectual-property friction into the open. Rising memory costs continue to weigh on hardware margins. With leadership changing hands, will Apple's AI catch-up accelerate or proceed more cautiously?" },
  { ticker: "AMZN", title_cn: "亚马逊跌2.3%,减持余波还是AI开支被追问?", body_cn: "亚马逊周二收跌2.32%,是大市值里少见的下跌,前一夜贝索斯申报出售1500万股的余波仍在发酵。同时公司正把Prime Video打造成AI能力的展示窗口,被解读为向市场证明AI投入的去处;但最新电话会上,它也面对了关于开支与回报的最尖锐提问。市值刚破3万亿,分歧立刻转向\"这笔钱花得值不值\"。当创始人减持与AI叙事同时摆上桌,资金该信哪一边?", title_en: "Amazon Drops 2.3% — Bezos Selldown Overhang or AI Spending Under Scrutiny?", body_en: "Amazon fell 2.32% Tuesday, an outlier among large-caps, as the overhang from Bezos's previously disclosed sale of 15 million shares continued to weigh on sentiment. The company is positioning Prime Video as a showcase for its AI capabilities, a move interpreted as proof-of-concept for its AI investment thesis; yet on its latest earnings call, management faced pointed questions about capital expenditure and returns. With market cap having just crossed $3 trillion, debate has quickly shifted to whether the spending is justified. With a founder selldown and an AI narrative on the table simultaneously, which signal should investors trust?" },
  { ticker: "QQQ", title_cn: "纳指ETF涨3.4%,AI升势从云厂商扩散到基建?", body_cn: "QQQ周二大涨3.40%,标普500指数涨1.79%、SPY涨1.80%,标普与道指双双收创历史新高。表层驱动是强财报流与霍尔木兹海峡重开的乐观预期,风险溢价被迅速压缩;更值得盯的是资金路径变了——亚马逊上周以AWS近四年最快增速验证了算力投入的回报,买盘随后从云厂商向AI软件与数据中心基建扩散,CoreWeave同日再涨7.16%。也有人提醒真正的威胁不是关税,而是沃什领导下的联储路径。当升势从几只龙头扩散到整条基建链,新高之后该由谁接棒?", title_en: "QQQ Surges 3.4% to Record Highs — Is the AI Rally Spreading From Cloud to Infrastructure?", body_en: "QQQ surged 3.40% Tuesday, with the S&P 500 gaining 1.79% and SPY rising 1.80% as both the S&P 500 and Dow Jones closed at all-time highs. Surface-level drivers included a strong earnings flow and optimism around the reopening of the Strait of Hormuz, rapidly compressing risk premiums; more significantly, capital rotation broadened — following AWS's fastest growth in nearly four years validating returns on compute investment, buying spread from cloud operators into AI software and data center infrastructure, with CoreWeave rising another 7.16% on the day. Some observers note the real risk is not tariffs but the Fed's policy path under Warsh. With the rally now diffusing across the entire infrastructure stack, who takes the baton after new highs?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
