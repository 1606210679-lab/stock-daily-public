<script>
const topics = [
  { ticker: "PLTR / SNAP", title_cn: "Palantir盘后飙14%,营收增93%让大空头也认输?", body_cn: "Palantir周一日间涨2.10%,盘后财报出炉后暴涨14.25%:Q2营收19.35亿美元、同比增93%,调整后每股收益0.41美元,商业收入增速更高达约150%。同夜Snap交出营收15.99亿美元、同比增19%,净亏损从2.63亿收窄至1.64亿,日间涨7.46%、夜盘再涨7.74%——应用层不再只讲故事。资金面更耐人寻味:大空头伯里已平掉半数PLTR空头,段永平年初建仓后仍在卖出看跌期权加码。当空头与价值投资人同时转向,AI软件的盈利兑现算被确认了吗?", title_en: "Palantir Surges 14% After Hours — Do the Bears Finally Concede?", body_en: "Palantir gained 2.10% during Monday's session before surging 14.25% after hours as quarterly results showed revenue of $1.935 billion, up 93% year-over-year, with adjusted EPS of $0.41 and commercial revenue growth of approximately 150%. Snap also delivered on the same night — revenue of $1.599 billion, up 19%, with net loss narrowing from $263 million to $164 million; shares rose 7.46% intraday and an additional 7.74% after hours. With prominent short-seller Burry having closed half his PLTR short position and value investor Duan Yongping continuing to sell put options to add exposure, does the simultaneous pivot by bears and value players confirm AI software's earnings inflection?" },
  { ticker: "SPCX / RKLB / ASTS", title_cn: "SpaceX涨5.7%今晚交卷,9亿股解禁谁先跑?", body_cn: "SpaceX周一涨5.68%,今晚盘后将交出上市以来第一份季报,但更硬的考验排在后面:按分阶段限售协议,财报后的第二个交易日最多约9.115亿股内部人与员工持股解禁,占可解禁股份的20%,以最新股价计算潜在流通市值接近千亿美元。太空概念同步走强,Rocket Lab涨8.44%、AST SpaceMobile涨7.70%。业绩与筹码两件事被压进48小时。当解禁紧跟财报落地,先动的会是内部人还是追高的散户?", title_en: "SpaceX Rises 5.7% Before Earnings — Who Moves First as 915M Shares Unlock?", body_en: "SpaceX climbed 5.68% Monday ahead of its first-ever quarterly earnings release since listing, but the harder test follows immediately: under a phased lock-up agreement, up to approximately 911.5 million insider and employee shares — 20% of the unlockable float — become eligible for sale on the second trading day after the report, representing a potential market value approaching $100 billion at current prices. Space-sector peers rallied in sympathy, with Rocket Lab up 8.44% and AST SpaceMobile up 7.70%. With earnings and the lock-up expiry compressed into 48 hours, when the unlock lands right on top of results, will insiders or momentum retail traders move first?" },
  { ticker: "ORCL", title_cn: "甲骨文涨9.2%,联邦大单补得回年内28%跌幅?", body_cn: "甲骨文周一大涨9.22%,随AI云板块集体转暖——同日CoreWeave涨11%、Snowflake涨6%,风险偏好明显回归。基本面上,CACI与甲骨文合作为美国人事管理局做联邦HR系统现代化,政企订单继续落地。但它年内仍累跌约28%,卖方正在讨论\"要什么条件才能回到200美元\"。当强反弹与深回撤并存,甲骨文的云叙事这次能走多远?", title_en: "Oracle Jumps 9.2% — Can a Federal Contract Offset a 28% YTD Decline?", body_en: "Oracle surged 9.22% Monday as the AI cloud sector broadly recovered, with CoreWeave up 11% and Snowflake up 6% on the same day, signaling a clear return of risk appetite. On the fundamental side, CACI and Oracle are collaborating to modernize the U.S. Office of Personnel Management's federal HR systems, adding another government enterprise contract. Yet Oracle remains down roughly 28% year-to-date, and sell-side analysts are actively debating what conditions would be needed to return the stock to $200. With a sharp rebound coexisting alongside a deep drawdown, how far can Oracle's cloud narrative carry this time?" },
  { ticker: "NBIS", title_cn: "Nebius再涨11.6%,一场爆仓反而成了利好?", body_cn: "Nebius周一大涨11.64%,延续前一周的反转,被卖方直接称作\"neocloud领军者\"。市场把某AI主题基金的爆仓视为\"清算事件\"——Cramer认为正是这场清算腾出了闪迪与Nebius的反弹空间,拥挤交易出清后估值重新被接受。同日AI云集体走强,信用担忧退潮。当杠杆出清成了反弹理由,这轮neocloud修复能延续多久?", title_en: "Nebius Surges Another 11.6% — Did a Short Squeeze Become a Catalyst?", body_en: "Nebius jumped 11.64% Monday, extending the prior week's reversal, with sell-side analysts now explicitly labeling it the \"neocloud leader.\" The market interpreted the forced unwind of an AI-themed fund as a \"liquidation event\" — Cramer argued the deleveraging cleared room for both SanDisk and Nebius to rebound, with crowded-trade flush-out making valuations acceptable again. AI cloud names rallied broadly on the same day as credit concerns receded. With leveraged unwinds now cited as a bullish catalyst, how long can this neocloud recovery last?" },
  { ticker: "MSFT", title_cn: "微软涨4.9%,华尔街逼它解释的究竟是什么?", body_cn: "微软周一涨4.93%,延续财报后的强势。市场焦点从业绩转向追问:华尔街要求管理层把AI投入的口径与回报路径讲清楚,有顶级分析师直言超大规模厂商是这轮AI的明确赢家、被打压的软件股才是价值所在。多空真正的分歧是自由现金流与估值哪个更贵。当\"赢家共识\"开始形成,微软的溢价还剩多少空间?", title_en: "Microsoft Gains 4.9% — What Exactly Is Wall Street Demanding It Explain?", body_en: "Microsoft rose 4.93% Monday, extending post-earnings strength, as market focus shifted from results to accountability: Wall Street is pressing management to clearly define the accounting scope of AI investment and articulate the path to returns, with top analysts openly stating that hyperscalers are the clear winners of this AI cycle while beaten-down software stocks represent the real value. The true bull-bear divide centers on whether free cash flow or valuation multiples are more stretched. As a \"winner consensus\" begins to form, how much premium room does Microsoft have left?" },
  { ticker: "AMZN", title_cn: "亚马逊涨4.6%破3万亿,贝索斯却递了减持单?", body_cn: "亚马逊周一涨4.58%,市值首次站上3万亿美元,也是道指收创历史新高的主要推手。这轮的核心抓手是云:AI算力订单从概念预期变成多年期框架合同,盈利确定性提升,微软、谷歌同日涨近5%,弹性更大的算力外溢受益者CoreWeave单日飙19.49%。但盘后股价转跌——贝索斯提交文件,拟出售1500万股、市值约40.7亿美元。当里程碑与创始人减持撞在同一天,3万亿是新起点还是阶段高点?", title_en: "Amazon Gains 4.6%, Crosses $3 Trillion — Why Did Bezos File to Sell?", body_en: "Amazon rose 4.58% Monday, pushing its market cap above $3 trillion for the first time and serving as the primary driver of the Dow Jones Industrial Average closing at a record high. The core catalyst was cloud: AI compute orders have evolved from speculative expectations into multi-year framework contracts, raising earnings visibility; Microsoft and Google each gained nearly 5% on the same day, while higher-leverage compute beneficiary CoreWeave surged 19.49%. Shares reversed after hours, however, as Bezos filed to sell 15 million shares valued at approximately $4.07 billion. With a historic milestone and a founder's sell notice landing on the same day, is $3 trillion a new launchpad or a cyclical peak?" },
  { ticker: "META / GOOG", title_cn: "Meta涨6%谷歌涨4.4%,白宫约谈是压力测试?", body_cn: "Meta周一涨6.02%、谷歌涨4.44%,双双领涨巨头。消息面上,白宫计划周二与科技巨头就AI安全测试开会,监管框架被推到台前;Meta财报电话会上的几场激烈交锋也仍在被复盘。当下市场把监管进程当成\"确定性提升\"而非风险,这与年初的反应完全相反。当政策桌与业绩桌同时开,这两家的AI叙事谁更经得起审?", title_en: "Meta Gains 6%, Google 4.4% — Is the White House Meeting a Stress Test?", body_en: "Meta rose 6.02% and Google gained 4.44% Monday, jointly leading the mega-cap rally. On the news front, the White House plans to meet with major tech companies Tuesday on AI safety testing, putting the regulatory framework back in the spotlight; heated exchanges from Meta's earnings call are also still being dissected. Markets are currently treating regulatory progress as a source of increased certainty rather than risk — a complete reversal from early-year sentiment. With policy discussions and earnings execution running in parallel, whose AI narrative holds up better under scrutiny?" },
  { ticker: "NVDA", title_cn: "英伟达涨2.9%,确定性开始被拿来跟美光比?", body_cn: "英伟达周一涨2.93%,随风险偏好回归上行,但涨幅落后同板块多数标的。卖方开始把它与美光并置讨论——\"要押AI热潮,是买英伟达的故事还是美光的长约\",供需锁价的确定性成了新的比较维度。同期半导体ETF刚走完2002年以来最差单月,估值折价被反复提起。当龙头被拿来跟上游比确定性,英伟达的溢价逻辑是否正在变?", title_en: "Nvidia Rises 2.9% — Is Its Certainty Now Being Benchmarked Against Micron?", body_en: "Nvidia advanced 2.93% Monday alongside a broader recovery in risk appetite, though it lagged most peers within the semiconductor sector. Sell-side analysts have begun positioning it alongside Micron in the same conversation — \"to play the AI boom, do you buy Nvidia's story or Micron's locked-in supply contracts\" — with supply-demand pricing certainty emerging as a new comparison metric. The semiconductor ETF just posted its worst single month since 2002, and valuation discounts are being repeatedly cited. With the sector leader now being benchmarked against upstream suppliers on certainty, is Nvidia's premium logic shifting?" },
  { ticker: "TSLA", title_cn: "特斯拉涨3.5%,超级多头松口它反而更敢涨?", body_cn: "特斯拉周一涨3.49%,耐人寻味的是催化来自一位\"超级多头\"略微转空——预期被下调,股价却逆势走强。另有科技预言家直言\"还把特斯拉当车企,是这十年最大的误判\",机器人与自动驾驶重新成为定价核心;马斯克的财富已是埃里森的四倍。当最乐观的人开始降温,市场却更敢买了,这种分歧该怎么读?", title_en: "Tesla Rises 3.5% — Did a Super-Bull Trimming Expectations Embolden Buyers?", body_en: "Tesla gained 3.49% Monday in a notable dynamic: the catalyst appeared to be a prominent \"super-bull\" modestly turning more cautious — as expectations were trimmed, the stock rallied against the grain. Separately, a prominent tech commentator stated that \"still viewing Tesla as a car company is the decade's biggest misjudgment,\" with robotics and autonomous driving re-emerging as the core pricing framework; Musk's net worth is now cited as four times that of Ellison. When the most optimistic voice starts to cool and the market buys more aggressively, how should this divergence be read?" },
  { ticker: "AAPL", title_cn: "苹果跌1.8%,库克时代收尾谁来接AI这摊?", body_cn: "苹果周一收跌1.78%,是巨头里唯一下跌的一个,财报后的供应链隐忧仍在消化。话题正转向管理层交接——卖方直接以\"库克时代即将结束\"为框架讨论它未来十年还值不值得买,同时提醒苹果八月历来是\"新闻真空期\",缺乏催化。存储成本上行与AI叙事缺席是两个未解的问题。当接班议题盖过财报本身,苹果的估值该按谁的战略来定?", title_en: "Apple Drops 1.8% — Who Inherits the AI Agenda as the Cook Era Winds Down?", body_en: "Apple fell 1.78% Monday, the only declining name among mega-caps, as post-earnings supply chain concerns continued to weigh. The narrative is shifting toward leadership succession — sell-side analysts are explicitly framing the next decade's investment case around \"the end of the Cook era,\" while also flagging that August has historically been a \"news vacuum\" for the stock, lacking near-term catalysts. Rising memory costs and the absence of a clear AI narrative remain two unresolved questions. With the succession debate overshadowing the earnings itself, whose strategic vision should anchor Apple's valuation?" },
  { ticker: "QQQ", title_cn: "纳指ETF涨1.8%,伊朗谈判把道指送上纪录高?", body_cn: "QQQ周一涨1.76%,标普500指数涨1.48%、SPY涨1.42%,道指在Mag 7走强与油价回落的组合下收创历史新高。驱动来自伊朗谈判的乐观预期,叠加特朗普表态点燃的风险偏好。但半导体ETF刚经历2002年以来最差单月,仍有机构提示这可能只是\"死猫跳\"。当指数创新高而芯片还在深水区,这轮反弹的基础够牢吗?", title_en: "Nasdaq ETF Gains 1.8% — Did Iran Talks Drive the Dow to a Record High?", body_en: "QQQ rose 1.76% Monday while the S&P 500 gained 1.48% and SPY advanced 1.42%, as the Dow Jones Industrial Average closed at a record high driven by a combination of Mag 7 strength and declining oil prices. The rally was fueled by optimism around Iran negotiations alongside risk appetite ignited by Trump's commentary. However, the semiconductor ETF just posted its worst single month since 2002, and some institutions are warning this may be a dead-cat bounce. With indexes at record highs while chips remain in the deep end, is this rally built on solid ground?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
