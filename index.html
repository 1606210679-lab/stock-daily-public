<script>
const topics = [
  { ticker: "QQQ / .SPX / .DJI", title_cn: "CPI四项全中,指数为何只涨了个零头?", body_cn: "美国7月CPI周三出炉,四项数据全部与预期一致:同比3.4%(预估3.4%、前值3.5%),环比0.1%(预估0.1%、前值-0.4%);核心CPI同比2.5%(预期2.50%、前值2.60%),环比0.2%(预期0.20%、前值0.00%)。同比增幅是3月以来最小,核心是2月以来最小。分项上住房与食品通胀环比各微涨0.1%,能源通胀较前一个月下降1.5%;核心环比之所以从0.00%回升到0.2%,主要来自医疗保健、机票、通讯、教育与娱乐。数据后交易员把9月加息概率压到约33%。但指数反应克制:标普500指数涨0.26%、纳指涨0.54%、QQQ涨0.73%,道指微跌0.04%,巨头反而集体走弱、AI算力二线单日暴涨。当利率靴子落地、资金第一件事是换仓,分歧到底在哪?", title_en: "CPI Hit on All Four Metrics — So Why Did Markets Barely Move?", body_en: "U.S. July CPI printed in line across the board: headline CPI +3.4% YoY and +0.1% MoM; core CPI +2.5% YoY and +0.2% MoM — the smallest annual gains since March and February, respectively. Housing and food inflation each rose 0.1% MoM while energy fell 1.5%; the core MoM rebound from 0.00% was driven by healthcare, airfares, communications, and education. Traders trimmed the probability of a September rate hike to roughly 33%, yet equities were muted — the S&P 500 gained 0.26%, the Nasdaq 0.54%, QQQ 0.73%, while the Dow dipped 0.04%, mega-caps weakened collectively, and second-tier AI compute names surged. With the rate overhang resolved, the first move was a rotation — so where exactly is the disagreement?" },
  { ticker: "NBIS / CRWV / RIOT", title_cn: "Nebius营收增454%飙34%,算力开始收钱了?", body_cn: "AI算力股周三迎来多重催化。Nebius暴涨34.14%:Q2营收5.82亿美元、同比大增454%,调整后净亏损3320万美元、同比收窄64%,卖方口径从\"看积压订单\"转向\"看现金流爆发\"。CoreWeave涨19.28%:Q2营收25.75亿美元、略低于26.11亿的预期,每股亏损1.03美元好于预期的1.24美元,真正的底牌是1040亿美元积压订单,不过也有报告提醒它仍在\"平衡术\"阶段。第三条是超长周期合约——Anthropic与比特币矿企Riot敲定20年算力协议,基础合同价值91亿美元、锁定191兆瓦,延期选择权全部行权后总额最高可达161亿美元,Riot前一日涨4.33%。当亏损收窄、千亿订单与20年长约同时出现,云计算这轮到了哪个阶段?", title_en: "Nebius Surges 34% on 454% Revenue Jump — Is AI Compute Monetizing?", body_en: "AI compute stocks drew multiple catalysts Wednesday. Nebius soared 34.14%: quarterly revenue hit $582 million, up 454% YoY, while adjusted net loss narrowed 64% YoY to $33.2 million, shifting the sell-side narrative from backlog-watching to cash-flow inflection. CoreWeave rose 19.28%: quarterly revenue came in at $2.575 billion, slightly below the $2.611 billion consensus, with a per-share loss of $1.03 beating the $1.24 estimate, anchored by a $104 billion order backlog — though some reports cautioned the company remains in a \"balancing act\" phase. A third catalyst: Anthropic and Bitcoin miner Riot signed a 20-year compute agreement with a base contract value of $9.1 billion covering 191 megawatts, expandable to up to $16.1 billion if all extension options are exercised; Riot had gained 4.33% the prior session. With losses narrowing, a $104 billion backlog, and a 20-year contract all arriving simultaneously, which phase has cloud computing reached?" },
  { ticker: "SMCI / LITE", title_cn: "超微涨19%光模块涨13.6%,空头被打反了?", body_cn: "两个财报前被看空的标的走出反向行情。Super Micro周三大涨19.02%:每股收益1.70美元远超0.98美元的预期,营收111.20亿美元低于117.82亿的预期,而卖方转口径称它的毛利率展望正在转强——毛利恰恰是财报前市场最担心的一项。Lumentum涨13.63%:每股收益3.23美元略超3.03美元的预期、营收10.06亿美元基本符合,一份上调评级的报告直言它在累计上涨约600%后依然不贵,另一份认为它的AI机会刚刚变大;而它在财报前一个交易日还随光模块板块被砸下8.61%。两家的共同点是悲观定价先行,业绩只要不差就成了超预期。当预期被打得太低,这类反转还能复制吗?", title_en: "Super Micro Jumps 19%, Optical Modules Gain 13.6% — Short Squeeze?", body_en: "Two heavily shorted names staged sharp reversals. Super Micro surged 19.02%: EPS of $1.70 crushed the $0.98 consensus, though revenue of $11.12 billion missed the $11.782 billion estimate; the sell-side pivoted, arguing that the gross margin outlook — the market's primary pre-earnings concern — is turning stronger. Lumentum gained 13.63%: EPS of $3.23 narrowly beat the $3.03 estimate and revenue of $1.006 billion was broadly in line; one upgrade report argued the stock remains reasonably valued even after cumulative gains of roughly 600%, while another said its AI opportunity has just expanded — notable given the stock was sold off 8.61% alongside the optical module sector just one session before earnings. The common thread: pessimistic positioning preceded both prints, meaning results only had to avoid disappointment to register as beats. When expectations are set this low, can these reversals keep repeating?" },
  { ticker: "MU / SKHY / SNDK / 07709", title_cn: "美光重回万亿市值,存储这次是真反转?", body_cn: "存储链周三集体走强:美光涨4.92%、市值重新站上1万亿美元,海力士涨9.01%、闪迪涨5.76%,海力士2倍杠杆产品07709单日涨14.28%,三倍做多半导体ETF(SOXL)涨6.89%。推力有三层:CPI落地后风险偏好回归;美光管理层上周明确表示AI存储紧缺可能延续到2027年之后、瑞银据此判断其盈利能力将出现\"结构性重置\";花旗二季度13F也显示它显著加仓了美光。反方仍在中国新增产能——长鑫已被纳入一只AI存储ETF。这条链过去两周上下折返多次,涨跌都很急。当市值里程碑与周期争议并存,存储的定价锚找到了吗?", title_en: "Micron Reclaims $1 Trillion Market Cap — Is the Memory Reversal Real?", body_en: "Memory stocks rallied broadly Wednesday: Micron gained 4.92%, reclaiming a $1 trillion market cap; SK Hynix rose 9.01%; SanDisk climbed 5.76%; SK Hynix's 2x leveraged product 07709 surged 14.28%; and the 3x leveraged semiconductor ETF SOXL advanced 6.89%. Three drivers converged: risk appetite returned after the CPI print; Micron management recently stated AI memory supply constraints could extend beyond 2027, prompting UBS to forecast a \"structural reset\" in the company's earnings power; and Citigroup's latest 13F showed a significant increase in its Micron position. The bear case centers on new Chinese capacity — CXMT has been added to an AI memory ETF. The sector has reversed sharply multiple times over the past two weeks. With a market-cap milestone and cyclical debate coexisting, has memory found its pricing anchor?" },
  { ticker: "SPCX", title_cn: "SpaceX涨9.7%,马斯克说AI九月就成第一大业务?", body_cn: "SpaceX周三大涨9.65%,把史上最大规模解禁落地以来的反弹继续拉长。催化来自马斯克的一句预判:他称AI将在9月成为SpaceX最大的业务,这个时间点比市场此前的理解激进得多,等于把估值叙事从发射与星链直接切到算力——公司首份财报里,AI相关资本开支高于预期本是被卖方挑刺的一项,现在被重新解读成投入前置。反方声音同样直接,有报告以\"小心重力\"为题提醒基本面终会把股价拉回。当叙事重心换得比业务更快,该按哪条线给它定价?", title_en: "SpaceX Surges 9.7% — Musk Says AI Becomes Top Business in September?", body_en: "SpaceX jumped 9.65% Wednesday, extending its rebound since the largest-ever lockup expiration. The catalyst was a bold forecast from Elon Musk: he said AI will become SpaceX's largest business segment by September — a timeline far more aggressive than market expectations, effectively shifting the valuation narrative from launch and Starlink directly to compute infrastructure. AI-related capital expenditure that sell-side analysts had flagged as a concern in the company's first earnings report is now being reframed as front-loaded investment. A dissenting report titled \"Beware of Gravity\" countered that fundamentals will ultimately anchor the share price. When the narrative shifts faster than the underlying business, which line should drive the valuation?" },
  { ticker: "700 / 981 / 1347 / 9618", title_cn: "腾讯营收增11%却跌3%,AI开支吃掉现金流?", body_cn: "港股科技进入业绩验证期。腾讯Q2营收2047.9亿元、同比增11%,经调整净利润684.2亿元、同比增9%;AI提升广告投放效率带动营销服务收入增22%,本土游戏收入增17%。但股价周四港股盘中仍跌3.03%,分歧集中在现金:本季资本开支升至527.8亿元,自由现金流为负138亿元,公司口径称剔除算力采购预付款后仍有376亿元——钱花在算力,不是主业失速,AI投入正从\"讲模型\"进入应用与商业化验证期。昨夜盘后京东集团与两家国产芯片厂中芯国际、华虹宏力也已交卷,今日盘中中芯涨2.67%、华虹涨2.45%、京东涨0.49%,资金明显更认国产算力链。当AI投入开始压现金流,腾讯该按利润还是按投入估?", title_en: "Tencent Revenue Up 11% Yet Stock Falls 3% — Is AI Spending Consuming Cash Flow?", body_en: "Hong Kong tech stocks have entered an earnings verification phase. Tencent posted quarterly revenue of 204.79 billion yuan, up 11% YoY, with adjusted net profit of 68.42 billion yuan, up 9% YoY; AI-driven advertising efficiency lifted marketing services revenue 22%, while domestic gaming revenue rose 17%. Yet shares fell 3.03% in Hong Kong intraday, with debate centered on cash: capital expenditure rose to 52.78 billion yuan this quarter, pushing free cash flow to negative 13.8 billion yuan — though management said FCF remains positive at 37.6 billion yuan excluding prepayments for compute procurement. After the close, JD.com, SMIC, and Hua Hong Semiconductor also reported; SMIC gained 2.67%, Hua Hong 2.45%, and JD.com 0.49% intraday, with capital clearly favoring the domestic compute supply chain. As AI spending begins to pressure cash flow, should Tencent be valued on earnings or on investment?" },
  { ticker: "GOOG / NVDA", title_cn: "巴菲特百亿押谷歌,英伟达持仓还没揭盖?", body_cn: "二季度13F进入最后披露窗口。伯克希尔已在Q2财报里释放信号:净买入近200亿美元上市股票、结束连续14个季度净卖出,其中约100亿美元投向谷歌,巨额现金开始回流科技龙头——但具体持仓要等本周末才公开。另一条值得盯的是英伟达自己披露的美股投资组合,新一季会否继续加码AI产业链,直接关系到\"循环交易\"这个质疑的成色。此外花旗、淡马锡、德银都已披露最新持仓,其中花旗持仓市值突破3000亿美元,并显著加仓美光与AMD等半导体产业链。股价上两者分化:谷歌周三微跌0.18%,英伟达涨3.03%。当巨头同时是卖方和买方,抄作业前要先分清哪一层?", title_en: "Buffett Bets ~$10B on Google — Has Nvidia's Portfolio Still Not Been Revealed?", body_en: "The Q2 13F disclosure window is entering its final stretch. Berkshire Hathaway signaled in its quarterly earnings that it was a net buyer of roughly $20 billion in listed equities — ending 14 consecutive quarters of net selling — with approximately $10 billion directed toward Alphabet, marking a significant return of its massive cash pile to big tech; specific holdings will be made public later this week. Also worth watching: Nvidia's own disclosed U.S. equity portfolio — whether it continues adding to the AI supply chain has direct bearing on the credibility of \"circular trading\" concerns. Separately, Citigroup, Temasek, and Deutsche Bank have already filed their latest holdings; Citi's portfolio market value surpassed $300 billion, with notable additions in Micron, AMD, and other semiconductor names. The two stocks diverged Wednesday: Alphabet slipped 0.18% while Nvidia gained 3.03%. When a mega-cap is simultaneously a seller and a buyer, which layer matters before following the trade?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
