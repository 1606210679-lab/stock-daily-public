<script>
const topics = [
  { ticker: ".SPX / QQQ / .IXIC", title_cn: "标普收创纪录盘中破7800,伯里却在买看跌?", body_cn: "美股周四三大指数齐升,标普500指数收涨0.65%至7798.99点、收盘创历史新高,盘中一度上破7800点整数关;纳指涨0.81%、QQQ涨1.16%,道指涨0.13%。推力是连着两天的通胀数据都偏软:7月CPI同比3.4%、环比0.1%,核心同比2.5%、环比0.2%,四项全部符合预期;周四公布的7月PPI同比4.2%,明显低于4.9%的预期与5.5%的前值,环比持平、为四个月最低,市场随即把美联储延长政策暂停的概率往上调,加息担忧进一步缓解。空方的动作同样清楚:大空头伯里被披露加仓QQQ看跌期权,并公开表示在为\"更大的一轮下跌\"做准备;也有卖方提醒下一轮科技财报前不宜追高。数据面转顺、筹码面转紧,这是典型的高位分歧。CPI与PPI会成为美股再创新高的续航燃料,还是新一轮波动的起点?你会继续加仓科技、换到黄金与防御板块,还是先观望等下一轮财报?", title_en: "S&P 500 Closes at Record High Past 7,800 — But Is Burry Buying Puts?", body_en: "U.S. equities rallied Thursday, with the S&P 500 rising 0.65% to a record close of 7,798.99, briefly breaching 7,800 intraday; the Nasdaq gained 0.81%, QQQ +1.16%, and the Dow +0.13%. July CPI came in at 3.4% year-on-year and 0.1% month-on-month, while July PPI printed 4.2% year-on-year — well below the 4.9% consensus and prior 5.5% — prompting markets to push out Fed rate-hike expectations. Meanwhile, notable short-seller Michael Burry was disclosed to have added QQQ put options, publicly stating he is positioning for \"a larger downturn.\" Will CPI and PPI data fuel further record highs, or mark the start of a new wave of volatility — and will you add to tech, rotate into gold and defensives, or wait for the next round of earnings?" },
  { ticker: "SNDK / WDC / SNXX", title_cn: "闪迪投资者日抛蓝图涨13.7%,存储再提速?", body_cn: "闪迪周四大涨13.67%、盘中一度暴涨约17%,催化是它召开2026投资者日——这是从西部数据分拆独立后最重要的一场战略发布会。管理层抛出的长期指引相当激进:28-30财年非GAAP毛利率目标80%、营业利润率75%,调整后自由现金流利润率维持50%,营收年增长15%-19%,并承诺把100%的过剩现金返还股东。同链条一起被抬起来:西部数据涨7.31%,闪迪2倍杠杆ETF(SNXX)单日涨27.28%。但空方理由并没有被消掉:上一轮财报它营收同比暴涨近4倍、还抛出140亿美元回购,却因下一财季指引偏弱连跌两个交易日,说明市场对NAND的定价看的是指引而不是后视镜;伯里同期还在加大对存储链的空头押注。当长期蓝图与短期指引各说一套,你更愿意买本体闪迪、跟涨的西部数据,还是直接用杠杆ETF?", title_en: "SanDisk Surges 13.7% on Investor Day Blueprint — Can Memory Keep Accelerating?", body_en: "SanDisk surged 13.67% Thursday, briefly spiking ~17% intraday, after hosting its 2026 Investor Day — the most significant strategic presentation since its spinoff from Western Digital. Management issued aggressive long-term targets: non-GAAP gross margin of 80% and operating margin of 75% by FY28–30, adjusted free cash flow margin of 50%, annual revenue growth of 15–19%, and a commitment to return 100% of excess cash to shareholders. The broader memory chain rallied in tandem — Western Digital gained 7.31% and the 2x leveraged SanDisk ETF (SNXX) surged 27.28% — though bears note that SanDisk's prior earnings saw revenue nearly quadruple year-on-year alongside a $14 billion buyback announcement, yet the stock fell for two straight sessions on weak near-term guidance, underscoring that NAND pricing is driven by forward outlook, not history. With long-term targets and near-term guidance telling different stories, would you buy SanDisk outright, ride Western Digital's coattails, or go straight to the leveraged ETF?" },
  { ticker: "SKHY / MU / 07709", title_cn: "海力士涨7.3%,伯里为何反手加大美光空头?", body_cn: "存储链周四继续走强:SK海力士涨7.29%、美光涨4.23%,海力士2倍杠杆产品07709涨9.83%,三倍做多半导体ETF(SOXL)涨2.25%。多头理由堆得很厚:SK集团董事长公开表示不担心对英伟达的依赖度,卖方顺势给出\"通往1万亿美元市值之路\"的判断,并指其基本面在强化、估值仍有竞争力;美光则被曝正用一只新设的AI基金重新梳理存储战略,前一日刚重回1万亿美元市值。空方的动作恰好同时出现:伯里被披露加大了对美光的空头头寸,理由是他预期一轮\"更大的下跌\";此外中国长鑫存储已被纳入一只AI存储ETF,新增供给正被资本市场正名。同一条链上,多头看紧缺延续到2027年之后,空头看产能与估值,两边都拿得出证据。你更看好HBM主供的海力士、周期弹性更大的美光,还是干脆用2倍杠杆产品放大波动?", title_en: "SK Hynix Jumps 7.3% — Why Is Burry Doubling Down on Micron Shorts?", body_en: "The memory chain extended gains Thursday: SK Hynix rose 7.29%, Micron gained 4.23%, the 2x leveraged Hynix product 07709 climbed 9.83%, and the 3x leveraged semiconductor ETF SOXL added 2.25%. Bulls stacked up reasons — SK Group's chairman publicly dismissed concerns over Nvidia dependency, a sell-side analyst outlined a path to a $1 trillion market cap for Hynix citing strengthening fundamentals and competitive valuation, while Micron was reported to be restructuring its memory strategy through a newly established AI fund, having just recrossed the $1 trillion market-cap threshold the prior session. Bears, however, were equally active: Burry was disclosed to have increased his short position in Micron, citing expectations of a \"larger decline,\" while China's CXMT was added to an AI memory ETF, legitimizing new supply in the eyes of capital markets. On the same chain, bulls see supply constraints extending past 2027 while bears point to capacity expansion and stretched valuations — both sides have evidence. Do you favor HBM-dominant SK Hynix, the higher-beta Micron, or amplify the trade with the 2x leveraged product?" },
  { ticker: "AMAT / COHR", title_cn: "应用材料盘后跌5.1%,自建产能没变成订单?", body_cn: "本周AI硬件链的最后两份财报给出了偏冷的答案。应用材料周四日间跌2.48%、盘后再跌5.13%:每股收益3.50美元略超3.4544美元的预期,营收91.15亿美元却略低于91.76亿的预期,更关键的是它给出的指引被市场评为\"反应平淡\"——在股价此前一轮上涨之后,这份指引不足以支撑估值。这一条恰好是本周最重要的验证:特斯拉与SpaceX宣布168亿美元建Terafab园区、英特尔增发150亿美元扩产,这些资本开支公告要变成设备订单才算落地,而设备端的指引说明\"还没到\"。光模块的Coherent同日收跌7.99%,把前一交易日8.24%的涨幅全部还了回去。多头会说订单只是滞后,空方会说扩产公告与设备采购之间本就隔着一到两个季度。当公告已经满天飞、订单还没进来,你更信设备端的指引,还是继续押AI巨头的资本开支?", title_en: "Applied Materials Falls 5.1% After Hours — Did Capex Announcements Fail to Convert to Orders?", body_en: "The final two earnings reports from the AI hardware chain this week delivered a cooler-than-expected read. Applied Materials slipped 2.48% during regular trading Thursday before falling a further 5.13% after hours: EPS of $3.50 narrowly beat the $3.4544 consensus, but revenue of $9.115 billion missed the $9.176 billion estimate, and management's guidance was met with a muted market reaction — insufficient to justify the stock's recent run-up. This outcome directly tests the week's key thesis: Tesla and SpaceX's announced $16.8 billion Terafab campus and Intel's $15 billion capacity expansion require capex commitments to translate into equipment orders before they count, and equipment-side guidance signals that conversion has not yet arrived. Optical components maker Coherent fell 7.99% on the same day, surrendering its entire 8.24% gain from the prior session. Bulls will argue orders are merely lagging; bears contend there is typically a one-to-two quarter gap between capex announcements and equipment procurement. With announcements in abundance but orders yet to materialize, do you trust equipment-side guidance or continue betting on the megacap AI capex cycle?" },
  { ticker: "PLTR / TSLA / NVDA", title_cn: "伯里加注做空,这三只当天却全在涨?", body_cn: "一份被广泛转载的持仓变动显示,伯里在为\"更大的一轮下跌\"布局:加仓QQQ看跌期权、加大美光空头,同时对英伟达、Palantir与特斯拉的头寸也做了调整。有意思的是这三只标的周四全在涨——Palantir涨4.66%、特斯拉涨3.80%、英伟达涨0.54%。各自也有独立催化:特斯拉方面,瑞典工会在公司推出买断方案后结束了持续近三年的罢工,这条长期悬着的劳资风险落地;Palantir延续财报后的强势,此前美银、摩根大通与Oppenheimer在同一时间把它列进最看好的AI标的;英伟达则在等自己披露的13F美股投资组合,市场想看它这一季会不会继续加码AI产业链。空方的逻辑是估值与拥挤度,多方的逻辑是业绩与订单,目前为止股价站在后者一边。当最有名的空头开始加注、标的却继续新高,你会跟着减仓,还是把这当成情绪指标反向用?", title_en: "Burry Adds Shorts — But Why Did All Three Targets Rally That Same Day?", body_en: "A widely circulated 13F filing disclosed that Michael Burry is positioning for \"a larger downturn\": he added QQQ put options, increased his Micron short, and adjusted positions in Nvidia, Palantir, and Tesla. Notably, all three of those names rose Thursday — Palantir +4.66%, Tesla +3.80%, Nvidia +0.54% — each with independent catalysts. Tesla's Swedish union ended a strike lasting nearly three years after the company introduced a buyout package, removing a long-standing labor risk; Palantir extended its post-earnings momentum after Bank of America, JPMorgan, and Oppenheimer simultaneously named it a top AI pick; and Nvidia is awaited to disclose its own U.S. equity portfolio, with markets watching whether it will continue adding to AI supply chain holdings. The short thesis rests on valuation and crowding; the bull thesis rests on earnings and order flow — and for now, price action favors the latter. With the market's most prominent short adding to bets while targets continue to make highs, will you trim alongside him or use it as a contrarian sentiment signal?" },
  { ticker: "ONDS", title_cn: "白宫加征无人机关税,Ondas为何反跌8.8%?", body_cn: "白宫周四发布公告,对来自欧盟、日本、列支敦士登、韩国、瑞士与台湾的无人机及零部件加征15%的从价关税,英国产无人机适用10%,关税将在公告后21天生效。按常规推演,这类壁垒应当利好美国本土无人机厂商,但Ondas Holdings当日逆势收跌8.80%,是当日榜单里跌幅最大的一只。分歧点在成本结构:关税挡住了海外整机,却同时抬高了本土厂商进口零部件的成本,而Ondas这类中小市值公司的供应链本地化程度尚不清楚,市场对\"国产替代受益\"与\"成本上升承压\"两种解读并没有形成共识;此外它前期涨幅已大,政策落地也可能成为获利了结的窗口。当政策方向明确、传导路径却不明确,你会按国产替代逻辑买本土厂商,还是等21天后关税真正生效再看订单?", title_en: "White House Hits Drones With New Tariffs — So Why Did Ondas Drop 8.8%?", body_en: "The White House announced Thursday a 15% ad valorem tariff on drones and components imported from the EU, Japan, Liechtenstein, South Korea, Switzerland, and Taiwan, with a 10% rate applied to UK-origin drones, effective 21 days from the announcement. Conventional logic would favor domestic U.S. drone manufacturers, yet Ondas Holdings bucked that narrative, closing down 8.80% — the steepest single-day decline on the day's losers list. The disconnect lies in cost structure: tariffs block foreign finished units but simultaneously raise the cost of imported components for domestic producers, and the degree of supply-chain localization at small-cap companies like Ondas remains unclear, leaving the market split between an \"import substitution beneficiary\" and a \"cost pressure\" read. A significant prior run-up in the shares also made the policy announcement a natural profit-taking trigger. With policy direction clear but transmission uncertain, will you buy domestic manufacturers on an import-substitution thesis, or wait until the tariffs take effect in 21 days and actual order flow becomes visible?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
