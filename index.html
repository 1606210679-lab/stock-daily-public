<script>
const topics = [
  { ticker: ".SPX / QQQ / SPY", title_cn: "一条营收口径的消息,为何能砸动整条AI链?", body_cn: "周四美股走出了少见的分化:纳斯达克综合指数收跌1.25%报27193.34点,标普500指数收跌0.47%报7765.36点,纳指100ETF(QQQ)收跌1.34%报747.58美元,道琼斯工业平均指数却收涨0.10%报51231.64点。砸盘的是一则关于口径的消息。据英国金融时报报道,OpenAI向投资者披露截至9月底的年化营收接近500亿美元,低于此前媒体报道的700亿美元,差额约200亿。差异不在业务本身,而在怎么算:和Anthropic比较时两家的统计口径不同,Anthropic把客户通过亚马逊云、谷歌云等云合作伙伴支付的钱全额计入,OpenAI只计入扣除合作伙伴分成之后自己实际拿到的部分,投资者此前按前一种口径把数字调上去,才推算出700亿。OpenAI拒绝置评。多头的抓手是这件事从头到尾没有一个客户流失、没有一笔订单取消,变的只是会计口径,而道指当天还收涨,说明被重新定价的是AI这条线而不是整个市场;空头的抓手是一条口径消息就能让整条链回调,恰恰说明这些股价里装的是对增速的想象而不是已经兑现的收入,而行业的风向标自己把参照系改小了一截。同样一家公司,换个算法差出200亿美元,你更信哪个口径?", title_en: "One Revenue Accounting Tweak — Why Did It Sink the Entire AI Chain?", body_en: "U.S. equities diverged sharply Thursday: the Nasdaq Composite fell 1.25% to 27,193.34, the S&P 500 slid 0.47% to 7,765.36, QQQ dropped 1.34% to $747.58, while the Dow edged up 0.10% to 51,231.64. The catalyst was a methodology dispute — the Financial Times reported OpenAI disclosed annualized revenue near $50 billion as of late September, well below the $70 billion figure previously cited in media reports, a roughly $20 billion gap attributable entirely to how partner-channel revenue is counted. Bulls say zero customer churn or order cancellations; bears say that a single accounting distinction triggering a broad AI selloff reveals valuations were priced on growth expectations rather than recognized revenue. Same company, different formula, $20 billion apart — which number do you trust?" },
  { ticker: "NVDA / AVGO / AMD / INTC", title_cn: "芯片股集体回调,但AMD说的是供不应求?", body_cn: "周四芯片股跟着AI这条线一起回调:英特尔收跌5.34%报107.08美元,博通收跌4.35%报360.14美元,AMD收跌3.90%报620.68美元,英伟达收跌2.94%报230.48美元。有意思的是公司这一侧的表态和股价是反的。AMD首席执行官苏姿丰本周在台北对记者说,即便公司2026年已经增加了产量,AI芯片的需求仍然超过供给,她预计未来几年需求都会维持在很高的水平,公司明年打算大幅增加产能;她还提到约束不只在晶圆,高带宽内存和封装这几样要同时到位才行。同一周,英特尔首席执行官陈立武表示公司会继续推进Terafab项目。多头的抓手是掌握真实订单的人说的是供不应求,这跟当天那条营收口径的消息完全不在一个层面,一个是算法一个是产能;空头的抓手是产能要到明年才大幅增加,而需求的强弱最终要由下游客户的预算来验证,当下游的参照系被调小一截时,再强的供给侧表态也压不住估值的重估。产能方说供不应求,股价却在跌,这种时候你会加仓吗?", title_en: "Chip Stocks Sold Off, But AMD Says Demand Still Outstrips Supply?", body_en: "Chip stocks retreated with the broader AI complex Thursday: Intel fell 5.34% to $107.08, Broadcom dropped 4.35% to $360.14, AMD declined 3.90% to $620.68, and Nvidia shed 2.94% to $230.48. AMD CEO Lisa Su told reporters in Taipei this week that AI chip demand continues to exceed supply even as the company scales up output into 2026, with constraints spanning HBM, packaging, and wafers simultaneously; Intel CEO Lip-Bu Tan separately reaffirmed the company's Terafab initiative. Bulls say the supply-demand signal from those with real order books outweighs an accounting revision; bears say that capacity additions are a 2026 story, and downstream budgets — not supplier commentary — ultimately validate demand. Supply-side executives say demand is insatiable, yet the stocks are falling — would you add here?" },
  { ticker: "MU / SNDK / SKHY", title_cn: "三星刚创纪录,存储股为何反而跌了一轮?", body_cn: "存储是周四跌得比较重的一块:闪迪收跌4.90%报1609.46美元,美光收跌4.79%报1035.84美元,SK海力士收跌4.35%报170.50美元。这个方向和基本面看起来是拧着的——三星电子前一天公布的三季度初步业绩创了纪录,营业利润约107.40万亿韩元、折合约800亿美元,是它第一次单季突破100万亿韩元。市场的解读落在了增速上:有分析认为这份创纪录的业绩同时显示增长正在放缓,而存储价格的涨幅也在收窄。多头的抓手是存储的绝对盈利水平仍然摆在那里,一个季度800亿美元的营业利润不是靠情绪撑出来的,下周开始的三季报季里美光还会贡献标普500三季度盈利增长的相当一块;空头的抓手是周期股的定价看的是增速的二阶导而不是利润的绝对值,当创纪录和放缓同时出现,市场会先按后者定价,何况这轮上涨前面已经积累了可观的涨幅。创纪录的利润配上放缓的增速,存储这轮是见顶了吗?", title_en: "Samsung Just Set a Record — So Why Did Memory Stocks Sell Off?", body_en: "Memory stocks were among Thursday's hardest hit: SanDisk fell 4.90% to $1,609.46, Micron dropped 4.79% to $1,035.84, and SK Hynix declined 4.35% to $170.50. The move came despite Samsung Electronics reporting a record preliminary quarter, with operating profit of approximately 107.4 trillion won — roughly $80 billion — marking the first time it has surpassed 100 trillion won in a single quarter. Markets focused on the deceleration narrative: analysts noted the record results simultaneously signal slowing growth momentum, and memory price appreciation is narrowing. Bulls say the absolute earnings power; bears say cyclical stocks are priced on the second derivative of growth, and when records coincide with deceleration, the market prices the latter first. Record profit, slowing growth — is memory peaking?" },
  { ticker: "AVGO / NBIS", title_cn: "借钱买算力的账,债券市场开始算了?", body_cn: "周四有一条容易被股价盖过去的线索:交易员正在给AI相关的科技债重新定价。背景是这轮AI基建大量靠发债支撑,据先锋领航的测算,2026年AI相关的债务发行规模在3000亿到5700亿美元之间,而微软、Meta、谷歌、甲骨文、亚马逊、英伟达这几家超大规模厂商的美元债务规模已经翻倍到超过3600亿美元。压力最集中的是甲骨文,10月初它的五年期信用违约互换定价一度隐含超过20%的违约概率。同一天Nebius收跌7.35%报219.71美元,博通收跌4.35%报360.14美元。多头的抓手是能持续借到钱本身说明资金供给还在,而这些债务对应的是真实的算力交付,不是空转;空头的抓手是信用违约互换的价格是专门做风险定价的人用钱投出来的票,它先于股价反应,而债务的成本会随着长端收益率一起往上走,当借钱的人越来越多、利率又居高不下,这笔账迟早要摊到利润表上。信用市场已经在要更高的补偿,这件事你看得有多重?", title_en: "Is the Bond Market Starting to Price the Cost of Borrowing for AI Compute?", body_en: "A thread easy to miss beneath Thursday's equity moves: traders are repricing AI-linked tech credit. Vanguard estimates AI-related debt issuance in 2026 could reach $300 billion to $570 billion, while dollar-denominated debt across Microsoft, Meta, Alphabet, Oracle, Amazon, and Nvidia has already doubled to over $360 billion; Oracle's five-year CDS spread in early October briefly implied a default probability exceeding 20%. Nebius fell 7.35% to $219.71 and Broadcom dropped 4.35% to $360.14 on the same day. Bulls say sustained access to capital markets confirms funding supply remains intact; bears say credit markets are forward-looking by design, and rising long-end yields mean the cost of this leverage will eventually hit income statements. Credit markets are demanding higher compensation — how seriously are you watching this?" },
  { ticker: "SPCX", title_cn: "买下一张全国频谱,星链要动谁的蛋糕?", body_cn: "SpaceX周四日间收跌4.19%报160.57美元,跟着AI这条线一起回调。但当天真正的消息出在收盘之后:公司宣布达成协议,收购Grain Management持有的全部全国性800兆赫兹频谱,涉及最多14兆赫兹的成对频谱,交易金额没有披露,还需要美国联邦通信委员会批准。这意味着星链的手机直连业务拿到了一张全国性的地面频谱牌照,消息出来后三大运营商在盘后都明显走低。多头的抓手是卫星直连此前最大的短板就是没有地面频谱,这笔交易把它从一个补充方案推向了可以独立组网的位置,而频谱是稀缺的、买一张少一张;空头的抓手是交易还要过联邦通信委员会这一关,金额也没有披露,而运营商手里的基站和用户关系不是一张频谱牌照就能替代的,从拿到频谱到真正抢到用户中间还隔着很长的路。什么情况下这张频谱才真正动摇运营商的位置?", title_en: "SpaceX Buys Nationwide Spectrum — Whose Market Share Is at Stake?", body_en: "SpaceX shares fell 4.19% to $160.57 during Thursday's session, pulled lower with the AI complex, but the day's real news came after the close: the company announced an agreement to acquire all nationwide 800 MHz spectrum held by Grain Management — up to 14 MHz of paired spectrum — for an undisclosed sum, subject to FCC approval. The deal would give Starlink's direct-to-cell service a national terrestrial spectrum license, and all three major U.S. carriers moved notably lower in after-hours trading on the news. Bulls say the absence of terrestrial spectrum was Starlink's biggest structural constraint, and this acquisition repositions it from a supplementary service to a standalone network — spectrum being finite by definition; bears say FCC approval is not guaranteed, the price remains undisclosed, and carrier infrastructure and customer relationships cannot be displaced by a license alone. Starlink now has terrestrial spectrum — what exactly should the carriers be worried about?" },
  { ticker: "QQQ / SPY", title_cn: "静默期前最后一次发声,沃什会说什么?", body_cn: "下周的利率这条线上有个时间点值得先标出来:国际货币基金组织的日程显示,美联储主席沃什将于北京时间10月16日中午在曼谷的年会上发表公开讲话,这是10月27日至28日联邦公开市场委员会会议进入静默期之前,官员最后一次公开发声。市场目前的押注是两步走:10月按兵不动的概率约80%,12月重启加息的概率也在80%上下;而这两个概率直接压在估值上——周四收盘,纳指100ETF(QQQ)收跌1.34%报747.58美元,标普500ETF(SPY)收跌0.42%报773.93美元。另一头的债券市场则在走自己的路,10月7日10年期美债收益率盘中最高到5.366%,30年期最高到5.728%,双双刷新2002年以来的高点。多头的抓手是10月不加息这件事已经被充分定价,只要沃什这次讲话没有推翻这个预期,短期压在估值上的那块石头就会搬开;空头的抓手是这轮长端收益率上行并不完全由短期政策预期驱动,即便加息预期回落,美国的财政压力和美债供需失衡这些中长期矛盾仍然没有化解,期限溢价才是推升长债利率的核心力量,这意味着美联储按不按兵,都不改变长端那一头的定价逻辑。10月按兵不动、12月再加,这条路径对股市是好事吗?", title_en: "Last Speech Before Blackout: What Will Warsh Say?", body_en: "A key date is worth flagging on next week's rates calendar: the IMF schedule shows Fed Chair Warsh is set to speak publicly in Bangkok at the annual meetings on October 16 Beijing time, the last opportunity for officials to comment before the FOMC blackout period ahead of the October 27–28 meeting. Markets currently price roughly an 80% probability of no action in October and a similar probability of a rate hike resuming in December; those odds sit directly on valuations — QQQ closed Thursday down 1.34% at $747.58 and SPY down 0.42% at $773.93. Bond markets are trading on their own logic: on October 7, the 10-year Treasury yield hit an intraday high of 5.366% and the 30-year reached 5.728%, both the highest levels since 2002. Bulls say the October hold is fully priced and a non-hawkish speech removes a near-term overhang on valuations; bears say the long-end move is driven primarily by term premium and fiscal imbalances — structural forces the Fed cannot resolve regardless of its near-term stance. One last speech before the blackout — what's the one line you most want to hear from Warsh?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
