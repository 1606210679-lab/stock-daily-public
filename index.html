const topics = [
  { ticker: "QQQ / GOOG", title_cn: "油价和长端利率一个加号一个减号,指数为什么停在零附近?", body_cn: "胡塞武装袭击沙特能源设施推高了油价,标普500和道指当天双双收跌,纳指100的QQQ只收跌0.08%,谷歌收涨0.02%——加号和减号同时进场,指数停在零附近。两笔账都没落地。一笔在今晚:北京时间23点,美国财政部公布扩容后的10至20年期国债回购上限,周四执行,贝森特已把长期美债单次回购规模从20亿美元提到至少40亿美元,并称必要时可加码;若实际规模明显高于40亿,长端收益率有望被压低,科技股和贵金属受益,若只兑现最低承诺,会被读成力度不足。分寸也要留:回购不是量化宽松,换不掉赤字。另一笔在通胀数据,10年期收益率已逼近4.8%,油价这一跳会先进能源分项。谷歌这一侧则是两位知名投资人给出了反向答案:阿克曼清空剩余持股,德鲁肯米勒卖出美光转买谷歌。多头的抓手是回购落地能给长端降温;空头的抓手是油价上行会把通胀预期重新顶起来。你会在今晚的回购数字出来前先买长债,还是等通胀读数明确再动科技股?", title_en: "Oil Prices Rise, Long Yields Loom — Why Is the Index Stuck Near Zero?", body_en: "Houthi strikes on Saudi energy infrastructure lifted oil prices, dragging the S&P 500 and Dow lower while the Nasdaq-100 QQQ slipped just 0.08% and Google edged up 0.02% — a plus and a minus arriving together, leaving the index parked near zero. Two accounts have yet to settle. The first is tonight: at 23:00 Beijing time the U.S. Treasury announces its expanded 10-to-20-year buyback cap, with execution Thursday; Bessent has already raised the single-session long-bond buyback size from $2 billion to at least $4 billion and says he can add more if needed. If the actual size runs well above $4 billion, long yields could be pushed down and tech and precious metals benefit; if only the minimum is delivered, it will be read as too timid. Keep the proportions straight: a buyback is not quantitative easing and does not retire the deficit. The second account is inflation data, with the 10-year yield already near 4.8% and the oil spike feeding the energy component first. On Google's side, two well-known investors gave opposite answers: Ackman cleared out his remaining stake while Druckenmiller sold Micron to buy Google. Bulls point to the buyback landing and cooling the long end; bears point to rising oil pushing inflation expectations back up. Will you buy long bonds before tonight's buyback figures, or wait for inflation data before moving on tech?" },
  { ticker: "INTC / AMD / AVGO / NVDA", title_cn: "芯片股集体跳涨英伟达反而收跌,这轮涨的是补票上车的那批?", body_cn: "当天的芯片板块是一张齐涨的表:英特尔收涨9.05%,是榜上最猛的一只;AMD收涨5.90%,博通收涨2.98%,三倍做多半导体的SOXL收涨5.11%。但涨的不是领跑者——英伟达收跌2.01%,是这一排大市值里唯一下跌的。查遍公开报道,没有一条把英特尔那9%归到某个具体事件上,能确认的只是“英特尔领涨芯片板块”,高通、AMD、博通同步跟涨,这更像补票上车:年内英特尔已涨183.12%,可它的起跳位置仍比同行低一档。同一天的另一头是减仓,最贵的那张票先被卖,英伟达贴着高点却成了板块里的例外。多头的抓手是宽度,行情从少数几只扩散到设备、封测和通用CPU这一整排,普涨本身就是资金还在场内的证据;空头的抓手正是它的成因,没有具体订单托着的补涨,退潮时也走得最快。你会跟着补涨买英特尔和AMD,还是趁英伟达回调去接位置最确定的那一只?", title_en: "Chip Stocks Surge But Nvidia Closes Red — Is This a Late-Entry Rally?", body_en: "The chip sector posted broad gains: Intel surged 9.05%, AMD rose 5.90%, Broadcom added 2.98%, and the 3x leveraged SOXL gained 5.11% — yet Nvidia fell 2.01%, the only decliner among large-caps. No specific catalyst could be confirmed for Intel's move; all that can be confirmed is that Intel led the chip sector, with Qualcomm, AMD and Broadcom rising alongside it. That looks more like late buyers boarding: Intel is up 183.12% year-to-date, yet its starting point still sits a notch below peers. The other side of the same session was trimming — the most expensive ticket gets sold first, and Nvidia, pinned near its highs, became the sector's exception. Bulls point to breadth — gains spreading from leading names to equipment, packaging, and general-purpose CPUs — while bears note that momentum-driven catch-up moves tend to unwind fastest when the tide turns. Will you chase the rally in Intel and AMD, or use Nvidia's pullback to buy the name with the clearest fundamental footing?" },
  { ticker: "MU / SNDK / SKHY", title_cn: "库存只剩十天存储股却走了岔路,涨价这条线断在哪一环?", body_cn: "存储这条线当天分了岔:SK海力士收涨4.83%,美光收跌1.61%,闪迪收跌0.12%。紧张是真的——存储短缺正从HBM蔓延到DRAM和NAND,AI服务器需求明显超过供给,内存已经成为交付瓶颈;三星、SK海力士和美光把产能优先排给HBM及服务器产品,进一步压缩了传统内存与SSD的供应,而新增晶圆厂形成有效产出还需要时间。韩国券商警告,三星电子和SK海力士的内存库存已降到不足十天供应量。断点在供给方自己这一头:铠侠否认与SK海力士的合作传闻,并表态会设法缓解芯片涨价——卖方出来给价格降温,和“缺货就该涨价”的剧本是反的。高盛同时给了偏暖的读法,认为美光和闪迪最糟的阶段可能已经过去。多头的抓手是库存天数,十天供应量意味着任何一笔追单都得加价;空头的抓手是涨价的对手方不只有客户,还有想稳住客户的同行。你会按库存紧张继续跟海力士,还是等铠侠的降温表态落到实际报价上再看美光和闪迪?", title_en: "Ten Days of Inventory Left, Yet Memory Stocks Diverged — Where Did the Rally Break Down?", body_en: "Memory stocks split sharply: SK Hynix gained 4.83% while Micron fell 1.61% and SanDisk slipped 0.12%. The tightness is real — the shortage is spreading from HBM into DRAM and NAND, AI server demand clearly outruns supply, and memory has become the delivery bottleneck; Samsung, SK Hynix and Micron are allocating capacity first to HBM and server products, squeezing conventional memory and SSD supply further, while new fabs need time to turn into effective output. Korean brokerages warn that Samsung Electronics' and SK Hynix's memory inventories have fallen below ten days of supply. The fracture point was on the supply side: Kioxia denied merger talks with SK Hynix and signaled it would act to ease chip price increases — a direct contradiction of the tight-supply-drives-prices narrative. Goldman Sachs offered a warmer read at the same time, arguing the worst may already be behind Micron and SanDisk. Bulls point to days of inventory: ten days of supply means any incremental order has to pay up; bears point out that the counterparty to higher prices is not only the customer but also rivals who want to keep those customers. Will you follow SK Hynix on tight inventory, or wait for Kioxia's price-cooling stance to show up in actual quotes before revisiting Micron and SanDisk?" },
  { ticker: "LITE / CRWV / NBIS / BE", title_cn: "芯片龙头收跌当天光纤、算力和电力全涨,钱换到哪一段路上了?", body_cn: "同一天,AI链上离芯片最远的几段全涨:Lumentum收涨11.04%,CoreWeave收涨11.72%,Nebius收涨7.73%,布鲁姆能源收涨9.63%。背后是三种账。光模块这一段有实单:康宁与Verizon签下数十亿美元级别的光纤协议,整排光通信被拉起,Lumentum年内已涨165.48%。算力租赁是订单叙事:Palantir把Nebius列为主权AI首选伙伴,CoreWeave那11.72%在公开报道里找不到具名催化,更像同类被一起买走。电力靠被动资金,布鲁姆能源即将随季度调整进标普500。分寸要留住:CoreWeave年内涨39.41%,一年只涨6.71%,已有分析质疑其现金流靠预付款。多头的抓手是瓶颈外移,芯片之外的每段都开始收钱;空头的抓手是这几段确定性差得远,有合同的和只有叙事的被同一波买盘打包。你会买有合同的光模块,还是赌算力租赁的叙事,或者守着即将进指数的那一只?", title_en: "Chip Leader Falls While Fiber, Compute, and Power All Rally — Where Did the Money Move?", body_en: "As chip stocks retreated, the furthest links in the AI chain surged: Lumentum +11.04%, CoreWeave +11.72%, Nebius +7.73%, and Bloom Energy +9.63%. Three different accounts sit behind them. The optical layer has real orders: Corning signed a multi-billion-dollar fiber agreement with Verizon, lifting the whole optical-communications row, and Lumentum is now up 165.48% year-to-date. Compute leasing is an order narrative: Palantir named Nebius its preferred sovereign AI partner, while CoreWeave's 11.72% has no named catalyst anywhere in public reporting and looks more like peers being bought together. Power runs on passive money, with Bloom Energy set to join the S&P 500 on the quarterly rebalance. Keep the proportions: CoreWeave is up 39.41% year-to-date but only 6.71% over one year, and analysts already question that its cash flow leans on prepayments. Bulls argue the bottleneck is migrating beyond chips, monetizing every adjacent layer; bears note that contract-backed and story-only names were bought in the same sweep. Will you buy the fiber names with signed contracts, bet on the compute-leasing narrative, or hold the stock about to enter the index?" },
  { ticker: "AAPL", title_cn: "把一块会折的屏摆在五万亿的门槛前,苹果今夜要卖的是什么?", body_cn: "苹果当天收跌1.17%,主场就在北京时间9月10日凌晨1点:官网确认主题是“亮新篇,来耀眼”,这是约翰·特努斯接任首席执行官后的首场产品活动。市场预期折叠屏iPhone与iPhone 18 Pro同台,有报道把定价指向2400美元一档,而标准版iPhone 18或延后到2027年,重量全压在高端。被盯的是三个数:定价、备货规模和供应链增量,它们决定折叠屏能不能撑起换机周期,也决定苹果能不能摸到5万亿美元市值那道门槛。你会在发布会前按预期买苹果,还是等定价和备货出来再决定?", title_en: "Apple Puts a Foldable Screen at the Door of a $5 Trillion Market Cap — What Is It Really Selling Tonight?", body_en: "Apple closed down 1.17% ahead of its product event at 1 a.m. Beijing time on September 10, the first major launch under CEO John Ternus; the official theme is confirmed as \"Wow. New chapters.\" A foldable iPhone is expected alongside the iPhone 18 Pro, with pricing reported around the $2,400 level, while a standard iPhone 18 may be pushed to 2027 — concentrating the cycle's weight entirely on the high end. Three numbers will define the event: pricing, production volumes, and supply-chain upside, which together determine whether the foldable can sustain an upgrade cycle and push Apple toward the $5 trillion market cap threshold. Will you buy Apple ahead of the event on expectations, or wait for pricing and supply figures before deciding?" },
  { ticker: "TSLA / SPCX", title_cn: "高盛把Cybercab的成本算到优步头上,特斯拉这笔账要多久落地?", body_cn: "特斯拉当天收涨3.98%,SpaceX收涨3.73%,这一涨有具体来路:高盛给出测算,Cybercab的单英里成本最多可比Waymo低30美分;同一天斯洛文尼亚放行完全自动驾驶,而优步收跌4%——市场直接把这部分成本优势从网约车平台的估值里挪到了特斯拉账上。分寸在时间:成本优势要变成利润,得先有车队规模,再有各地监管逐个放行,斯洛文尼亚这样的单一市场只是把门推开一条缝。SpaceX那3.73%带着同样的问题,马斯克又一次把轨道数据中心的时间表往前挪,但有专家直接把它归为“下个十年的事”,另有分析指出它与卫星通信方的频谱之争可能波及航空客舱业务。多头的抓手是成本,自动驾驶一旦跑通,单位成本会压过所有网约车对手;空头的抓手是节奏,监管和产能都不按估值的速度走。你会按成本优势买特斯拉,还是等车队规模和更多市场的放行落地再说?", title_en: "Goldman Puts Cybercab's Cost Advantage Against Uber — How Long Before Tesla Books the Gain?", body_en: "Tesla rose 3.98% and SpaceX gained 3.73% after Goldman Sachs estimated Cybercab's per-mile cost could undercut Waymo by as much as 30 cents per mile; on the same day Slovenia approved fully autonomous driving while Uber fell 4%, as markets effectively transferred that cost advantage from ride-hailing platform valuations to Tesla. The caveat is timing: cost savings only convert to profit once fleet scale is achieved and regulators in each market give clearance — Slovenia is a single small opening. SpaceX's 3.73% gain carries similar uncertainty, as Musk again pulled forward his orbital data-center timeline, though experts call it a next-decade project and analysts flag potential spectrum conflicts with satellite communications that could affect aviation cabin services. Bulls point to cost: once autonomous driving works, unit costs will beat every ride-hailing rival; bears point to pace — regulators and production capacity do not move at the speed of the valuation. Will you buy Tesla on the cost advantage thesis, or wait for fleet scale and broader regulatory approvals to materialize?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
