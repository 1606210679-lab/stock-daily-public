<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-10-12 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-10-12</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 6</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:16.7%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 6 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: ".SPX / QQQ", title_cn: "银行财报打头阵，台积电接棒，三季报第一周怎么读？", body_cn: "美股上周五三大指数集体收涨：纳斯达克综合指数收涨0.64%报27366.17点，标普500指数收涨0.59%报7811.54点，道琼斯工业平均指数收涨0.83%报51654.95点，QQQ收涨0.49%报751.27美元。本周三季报季正式开门：摩根大通、富国银行本周率先披露，台积电周四接棒，本周还有CPI和PPI数据落地。多头的抓手是高利率对大型银行净息差有直接支撑，台积电的CoWoS封装产能在三季度前已基本锁定；空头的抓手是消费者信心已滑至近期低点，一旦有核心公司给出保守指引，上周五的反弹线不一定守得住。这周银行财报和台积电季报，你觉得哪个对大盘方向影响更大？", title_en: "Banks Fire First, TSMC Follows — How Should You Read Earnings Week?", body_en: "U.S. equities rallied Friday: the Nasdaq Composite rose 0.64% to 27,366.17, the S&P 500 gained 0.59% to 7,811.54, the Dow Jones Industrial Average climbed 0.83% to 51,654.95, and QQQ added 0.49% to $751.27. Earnings season kicks off this week with JPMorgan and Wells Fargo reporting first, followed by TSMC on Thursday, alongside CPI and PPI data. Bulls say high-rate tailwinds for bank net interest margins and largely locked-in CoWoS packaging capacity at TSMC; Bears say that consumer confidence has slid to recent lows and Friday's rebound may not hold if any key company issues cautious guidance. Which do you think will have a bigger impact on market direction this week — the bank earnings or TSMC's quarterly results?" },
  { ticker: "TSM / JPM / ASML", title_cn: "台积电周四压轴，银行+芯片设备，三季报周日历怎么读？", body_cn: "本周三季报季步步推进：周二早间摩根大通、高盛、富国银行、花旗、UNH同日披露，为整个银行股财报季定调；周三早间ASML和摩根士丹利跟上，ASML的订单储备数据将直接映射AI芯片设备需求是否继续提速；周四早间台积电发布——本周最受瞩目的一张财报，Q3先进封装CoWoS产能指引关系到下游英伟达、苹果的整条供应链预期。多头的抓手是台积电此前已明确CoWoS需求大于供给且没有松弛信号，若三季报维持或上调产能指引，整个AI板块的估值锚会往上走；空头的抓手是银行若在周二率先给出谨慎信贷展望，整周的财报情绪可能在周四前就已被压低。台积电这张财报，你最关注哪一项数据？", title_en: "TSMC Headlines Thursday; How Should You Read This Earnings Week Calendar?", body_en: "Earnings season advances on multiple fronts: Tuesday morning brings JPMorgan, Goldman Sachs, Wells Fargo, Citi, and UNH simultaneously, setting the tone for the entire bank reporting season; Wednesday morning features ASML and Morgan Stanley, with ASML's order backlog data serving as a direct read on whether AI chip equipment demand continues to accelerate. TSMC reports Thursday morning — the week's most closely watched result — with its advanced CoWoS packaging capacity guidance carrying direct implications for downstream supply chain expectations at Nvidia and Apple. Bulls say TSMC has previously signaled CoWoS demand exceeds supply with no signs of slack, meaning maintained or raised guidance could lift AI sector valuations; Bears say that cautious bank credit outlooks on Tuesday could dampen overall earnings sentiment well before Thursday. Which data point in TSMC's earnings are you watching most closely?" },
  { ticker: "IREN", title_cn: "Anthropic是IREN的神秘大客户，AI算力托管要重新定价吗？", body_cn: "AI算力托管公司IREN上周五收跌1.46%报35.19美元，但周末出现了新叙事：市场盛传Anthropic是IREN的大客户，消息推动股价大幅走高。背景是neocloud板块近期承压——SemiAnalysis报告质疑部分AI数据中心运营商的算力实际交付能力，IREN、CoreWeave等股价均已从高点回落。多头的抓手是Anthropic这类模型公司一旦锁定算力合同便不易切换，而IREN已获英伟达AI基础设施认证背书；空头的抓手是这一消息仍属传言、未经官方确认，neocloud的变现周期和资本开支节奏本就是市场最大的不确定来源。你怎么看Anthropic等大模型公司选择第三方算力托管而非自建的逻辑？", title_en: "Anthropic Rumored as IREN's Mystery Anchor Client — Is AI Compute Hosting Due for a Reprice?", body_en: "AI compute hosting company IREN fell 1.46% to $35.19 on Friday, but a new narrative emerged over the weekend: market speculation that Anthropic is a major IREN client sent the stock sharply higher. The backdrop is a pressured neocloud sector — a SemiAnalysis report questioned the actual compute delivery capabilities of some AI data center operators, pushing IREN, CoreWeave, and peers well off their highs. Bulls say once model companies like Anthropic lock in compute contracts, switching is difficult, and IREN carries Nvidia's AI infrastructure certification; Bears say that the Anthropic report remains unconfirmed rumor, and neocloud monetization timelines and capex pacing remain the market's biggest uncertainty. What is your view on the logic behind frontier AI model companies choosing third-party compute hosting over building their own infrastructure?" },
  { ticker: "MSFT / GOOG", title_cn: "Big Tech押了4200亿数据中心，微软是最便宜的那张牌吗？", body_cn: "微软上周五收涨2.38%报535.07美元，谷歌上周五收涨0.87%报347.86美元。近期多篇分析将微软列为Big Tech当前估值最低的公司，与此同时亚马逊和谷歌合计承诺向数据中心投入逾4200亿美元，微软的资本开支规模相当。微软将于10月28日发布三季报，分析师给出的最低合格线是Azure云增速保持在40%以上，否则\"估值洼地\"的逻辑便难以维持。多头的抓手是Azure在企业端AI工作负载的份额仍在增加，Copilot已在办公场景实现规模商业化；空头的抓手是40%增速的预期已嵌入当前定价，一旦不及，惩罚力度会超过一般财报miss。如果Azure增速只是勉强过40%而没有超预期，你觉得市场会怎么定价微软？", title_en: "Big Tech Has Committed $420B to Data Centers — Is Microsoft the Cheapest Play?", body_en: "Microsoft closed up 2.38% at $535.07 Friday, while Alphabet gained 0.87% to $347.86. Multiple recent analyses flag Microsoft as the lowest-valued name among Big Tech, even as Amazon and Alphabet together have committed over $420 billion to data center investment — a scale Microsoft's own capex broadly matches. Microsoft is set to report quarterly earnings on October 28; analysts set the minimum passing threshold at Azure cloud growth holding above 40%, below which the \"valuation discount\" thesis becomes difficult to sustain. Bulls say Azure's growing share of enterprise AI workloads and Copilot's scaled commercialization in productivity; Bears say the 40% growth expectation is already priced in, meaning any miss would carry outsized punishment relative to a typical earnings shortfall. If Azure growth only barely clears 40% without a beat, how do you think the market will price Microsoft?" },
  { ticker: "MU / SNDK / SKHY", title_cn: "DRAM深陷熊市，存储股反弹要等哪几件事同时成立？", body_cn: "存储板块上周五继续承压：美光收跌0.66%，从年内高点累计回落逾18%；SanDisk收跌1.72%，SK海力士收跌0.86%，追踪存储板块的DRAM ETF仍深陷熊市。压制逻辑来自多个方向：HBM需求被英伟达供应链集中吸收，导致大众DRAM供需偏松；服务器采购在AI投入大幅提升后对普通内存的优先级下降；消费端需求仍未见回暖。多头的抓手是美光一旦在HBM份额上从三星或SK手中切入，季报可能出现结构性超预期；空头的抓手是整个存储复苏周期被AI HBM需求扭曲，普通DRAM的价格回升节奏比上一轮周期更难预测。DRAM熊市的底到底在哪里，你会从哪个信号开始判断？", title_en: "DRAM Stuck in a Bear Market — What Has to Happen for Memory Stocks to Recover?", body_en: "Memory stocks remained under pressure Friday: Micron fell 0.66%, now down more than 18% from its year-to-date high; SanDisk dropped 1.72%, SK Hynix declined 0.86%, and the DRAM ETF tracking the memory sector remains deep in bear market territory. Multiple forces weigh on the sector: HBM demand is being absorbed by Nvidia's concentrated supply chain, leaving the broader DRAM market oversupplied; server procurement has deprioritized standard memory following a surge in AI spending; and consumer demand shows no signs of recovery. Bulls say Micron could deliver a structurally positive earnings surprise if it captures HBM share from Samsung or SK Hynix; Bears say the entire memory recovery cycle has been distorted by AI HBM demand, making the timing of a standard DRAM price rebound far harder to predict than in previous cycles. Where is the true bottom of the DRAM bear market, and which signal would you use to start calling it?" },
  { ticker: "BTC.USD.CC", title_cn: "美债收益率再破5%，比特币的定价逻辑站得住吗？", body_cn: "比特币报83746美元，涨1.01%。与此同时，美国10年期国债收益率本周再度触及5%上方，这一水平在过去被视为多资产定价的关键阈值，部分分析认为高利率持续会压制比特币的投机性溢价。与此形成对比的是，美国前总统特朗普之子Eric Trump本周表态，主张加密货币应积极拥抱AI叙事，认为这是下一个增长逻辑的切入点。多头的抓手是比特币在高利率压力下仍能守住8万美元以上，机构持仓的底部托举比过往任何一轮熊市都更稳；空头的抓手是5%的国债收益率意味着无风险回报相当可观，对风险资产整体构成估值压力，加密市场不例外。5%的利率环境下，你还会给比特币留多少配置空间？", title_en: "10-Year Yield Breaks 5% Again — Can Bitcoin's Pricing Logic Hold?", body_en: "Bitcoin traded at $83,746, up 1.01%, even as the U.S. 10-year Treasury yield climbed back above 5% — a level widely regarded as a critical threshold for multi-asset pricing — with some analysts arguing sustained high rates will compress Bitcoin's speculative premium. In contrast, Eric Trump, son of former U.S. President Donald Trump, this week advocated for crypto to embrace the AI narrative as its next growth catalyst. Bulls say Bitcoin is holding above $80,000 despite rate pressure, with institutional positioning providing a more stable floor than in any prior bear cycle; Bears say a 5% risk-free yield represents a compelling alternative, applying valuation pressure across risk assets including crypto. In a 5% rate environment, how much allocation space would you still reserve for Bitcoin?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
