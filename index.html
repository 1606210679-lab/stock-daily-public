<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topics Review — 2026-11-20 AM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #0f1117; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .container { width: 100%; max-width: 780px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-badge { display: inline-block; background: #1e3a8a; color: #93c5fd; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; margin-top: 5px; }
  .progress-text { font-size: 28px; font-weight: 700; color: #f1f5f9; text-align: right; }
  .progress-sub { font-size: 12px; color: #475569; text-align: right; margin-top: 2px; }

  /* Progress bar */
  .progress-bar-wrap { height: 4px; background: #1e293b; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 2px; transition: width 0.3s ease; }

  /* Card */
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .ticker-tag { display: inline-block; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.08em; margin-bottom: 20px; }

  /* Section divider */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 16px;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #1e3a8a;
  }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 12px;
    border-radius: 20px;
  }
  .section-label.cn { color: #f59e0b; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
  .section-label.en { color: #60a5fa; background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.3); }

  /* Field */
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  /* Content boxes */
  .field-content {
    font-size: 14px; line-height: 1.65; word-break: break-word;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 9px;
  }
  .field-content.cn-content {
    color: #fcd34d; background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.2);
  }
  .field-content.en-content {
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155;
  }
  .field-content.body-cn { font-size: 13px; color: #fbbf24; }
  .field-content.body-en { font-size: 13px; color: #cbd5e1; }

  /* Buttons */
  .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; }
  .copy-title-cn-btn { background: rgba(217,119,6,0.8); color: #fff; }
  .copy-title-cn-btn:hover { background: #d97706; }
  .copy-title-en-btn { background: #1d4ed8; color: #fff; }
  .copy-title-en-btn:hover { background: #2563eb; }
  .copy-body-cn-btn  { background: rgba(180,83,9,0.8); color: #fff; }
  .copy-body-cn-btn:hover  { background: #b45309; }
  .copy-body-en-btn  { background: #0f766e; color: #fff; }
  .copy-body-en-btn:hover  { background: #0d9488; }
  .copy-btn.copied { background: #166534 !important; color: #bbf7d0 !important; }

  /* Hint */
  .hint { font-size: 12px; color: #334155; text-align: center; margin-bottom: 14px; }
  .hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #64748b; }

  /* Nav */
  .nav { display: flex; gap: 12px; }
  .nav-btn { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
  .nav-btn:hover:not(:disabled) { background: #334155; color: #e2e8f0; border-color: #475569; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* Done */
  .done-banner { display: none; text-align: center; padding: 28px; background: #14532d; border: 1px solid #166534; border-radius: 16px; color: #bbf7d0; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .done-sub { font-size: 13px; opacity: 0.8; margin-top: 8px; display: block; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="date-label">2026-11-20</div>
      <div class="session-badge">AM</div>
    </div>
    <div>
      <div class="progress-text" id="progressText">1 / 5</div>
      <div class="progress-sub">topics</div>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:20.0%"></div>
  </div>

  <div id="doneBanner" class="done-banner">
    ✅ All done! 5 topics uploaded
    <span class="done-sub">记得运行 python3 learn_from_edits.py 记录本次偏好</span>
  </div>

  <div id="card" class="card" >
    <div class="ticker-tag" id="tickerTag"></div>

    <!-- ── 中文区块 ── -->
    <div class="section-divider"><span class="section-label cn">中文</span></div>

    <div class="field-block">
      <div class="field-label">标题</div>
      <div class="field-content cn-content" id="titleCn"></div>
      <button class="copy-btn copy-title-cn-btn" onclick="copyField('title_cn')">复制标题（中文）</button>
    </div>

    <div class="field-block">
      <div class="field-label">正文</div>
      <div class="field-content cn-content body-cn" id="bodyCn"></div>
      <button class="copy-btn copy-body-cn-btn" onclick="copyField('body_cn')">复制正文（中文）</button>
    </div>

    <!-- ── 英文区块 ── -->
    <div class="section-divider"><span class="section-label en">English</span></div>

    <div class="field-block">
      <div class="field-label">Title</div>
      <div class="field-content en-content" id="titleEn"></div>
      <button class="copy-btn copy-title-en-btn" onclick="copyField('title_en')">Copy Title (EN)</button>
    </div>

    <div class="field-block">
      <div class="field-label">Body</div>
      <div class="field-content en-content body-en" id="bodyEn"></div>
      <button class="copy-btn copy-body-en-btn" onclick="copyField('body_en')">Copy Body (EN)</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;|&nbsp;
    <kbd>1</kbd> 复制标题(中) &nbsp;|&nbsp;
    <kbd>2</kbd> 复制正文(中) &nbsp;|&nbsp;
    <kbd>T</kbd> Copy Title(EN) &nbsp;|&nbsp;
    <kbd>B</kbd> Copy Body(EN)
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← Prev</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" >Next →</button>
  </div>

</div>
<script>
const topics = [
  { ticker: "ANT", title_cn: "Anthropic首秀涨17%，高开回落后怎么布局？", body_cn: "Anthropic（ANT）美股周四（11月19日）首日以111.50美元开盘、97.17美元收盘；收盘较83美元发行价上涨17.07%，却较开盘回落约12.85%；获配者与开盘追入者承受的是两种不同结果。公司与售股股东合计公开发售9.8亿股，按发行价计算的发售总额约813.4亿美元，并不等于公司全部募资或收盘市值。多头看Claude需求和云分销带来的增长空间，空头担心算力成本、盈利兑现及高开回落后的波动。英伟达公布的季度收入虽达到1158亿美元，却没有阻止本周芯片股回撤，模型公司的热度也不能直接替代财务验证。按发行价获配、在公开市场等待价格稳定，或选择上市云合作伙伴是不同路径；云伙伴股票不等于持有ANT。首日高开回落后，你认为ANT要出现什么信号才值得考虑公开市场参与？", title_en: "Anthropic Jumps 17% in Debut: How to Position After the Reversal?", body_en: "Anthropic (ANT) opened at $111.50 and closed at $97.17 in its US debut Thursday (Nov 19) — up 17.07% from the $83 IPO price but down 12.85% from the open, leaving IPO allottees and opening buyers with very different outcomes. The company and selling shareholders offered 980 million shares, roughly $81.34 billion at the offer price, which is neither total fundraising nor closing market cap. Bulls cite Claude demand and cloud distribution; bears flag compute costs, profit delivery and post-pop volatility. Nvidia's $115.8 billion quarterly revenue did not stop this week's chip pullback, and model-company buzz is no substitute for financial validation. IPO allocation, waiting for open-market prices to settle, and owning listed cloud partners carry different risks; a cloud partner is not ownership of ANT. After the high-open reversal, what evidence would make open-market participation more defensible?" },
  { ticker: "PDD", title_cn: "拼多多涨11.04%，营收持平还值得追吗？", body_cn: "拼多多（PDD）美股周四（11月19日）收涨11.04%，但当天公布的第三季收入约1083亿元，与上年基本持平。在线营销服务收入增长12%，交易服务收入下降12%，平台广告变现与交易业务方向分化。GAAP归母净利约295亿元，调整后约310亿元；后者较去年约314亿元略降，股价上涨并非因为利润加速。多头看营销收入增长和销售费用收缩，空头担心交易服务下滑、对商家与供应链的投入影响后续回报。若交易服务继续走弱，仅靠广告收入扩张能否支撑PDD这次反弹？", title_en: "PDD Jumps 11.04%: Still Worth Chasing on Flat Revenue?", body_en: "PDD rose 11.04% Thursday (Nov 19), yet third-quarter revenue of about RMB 108.3 billion was roughly flat year on year. Online marketing services grew 12% while transaction services fell 12%, showing divergent trends in advertising monetization and transactions. GAAP net income attributable was about RMB 29.5 billion and adjusted net income about RMB 31.0 billion, the latter slightly below last year's roughly RMB 31.4 billion; faster profit growth did not drive the rally. Bulls see ad growth and lower selling costs; bears worry that weaker transaction services and sustained merchant and supply-chain spending will erode future returns. If transaction services keep falling, can ad growth alone sustain the PDD rebound?" },
  { ticker: "BABA / 00700.HK", title_cn: "阿里云增53%，腾讯高投入谁先回现金？", body_cn: "阿里巴巴（BABA）美股周四（11月19日）收跌1.26%，当天公布的季度收入2715.19亿元、同比增长10%，调整后净利润199.09亿元、同比增长92%；AI云与算力服务收入增长53%，但自由现金流流出344.72亿元，较上年同期流出218.40亿元扩大。腾讯（00700.HK）前一日披露季度收入2073.36亿元、同比增长8%，非国际财务报告准则归母净利665.19亿元、同比下降6%；资本开支814.33亿元，自由现金流流出691亿元。两家利润调整口径与现金流定义并不相同，不能拿利润增速直接给云业务估值，腾讯称剔除算力采购预付款后自由现金流为正169亿元，但这是其付款端的调整，不能当作报告值或客户收入。多头看阿里云客户需求和腾讯游戏广告的盈利基础，空头看算力支出先于现金回收。阿里的云增长和腾讯的游戏广告中，哪条路径更可能先把利润转成自由现金流？", title_en: "Alibaba Cloud Up 53%: With Tencent's Heavy Capex, Who Turns Cash First?", body_en: "Alibaba (BABA) fell 1.26% Thursday (Nov 19) after reporting quarterly revenue of RMB 271.519 billion, up 10% year on year, and adjusted net income of RMB 19.909 billion, up 92%. AI cloud and compute services revenue rose 53%, but free cash flow was an outflow of RMB 34.472 billion, wider than last year's RMB 21.840 billion outflow. Tencent (00700.HK) the prior day reported quarterly revenue of RMB 207.336 billion, up 8%, non-IFRS net income attributable of RMB 66.519 billion, down 6%, capex of RMB 81.433 billion and a free cash flow outflow of RMB 69.1 billion. The two use different adjusted profit measures and cash flow definitions; profit growth cannot be applied directly to value cloud units. Tencent says free cash flow would be positive RMB 16.9 billion excluding compute-procurement prepayments, but this is a hypothetical adjustment to its own cash outflow, not reported cash flow or revenue received from customers. Between Alibaba's cloud growth and Tencent's gaming and advertising, which path is likelier to turn profit into free cash flow first?" },
  { ticker: "QQQ", title_cn: "QQQ跌2.19%，新股热度能稳住科技吗？", body_cn: "纳指100 ETF（QQQ）美股周四（11月19日）收跌2.19%，标普500 ETF（SPY）跌1.96%；同日Anthropic首日收盘较发行价高17.07%，但英伟达跌3.30%、AMD跌7.72%，新股热度与大型芯片股回撤同时出现，科技股并未一起受益。多头看模型需求与芯片投资仍可能互相支撑，空头担心云厂资本开支、利率敏感估值和龙头回撤继续压住指数。单一新股受到追捧与整体风险偏好改善并非一回事；如果ANT稳定在发行价之上而芯片和云厂仍弱，QQQ要重启持续修复，大型科技股普遍跟涨与算力订单、现金流兑现哪项更关键？", title_en: "QQQ Falls 2.19%: Can IPO Buzz Hold Up Tech?", body_en: "The Nasdaq 100 ETF (QQQ) fell 2.19% Thursday (Nov 19) and the S&P 500 ETF (SPY) lost 1.96%; Anthropic closed 17.07% above its IPO price the same day, yet Nvidia fell 3.30% and AMD 7.72% — new-issue enthusiasm coincided with a sharp chip selloff rather than a broad tech rally. Bulls see model demand and chip investment still reinforcing each other; bears point to cloud capex, rate-sensitive valuations and leader drawdowns. If ANT holds above its offer price while chips and cloud names stay weak, does QQQ need broad mega-cap participation to recover, or must compute orders and cash flow land first?" },
  { ticker: "NVDA / AMD", title_cn: "英伟达再跌3.30%，AMD急挫后怎么选？", body_cn: "英伟达（NVDA）美股周四（11月19日）再跌3.30%，AMD跌7.72%；前一日AMD曾走强，芯片替代交易很快转弱。英伟达已公布第三季收入1158亿美元和下一季1300亿美元收入指引，数据中心需求仍有公司披露支撑，但指引不是已签订单，更不能由AMD的涨跌倒推出客户改签。多头看英伟达Vera Rubin交付，以及AMD服务器CPU和GPU在多供应商采购中的机会；空头担心毛利率压力、产品适配周期和云厂资本开支回款慢于投入。英伟达自身交付与AMD实际出货中，哪一项会先让投资者重新确认订单方向？", title_en: "Nvidia Falls Another 3.30%: How to Choose After AMD's Slide?", body_en: "Nvidia (NVDA) fell another 3.30% Thursday (Nov 19) and AMD dropped 7.72% after AMD had gained the previous day — the chip-substitution trade faded fast. Nvidia has reported third-quarter revenue of $115.8 billion and next-quarter guidance of $130 billion; data center demand still has company disclosure behind it, but guidance is not signed orders, and AMD's moves do not show customers switching. Bulls cite Vera Rubin deliveries and AMD's server CPU and GPU opportunity in multi-vendor sourcing; bears flag gross margin pressure, qualification cycles and cloud capex payback. Which comes first — Nvidia's own deliveries or AMD's actual shipments — to reconfirm order direction?" },
];
let current = 0;

function render() {
  if (!topics.length) return;
  const t = topics[current];
  document.getElementById('tickerTag').textContent = t.ticker || 'TOPIC';
  document.getElementById('titleCn').textContent   = t.title_cn;
  document.getElementById('bodyCn').textContent    = t.body_cn;
  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
