const topics = [
  { ticker: "QQQ / .SPX / .DJI / XAUUSD", title_cn: "CPI四项全中,9月加息压力真的缓解了吗?", body_cn: "周三美国7月CPI出炉,四项数据全部符合预期:同比3.4%(预估3.4%、前值3.5%),环比0.1%(预估0.1%、前值-0.4%);核心CPI同比2.5%(预期2.50%、前值2.60%),环比0.2%(预期0.20%、前值0.00%)。同比增幅创3月以来最小,核心创2月以来最小。分项看,住房与食品通胀环比各微涨0.1%,能源通胀较前一个月下降1.5%;核心环比从0.00%回升至0.2%,上涨项目集中在医疗保健、机票、通讯、教育与娱乐。数据公布后交易员略微下调9月美联储加息的赌注,概率回落至约33%。盘面反应克制:标普500指数涨0.26%、纳指涨0.54%、QQQ涨0.73%,道指微跌0.04%,美股在创下新高后仍在高位震荡;同时黄金期货涨2.02%至4471美元、白银涨1.48%。CPI会成为美股再创新高的续航燃料,还是新一轮波动的起点?你会加仓科技、布局黄金,还是先观望?", title_en: "U.S. July CPI Hits All Estimates — Does September Rate Hike Pressure Really Ease?", body_en: "U.S. July CPI met all four consensus estimates: headline CPI rose 3.4% year-over-year and 0.1% month-over-month, while core CPI climbed 2.5% YoY and 0.2% MoM — the smallest annual gains since March and February, respectively. Housing and food inflation each edged up 0.1% MoM; energy fell 1.5%. Following the release, traders trimmed bets on a September Fed rate hike, with odds slipping to roughly 33%. The S&P 500 rose 0.26%, Nasdaq gained 0.54%, QQQ added 0.73%, and gold futures surged 2.02% to $4,471. Will this CPI print fuel another leg higher for equities, or mark the start of fresh volatility?" },
  { ticker: "NBIS / CRWV / RIOT", title_cn: "CRWV、NBIS绩后大涨,AI算力站上风口了?", body_cn: "AI算力股迎来多重催化。Nebius周三暴涨34.14%:Q2营收5.82亿美元、同比大增454%,调整后净亏损3320万美元、同比收窄64%,卖方口径从\"看积压订单\"转向\"看现金流爆发\"。CoreWeave涨19.28%:Q2营收25.75亿美元、略低于26.11亿的市场预期,每股亏损1.03美元好于预期的1.24美元,真正的底牌是高达1040亿美元的积压订单,不过也有报告提醒它仍处在\"平衡术\"阶段。与此同时,一笔超长周期算力合约搅动市场:Anthropic已与比特币矿企Riot Platforms达成20年算力采购协议,基础合同价值91亿美元、锁定191兆瓦算力资源,延期选择权全部行权后总额最高攀升至161亿美元,Riot前一交易日涨4.33%。市场核心关注三点:积压订单能否继续扩容、盈利端利润率拐点何时出现、管理层对下半年AI算力需求的判断。当前云计算行业处于怎样的发展阶段?细分赛道里CoreWeave、Nebius还是矿企转型的Riot更值得跟踪?", title_en: "CRWV, NBIS Surge Post-Earnings — Has AI Compute Hit Its Inflection Point?", body_en: "AI compute stocks rallied on multiple catalysts. Nebius (NBIS) surged 34.14% after reporting revenue of $582 million, up 454% YoY, with adjusted net loss narrowing 64% to $33.2 million. CoreWeave (CRWV) climbed 19.28% on revenue of $2.575 billion, slightly below the $2.611 billion consensus, with EPS loss of $1.03 beating the $1.24 estimate; its $104 billion backlog was the headline number. Separately, Anthropic signed a 20-year compute supply agreement with Riot Platforms worth $9.1 billion at base, covering 191 megawatts, with total value potentially reaching $16.1 billion if all extension options are exercised — Riot gained 4.33%. Among CoreWeave, Nebius, and Riot, which is most worth tracking?" },
  { ticker: "SMCI / LITE / COHR / AMAT", title_cn: "超微涨19%光模块跟涨,AI硬件链谁最受益?", body_cn: "财报前被看空的AI硬件标的集体反转。Super Micro周三大涨19.02%:每股收益1.70美元远超0.98美元的预期,营收111.20亿美元低于117.82亿的预期,而卖方转口径称其毛利率展望正在转强——毛利恰是财报前市场最担心的一项。光互连三家同步走强:Lumentum涨13.63%,每股收益3.23美元略超3.03美元预期、营收10.06亿基本符合,有报告在其累计上涨约600%后仍给出上调评级;Coherent涨8.24%,今晚盘后交卷;设备端的应用材料涨4.29%,今晚同样公布季报,它是\"AI巨头自建产能\"能否变成设备订单的直接检验。这条链上,服务器、光模块与设备三段的定价逻辑并不相同:一段拼毛利,一段拼800G产能,一段拼资本开支落地。你更看好整机的超微、光模块的Lumentum与Coherent,还是设备端的应用材料?", title_en: "Super Micro Jumps 19%, Optical Modules Follow — Who Benefits Most in AI Hardware?", body_en: "AI hardware names reversed bearish pre-earnings sentiment in unison. Super Micro (SMCI) surged 19.02%, with EPS of $1.70 far exceeding the $0.98 estimate, though revenue of $11.12 billion missed the $11.782 billion consensus; analysts pivoted to highlight an improving gross margin outlook — the metric markets had feared most. Optical interconnect names rallied in tandem: Lumentum gained 13.63% with EPS of $3.23 beating the $3.03 estimate on revenue of $1.006 billion, while Coherent rose 8.24% ahead of its after-hours results. Applied Materials advanced 4.29%, also reporting after hours, serving as a direct test of whether AI giants' capacity build-out translates into equipment orders. Do you favor Super Micro, Lumentum and Coherent, or Applied Materials?" },
  { ticker: "MU / SKHY / SNDK / 07709", title_cn: "美光重回万亿市值,存储是反弹还是反转?", body_cn: "存储链周三集体走强:美光涨4.92%、市值重新站上1万亿美元,SK海力士涨9.01%、闪迪涨5.76%,海力士2倍杠杆产品07709单日涨14.28%,三倍做多半导体ETF(SOXL)涨6.89%。多头理由有三条:CPI落地后风险偏好回归;美光管理层上周明确表示AI存储紧缺可能延续到2027年之后,瑞银据此判断其盈利能力将出现\"结构性重置\";花旗二季度13F显示它显著加仓美光。空头理由同样清楚:中国长鑫存储已被纳入一只AI存储ETF,新增供给正被资本市场正名;闪迪与西部数据上一轮财报都是业绩超预期却因指引偏弱连跌两日。这条链过去两周上下折返多次,涨跌都很急。存储芯片本轮是反弹还是反转?三家核心标的美光、海力士、闪迪中,你更看好谁?", title_en: "Micron Reclaims $1 Trillion Market Cap — Memory Rebound or Reversal?", body_en: "Memory stocks surged broadly: Micron (MU) rose 4.92%, reclaiming a $1 trillion market cap; SK Hynix gained 9.01%; SanDisk climbed 5.76%; the 2x leveraged SK Hynix product 07709 jumped 14.28%; and the 3x long semiconductor ETF SOXL advanced 6.89%. Bulls cite three drivers: improved risk appetite following CPI data, Micron management's recent assertion that AI memory supply constraints could persist beyond 2027 — prompting UBS to forecast a structural reset in profitability — and Citi's 13F showing a significant increase in Micron holdings. Bears counter that China's CXMT has been added to an AI memory ETF, legitimizing new supply, while SanDisk and Western Digital both fell for two days after their last earnings despite beats, citing weak guidance. Is this a rebound or a reversal — and among Micron, SK Hynix, and SanDisk, which do you favor?" },
  { ticker: "SPCX", title_cn: "SpaceX涨9.7%,AI九月成第一大业务靠谱吗?", body_cn: "SpaceX周三大涨9.65%,把史上最大规模IPO首轮解禁落地以来的反弹继续拉长。催化来自马斯克的一句预判:他称AI将在9月成为SpaceX最大的业务,这个时间点比市场此前的理解激进得多,等于把估值叙事从火箭发射与星链直接切到算力——公司首份公开财报里,营收同比增约92%超预期、AI业务亏损收窄快于预期,唯独AI相关资本开支高于预期,当时被卖方挑刺,现在被重新解读成投入前置。反方声音同样直接:一份以\"小心重力\"为题的报告提醒基本面终会把股价拉回,另有卖方在财报后直言它\"还有很长的下跌空间\"。此外木头姐在财报后的回调中加仓,摩根大通也重设了目标价。当叙事重心换得比业务本身更快,你更愿意按发射与星链的现金流给它定价,还是按AI算力的想象空间?", title_en: "SpaceX Surges 9.7% — Is AI Becoming Its Top Business Segment by September Realistic?", body_en: "SpaceX shares jumped 9.65%, extending a post-lockup-expiry rally. The catalyst was Elon Musk's forecast that AI will become SpaceX's largest business segment by September — a far more aggressive timeline than the market had assumed, effectively shifting the valuation narrative from rocket launches and Starlink to compute. In the company's first public earnings report, revenue rose roughly 92% YoY, beating estimates, AI segment losses narrowed faster than expected, but AI-related capex came in above forecast — initially flagged by analysts and now reinterpreted as front-loaded investment. Cathie Wood added to her position during the post-earnings pullback, and JPMorgan reset its price target. When the narrative shifts faster than the underlying business, do you value SpaceX on Starlink and launch cash flows, or on AI compute optionality?" },
  { ticker: "700 / 981 / 1347 / 9618", title_cn: "腾讯AI投入提速,国产算力链能否接力?", body_cn: "港股科技进入业绩验证期。腾讯Q2营收2047.9亿元、同比增11%,经调整净利润684.2亿元、同比增9%;AI提升广告投放效率带动营销服务收入增22%,本土游戏收入增17%。本季资本开支升至527.8亿元,自由现金流为负138亿元,但剔除算力采购预付款后仍达376亿元,核心业务的现金创造能力保持稳健,AI投入正从\"讲模型\"进入应用与商业化验证期。不过股价周四港股盘中仍跌3.03%,市场对个位数到双位数之间的增速与持续攀升的开支仍在拉扯。昨夜盘后京东集团与两家国产芯片厂中芯国际、华虹宏力也已交卷,今日盘中中芯涨2.67%、华虹涨2.45%、京东涨0.49%,国产算力链反而更受资金青睐。腾讯的AI应用,还是中芯、华虹代表的国产算力链,你更看好哪一条?", title_en: "Tencent Accelerates AI Spending — Can China's Domestic Compute Chain Keep Pace?", body_en: "Tencent reported Q2 revenue of 204.79 billion yuan, up 11% YoY, with adjusted net profit of 68.42 billion yuan, up 9% YoY; AI-driven ad efficiency lifted marketing services revenue 22%, while domestic gaming revenue grew 17%. Capital expenditure rose to 52.78 billion yuan, with free cash flow at negative 13.8 billion yuan — though stripping out compute procurement prepayments, it remained a healthy 37.6 billion yuan. Despite solid fundamentals, Tencent shares fell 3.03% in Hong Kong intraday, as markets weighed single-to-double-digit growth against rising spend. JD.com, SMIC, and Hua Hong Semiconductor also reported after hours; SMIC rose 2.67%, Hua Hong gained 2.45%, and JD added 0.49% intraday, with domestic compute names attracting stronger inflows. Do you favor Tencent's AI application story, or the domestic compute chain represented by SMIC and Hua Hong?" },
  { ticker: "GOOG / NVDA", title_cn: "机构Q2持仓大公开,\"聪明钱\"都在买什么?", body_cn: "二季度13F披露进入最后窗口,伯克希尔等头部机构的具体仓位将集中公开。伯克希尔已在Q2财报里释放信号:二季度净买入近200亿美元上市股票,结束连续14个季度净卖出的纪录,其中约100亿美元投向谷歌,巨额现金开始回流科技龙头,但完整持仓要等到本周末。另一条值得盯紧的是英伟达自己披露的美股投资组合,新一季报告会否继续加码AI产业链,直接关系到市场对\"循环交易\"这一质疑的判断。此外花旗、淡马锡、德银都已披露最新持仓:花旗持仓市值突破3000亿美元,大举增持半导体产业链,美光与AMD均获显著加仓。股价上两者分化,谷歌周三微跌0.18%、英伟达涨3.03%。你怎么看大机构Q2的调仓,会跟着\"抄作业\"吗?更愿意跟巴菲特买谷歌,还是跟英伟达押产业链?", title_en: "Q2 13F Disclosures: What Is 'Smart Money' Actually Buying?", body_en: "The Q2 13F filing window is closing, bringing major institutional positions into focus. Berkshire Hathaway signaled a shift in its earnings release, reporting net purchases of nearly $20 billion in listed equities during Q2 — ending a 14-quarter streak of net selling — with roughly $10 billion directed toward Alphabet; full holdings are expected by end of this week. Nvidia's own disclosed U.S. equity portfolio is also under scrutiny, with markets watching whether it continues adding to AI supply chain positions amid ongoing 'circular trading' skepticism. Citi, Temasek, and Deutsche Bank have already filed: Citi's portfolio surpassed $300 billion in market value, with significant additions across the semiconductor supply chain, including Micron and AMD. Alphabet dipped 0.18% Wednesday while Nvidia gained 3.03%. Will you follow the institutional playbook — and do you prefer Buffett's Alphabet bet or Nvidia's supply chain wager?" },
];

  document.getElementById('titleEn').textContent   = t.title_en;
  document.getElementById('bodyEn').textContent    = t.body_en;
  document.getElementById('progressText').textContent = (current+1) + ' / ' + topics.length;
  document.getElementById('progressBar').style.width  = ((current+1)/topics.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === topics.length - 1;
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('card').style.display = '';
  resetBtns();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) { current = next; render(); }
  else if (dir === 1 && current === topics.length - 1) {
    document.getElementById('doneBanner').style.display = 'block';
    document.getElementById('card').style.display = 'none';
  }
}

function resetBtns() {
  [
    ['.copy-title-cn-btn', '复制标题（中文）'],
    ['.copy-body-cn-btn',  '复制正文（中文）'],
    ['.copy-title-en-btn', 'Copy Title (EN)'],
    ['.copy-body-en-btn',  'Copy Body (EN)'],
  ].forEach(([sel, label]) => {
    const btn = document.querySelector(sel);
    if (btn) { btn.textContent = label; btn.classList.remove('copied'); }
  });
}

function copyField(field) {
  const text = topics[current][field];
  const labelMap = {
    title_cn: '复制标题（中文）',
    body_cn:  '复制正文（中文）',
    title_en: 'Copy Title (EN)',
    body_en:  'Copy Body (EN)',
  };
  const selMap = {
    title_cn: '.copy-title-cn-btn',
    body_cn:  '.copy-body-cn-btn',
    title_en: '.copy-title-en-btn',
    body_en:  '.copy-body-en-btn',
  };
  const btn = document.querySelector(selMap[field]);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = labelMap[field];
      btn.classList.remove('copied');
    }, 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')           navigate(-1);
  if (e.key === 'ArrowRight')          navigate(1);
  if (e.key === '1')                   copyField('title_cn');
  if (e.key === '2')                   copyField('body_cn');
  if (e.key.toLowerCase() === 't')     copyField('title_en');
  if (e.key.toLowerCase() === 'b')     copyField('body_en');
});

render();
</script>
</body>
</html>
